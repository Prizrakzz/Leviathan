archetype: vintage_revision
row_meaning: One row is one PSD balance-sheet release vintage for a commodity, country, and market year.
column_descriptions:
  area_harvested_1000ha: Area harvested reported in thousand hectares at the declared row grain.
  beginning_stocks_mt: Beginning stocks reported in metric tonnes at the declared row grain.
  consumption_mt: Consumption reported in metric tonnes at the declared row grain.
  consumption_mt_revision: Change in consumption mt from the prior comparable source release.
  country: Country represented by the observation.
  ending_stocks_mt: Ending stocks reported in metric tonnes at the declared row grain.
  ending_stocks_mt_revision: Change in ending stocks mt from the prior comparable source release.
  exports_mt: Exports reported in metric tonnes at the declared row grain.
  imports_mt: Imports reported in metric tonnes at the declared row grain.
  leviathan_slug: Leviathan's governed commodity identifier.
  market_year: Source-defined commodity marketing year.
  production_mt: Production reported in metric tonnes at the declared row grain.
  production_mt_revision: Change in production mt from the prior comparable source release.
  release_date: Date on which this source release became available.
  su_ratio: Stock-to-use ratio comparing ending inventories with the governed use measure.
  su_ratio_yoy_delta: Signed change in stock-to-use ratio year-over-year from its governed comparison
    period.
  wasde_release_month: Wasde release month locating the observation on its source reporting calendar.
  yield_mt_ha: Yield reported in metric tonnes per hectare at the declared row grain.
why_it_matters:
  area_harvested_1000ha: Carries a primary analytical measure.
  beginning_stocks_mt: Carries a primary analytical measure.
  consumption_mt: Carries a primary analytical measure.
  consumption_mt_revision: Provides explanatory context or a candidate diagnostic at the declared row
    grain.
  country: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  ending_stocks_mt: Carries a primary analytical measure.
  ending_stocks_mt_revision: Provides explanatory context or a candidate diagnostic at the declared row
    grain.
  exports_mt: Carries a primary analytical measure.
  imports_mt: Carries a primary analytical measure.
  leviathan_slug: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  market_year: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  production_mt: Carries a primary analytical measure.
  production_mt_revision: Provides explanatory context or a candidate diagnostic at the declared row grain.
  release_date: Defines row uniqueness; is required by the source contract.
  su_ratio: Carries a primary analytical measure.
  su_ratio_yoy_delta: Provides explanatory context or a candidate diagnostic at the declared row grain.
  wasde_release_month: Provides explanatory context or a candidate diagnostic at the declared row grain.
  yield_mt_ha: Carries a primary analytical measure.
