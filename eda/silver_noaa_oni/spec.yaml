row_meaning: One row is one monthly Oceanic Nino Index observation and phase.
column_descriptions:
  argentina_la_nina_flag: Boolean indicator showing whether argentina la nina applies to this row.
  el_nino_flag: Boolean indicator showing whether el nino applies to this row.
  la_nina_brazil_flag: Boolean indicator showing whether la nina brazil applies to this row.
  la_nina_flag: Boolean indicator showing whether la nina applies to this row.
  month: Calendar month associated with the observation.
  oni_anom: Governed numeric Oceanic Niño Index anom measure used for source-level analytical comparisons.
  oni_lag12: Oceanic niño index shifted back 12 reporting periods.
  oni_lag3: Oceanic niño index shifted back 3 reporting periods.
  oni_lag6: Oceanic niño index shifted back 6 reporting periods.
  oni_lag9: Oceanic niño index shifted back 9 reporting periods.
  phase: Categorical phase state derived or reported for this row.
  season: Source-defined crop or reporting season.
  source: Source-system label retained for provenance.
  year: Calendar year associated with the observation.
