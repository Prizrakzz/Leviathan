row_meaning: One row is one CONAB coffee estimate for a crop year, survey round, and region.
column_descriptions:
  area_in_production_ha: Area in production reported in hectares at the declared row grain.
  area_revision_ha: Change in area from the prior comparable source release, measured in hectares.
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  is_repeated_survey: Boolean indicator showing whether repeated survey applies to this row.
  parser_version: Version of the parser that converted the source document into this row.
  production_revision_pct: Change in production from the prior comparable source release, measured in
    percent.
  production_revision_streak: Change in production streak from the prior comparable source release.
  production_revision_thousand_bags: Change in production from the prior comparable source release, measured
    in thousand bags.
  production_thousand_bags: Production reported in thousand bags at the declared row grain.
  region: Subnational or crop-growing region represented by the observation.
  region_raw: Original source-reported region retained before normalization for lineage and mapping review.
  repeated_from_survey_number: Ordinal repeated from survey position used to order comparable source records.
  safra_year: Safra year locating the observation on its source reporting calendar.
  source: Source-system label retained for provenance.
  source_file_etag: Source-object identity used for lineage and reproducibility checks.
  source_raw_key: Immutable or traceable key for the upstream source object.
  survey_content_fingerprint: Stable content fingerprint used to identify and reproduce the originating
    artifact.
  survey_number: Governed survey number component that helps uniquely identify the row.
  worksheet: Workbook worksheet from which the row was extracted.
  yield_bags_per_ha: Yield reported in bags per hectare at the declared row grain.
  yield_revision_bags_per_ha: Change in yield from the prior comparable source release, measured in bags
    per hectare.
