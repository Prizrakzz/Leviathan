archetype: vintage_revision
row_meaning: One row is one WAP Table 01 release-to-release revision for a commodity balance item.
column_descriptions:
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  marketing_year: Source-defined commodity marketing year.
  month_abbr: Human-readable month label used for display.
  prior_release_month: Prior release month locating the observation on its source reporting calendar.
  prior_value_mmt: Prior comparable value value, measured in million metric tonnes.
  release_month: Release month locating the observation on its source reporting calendar.
  revision_mmt: Change in the estimate from the prior comparable source release, measured in million metric
    tonnes.
  row_label: Source category identifying the row label represented by the row.
  value_mmt: Value reported in million metric tonnes at the declared row grain.
  vintage_status: Source classification describing the row's vintage status.
  vintage_type: Source classification describing the row's vintage type.
why_it_matters:
  commodity: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  country: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  marketing_year: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  month_abbr: Provides explanatory context or a candidate diagnostic at the declared row grain.
  prior_release_month: Provides explanatory context or a candidate diagnostic at the declared row grain.
  prior_value_mmt: Provides explanatory context or a candidate diagnostic at the declared row grain.
  release_month: Defines row uniqueness; is required by the source contract.
  revision_mmt: Provides explanatory context or a candidate diagnostic at the declared row grain.
  row_label: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  value_mmt: Carries a primary analytical measure.
  vintage_status: Provides explanatory context or a candidate diagnostic at the declared row grain.
  vintage_type: Provides explanatory context or a candidate diagnostic at the declared row grain.
