column_descriptions:
  blended_npk_index: Composite blended npk index level reported or calculated for the observation period.
  blended_npk_index_zscore_5yr: Standardized z-score of blended npk index against its trailing 5-year
    history.
  brent_crude_usd_bbl: Brent crude reported in U.S. dollars per barrel at the declared row grain.
  brent_crude_usd_bbl_zscore_5yr: Standardized z-score of brent crude usd bbl against its trailing 5-year
    history.
  dap_usd_mt: Dap reported in U.S. dollars per metric tonne at the declared row grain.
  dap_usd_mt_zscore_5yr: Standardized z-score of dap usd mt against its trailing 5-year history.
  date: Calendar observation date; not automatically a publication timestamp.
  latest_release_ym: Latest source release year-month contributing to the assembled observation row.
  month: Calendar month associated with the observation.
  natural_gas_eu_usd_mmbtu: Natural gas eu reported in U.S. dollars per million BTU at the declared row
    grain.
  natural_gas_eu_usd_mmbtu_zscore_5yr: Standardized z-score of natural gas eu usd mmbtu against its trailing
    5-year history.
  natural_gas_us_usd_mmbtu: Natural gas us reported in U.S. dollars per million BTU at the declared row
    grain.
  natural_gas_us_usd_mmbtu_zscore_5yr: Standardized z-score of natural gas us usd mmbtu against its trailing
    5-year history.
  palm_oil_cpo_usd_t: Palm oil cpo reported in U.S. dollars per tonne at the declared row grain.
  palm_oil_cpo_usd_t_zscore_5yr: Standardized z-score of palm oil cpo usd t against its trailing 5-year
    history.
  phosphate_rock_usd_mt: Phosphate rock reported in U.S. dollars per metric tonne at the declared row
    grain.
  phosphate_rock_usd_mt_zscore_5yr: Standardized z-score of phosphate rock usd mt against its trailing
    5-year history.
  potassium_usd_mt: Potassium reported in U.S. dollars per metric tonne at the declared row grain.
  potassium_usd_mt_zscore_5yr: Standardized z-score of potassium usd mt against its trailing 5-year history.
  rapeseed_oil_usd_t: Rapeseed oil reported in U.S. dollars per tonne at the declared row grain.
  rapeseed_oil_usd_t_zscore_5yr: Standardized z-score of rapeseed oil usd t against its trailing 5-year
    history.
  raw_sugar_world_usd_t: Original source-reported sugar world usd t retained before normalization for
    lineage and mapping review.
  raw_sugar_world_usd_t_zscore_5yr: Original source-reported sugar world usd t zscore 5-year retained
    before normalization for lineage and mapping review.
  soybean_meal_usd_t: Soybean meal reported in U.S. dollars per tonne at the declared row grain.
  soybean_meal_usd_t_zscore_5yr: Standardized z-score of soybean meal usd t against its trailing 5-year
    history.
  soybean_oil_usd_t: Soybean oil reported in U.S. dollars per tonne at the declared row grain.
  soybean_oil_usd_t_zscore_5yr: Standardized z-score of soybean oil usd t against its trailing 5-year
    history.
  soybeans_usd_t: Soybeans reported in U.S. dollars per tonne at the declared row grain.
  soybeans_usd_t_zscore_5yr: Standardized z-score of soybeans usd t against its trailing 5-year history.
  urea_usd_mt: Urea reported in U.S. dollars per metric tonne at the declared row grain.
  urea_usd_mt_zscore_5yr: Standardized z-score of urea usd mt against its trailing 5-year history.
  wheat_us_hrw_usd_t: Wheat us hrw reported in U.S. dollars per tonne at the declared row grain.
