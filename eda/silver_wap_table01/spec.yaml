  label, and vintage role.
column_descriptions:
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  marketing_year: Source-defined commodity marketing year.
  month_abbr: Human-readable month label used for display.
  release_month: Release month locating the observation on its source reporting calendar.
  row_label: Source category identifying the row label represented by the row.
  value_mmt: Value reported in million metric tonnes at the declared row grain.
  vintage_status: Source classification describing the row's vintage status.
  vintage_type: Source classification describing the row's vintage type.
