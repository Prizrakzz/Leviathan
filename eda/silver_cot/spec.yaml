row_meaning: One row is one weekly trader-positioning report for a mapped commodity contract.
column_descriptions:
  leviathan_slug: Leviathan's governed commodity identifier.
  mm_long: CFTC managed-money long position measure for the reporting date.
  mm_net: Governed numeric managed-money net measure used for source-level analytical comparisons.
  mm_net_z_3yr: Standardized z-score of managed-money net against its trailing 3-year history.
  mm_pct_oi: CFTC managed-money percent open interest position measure for the reporting date.
  mm_pct_oi_z_3yr: Standardized z-score of managed-money percent open interest against its trailing 3-year
    history.
  mm_short: CFTC managed-money short position measure for the reporting date.
  mm_spread: CFTC managed-money spread position measure for the reporting date.
  open_interest: Governed numeric open interest measure used for source-level analytical comparisons.
  report_date: Reporting date assigned by the source publication.
  source: Source-system label retained for provenance.
why_it_matters:
  leviathan_slug: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  mm_long: Provides explanatory context or a candidate diagnostic at the declared row grain.
  mm_net: Carries a primary analytical measure.
  mm_net_z_3yr: Carries a primary analytical measure.
  mm_pct_oi: Provides explanatory context or a candidate diagnostic at the declared row grain.
  mm_pct_oi_z_3yr: Provides explanatory context or a candidate diagnostic at the declared row grain.
  mm_short: Provides explanatory context or a candidate diagnostic at the declared row grain.
  mm_spread: Provides explanatory context or a candidate diagnostic at the declared row grain.
  open_interest: Carries a primary analytical measure.
  report_date: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  source: Supports provenance or reproducibility.
