known_hazards:
- Apply the first-partition-key fence; foreign subtrees under the root are out of scope.
- Ingest time is not a historical FAOSTAT publication vintage.
- Canonical root contains foreign subtrees; only commodity= children immediately below the root are in
  scope.
- FAOSTAT is latest-only/manual and its ingest timestamp is not a historical publication vintage.
- Projection domains are declarations, not physical truth; enumerate canonical Parquet directly and never
  use unconstrained Athena.
no_candidate_reason: null
archetype: annual_geographic_production
row_meaning: One row is one latest-available production metric for a commodity, country, and year.
column_descriptions:
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  country_key: Normalized country key used at the declared row grain.
  dataset: Source dataset identifier associated with the observation.
  flag: Source quality or status flag attached to the observation.
  ingest_date: Pipeline ingestion date; it is not automatically source publication time.
  is_official: Boolean indicator showing whether official applies to this row.
  metric: Named measure represented by the row.
  note: Source note retained to explain qualifications or exceptional values.
  source: Source-system label retained for provenance.
  source_file_name: Name of the source file from which the row was extracted.
  unit: Measurement unit attached to the row's metric or attribute.
  value: Numeric value for the row's declared metric and unit.
  year: Calendar year associated with the observation.
why_it_matters:
  commodity: Defines row uniqueness; supports entity segmentation; controls physical coverage; is required
    by the source contract.
  country: Supports entity segmentation.
  country_key: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  dataset: Provides explanatory context or a candidate diagnostic at the declared row grain.
  flag: Provides explanatory context or a candidate diagnostic at the declared row grain.
  ingest_date: Supports provenance or reproducibility.
  is_official: Provides explanatory context or a candidate diagnostic at the declared row grain.
  metric: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  note: Provides explanatory context or a candidate diagnostic at the declared row grain.
  source: Supports provenance or reproducibility.
  source_file_name: Provides explanatory context or a candidate diagnostic at the declared row grain.
  unit: Provides explanatory context or a candidate diagnostic at the declared row grain.
  value: Carries a primary analytical measure.
  year: Defines row uniqueness; anchors temporal coverage; controls physical coverage; is required by
    the source contract.
