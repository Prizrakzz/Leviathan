pit_notes:
- Use ingest_date as the governed knowledge-time boundary (ingest semantics).
- ingest_date records pipeline arrival, not historical source publication availability.
- Ingest time is not a historical FAOSTAT publication vintage.
- FAOSTAT is latest-only/manual and its ingest timestamp is not a historical publication vintage.
anti_features:
- Do not derive same-period or future-looking features without enforcing observation and knowledge-time
  cutoffs.
- Do not silently drop outliers, duplicates, missing periods, or unmapped entities from evidence.
feature_quarantined: false
