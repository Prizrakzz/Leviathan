  avg_micronaire: Governed numeric average micronaire measure used for source-level analytical comparisons.
  avg_staple: Governed numeric average staple measure used for source-level analytical comparisons.
  avg_strength: Governed numeric average strength measure used for source-level analytical comparisons.
  commodity: Governed or source-normalized commodity identifier.
  geography: Geographic reporting area represented by the observation.
  percent_tenderable: Governed numeric percent tenderable measure used for source-level analytical comparisons.
  samples_classed: Number of cotton samples supporting the reported classing-quality averages.
  season: Source-defined crop or reporting season.
  source: Source-system label retained for provenance.
  source_file_etag: Source-object identity used for lineage and reproducibility checks.
  source_pages: Source provenance value identifying the pages used to produce this row.
  source_raw_key: Immutable or traceable key for the upstream source object.
