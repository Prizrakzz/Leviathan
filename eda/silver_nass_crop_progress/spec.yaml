row_meaning: One row is one state-level crop-progress snapshot for a commodity and
  report date.
column_descriptions:
  commodity: Governed or source-normalized commodity identifier.
  date: Calendar observation date; not automatically a publication timestamp.
  leviathan_slug: Leviathan's governed commodity identifier.
  pct_emerged: Governed numeric percent emerged measure used for source-level analytical
    comparisons.
  pct_good_excellent: Governed numeric percent good excellent measure used for source-level
    analytical comparisons.
  pct_harvested: Governed numeric percent harvested measure used for source-level
    analytical comparisons.
  pct_planted: Governed numeric percent planted measure used for source-level analytical
    comparisons.
  pct_poor_very_poor: Percentage of reported observations classified as poor very
    poor.
  source: Source-system label retained for provenance.
  state: State represented by the observation.
  week_of_year: Week of year locating the observation on its source reporting calendar.
  year: Calendar year associated with the observation.
why_it_matters:
  commodity: Defines row uniqueness; supports entity segmentation; controls physical
    coverage; is required by the source contract.
  date: Defines row uniqueness; anchors temporal coverage; is required by the source
    contract.
  leviathan_slug: Supports entity segmentation.
  pct_emerged: Carries a primary analytical measure.
  pct_good_excellent: Carries a primary analytical measure.
  pct_harvested: Carries a primary analytical measure.
  pct_planted: Carries a primary analytical measure.
  pct_poor_very_poor: Provides explanatory context or a candidate diagnostic at the
    declared row grain.
  source: Supports provenance or reproducibility.
  state: Defines row uniqueness; supports entity segmentation; is required by the
    source contract.
  week_of_year: Provides explanatory context or a candidate diagnostic at the declared
    row grain.
  year: Defines row uniqueness; controls physical coverage; is required by the source
    contract.
