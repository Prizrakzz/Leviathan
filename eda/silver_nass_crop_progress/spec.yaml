pit_notes:
- No governed knowledge-time column is declared; descriptive source EDA is valid,
  but feature prototypes need an explicit cutoff-availability rule.
anti_features:
- Do not derive same-period or future-looking features without enforcing observation
  and knowledge-time cutoffs.
- Do not silently drop outliers, duplicates, missing periods, or unmapped entities
  from evidence.
- Do not derive same-season pace or crop-stage timing until a crop-specific season
  key and cutoff alignment are governed; week_of_year is only a calendar-week diagnostic.
- Do not treat ingestion or file timestamps as historical publication dates.
