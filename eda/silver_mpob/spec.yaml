row_meaning: One row is Malaysia's palm-oil balance and price state for one month.
column_descriptions:
  closing_stocks_palm_oil_mt: Closing stocks palm oil reported in metric tonnes at the declared row grain.
  commodity: Governed or source-normalized commodity identifier.
  date: Calendar observation date; not automatically a publication timestamp.
  exports_palm_oil_mt: Exports palm oil reported in metric tonnes at the declared row grain.
  ffb_price_myr_per_mt: Fresh fruit bunch price reported in Malaysian ringgit per metric tonne at the
    declared row grain.
  imports_palm_oil_mt: Imports palm oil reported in metric tonnes at the declared row grain.
  production_cpo_mt: Production cpo reported in metric tonnes at the declared row grain.
  source: Source-system label retained for provenance.
  su_ratio: Stock-to-use ratio comparing ending inventories with the governed use measure.
why_it_matters:
  closing_stocks_palm_oil_mt: Carries a primary analytical measure.
  commodity: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  date: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  exports_palm_oil_mt: Carries a primary analytical measure.
  ffb_price_myr_per_mt: Carries a primary analytical measure.
  imports_palm_oil_mt: Carries a primary analytical measure.
  production_cpo_mt: Carries a primary analytical measure.
  source: Supports provenance or reproducibility.
  su_ratio: Carries a primary analytical measure.
