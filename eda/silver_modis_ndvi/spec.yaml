feature_hypothesis_templates:
- family: stage_aggregate
  mechanism: Crop-stage exposure and stress accumulation.
- family: climatology_anomaly
  mechanism: Deviation from trailing local seasonal norms.
- family: threshold_duration
  mechanism: Duration and count of agronomic threshold breaches.
- family: rolling_change
  mechanism: Lagged change, momentum, and rolling dispersion.
- family: relative_spread
  mechanism: Relative movement across economically linked measures.
known_hazards:
- MODIS period is composite timing metadata, not a continuous sensor measure.
no_candidate_reason: null
archetype: spatial_weather_vegetation
row_meaning: One row is one regional MODIS vegetation composite for a commodity and period date.
column_descriptions:
  baseline_mean: Reference baseline for mean used to calculate anomalies.
  baseline_std: Reference baseline for std used to calculate anomalies.
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  date: Calendar observation date; not automatically a publication timestamp.
  ingest_date: Pipeline ingestion date; it is not automatically source publication time.
  latitude: Geographic latitude coordinate locating the sampled grid cell or observation point.
  longitude: Geographic longitude coordinate locating the sampled grid cell or observation point.
  ndvi: Governed numeric normalized difference vegetation index measure used for source-level analytical
    comparisons.
  ndvi_raw: Original source-reported normalized difference vegetation index retained before normalization
    for lineage and mapping review.
  ndvi_z_score: Standardized anomaly of normalized difference vegetation index relative to its governed
    baseline.
  period: MODIS composite-timing metadata, not a continuous sensor measurement.
  pixel_reliability: Source quality code indicating the reliability of the pixel observation.
  region: Subnational or crop-growing region represented by the observation.
  year: Calendar year associated with the observation.
why_it_matters:
  baseline_mean: Provides explanatory context or a candidate diagnostic at the declared row grain.
  baseline_std: Provides explanatory context or a candidate diagnostic at the declared row grain.
  commodity: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  country: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  date: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  ingest_date: Supports provenance or reproducibility.
  latitude: Provides explanatory context or a candidate diagnostic at the declared row grain.
  longitude: Provides explanatory context or a candidate diagnostic at the declared row grain.
  ndvi: Carries a primary analytical measure.
  ndvi_raw: Provides explanatory context or a candidate diagnostic at the declared row grain.
  ndvi_z_score: Carries a primary analytical measure.
  period: Provides explanatory context or a candidate diagnostic at the declared row grain.
  pixel_reliability: Provides explanatory context or a candidate diagnostic at the declared row grain.
  region: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  year: Provides explanatory context or a candidate diagnostic at the declared row grain.
