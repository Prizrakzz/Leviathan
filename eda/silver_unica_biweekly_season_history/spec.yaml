row_meaning: One row is one finalized fortnight observation for a harvest year and region.
column_descriptions:
  cane_crushed_t: Cane crushed reported in tonnes at the declared row grain.
  ethanol_anhydrous_m3: Ethanol anhydrous reported in cubic metres at the declared row grain.
  ethanol_hydrous_m3: Ethanol hydrous reported in cubic metres at the declared row grain.
  ethanol_total_m3: Ethanol total reported in cubic metres at the declared row grain.
  fortnight_date: Fortnight date locating the observation on its source reporting calendar.
  fortnight_label: Human-readable label naming the row's fortnight category.
  fortnight_seq: Governed fortnight seq component that helps uniquely identify the row.
  harvest_year: Source-defined harvest season or harvest year.
  region: Subnational or crop-growing region represented by the observation.
  source_idm: Source provenance value identifying the source document used to produce this row.
  source_position_date: Source position date attached to finalized history; it is not evidence of a genuine
    historical release vintage.
  sugar_produced_t: Sugar produced reported in tonnes at the declared row grain.
