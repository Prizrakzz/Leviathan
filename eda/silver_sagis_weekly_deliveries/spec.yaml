archetype: progressive_cumulative
row_meaning: One row is one cumulative delivery point for a South African crop season and week.
column_descriptions:
  crop: Crop or agricultural product represented by the observation.
  pct_of_prior_yr: Governed numeric percent of prior yr measure used for source-level analytical comparisons.
  prior_prog_total_mt: Prior comparable progressive cumulative total value, measured in metric tonnes.
  prog_total_mt: Cumulative progressive cumulative total through the row's reporting cutoff, measured
    in metric tonnes.
  season: Source-defined crop or reporting season.
  source: Source-system label retained for provenance.
  week_ending: Last calendar date covered by the reported week.
  week_number: Ordinal week position within the reporting cycle.
  z_vs_3yr_avg: Governed numeric z vs 3-year average measure used for source-level analytical comparisons.
why_it_matters:
  crop: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  pct_of_prior_yr: Carries a primary analytical measure.
  prior_prog_total_mt: Provides explanatory context or a candidate diagnostic at the declared row grain.
  prog_total_mt: Carries a primary analytical measure.
  season: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  source: Supports provenance or reproducibility.
  week_ending: Provides explanatory context or a candidate diagnostic at the declared row grain.
  week_number: Defines row uniqueness; is required by the source contract.
  z_vs_3yr_avg: Carries a primary analytical measure.
