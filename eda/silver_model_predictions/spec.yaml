feature_hypothesis_templates:
- family: lagged_robust_transform
  mechanism: Lagged level, delta, ratio, and robust trailing normalization.
known_hazards:
- Generated model outputs are prohibited feature inputs and remain excluded_leakage.
- Candidate grain may be inferred for quality evidence only, never promoted as contract.
- 'Model-output plane: prohibited as a feature source and classified excluded_leakage.'
- Placeholder/broken catalog partitions have existed historically; profile them as quality evidence only.
- Registry lacks a complete natural-key/value-column contract; inferred grain is evidence only and cannot
  be promoted automatically.
no_candidate_reason: Model outputs are prohibited feature inputs.
archetype: generated_output_quarantine
row_meaning: One row is a persisted model-output record; it is inspected only for output-plane quality
  and lineage, never as a feature source.
column_descriptions:
  as_of_date: Snapshot date represented by the stored vintage.
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  crop_year: Crop year locating the observation on its source reporting calendar.
  cv_policy: Named cv policy applied when producing the row.
  dataset_key: Stable dataset identifier used for lineage and controlled joins.
  feature_set_id: Stable feature set identifier used for lineage and controlled joins.
  feature_set_sha: Stable content fingerprint used to identify and reproduce the originating artifact.
  model: Generated-output model identifier retained only for storage and lineage QA; it is prohibited
    as feature evidence.
  model_dataset_version: Version identifier for the model dataset artifact or logic.
  model_family: Physical model family partition value used to establish source coverage.
  prediction_as_of_date: Prediction as of date locating the observation on its source reporting calendar.
  prediction_date: Date associated with the generated prediction record.
  prior_year_anomaly_baseline: Prior year anomaly baseline locating the observation on its source reporting
    calendar.
  run_id: Stable run identifier used for lineage and controlled joins.
  snapshot_policy: Named snapshot policy applied when producing the row.
  snapshot_stage: Processing classification locating the row within the snapshot stage hierarchy.
  source_dataset_version: Source provenance value identifying the dataset version used to produce this
    row.
  target: Generated-output target identifier retained only for storage and lineage QA; it is prohibited
    as feature evidence.
  target_key: Stable target identifier used for lineage and controlled joins.
  tier: Processing classification locating the row within the tier hierarchy.
  trailing_mean_anomaly_baseline: Reference baseline for trailing mean anomaly used to calculate anomalies.
  trailing_trend_anomaly_baseline: Reference baseline for trailing trend anomaly used to calculate anomalies.
  y_actual: Persisted outcome used for output evaluation; prohibited as a feature.
  y_pred: Persisted model prediction; prohibited as a feature.
  zero_anomaly_baseline: Reference baseline for zero anomaly used to calculate anomalies.
