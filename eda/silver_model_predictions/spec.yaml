- PIT feature analysis is prohibited because this is generated output, not an input source.
anti_features:
- Model predictions, actual outcomes, baselines, run identifiers, and output metadata are prohibited input
  features.
- Do not compute target associations, performance charts, or feature candidates from this table.
- Do not infer a production key from observed output rows and silently promote it.
