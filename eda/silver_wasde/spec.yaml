row_meaning: One row is one WASDE estimate role for a release, commodity, region,
  marketing year, and balance-sheet attribute.
column_descriptions:
  attribute: Named balance-sheet or domain attribute represented by the row.
  commodity: Governed or source-normalized commodity identifier.
  estimate: Governed numeric estimate measure used for source-level analytical comparisons.
  estimate_role: Governed estimate role component that helps uniquely identify the
    row.
  is_current_release_estimate: Boolean indicator showing whether current release estimate
    applies to this row.
  is_final_or_latest: Boolean indicator showing whether final or latest applies to
    this row.
  is_first_estimate: Boolean indicator showing whether first estimate applies to this
    row.
  is_projection: Boolean indicator showing whether projection applies to this row.
  is_source_final: Boolean indicator showing whether source final applies to this
    row.
  marketing_year: Source-defined commodity marketing year.
  marketing_year_end_date: Marketing year end date locating the observation on its
    source reporting calendar.
  months_to_marketing_year_end: Months to marketing year end locating the observation
    on its source reporting calendar.
  prior_estimate: Prior comparable estimate value.
  prior_release_date: Prior release date locating the observation on its source reporting
    calendar.
  projection_month: Projection month locating the observation on its source reporting
    calendar.
  raw_attribute: Original source-reported attribute retained before normalization
    for lineage and mapping review.
  raw_projection_month: Original source-reported projection month retained before
    normalization for lineage and mapping review.
  raw_region: Original source-reported region retained before normalization for lineage
    and mapping review.
  raw_status: Original source-reported status retained before normalization for lineage
    and mapping review.
  raw_table_name: Original source-reported table name retained before normalization
    for lineage and mapping review.
  region: Subnational or crop-growing region represented by the observation.
  release_date: Date on which this source release became available.
  release_sequence: Ordinal release position used to order comparable source records.
  revision: Change in the estimate from the prior comparable source release.
  revision_direction: Change in direction from the prior comparable source release.
  revision_gap_days: Change in gap days from the prior comparable source release.
  source: Source-system label retained for provenance.
  source_table_id: Source provenance value identifying the table id used to produce
    this row.
  table_type: Source classification describing the row's table type.
  unit: Source page basis or continuation text (for example, Milled Basis or Cont'd);
    it is not a governed numeric measurement unit.
