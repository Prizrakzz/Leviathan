pit_notes:
- Use release_date as the governed knowledge-time boundary (vintage semantics).
anti_features:
- Do not derive same-period or future-looking features without enforcing observation
  and knowledge-time cutoffs.
- Do not silently drop outliers, duplicates, missing periods, or unmapped entities
  from evidence.
- Do not compare or transform estimate magnitudes until each attribute's numeric unit
  and scale are governed; the current unit field contains page basis/continuation
  text.
