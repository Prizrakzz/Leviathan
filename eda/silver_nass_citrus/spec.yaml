archetype: vintage_revision
row_meaning: One row is one citrus forecast vintage for a season, crop, state, and release date.
column_descriptions:
  crop: Crop or agricultural product represented by the observation.
  forecast_1000_boxes: Forecast reported in thousand boxes at the declared row grain.
  hlb_trend_factor: Derived hlb trend factor used to compare the row with its reference level.
  release_date: Date on which this source release became available.
  report_month: Report month locating the observation on its source reporting calendar.
  revision_1000_boxes: Change in the estimate from the prior comparable source release, measured in thousand
    boxes.
  season: Source-defined crop or reporting season.
  source: Source-system label retained for provenance.
  state: State represented by the observation.
why_it_matters:
  crop: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  forecast_1000_boxes: Carries a primary analytical measure.
  hlb_trend_factor: Provides explanatory context or a candidate diagnostic at the declared row grain.
  release_date: Defines row uniqueness; is required by the source contract.
  report_month: Anchors temporal coverage.
  revision_1000_boxes: Provides explanatory context or a candidate diagnostic at the declared row grain.
  season: Defines row uniqueness; is required by the source contract.
  source: Supports provenance or reproducibility.
  state: Defines row uniqueness; supports entity segmentation; is required by the source contract.
