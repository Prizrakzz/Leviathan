  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  date: Calendar observation date; not automatically a publication timestamp.
  ex_dock_price_usd_cents_per_lb: Ex dock price reported in U.S. cents per pound at the declared row grain.
  exports_bags_60kg: Exports reported in 60-kilogram bags at the declared row grain.
  exports_value_usd_m: Exports value reported in millions of U.S. dollars at the declared row grain.
  internal_price_cop_per_125kg: Internal price reported in Colombian pesos per 125 kilograms at the declared
    row grain.
  leviathan_slug: Leviathan's governed commodity identifier.
  month: Calendar month associated with the observation.
  production_bags_60kg: Production reported in 60-kilogram bags at the declared row grain.
  source: Source-system label retained for provenance.
  year: Calendar year associated with the observation.
