row_meaning: One row is one U.S. commodity-state-year production and area observation.
column_descriptions:
  area_harvested_cv_pct: Area harvested cv reported in percent at the declared row grain.
  area_harvested_ha: Area harvested reported in hectares at the declared row grain.
  area_planted_cv_pct: Area planted cv reported in percent at the declared row grain.
  area_planted_ha: Area planted reported in hectares at the declared row grain.
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  leviathan_slug: Leviathan's governed commodity identifier.
  marketing_year: Source-defined commodity marketing year.
  production_cv_pct: Production cv reported in percent at the declared row grain.
  production_mt: Production reported in metric tonnes at the declared row grain.
  source: Source-system label retained for provenance.
  state: State represented by the observation.
  year: Calendar year associated with the observation.
  yield_cv_pct: Yield cv reported in percent at the declared row grain.
  yield_t_ha: Yield reported in tonnes per hectare at the declared row grain.
why_it_matters:
  area_harvested_cv_pct: Provides explanatory context or a candidate diagnostic at the declared row grain.
  area_harvested_ha: Carries a primary analytical measure.
  area_planted_cv_pct: Provides explanatory context or a candidate diagnostic at the declared row grain.
  area_planted_ha: Carries a primary analytical measure.
  commodity: Defines row uniqueness; supports entity segmentation; controls physical coverage; is required
    by the source contract.
  country: Supports entity segmentation.
  leviathan_slug: Supports entity segmentation.
  marketing_year: Provides explanatory context or a candidate diagnostic at the declared row grain.
  production_cv_pct: Provides explanatory context or a candidate diagnostic at the declared row grain.
  production_mt: Carries a primary analytical measure.
  source: Supports provenance or reproducibility.
  state: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  year: Defines row uniqueness; anchors temporal coverage; controls physical coverage; is required by
    the source contract.
  yield_cv_pct: Provides explanatory context or a candidate diagnostic at the declared row grain.
  yield_t_ha: Carries a primary analytical measure.
