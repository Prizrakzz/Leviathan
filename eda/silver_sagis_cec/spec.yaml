row_meaning: One row is one SAGIS crop-estimate release for a production year, crop, scope, and estimate
  number.
column_descriptions:
  area_planted_ha: Area planted reported in hectares at the declared row grain.
  crop: Crop or agricultural product represented by the observation.
  current_estimate_t: Current-release estimate value, measured in tonnes.
  estimate_number: Governed estimate number component that helps uniquely identify the row.
  prior_estimate_t: Prior comparable estimate value, measured in tonnes.
  prior_year_final_t: Prior year final t locating the observation on its source reporting calendar.
  production_year: Production year locating the observation on its source reporting calendar.
  release_date: Date on which this source release became available.
  report_month: Report month locating the observation on its source reporting calendar.
  revision_pct: Change in the estimate from the prior comparable source release, measured in percent.
  revision_surprise: Change in surprise from the prior comparable source release.
  revision_t: Change in the estimate from the prior comparable source release, measured in tonnes.
  scope: Source category identifying the scope represented by the row.
  season_type: Source classification describing the row's season type.
  source: Source-system label retained for provenance.
why_it_matters:
  area_planted_ha: Provides explanatory context or a candidate diagnostic at the declared row grain.
  crop: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  current_estimate_t: Carries a primary analytical measure.
  estimate_number: Defines row uniqueness; is required by the source contract.
  prior_estimate_t: Provides explanatory context or a candidate diagnostic at the declared row grain.
  prior_year_final_t: Provides explanatory context or a candidate diagnostic at the declared row grain.
  production_year: Defines row uniqueness; is required by the source contract.
  release_date: Provides explanatory context or a candidate diagnostic at the declared row grain.
  report_month: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  revision_pct: Provides explanatory context or a candidate diagnostic at the declared row grain.
  revision_surprise: Carries a primary analytical measure.
  revision_t: Carries a primary analytical measure.
  scope: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  season_type: Provides explanatory context or a candidate diagnostic at the declared row grain.
  source: Supports provenance or reproducibility.
