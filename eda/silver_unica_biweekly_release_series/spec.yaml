row_meaning: One row is one UNICA release-date comparison for a harvest year and region.
column_descriptions:
  cane_crushed_current_t: Current-release cane crushed value, measured in tonnes.
  cane_crushed_prior_t: Prior comparable cane crushed value, measured in tonnes.
  ethanol_anhydrous_current_m3: Current-release ethanol anhydrous value, measured in cubic metres.
  ethanol_anhydrous_prior_m3: Prior comparable ethanol anhydrous value, measured in cubic metres.
  ethanol_hydrous_current_m3: Current-release ethanol hydrous value, measured in cubic metres.
  ethanol_hydrous_prior_m3: Prior comparable ethanol hydrous value, measured in cubic metres.
  ethanol_total_current_m3: Current-release ethanol total value, measured in cubic metres.
  ethanol_total_prior_m3: Prior comparable ethanol total value, measured in cubic metres.
  harvest_year: Source-defined harvest season or harvest year.
  position_date: Position date locating the observation on its source reporting calendar.
  region: Subnational or crop-growing region represented by the observation.
  sugar_produced_current_t: Current-release sugar produced value, measured in tonnes.
  sugar_produced_prior_t: Prior comparable sugar produced value, measured in tonnes.
