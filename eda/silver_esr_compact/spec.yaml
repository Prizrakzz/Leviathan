pit_notes:
- Use as_of_date as the governed knowledge-time boundary (vintage semantics).
- Apply the registry publication lag of 0 day(s) after observation time.
- Treat as-of dates before 2026-05-24 as synthetic backfill until provenance proves
  otherwise.
- Backfilled as-of values before 2026-05-24 are not genuine historical vintages.
- Backfilled as-of values before 2026-05-24 are not treated as genuine historical
  publication vintages.
anti_features:
- Do not derive same-period or future-looking features without enforcing observation
  and knowledge-time cutoffs.
- Do not silently drop outliers, duplicates, missing periods, or unmapped entities
  from evidence.
- Do not stack raw and compact ESR rows.
- Do not use pre-2026-05-24 backfilled as-of labels as genuine PIT history.
