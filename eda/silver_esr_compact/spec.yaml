feature_hypothesis_templates:
- family: official_revision
  mechanism: New information revealed between genuine releases.
- family: forecast_horizon
  mechanism: Forecast level and uncertainty by time-to-outcome.
- family: season_pace
  mechanism: Progress relative to the same season cutoff in prior years.
- family: trajectory_change
  mechanism: Acceleration, deceleration, and completion timing.
known_hazards:
- Compact ESR is the feature surface; use raw ESR only for parity, never row stacking.
- Backfilled as-of values before 2026-05-24 are not genuine historical vintages.
- Feature-serving view of ESR; compare parity with raw ESR but do not double-count
  either surface.
- Backfilled as-of values before 2026-05-24 are not treated as genuine historical
  publication vintages.
no_candidate_reason: null
archetype: esr_paired
row_meaning: One row is the compact feature-serving ESR observation for a commodity,
  market year, destination, week, and as-of snapshot.
column_descriptions:
  as_of_date: Stored ESR snapshot date; dates before 2026-05-24 may be backfilled
    labels rather than genuine historical publication vintages.
  changes_1000mt: Changes reported in thousand metric tonnes at the declared row grain.
  commodity: Governed or source-normalized commodity identifier.
  commodity_code: USDA commodity vocabulary code; it is a categorical identifier,
    not a numeric measure.
  commodity_name: Human-readable label naming the row's commodity category.
  country_code: USDA destination-country vocabulary code; it is a categorical entity
    identifier, not a numeric measure.
  gross_new_sales_1000mt: Gross new sales reported in thousand metric tonnes at the
    declared row grain.
  ingest_date: Pipeline ingestion date; it is not automatically source publication
    time.
  market_year: Source-defined commodity marketing year.
  outstanding_sales_1000mt: Outstanding sales reported in thousand metric tonnes at
    the declared row grain.
  source: Source-system label retained for provenance.
  source_unit_id: USDA source-unit vocabulary identifier; it is categorical metadata,
    not a quantity.
  week_ending_date: Last calendar date covered by the reported week.
  weekly_exports_1000mt: Weekly exports reported in thousand metric tonnes at the
    declared row grain.
why_it_matters:
  as_of_date: Defines row uniqueness; controls physical coverage; is required by the
    source contract.
  changes_1000mt: Provides explanatory context or a candidate diagnostic at the declared
    row grain.
  commodity: Supports entity segmentation; controls physical coverage.
  commodity_code: Defines row uniqueness; supports entity segmentation; is required
    by the source contract.
  commodity_name: Provides explanatory context or a candidate diagnostic at the declared
    row grain.
  country_code: Defines row uniqueness; supports entity segmentation; is required
    by the source contract.
  gross_new_sales_1000mt: Provides explanatory context or a candidate diagnostic at
    the declared row grain.
  ingest_date: Supports provenance or reproducibility.
  market_year: Defines row uniqueness; is required by the source contract.
  outstanding_sales_1000mt: Carries a primary analytical measure.
  source: Supports provenance or reproducibility.
  source_unit_id: Provides explanatory context or a candidate diagnostic at the declared
    row grain.
  week_ending_date: Defines row uniqueness; anchors temporal coverage; is required
    by the source contract.
  weekly_exports_1000mt: Carries a primary analytical measure.
primary_measures:
- weekly_exports_1000mt
- outstanding_sales_1000mt
