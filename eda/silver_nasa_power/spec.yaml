archetype: spatial_weather_vegetation
row_meaning: One row is one daily NASA POWER weather observation for a commodity-growing
  region.
column_descriptions:
  commodity: Governed or source-normalized commodity identifier.
  country: Country represented by the observation.
  date: Calendar observation date; not automatically a publication timestamp.
  day: Calendar day-of-month component materialized from the observation date partition.
  ingest_date: Pipeline ingestion date; it is not automatically source publication
    time.
  month: Calendar month associated with the observation.
  precipitation_mm: Precipitation reported in millimetres at the declared row grain.
  region: Subnational or crop-growing region represented by the observation.
  relative_humidity_2m_pct: Relative humidity 2-month reported in percent at the declared
    row grain.
  source: Source-system label retained for provenance.
  source_file_name: Name of the source file from which the row was extracted.
  temperature_2m_max_c: Temperature 2-month max reported in degrees Celsius at the
    declared row grain.
  temperature_2m_mean_c: Temperature 2-month mean reported in degrees Celsius at the
    declared row grain.
  temperature_2m_min_c: Temperature 2-month min reported in degrees Celsius at the
    declared row grain.
  wind_speed_2m_m_s: Wind speed 2-month reported in metres per second at the declared
    row grain.
  year: Calendar year associated with the observation.
why_it_matters:
  commodity: Defines row uniqueness; supports entity segmentation; controls physical
    coverage; is required by the source contract.
  country: Defines row uniqueness; supports entity segmentation; controls physical
    coverage; is required by the source contract.
  date: Defines row uniqueness; anchors temporal coverage; is required by the source
    contract.
  day: Provides explanatory context or a candidate diagnostic at the declared row
    grain.
  ingest_date: Supports provenance or reproducibility.
  month: Defines row uniqueness; controls physical coverage; is required by the source
    contract.
  precipitation_mm: Carries a primary analytical measure.
  region: Defines row uniqueness; supports entity segmentation; controls physical
    coverage; is required by the source contract.
  relative_humidity_2m_pct: Carries a primary analytical measure.
  source: Supports provenance or reproducibility.
  source_file_name: Provides explanatory context or a candidate diagnostic at the
    declared row grain.
  temperature_2m_max_c: Carries a primary analytical measure.
  temperature_2m_mean_c: Carries a primary analytical measure.
  temperature_2m_min_c: Carries a primary analytical measure.
  wind_speed_2m_m_s: Carries a primary analytical measure.
  year: Defines row uniqueness; controls physical coverage; is required by the source
    contract.
