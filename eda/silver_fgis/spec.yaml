archetype: progressive_cumulative
row_meaning: One row is one destination-level weekly grain-export inspection observation within a commodity
  marketing year.
column_descriptions:
  destination_country: Destination country receiving the reported shipment or export.
  exports_mt_ctd: Cumulative exports mt crop-to-date through the row's reporting cutoff.
  exports_mt_weekly: Governed numeric exports mt weekly measure used for source-level analytical comparisons.
  leviathan_slug: Leviathan's governed commodity identifier.
  marketing_year: Source-defined commodity marketing year.
  source: Source-system label retained for provenance.
  week_ending_date: Last calendar date covered by the reported week.
  week_of_marketing_year: Week of marketing year locating the observation on its source reporting calendar.
why_it_matters:
  destination_country: Defines row uniqueness; supports entity segmentation; is required by the source
    contract.
  exports_mt_ctd: Carries a primary analytical measure.
  exports_mt_weekly: Carries a primary analytical measure.
  leviathan_slug: Defines row uniqueness; supports entity segmentation; controls physical coverage; is
    required by the source contract.
  marketing_year: Defines row uniqueness; controls physical coverage; is required by the source contract.
  source: Supports provenance or reproducibility.
  week_ending_date: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
  week_of_marketing_year: Provides explanatory context or a candidate diagnostic at the declared row grain.
