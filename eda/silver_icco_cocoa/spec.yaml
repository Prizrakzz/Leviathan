archetype: annual_geographic_production
row_meaning: One row is ICCO's latest assembled world cocoa balance for one cocoa season.
column_descriptions:
  cocoa_year: Cocoa year locating the observation on its source reporting calendar.
  end_stocks_kt: End stocks reported in kilotonnes at the declared row grain.
  grindings_3yr_trend: Trailing mean of the latest three observed season rows, including the current row;
    gaps mean it is not necessarily three consecutive calendar seasons.
  grindings_kt: Grindings reported in kilotonnes at the declared row grain.
  grindings_trend_dev: Current grindings minus the stored three-row trend.
  latest_release_date: Latest release date across the values assembled into the season row; it does not
    prove every metric came from one release.
  production_kt: Production reported in kilotonnes at the declared row grain.
  source: Source-system label retained for provenance.
  su_ratio: End stocks divided by grindings, expressed as a ratio.
  surplus_deficit_kt: ICCO-published market balance in kilotonnes; do not reconstruct it as simple production
    minus grindings.
why_it_matters:
  cocoa_year: Defines row uniqueness; is required by the source contract.
  end_stocks_kt: Carries a primary analytical measure.
  grindings_3yr_trend: Provides explanatory context or a candidate diagnostic at the declared row grain.
  grindings_kt: Carries a primary analytical measure.
  grindings_trend_dev: Provides explanatory context or a candidate diagnostic at the declared row grain.
  latest_release_date: Anchors temporal coverage.
  production_kt: Carries a primary analytical measure.
  source: Supports provenance or reproducibility.
  su_ratio: Carries a primary analytical measure.
  surplus_deficit_kt: Carries a primary analytical measure.
