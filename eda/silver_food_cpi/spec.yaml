archetype: annual_geographic_production
row_meaning: One row is annual food-price inflation for one country.
column_descriptions:
  country_iso: ISO country code used to identify the reported country.
  country_name: Human-readable country name attached to the country identifier.
  cpi_available: Boolean indicator showing whether consumer price inflation applies to this row.
  cpi_yoy_pct: Consumer price inflation year-over-year reported in percent at the declared row grain.
  cpi_yoy_z_10yr: Standardized z-score of consumer price inflation year-over-year against its trailing
    10-year history.
  cpi_yoy_z_5yr: Standardized z-score of consumer price inflation year-over-year against its trailing
    5-year history.
  source: Source-system label retained for provenance.
  year: Calendar year associated with the observation.
why_it_matters:
  country_iso: Defines row uniqueness; supports entity segmentation; is required by the source contract.
  country_name: Supports entity segmentation.
  cpi_available: Provides explanatory context or a candidate diagnostic at the declared row grain.
  cpi_yoy_pct: Carries a primary analytical measure.
  cpi_yoy_z_10yr: Provides explanatory context or a candidate diagnostic at the declared row grain.
  cpi_yoy_z_5yr: Carries a primary analytical measure.
  source: Supports provenance or reproducibility.
  year: Defines row uniqueness; anchors temporal coverage; is required by the source contract.
