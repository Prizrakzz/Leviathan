row_meaning: One row is one daily continuous-futures observation for a mapped commodity.
column_descriptions:
  close: Governed numeric close measure used for source-level analytical comparisons.
  date: Calendar observation date; not automatically a publication timestamp.
  leviathan_slug: Leviathan's governed commodity identifier.
  log_return: Governed numeric log return measure used for source-level analytical comparisons.
  momentum_1yr: Directional price change over the 1-year lookback window.
  momentum_60d: Directional price change over the 60-day lookback window.
  price_z_2yr: Standardized z-score of price against its trailing 2-year history.
  realized_vol_30d: Realized return volatility over the realized vol 30-day window.
  source: Source-system label retained for provenance.
  vol_regime: Categorical vol state derived or reported for this row.
