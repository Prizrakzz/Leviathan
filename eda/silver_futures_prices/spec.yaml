pit_notes:
- No governed knowledge-time column is declared; descriptive source EDA is valid, but feature prototypes
  need an explicit cutoff-availability rule.
anti_features:
- Do not derive same-period or future-looking features without enforcing observation and knowledge-time
  cutoffs.
- Do not silently drop outliers, duplicates, missing periods, or unmapped entities from evidence.
- Do not use raw close levels across contracts or across an unverified quote/unit regime break; verify
  contract quote units and continuity first.
- Do not treat ingestion or file timestamps as historical publication dates.
- Do not silently replace raw duplicate evidence with the consumer view.
