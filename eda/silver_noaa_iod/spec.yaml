row_meaning: One row is one monthly Indian Ocean Dipole observation.
column_descriptions:
  date: Calendar observation date; not automatically a publication timestamp.
  dmi_value: Governed numeric dipole mode index value measure used for source-level analytical comparisons.
  iod_dmi_3month_avg: Governed numeric iod dipole mode index 3month average measure used for source-level
    analytical comparisons.
  iod_dmi_ethiopia_lag4: Iod dipole mode index ethiopia shifted back 4 reporting periods.
  iod_phase: Categorical iod state derived or reported for this row.
  month: Calendar month associated with the observation.
  source: Source-system label retained for provenance.
  year: Calendar year associated with the observation.
