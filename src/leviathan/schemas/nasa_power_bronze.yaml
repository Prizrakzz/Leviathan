source: nasa_power_bronze
type: dataframe

# Expected columns in the bronze Parquet output from raw_to_bronze_nasa_power.py.
# Parameter names are lowercased by nasa_power_payload_to_daily_dataframe().
required_columns:
  - commodity
  - source
  - country
  - region
  - date
  - year
  - month
  - day
  - t2m
  - t2m_max
  - t2m_min
  - prectotcorr
  - rh2m
  - ws2m
  - ingest_date
  - source_file_name

# Recognized-but-optional: fetched from 2025 onward, DROPPED by the F021 wide transform
# (NASA_EXCLUDED_PARAMS) and used by no feature. Historical bronze (1981-2024) predates it;
# requiring it aborted every b2s read on the pre-2025 history (BF-W1). Neither presence nor
# absence is drift.
optional_columns:
  - allsky_sfc_sw_dwn

year_col: year
min_year: 1980
