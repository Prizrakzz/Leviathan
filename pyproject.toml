[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"leviathan.schemas" = ["*.yaml"]

[project]
name = "leviathan"
version = "0.1.0"
description = "Commodity market-neutral trading system"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40",      # Anthropic API client (Haiku chunking provider, Opus authoring, Sonnet serving)
    "beautifulsoup4>=4.12",
    "boto3",
    "lxml>=4.9",
    "curl-cffi>=0.7",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "rank-bm25>=0.2",       # hybrid retrieval lexical leg (BM25 over prop text; the reranker uses sentence-transformers)
    "pyyaml",
    "requests",
    "tenacity",
    "python-dotenv",
    "typing_extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "moto[s3]>=4.0",
    "rasterio==1.3.10",
    "s3fs",
    "boto3-stubs[batch,glue,s3,logs]",
]
batch = [
    "rasterio>=1.3,<1.5",  # 1.5+ requires Python >=3.12 and numpy>=2
    "pdfplumber>=0.11",    # PDF text extraction for WASDE/WAP text pipeline
    "pypdf>=4.0",          # PDF page truncation before Textract (Phase 2 scanned WASDE)
]
biweekly = [
    "playwright>=1.40",    # headless browser for JS-rendered listing page
    "pdfplumber>=0.11",    # PDF table extraction for bulletin parsing
]
training = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "mlflow==3.14.0",
    "optuna>=3.5",         # Bayesian hyperparameter search (TPE) over walk-forward CV
]
# Heavy extras the tree-based trainer does NOT import — kept out of the default image so
# every Batch job pulls ~1.3 GB, not ~4.4 GB.  Install into a separate
# leviathan-trainer-dl image only when deep/anomaly models actually need them.
#   torch ~900 MB; shap pulls numba/llvmlite (~250 MB).
# (sagemaker-training was dropped entirely: we run on Batch, not SageMaker Training Jobs.)
training-dl = [
    "torch>=2.1",          # CPU-only wheel; install via the pytorch CPU index in the DL Dockerfile
    "shap>=0.44",          # SHAP explanations (TreeExplainer) for the inference/explanation path
]
# GraphRAG evidence-build (WS-MS2): SELF-HOSTED bge-m3 embeddings on the cloud builder. Kept out of the default
# image — only the leviathan_embedder Dockerfile installs these (torch via the pytorch CPU index there).
embed = [
    "sentence-transformers>=2.2",   # bge-m3 (BAAI/bge-m3); pulls transformers + tokenizers
    "torch>=2.1",                   # CPU-only wheel; the embedder Dockerfile installs it from the CPU index
]
serve = [
    "langgraph>=0.2.0",             # Phase 5 orchestration conductor; 0.1.9 has a pregel runtime bug (skip its test)
]
pg = [
    "psycopg[binary]>=3.1",         # pgvector evidence store (EVIDENCE_BACKEND=pg) — filtered dense+FTS in one SQL round-trip
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Glue scripts run a bootstrap block before importing leviathan/pandas.
# The post-bootstrap imports are intentionally below module level.
"jobs/glue/*.py" = ["E402"]
