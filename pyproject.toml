[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"leviathan.schemas" = ["*.yaml"]

[project]
name = "leviathan"
version = "0.1.0"
description = "Commodity market-neutral trading system"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3",
    "curl-cffi>=0.7",
    "openpyxl>=3.1",
    "pandas",
    "pyarrow",
    "pyyaml",
    "requests",
    "tenacity",
    "python-dotenv",
    "typing_extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "moto[s3]>=4.0",
    "rasterio==1.3.10",
    "s3fs",
    "boto3-stubs[batch,glue,s3,logs]",
]
batch = [
    "rasterio>=1.3,<1.5",  # 1.5+ requires Python >=3.12 and numpy>=2
]
biweekly = [
    "playwright>=1.40",    # headless browser for JS-rendered listing page
    "pdfplumber>=0.11",    # PDF table extraction for bulletin parsing
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Glue scripts run a bootstrap block before importing leviathan/pandas.
# The post-bootstrap imports are intentionally below module level.
"jobs/glue/*.py" = ["E402"]