[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"leviathan.schemas" = ["*.yaml"]

[project]
name = "leviathan"
version = "0.1.0"
description = "Commodity market-neutral trading system"
requires-python = ">=3.9"
dependencies = [
    "boto3",
    "pandas",
    "pyarrow",
    "pyyaml",
    "requests",
    "s3fs",
    "tenacity",
    "python-dotenv",
    "typing_extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "moto[s3]>=4.0",
    "rasterio==1.3.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100