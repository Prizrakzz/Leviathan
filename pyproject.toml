[project]
name = "leviathan"
version = "0.1.0"
description = "Commodity market-neutral trading system"
requires-python = ">=3.9"
dependencies = [
    "boto3",
    "pandas",
    "pyarrow",
    "pyyaml",
    "requests",
    "s3fs",
    "tenacity",
    "python-dotenv",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100