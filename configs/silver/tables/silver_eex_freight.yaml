notes: 'FORWARD-ONLY ACCUMULATOR, and every field above follows from that. The source
  (api.eex-group.com/pub/market-data/chart/eod, unauthenticated) serves a rolling ~5-TRADING-DAY
  window of settlement prices and NO history -- measured 2026-08-20, a request widened to
  startDate=2025-01-01 still returns exactly five settlPx points. There is no backfill and there
  never will be, so a day not fetched is gone forever and every raw object is an immutable FIRST
  CAPTURE (a re-served window is byte-compared and logged to a _divergence/ sibling, never written
  over). freshness_sla.max_lag_days=5 is therefore the SOURCE''S OWN ceiling and not a preference:
  four consecutive missed daily runs are recoverable, the fifth is not, and an alarm at 30 days
  would fire five weeks after the data was already unrecoverable. write_mode is append for the same
  reason -- history here is accumulated, and an overwrite publisher would be able to destroy days
  that cannot be re-fetched. UNITS (measured from the payloads'' own uOM field, NOT assumed): this
  venue publishes TWO price units. uOM=DAYS -> unit "USD/day" for the ten time/trip-charter averages
  (Panamax 5TC/P1E_82/P2E_82/P3E_82/P6, Supramax 10TC/11TC, Capesize 5TC and 5TC(182), Handysize
  7TC), and uOM=TN -> unit "USD/tonne" for the three Capesize VOYAGE routes C3EM/C5EM/C7EM, whose
  settlements print near 15-36 beside Panamax figures near 20,000. The `unit` column is the
  authority and is built from currency+uOM per row; an unrecognised uOM is FATAL in the transform.
  volume_lots is in LOTS (the venue''s lotSize series) and is deliberately NOT the venue''s `volume`
  series, which is denominated in uOM and differs by the lot size on the TN routes; the native
  figure stays in bronze as volume_uom. PIT: trade_date is the venue''s own published settlement
  date, carried verbatim from the payload -- nothing on this leg is derived from a wall clock -- so
  publication_lag_days is 0 (the settlement IS the publication). min_nonnull_frac 0.9 on settle_px
  is CALIBRATED rather than the provisional 0.5: EEX settles every listed contract every trading day
  and the census measured 84/84 maturities priced on all five window days for P5TC, so a table with
  10% missing settlements is a real defect, not a thin source. consumers=none and numbers_ref/
  cascade_ref null are deliberate under the four-checkmark law: no numbers card exists yet and one
  must not be minted before proof-of-rows. LICENCE: EEX Group DataSource General Conditions govern
  redistribution and the clause text could not be extracted from the recon machine
  (PARKED-FOR-HOME, recon 1d-iv) -- treat as fetchable for internal signal, NOT clearly
  redistributable, the same posture the live Euronext leg already operates under.'
