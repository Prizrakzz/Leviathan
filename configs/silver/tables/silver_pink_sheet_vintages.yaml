notes: 'min_nonnull_frac is PROVISIONAL (uniform 0.5) pending per-source calibration (OP-8 / AV-11, SILVER-V001).
  This registry is the SINGLE authority for value_columns and min_nonnull_frac (Attack 3 finding #6).
  Types are the INV-2 TARGET writer schema; arrow_type is the current-physical type from the R0 baseline.
  PINK SHEET VINTAGES lane (a): the BITEMPORAL companion to silver_pink_sheet -- one row per (data month,
  WB release), where the sibling keeps one row per month at the current revision. natural_key is [release_date,
  date] with the VINTAGE AXIS FIRST, reading ''one restatement of a data month per release''; release_ym
  is deliberately NOT in the key, being a rendering of release_date rather than an independent fact. release_date
  is an IN-FILE STRING ''YYYY-MM-DD'' column and NOT a Hive partition key -- partition_keys is EMPTY because
  the table is flat, so stage_feature_probe''s partition-key forgiveness (the silver_wasde ''release_date=''
  precedent) does not apply and the column must genuinely be in the parquet footer, which it is. A STRING
  and never a timestamp: the as-of guard is a lexical CAST(release_date AS varchar) <= ''<asof>'', so
  a timestamp renders ''YYYY-MM-DD HH:MM:...'' and silently EXCLUDES a release published ON the asof.
  Each release is a FULL as-published history back to 1960-01 (measured on six vintages: 780/792/796/798/799/800
  rows, each hole-free), which is what keeps one clock on every row of a release and therefore keeps a
  point-in-time window from spanning two. The z-scores are RE-COMPUTED per release over that release''s
  own restated history -- copying the current z onto an older vintage''s rows would put a number derived
  from post-asof revisions on a row stamped with a past release. latest_release_ym is dropped on purpose:
  on a vintage row it and release_ym are one fact in two renderings. HOW A ROW''S CLOCK RUNG IS READ:
  release_date_source names the rung of the ladder in leviathan.common.pink_sheet_release.release_clock
  that minted release_date, and it is one of four values. origin_last_modified = the ORIGIN''s HTTP Last-Modified
  recorded at capture in the raw_meta sidecar, whose month equals the derived release month; origin_last_modified_clamped
  = the same, except the header landed on the month-END and was clamped one day earlier, because a month-end
  stamp is unselectable at every asof inside its own release month under the lexical as-of guard; derived_month_first
  = the FIRST day of the derived release month, the fallback, measured 1-5 days EARLY against the six
  workbooks'' own Description stamps; derived_month_first_archive = the same fallback on a body replayed
  from the web archive, kept DISTINCT because the archive''s own Last-Modified is the crawl''s and may
  never reach rung 1. The rung is a property of the CAPTURE, not of the row: rung 1 is reachable only
  because jobs/batch/pink_sheet_vintages_task.py reads each release''s raw_meta sidecar and hands the
  header to the builder -- bronze carries no clock column -- so a release whose sidecar is absent or unreadable
  takes rung 2, declared by absence rather than guessed. Count the values to tell an origin-clocked vintage
  from an archive-clocked one; the four already-banked objects all read derived_month_first, and that
  zero is measured.'
