# PSD-first supervised target mapping.
#
# This file is the target-source truth table for the next model-ready target
# family. It does not build targets by itself; Phase 3 uses this contract to
# build target panels from silver/psd.

schema_version: 1

source:
  source_key: psd
  target_source: psd
  source_table: silver_psd
  s3_prefix: s3://leviathan-dev-shahem-001/silver/psd/
  source_slug_field: leviathan_slug
  country_field: country
  year_field: market_year
  release_date_field: release_date
  source_vintage_field: release_date

defaults:
  dataset_key: psd_snd_anomaly
  target_type: trailing_trend_pct_anomaly
  min_history_years: 5
  target_year_field: market_year
  model_year_field: crop_year
  target_revision_policy: latest_release_for_market_year
  target_release_context: latest_available_psd_release
  near_zero_trend_epsilon: 1.0e-9
  allowed_as_feature: true
  allowed_as_target: true
  target_grain:
    - contract_key
    - psd_country
    - market_year
    - target_key

target_metrics:
  - target_key: psd_production_anomaly_pct
    target_family: psd_production_anomaly
    psd_attribute: production_mt
    title: PSD production anomaly versus trailing trend
    unit: pct_deviation
    value_unit: metric_tons
    allowed_as_target: true

  - target_key: psd_ending_stocks_anomaly_pct
    target_family: psd_balance_sheet_anomaly
    psd_attribute: ending_stocks_mt
    title: PSD ending-stocks anomaly versus trailing trend
    unit: pct_deviation
    value_unit: metric_tons
    allowed_as_target: true

  - target_key: psd_stock_to_use_anomaly_pct
    target_family: psd_balance_sheet_anomaly
    psd_attribute: su_ratio
    title: PSD stock-to-use anomaly versus trailing trend
    unit: pct_deviation
    value_unit: ratio
    allowed_as_target: true

  - target_key: psd_exports_anomaly_pct
    target_family: psd_balance_sheet_anomaly
    psd_attribute: exports_mt
    title: PSD exports anomaly versus trailing trend
    unit: pct_deviation
    value_unit: metric_tons
    allowed_as_target: true

  - target_key: psd_imports_anomaly_pct
    target_family: psd_balance_sheet_anomaly
    psd_attribute: imports_mt
    title: PSD imports anomaly versus trailing trend
    unit: pct_deviation
    value_unit: metric_tons
    allowed_as_target: true

  - target_key: psd_domestic_use_anomaly_pct
    target_family: psd_balance_sheet_anomaly
    psd_attribute: consumption_mt
    title: PSD domestic-use anomaly versus trailing trend
    unit: pct_deviation
    value_unit: metric_tons
    allowed_as_target: true

legacy_target_family:
  dataset_key: annual_physical_anomaly
  status: legacy_baseline
  target_source: faostat
  source_key: production:faostat
  note: Existing production/yield/area anomaly targets are FAOSTAT-derived engineering baselines, not PSD-first futures-linked targets.
  target_keys:
    - production_anomaly_pct
    - yield_anomaly_pct
    - area_harvested_anomaly_pct

contract_mappings:
  - contract_key: arabica_coffee
    target_status: aggregate_proxy
    target_source: psd
    psd_source_slug: arabica_coffee
    psd_commodity: coffee_green
    mapping_confidence: medium
    allowed_targets:
      - psd_production_anomaly_pct
      - psd_ending_stocks_anomaly_pct
      - psd_stock_to_use_anomaly_pct
      - psd_exports_anomaly_pct
      - psd_imports_anomaly_pct
      - psd_domestic_use_anomaly_pct
    target_origins:
      - origin_key: brazil
        psd_country: Brazil
        role: primary_origin
      - origin_key: colombia
        psd_country: Colombia
        role: primary_origin
      - origin_key: honduras
        psd_country: Honduras
        role: primary_origin
    note: PSD coffee is green-coffee aggregate; it does not cleanly split arabica from robusta.

