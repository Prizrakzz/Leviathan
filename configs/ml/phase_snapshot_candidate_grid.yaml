# WASDE snapshot candidate smoke grid.
#
# This is deliberately smaller than the Phase 10 certification grid.  Its job
# is to prove grouped snapshot CV and safety gates before broader sweeps.

schema_version: 1

defaults:
  model_dataset_version: latest
  source_dataset_version: none
  commodities:
    - corn_cbot
  dataset_keys:
    - psd_snd_anomaly_snapshot
  target_keys:
    - psd_production_anomaly_pct
  feature_sets:
    - wasde_monthly_revision
    - preseason_physical_plus_wasde_revision
  feature_stack: auto
  models:
    - lightgbm
  min_train_years: 10
  min_trainable_annual_groups: 20
  min_event_groups: 5
  min_non_null_rate: 0.2
  collapse_policy: latest

model_param_profiles:
  - id: lightgbm_snapshot_smoke
    models:
      - lightgbm
    params:
      n_estimators: 200
      max_depth: 3
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.7
      num_leaves: 7
      min_data_in_leaf: 10
      lambda_l1: 0.1
      lambda_l2: 5.0

  - id: xgboost_snapshot_smoke
    models:
      - xgboost
    params:
      n_estimators: 200
      max_depth: 2
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.7
      min_child_weight: 10
      reg_alpha: 0.1
      reg_lambda: 5.0

hypotheses:
  - id: corn_snapshot_grouped_cv_smoke
    description: Corn-only grouped snapshot CV smoke for pure WASDE revisions and preseason-plus-WASDE context.
    models:
      - lightgbm
      - xgboost
    model_param_profiles:
      - lightgbm_snapshot_smoke
      - xgboost_snapshot_smoke
