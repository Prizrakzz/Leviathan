# Model-ready dataset version status registry.
#
# This file is the non-destructive control plane for MLflow experiment surfaces.
# It does not move, delete, or mutate S3 objects.  It tells readers which
# immutable model-ready versions are active research surfaces and which are
# retained only for legacy/replay comparisons.

schema_version: 1

defaults:
  default_status: unknown
  active_statuses:
    - active
  non_default_statuses:
    - legacy
    - deprecated
    - archived_reference
    - blocked
    - unknown

versions:
  - dataset_version: 20260627T121215Z_phase5_psd_smoke
    status: active
    default_discovery_allowed: true
    target_source: psd
    dataset_keys:
      - psd_snd_anomaly
    source_gold_dataset_version: 20260626T010217Z_6725de02_phase7_full
    scope: smoke
    commodity_count: 4
    matrix_count: 24
    target_count: 24
    default_priority: 100
    notes: Current PSD-first smoke research surface for corn, soybeans, soybean oil, and soft red winter wheat. Replace with a full PSD-first version when built.

  - dataset_version: 20260627T190257Z_1a042698_phase9_psd_snapshot_corn
    status: legacy
    default_discovery_allowed: false
    target_source: psd
    dataset_keys:
      - psd_snd_anomaly_snapshot
    source_gold_dataset_version: 20260626T010217Z_6725de02_phase7_full
    scope: snapshot_smoke
    commodity_count: 1
    matrix_count: 1
    target_count: 1
    legacy_reason: Superseded by the Phase 1 PSD vintage-pruned snapshot surface; retained for replay because it exposed all-missing MoM revision columns from the current silver/psd source.
    replaced_by: 20260628T012959Z_57a6b3ea_phase1_psd_vintage_pruned
    default_priority: 0
    notes: Corn PSD production-anomaly snapshot surface with point-in-time monthly PSD vintage features and combined preseason-plus-vintage feature-set membership.

  - dataset_version: 20260628T012959Z_57a6b3ea_phase1_psd_vintage_pruned
    status: active
