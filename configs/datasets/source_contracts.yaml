# Source certification contracts for MLflow experiment readiness.
#
# These contracts intentionally describe the live silver/feature inputs that can
# feed model-ready gold. They do not include GraphRAG tables.
#
# status values:
#   core              - eligible for core fundamental feature sets if checks pass
#   certified_driver  - economic/physical driver allowed in core feature sets
#   diagnostic_only   - useful for slicing/monitoring, not core fitting
#   deferred          - present but not needed for the next MLflow-ready slice
#
# duplicate_check values:
#   full  - run exact duplicate natural-key check
#   skip  - skip exact duplicate check and record the reason

sources:
  - source_key: production:faostat
    title: FAOSTAT production silver
    glue_table: silver_production
    s3_prefix: s3://leviathan-dev-shahem-001/silver/production/
    status: core
    grain: commodity x country x metric x year
    required_columns: [country, country_key, metric, unit, value, source, dataset]
    natural_key: [commodity, country_key, metric, year]
    date_columns: [year]
    availability_columns: [year, ingest_date]
    expected_min_rows: 1000
    duplicate_check: full

  - source_key: weather:chirps
    title: CHIRPS precipitation silver
    glue_table: silver_chirps
    s3_prefix: s3://leviathan-dev-shahem-001/silver/weather/source=chirps/
    status: core
    grain: commodity x country x region x date x variable
    required_columns: [date, variable, value, source]
    natural_key: [commodity, country, region, year, month, date, variable]
    date_columns: [date, year, month]
    availability_columns: [date, ingest_date]
    expected_min_rows: 1000
    duplicate_check: skip
    athena_mode: metadata_only
    duplicate_skip_reason: large partitioned daily weather source; exact duplicate scan is deferred to source-specific validation

