    status: active
    s3_prefix: silver/model_predictions/
    format: PARQUET
    schema:
      - {name: country, type: string, nullable: false}
      - {name: crop_year, type: int, nullable: false}
      - {name: y_actual, type: double, nullable: true}
      - {name: y_pred, type: float, nullable: false}
      - {name: commodity, type: string, nullable: false}
      - {name: tier, type: string, nullable: false}
      - {name: target, type: string, nullable: false}
      - {name: model, type: string, nullable: false}
      - {name: feature_set_sha, type: string, nullable: false}
      - {name: run_id, type: string, nullable: false}
      - {name: as_of_date, type: string, nullable: false}
      - {name: model_family, type: string, nullable: false}
      - {name: prediction_date, type: string, nullable: false}
    natural_key: [model_family, prediction_date, run_id, commodity, country, crop_year]
    partitions:
      - name: model_family
        type: string
        projection: {type: enum, values: "tier1_production,tier2_sd,tier3_spread,anomaly"}
      - name: prediction_date
        type: string
        projection: {type: date, format: yyyy-MM-dd, range: "2026-01-01,2035-12-31"}
    owner: {transform: null, task: jobs/batch/train_commodity.py}
    timestamps: {primary: [as_of_date, prediction_date]}
    freshness_days: 30
    historical_range: {start: "2026", end: null}
    core_fundamental: false
    athena:
      table: silver_model_predictions
      storage_template: >-
        silver/model_predictions/model_family=${model_family}/prediction_date=${prediction_date}/
      smoke_query: >-
        SELECT run_id FROM "leviathan_dev"."silver_model_predictions"
        WHERE model_family='tier1_production' AND prediction_date='2026-06-17'
        LIMIT 1
