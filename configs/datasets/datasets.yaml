# Dataset registry for MLflow-ready, queryable derived datasets.
#
# Source contracts live in source_contracts.yaml. This file describes derived
# gold artifacts that training jobs and Athena can select by dataset_version.

datasets:
  - dataset_key: gold_feature_spine_versions
    title: Immutable broad feature spine versions
    layer: gold
    format: parquet
    grain: dataset_version x commodity x country x crop_year x feature
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_spine_versions/
    athena_table: gold_feature_spine_versions
    partition_keys: [dataset_version, commodity]
    natural_key: [dataset_version, commodity, country, crop_year, feature]
    versioned: true
    mutable_latest_table: gold_feature_spine

  - dataset_key: gold_feature_matrix_versions
    title: Immutable broad feature matrix versions
    layer: gold
    format: parquet
    grain: dataset_version x commodity x country x crop_year
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_matrix_versions/
    athena_table: null
    partition_keys: [dataset_version, commodity]
    natural_key: [dataset_version, commodity, country, crop_year]
    versioned: true
    mutable_latest_table: null
    note: Wide matrix columns vary by dataset version; use as an MLflow training artifact.

  - dataset_key: gold_feature_catalog_versions
    title: Feature catalog per immutable gold dataset version
    layer: gold
    format: parquet
    grain: dataset_version x feature
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_catalog_versions/
    athena_table: gold_feature_catalog_versions
    partition_keys: [dataset_version]
    natural_key: [dataset_version, feature]
    versioned: true
    mutable_latest_table: gold_feature_catalog

  - dataset_key: gold_feature_entity_map_versions
    title: Feature-to-entity coverage per immutable gold dataset version
    layer: gold
    format: parquet
    grain: dataset_version x feature x commodity x country
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_entity_map_versions/
    athena_table: gold_feature_entity_map_versions
    partition_keys: [dataset_version]
    natural_key: [dataset_version, feature, commodity, country]
    versioned: true
    mutable_latest_table: null

  - dataset_key: gold_feature_group_map_versions
    title: Feature-to-group coverage per immutable gold dataset version
    layer: gold
    format: parquet
    grain: dataset_version x feature x group
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_group_map_versions/
    athena_table: gold_feature_group_map_versions
    partition_keys: [dataset_version]
    natural_key: [dataset_version, feature, group]
    versioned: true
    mutable_latest_table: null

  - dataset_key: gold_feature_set_versions
    title: Model-purpose feature sets per immutable gold dataset version
    layer: gold
    format: parquet
    grain: dataset_version x feature_set_id x feature
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_set_versions/
    athena_table: gold_feature_set_versions
    partition_keys: [dataset_version]
    natural_key: [dataset_version, feature_set_id, feature]
    versioned: true
    mutable_latest_table: null

  - dataset_key: gold_feature_set_manifests
    title: Model-purpose feature-set JSON summaries
    layer: gold
    format: json
    grain: dataset_version
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_set_manifests/
    athena_table: null
    partition_keys: [dataset_version]
    natural_key: [dataset_version]
    versioned: true
    mutable_latest_table: null

  - dataset_key: gold_feature_spine_manifests
    title: Immutable feature spine dataset manifests
    layer: gold
    format: json
    grain: dataset_version
    s3_prefix: s3://leviathan-dev-shahem-001/gold/feature_spine_manifests/
    athena_table: gold_feature_spine_manifests
    partition_keys: [dataset_version]
    natural_key: [dataset_version]
    versioned: true
    mutable_latest_table: null

  - dataset_key: gold_training_windows_versions
    title: Training window summaries per immutable matrix version
    layer: gold
    format: parquet
    grain: dataset_version x commodity x tier
    s3_prefix: s3://leviathan-dev-shahem-001/gold/training_windows_versions/
    athena_table: gold_training_windows_versions
    partition_keys: [dataset_version]
    natural_key: [dataset_version, commodity, tier]
    versioned: true
    mutable_latest_table: gold_training_windows
