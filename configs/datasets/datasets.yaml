schema_version: 1
bucket: leviathan-dev-shahem-001
database: leviathan_dev

# Tables that are intentionally removed after their definitions are backed up.
retired_tables:
  - production_raw
  - silver_fnc_colombia
  - silver_weather

x-commodity-values: &commodity_values >-
  cocoa,corn_cbot,campinas_corn_reference_bmf,french_wheat_matif,
  french_maize_matif,hard_red_winter_wheat_kcbt,
  hard_red_spring_wheat_mgex,soft_red_winter_wheat_cbot,
  rough_rice_cbot,south_african_white_maize_jse,
  south_african_yellow_maize_jse,soybeans_cbot,soybean_meal_cbot,
  soybean_oil_cbot,soybeans_no_1_dce,soybeans_no_2_dce,
  soybean_meal_dce,soybean_oil_dce,french_rapeseed_matif,canola_ice,
  rapeseed_oil_zce,rapeseed_meal_zce,malaysian_crude_palm_oil_cme,
  palm_olein_dce,brazilian_arabica_coffee,arabica_coffee,
  robusta_coffee,cotton,raw_sugar,white_sugar,frozen_orange_juice

x-weather-long-schema: &weather_long_schema
  - {name: date, type: date, nullable: false}
  - {name: year, type: bigint, nullable: false}
  - {name: month, type: bigint, nullable: false}
  - {name: day, type: bigint, nullable: false}
  - {name: country, type: string, nullable: false}
  - {name: region, type: string, nullable: false}
  - {name: commodity, type: string, nullable: false}
  - {name: source, type: string, nullable: false}
  - {name: ingest_date, type: string, nullable: false}
  - {name: variable, type: string, nullable: false}
  - {name: value, type: double, nullable: true}

x-graphrag-partitions: &graphrag_partitions
  - name: source
    type: string
    projection:
      type: enum
      values: usda_wasde,usda_wap,usda_gain,conab
  - name: year
    type: int
    projection: {type: integer, range: "1973,2035"}
  - name: month
    type: int
    projection: {type: integer, range: "1,12", digits: "2"}

datasets:
  - dataset_id: metadata_s3_inventory
    layer: metadata
    role: metadata
    status: active
    s3_prefix: metadata/s3_inventory/
    format: PARQUET
    schema:
      - {name: bucket, type: string, nullable: false}
      - {name: key, type: string, nullable: false}
      - {name: size, type: bigint, nullable: false}
      - {name: last_modified_date, type: timestamp, nullable: false}
      - {name: e_tag, type: string, nullable: true}
      - {name: storage_class, type: string, nullable: true}
      - {name: replication_status, type: string, nullable: true}
      - {name: encryption_status, type: string, nullable: true}
      - {name: dt, type: string, nullable: false}
    natural_key: [bucket, key, dt]
    partitions:
      - name: dt
        type: string
        projection:
          type: date
          format: yyyy-MM-dd-HH-mm
          range: 2026-06-23-00-00,NOW
          interval: "1"
          interval.unit: HOURS
    owner: {transform: null, task: aws_s3_bucket_inventory}
    timestamps: {primary: [last_modified_date, dt]}
    freshness_days: 8
    historical_range: {start: "2026-06-23", end: null}
    core_fundamental: true
    athena:
      table: metadata_s3_inventory
      location: metadata/s3_inventory/leviathan-dev-shahem-001/leviathan-dev-weekly/hive/
      serde: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
      input_format: org.apache.hadoop.hive.ql.io.SymlinkTextInputFormat
      output_format: org.apache.hadoop.hive.ql.io.IgnoreKeyTextOutputFormat
      smoke_query: >-
        SELECT key FROM "leviathan_dev"."metadata_s3_inventory"
        WHERE dt = date_format(current_timestamp - interval '7' day, '%Y-%m-%d-00-00')
        LIMIT 1

  - dataset_id: gold_feature_catalog
    layer: gold
    role: metadata
    status: active
    s3_prefix: gold/feature_catalog/
    format: PARQUET
    schema:
      - {name: feature, type: string, nullable: false}
      - {name: scope, type: string, nullable: false}
      - {name: group, type: string, nullable: true}
      - {name: commodity, type: string, nullable: true}
      - {name: is_label, type: boolean, nullable: false}
    natural_key: [feature]
    partitions: []
    owner:
      transform: leviathan.features.pivot.build_feature_catalog
      task: jobs/batch/feature_spine_task.py
    timestamps: {primary: []}
    freshness_days: 30
    historical_range: {start: null, end: null}
    core_fundamental: false
    athena: {table: gold_feature_catalog}

  - dataset_id: gold_feature_spine
    layer: gold
    role: feature_source
    status: active
    s3_prefix: gold/feature_spine/commodity=
    format: PARQUET
    schema:
      - {name: country, type: string, nullable: false}
      - {name: crop_year, type: int, nullable: false}
      - {name: feature, type: string, nullable: false}
      - {name: value, type: double, nullable: true}
      - {name: is_label, type: boolean, nullable: false}
      - {name: event_time, type: date, nullable: false}
      - {name: commodity, type: string, nullable: false}
    natural_key: [commodity, country, crop_year, feature]
    partitions:
      - name: commodity
        type: string
        projection: {type: enum, values: *commodity_values}
    owner:
      transform: leviathan.features.spine.build_spine
      task: jobs/batch/feature_spine_task.py
    timestamps: {primary: [event_time]}
    freshness_days: 30
    historical_range: {start: "1961", end: null}
    core_fundamental: true
    athena:
      table: gold_feature_spine
      location: gold/feature_spine/
      storage_template: gold/feature_spine/commodity=${commodity}/
      smoke_query: >-
        SELECT feature FROM "leviathan_dev"."gold_feature_spine"
        WHERE commodity='corn_cbot' LIMIT 1

