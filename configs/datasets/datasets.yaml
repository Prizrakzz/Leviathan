      task: jobs/batch/feature_spine_v2_task.py
    timestamps: {primary: [as_of_date, feature_available_at]}
    freshness_days: null
    historical_range: {start: "1981", end: null}
    core_fundamental: true
    athena:
      table: gold_v2_feature_spine
      location: gold_v2/feature_spine/
      storage_template: gold_v2/feature_spine/dataset_version=${dataset_version}/commodity=${commodity}/
      smoke_query: >-
        SELECT feature FROM "leviathan_dev"."gold_v2_feature_spine"
        WHERE dataset_version='__REPLACE_ME__' AND commodity='corn_cbot' LIMIT 1

