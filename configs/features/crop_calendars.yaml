# Crop calendars: phenological stage windows + crop-year/marketing-year alignment.
#
# Source of truth for the windows documented in desiredstate.md ("Crop calendars
# consumed by the feature engineering pipeline" + "Crop Year vs Marketing Year —
# Alignment Rule").  Consumed by leviathan.features.calendar.
#
# Per commodity:
#   crop_year_start_month: month (1-12) on which integer crop_year N begins.
#       crop_year N spans [N-{start_month}-01, N+1-{start_month}-01).
#       Example: corn_cbot start_month=5 → crop_year 2024 = 2024-05-01..2025-04-30.
#   mkt_year_offset: marketing-year integer offset joined for S/D features.
#       -1 = prior marketing year (the vintage available at planting).
#   stages: {stage_name: [start_month, end_month]} — inclusive month windows.
#       start_month > end_month means the window crosses the calendar-year
#       boundary (e.g. grain_fill 11-3 = Nov..Mar of the following year).
#       Stage months are resolved RELATIVE to the crop year: each month is the
#       first occurrence of that month on/after the crop-year start date.
#   gdd_window: [first_stage, last_stage] — stages bounding GDD accumulation.
#
# Commodities without an entry get no stage-window weather features (structural
# missingness — the spine still builds with production/S-D features).

corn_cbot:
  crop_year_start_month: 5
  mkt_year_offset: -1
  stages:
    planting: [5, 5]
    silking: [7, 7]
    grain_fill: [8, 8]
    harvest: [9, 10]
  gdd_window: [planting, grain_fill]

