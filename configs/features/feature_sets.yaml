# Model-purpose feature sets for MLflow experiments.
#
# These sets are resolved from the semantic feature catalog generated for an
# immutable gold dataset version.  They replace era-style tiers for the governed
# training path while leaving configs/features/feature_tiers.yaml available for
# legacy/backward-compatible runs.

schema_version: 1

defaults:
  exclude_labels: true
  blocked_policies:
    - excluded_market_signal
  min_non_null_rate: 0.0
  min_lag_days: 0
  allow_empty: false
  allow_diagnostic: false
  missingness_policy: tree_models_allow_nan

feature_sets:
  - id: preseason_physical
    version: 1
    description: Long-horizon physical baseline known before or early in the crop year.
    allowed_policies:
      - fundamental_physical
      - certified_economic_driver
    allowed_semantic_scopes:
      - origin_production_history
      - origin_balance_sheet
      - global_climate
      - economic_driver
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - production_anomaly
      - yield_anomaly
      - balance_sheet_revision

  - id: inseason_weather
    version: 1
    description: Weather, soil-moisture, remote-sensing, and climate-stress features.
    allowed_policies:
      - fundamental_physical
    allowed_feature_families:
      - weather_precipitation
      - weather_drought
      - weather_temperature
      - weather_frost
      - weather_heat_stress
      - growing_degree_days
      - soil_moisture
      - vegetation_index
      - enso
      - indian_ocean_dipole
      - perennial_capacity
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - production_anomaly
      - yield_anomaly
      - tail_event_probability

  - id: inseason_weather_dense
    version: 1
    description: Dense origin-level weather stress aggregates for annual PSD anomaly experiments.
    allowed_policies:
      - fundamental_physical
    allowed_feature_families:
      - weather_dense
    exclude_feature_patterns:
      - "^weather_dense_ndvi_z_coverage_share_"
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    min_non_null_rate: 0.6
    target_compatibility:
      - production_anomaly
      - yield_anomaly
      - tail_event_probability

  - id: preseason_physical_plus_weather_dense
    version: 1
    description: Preseason physical baseline plus dense in-season weather aggregates.
    allowed_policies:
      - fundamental_physical
      - certified_economic_driver
    allowed_semantic_scopes:
      - origin_production_history
      - origin_balance_sheet
      - global_climate
      - economic_driver
      - origin_stage_weather
    exclude_feature_patterns:
      - "^chirps_precip_"
      - "^drought_z_"
      - "^nasa_tmax_anomaly_"
      - "^nasa_tmin_anomaly_"
      - "^frost_event_flag_"
      - "^gdd_z_"
      - "^heat_stress_z_"
      - "^cpc_soil_z_"
      - "^modis_ndvi_z_"
      - "^weather_dense_ndvi_z_coverage_share_"
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    min_non_null_rate: 0.6
    target_compatibility:
      - production_anomaly
      - yield_anomaly
      - balance_sheet_revision
      - tail_event_probability

  - id: corn_preseason_core
    version: 1
    description: Corn experiment baseline using preseason physical context and certified planting incentives.
    component_feature_sets:
      - preseason_physical
      - planting_incentives
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - production_anomaly

  - id: persistence_context
    version: 1
    description: Model-ready-only prior-year target anomaly context for persistence-aware annual experiments.
    allow_empty: true
    allowed_policies:
      - fundamental_physical
    allowed_feature_families:
      - persistence_context
    include_feature_patterns:
      - "^persistence_"
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    min_lag_days: 365
    target_compatibility:
      - psd_production_anomaly
      - psd_balance_sheet_anomaly
      - tail_event_probability

  - id: corn_persistence_core
    version: 1
    description: Corn preseason core plus prior-year target anomaly persistence context.
    component_feature_sets:
      - corn_preseason_core
      - persistence_context
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - production_anomaly
      - tail_event_probability

  - id: corn_persistence_weather_pruned
    version: 1
    description: Corn persistence core plus dense weather features that pass model-ready sparsity gates.
    component_feature_sets:
      - corn_persistence_core
      - inseason_weather_dense
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    min_non_null_rate: 0.6
    target_compatibility:
      - psd_production_anomaly
      - production_anomaly
      - tail_event_probability

  - id: corn_persistence_flow
    version: 1
    description: Corn persistence core plus observable physical-flow pace features.
    component_feature_sets:
      - corn_persistence_core
      - physical_flow
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - production_anomaly
      - balance_sheet_revision
      - tail_event_probability

  - id: corn_preseason_core_plus_weather_dense
    version: 1
    description: Corn preseason baseline plus dense origin-level in-season weather aggregates.
    component_feature_sets:
      - corn_preseason_core
      - inseason_weather_dense
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - production_anomaly
      - tail_event_probability

  - id: corn_preseason_core_plus_wasde
    version: 1
    description: Corn preseason baseline plus point-in-time WASDE monthly revision signal.
    component_feature_sets:
      - corn_preseason_core
      - wasde_monthly_revision
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - psd_balance_sheet_anomaly
      - official_estimate_revision

  - id: corn_preseason_core_plus_flow
    version: 1
    description: Corn preseason baseline plus observable physical-flow pace features.
    component_feature_sets:
      - corn_preseason_core
      - physical_flow
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - production_anomaly
      - balance_sheet_revision

  - id: corn_weather_wasde
    version: 1
    description: Corn preseason baseline plus dense weather stress and point-in-time WASDE revision signal.
    component_feature_sets:
      - corn_preseason_core
      - inseason_weather_dense
      - wasde_monthly_revision
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - psd_balance_sheet_anomaly
      - tail_event_probability

  - id: corn_weather_flow
    version: 1
    description: Corn preseason baseline plus dense weather stress and observable physical-flow pace.
    component_feature_sets:
      - corn_preseason_core
      - inseason_weather_dense
      - physical_flow
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - production_anomaly
      - tail_event_probability
      - balance_sheet_revision

  - id: corn_full_fundamental_stack
    version: 1
    description: Corn full non-market annual fundamental stack for controlled Phase 6 certification.
    component_feature_sets:
      - corn_preseason_core
      - inseason_weather_dense
      - physical_flow
      - crop_condition
      - balance_sheet
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - psd_balance_sheet_anomaly
      - production_anomaly
      - tail_event_probability
      - balance_sheet_revision

  - id: crop_condition
    version: 1
    description: In-season crop-condition and progress features.
    allowed_policies:
      - fundamental_physical
    allowed_semantic_scopes:
      - inseason_crop_condition
    target_compatibility:
      - production_anomaly
      - yield_anomaly
      - finalization_gap

  - id: official_revision
    version: 1
    description: Official survey and balance-sheet revisions.
    allowed_policies:
      - fundamental_physical
    allowed_semantic_scopes:
      - official_revision
      - official_estimate
    target_compatibility:
      - official_estimate_revision
      - finalization_gap

  - id: psd_monthly_vintage_features
    version: 1
    description: Legacy alias for PSD balance-sheet snapshot context. Current silver/psd does not retain true monthly PSD release history.
    allow_empty: true
    allowed_policies:
      - fundamental_physical
    allowed_feature_families:
      - psd_balance_sheet_snapshot
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - psd_balance_sheet_anomaly
      - official_estimate_revision
      - finalization_gap

  - id: psd_balance_sheet_snapshot
    version: 1
    description: Point-in-time PSD balance-sheet snapshot context for annual PSD target models.
    allow_empty: true
    allowed_policies:
      - fundamental_physical
    allowed_feature_families:
      - psd_balance_sheet_snapshot
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - psd_balance_sheet_anomaly
      - official_estimate_revision
      - finalization_gap

  - id: wasde_monthly_revision
    version: 1
    description: Diagnostic-only as a standalone stack until the WASDE release-date rebuild emits dense latest-estimate and balance-sheet features; current production matrix selected zero usable pure WASDE columns.
    allowed_policies:
      - fundamental_physical
    allowed_feature_families:
      - official_revisions
    allowed_sources:
      - wasde
    include_feature_patterns:
      - "^wasde_"
    blocked_policies:
      - diagnostic_only
      - excluded_market_signal
    target_compatibility:
      - psd_production_anomaly
      - psd_balance_sheet_anomaly
      - official_estimate_revision
      - finalization_gap

  - id: physical_flow
    version: 1
    description: Export, delivery, crush, and other observable physical-flow pace features.
    allowed_policies:
      - fundamental_physical
    allowed_semantic_scopes:
      - origin_physical_flow
    target_compatibility:
      - physical_flow_trajectory
      - balance_sheet_revision

  - id: quality_tenderability
    version: 1
    description: Quality and tenderable-supply features for commodities where headline production overstates usable supply.
    allow_empty: true
    allowed_policies:
      - fundamental_physical
    allowed_semantic_scopes:
      - quality_tenderability
    allowed_feature_families:
      - cotton_quality
    target_compatibility:
      - quality_tenderability_event
      - tail_event_probability

  - id: balance_sheet
    version: 1
    description: Stocks, use, supply-demand, and stock-use balance features.
    allowed_policies:
      - fundamental_physical
    allowed_semantic_scopes:
      - origin_balance_sheet
      - balance_sheet
    target_compatibility:
      - balance_sheet_revision
      - stock_use_revision

  - id: processing_economics
    version: 1
    description: Certified lagged processing-economics drivers with a physical-demand mechanism.
    allow_empty: true
    allowed_policies:
      - certified_economic_driver
    allowed_feature_families:
      - processing_economics
      - substitution_economics
    blocked_policies:
      - fundamental_physical
      - diagnostic_only
      - excluded_market_signal
    min_lag_days: 1
    target_compatibility:
      - crush_demand
      - substitution_demand
      - balance_sheet_revision

  - id: planting_incentives
    version: 1
    description: Certified lagged cost and FX drivers that can affect acreage or producer incentives.
    allowed_policies:
      - certified_economic_driver
    allowed_feature_families:
      - input_costs
      - fx_macro
    blocked_policies:
      - fundamental_physical
      - diagnostic_only
      - excluded_market_signal
    min_lag_days: 1
    target_compatibility:
      - planted_area_anomaly
      - production_anomaly

  - id: trade_competitiveness
    version: 1
    description: Certified lagged FX competitiveness drivers.
    allowed_policies:
      - certified_economic_driver
    allowed_feature_families:
      - fx_macro
    blocked_policies:
      - fundamental_physical
      - diagnostic_only
      - excluded_market_signal
    min_lag_days: 1
    target_compatibility:
      - export_pace
      - balance_sheet_revision

  - id: tail_risk
    version: 1
    description: Physical stress and anomaly features useful for downside/upside event classification.
    allowed_policies:
      - fundamental_physical
    allowed_feature_families:
      - weather_drought
      - weather_frost
      - weather_heat_stress
      - growing_degree_days
      - soil_moisture
      - vegetation_index
      - crop_condition
      - cotton_quality
    target_compatibility:
      - tail_event_probability
      - multivariate_physical_anomaly

  - id: data_quality
    version: 1
    description: Availability and lookback diagnostics for experiment slicing and QA.
    allowed_policies:
      - fundamental_physical
    include_feature_patterns:
      - "_available$"
      - "^capacity_lookback_truncated_"
    target_compatibility:
      - diagnostic_dataset_quality
    missingness_policy: diagnostic_not_model_input

  - id: diagnostic_market_context
    version: 1
    description: Diagnostic-only market context for monitoring and slicing, not core fitting.
    allowed_policies:
      - diagnostic_only
    allowed_semantic_scopes:
      - diagnostic_market_context
    allowed_feature_families:
      - market_positioning
    blocked_policies:
      - excluded_market_signal
    allow_diagnostic: true
    target_compatibility:
      - diagnostic_monitoring
    missingness_policy: diagnostic_only
