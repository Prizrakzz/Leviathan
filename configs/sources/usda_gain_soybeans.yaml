source: usda_gain_soybeans

commodity_id: 27  # FAS taxonomy: "Soybeans"

browse_url: "https://fas.usda.gov/data/search?reports%5B0%5D=report_type%3A10251&reports%5B1%5D=report_commodities%3A27"

notes: >
  USDA FAS GAIN country-level Soybeans Annual attaché intelligence reports.
  Covers the CBOT/DCE soybean spread origins. Primary intelligence on area planted,
  crop conditions, crush margins, export registrations, China import demand, and
  Argentina/Brazil competitiveness dynamics.

publication_cadence: annual

target_commodities:
  - soybeans_cbot
  - soybeans_no_1_dce
  - soybeans_no_2_dce

report_categories:
  - Oilseeds and Products Annual
  - Oilseeds and Products Update

target_countries:
  - BR   # Brazil           (largest exporter)
  - US   # United States    (CBOT)
  - AR   # Argentina        (largest meal/oil exporter)
  - CN   # China            (largest importer)
  - PY   # Paraguay
  - BO   # Bolivia
  - IN   # India
  - UA   # Ukraine

historical_depth: 1998

s3_key_pattern: >
  raw/production/source=usda_gain_soybeans/country={iso2}/publication_date={YYYYMMDD}/{filename}.pdf

graphrag_priority: P2

crawl_command: >
  python scratch/gain/probe_gain_http.py
    --commodity-id 27
    --target-countries BR,US,AR,CN,PY,BO,IN,UA
    --output scratch/gain/crawl_soybeans.jsonl

manifest_command: >
  python scratch/gain/build_manifest.py
    --source-name usda_gain_soybeans
    --input scratch/gain/crawl_soybeans.jsonl

backfill_command: >
  python jobs/ingest/fetch_gain.py
    --source usda_gain_soybeans
    --skip-existing-s3
    --sleep-seconds 2
