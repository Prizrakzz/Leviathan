# MPOC (Malaysian Palm Oil Council) - market intelligence and trade statistics
# Source : Malaysian Palm Oil Council
# URL    : https://mpoc.org.my
# CMS    : WordPress; no WAF; standard requests with Chrome UA works
#
# Four series:
#   trade_statistics   - Monthly Palm Oil Trade Statistics (2009-2023, 15 pages)
#   stock_comparison   - Stock Comparison single live page (multi-country oils & fats)
#   competitive_prices - Daily Palm Oil Prices single live page (CPO vs SBO vs SFO)
#   market_highlights  - Individual market analysis articles (342 articles)

releases:

