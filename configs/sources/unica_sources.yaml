# UNICA (Brazilian Sugarcane Industry Association) — Production and Milling History
#
# Source: UNICADATA portal — https://unicadata.com.br/historico-de-producao-e-moagem.php
# Region: Brazil Center-South (Centro-Sul) only.
# Cadence: Fortnightly (quinzenal) during the milling season (April–November).
# Data: Cumulative totals per fortnight — cane crushed, sugar produced, ethanol produced.
#
# The portal is JavaScript-rendered; data is loaded via AJAX after the user
# selects a harvest year.  The fetch job uses Playwright (headless Chromium)
# to drive the form and capture the rendered HTML table.
#
# Harvest year format used by UNICA on the site: "YYYY/YYYY" (e.g. "2020/2021").
# S3 key format: raw/production/source=unica/harvest_year=YYYY_YYYY/production_milling.html
#
# NOTE: The Per-Harvest view (idMn=32, tipoHistorico=4) currently only exposes
# data up to harvest year 2020/2021 (verified May 2026).  Update this list when
# newer years become available in the select dropdown.

source: unica
# idMn=32 → Production and Milling / Per Harvest (tipoHistorico=4)
url: "https://unicadata.com.br/historico-de-producao-e-moagem.php?idMn=32&tipoHistorico=4&idioma=2"
region: centro_sul

playwright:
  page_load_wait_ms: 10000
  table_wait_ms: 20000

# Available harvest years (labels as they appear in the safra <select>).
harvest_years:
  - "2005/2006"
  - "2006/2007"
  - "2007/2008"
  - "2008/2009"
  - "2009/2010"
  - "2010/2011"
  - "2011/2012"
  - "2012/2013"
  - "2013/2014"
  - "2014/2015"
  - "2015/2016"
  - "2016/2017"
  - "2017/2018"
  - "2018/2019"
  - "2019/2020"
  - "2020/2021"
