# UNICA (Brazilian Sugarcane Industry Association) — Production and Milling History
#
# Source: UNICADATA portal — https://unicadata.com.br/historico-de-producao-e-moagem.php
# Region: Brazil Center-South (Centro-Sul) only.
# Cadence: Fortnightly (quinzenal) during the milling season (April–November).
# Data: Cumulative totals per fortnight — cane crushed, sugar produced, ethanol produced.
#
# The portal is JavaScript-rendered; data is loaded via AJAX after the user
# selects a harvest year.  The fetch job uses Playwright (headless Chromium)
# to drive the form and capture the rendered HTML table.
#
# Harvest year format used by UNICA on the site: "YYYY/YYYY" (e.g. "2020/2021").
# S3 key format: raw/production/source=unica/harvest_year=YYYY_YYYY/production_milling.html
#
# NOTE: The Per-Harvest view (idMn=32, tipoHistorico=4) exposes data for
# 1980/1981–2020/2021 (41 harvest years, verified May 2026).  Years 2021/2022
# and later return empty tables on this endpoint; use unica_biweekly instead.
#
# D-SG G2-1(a-i), 2026-08-16: this list is the FLOOR, no longer the whole target.
# fetch_unica.py --through-current-season extends it to the current open season, and a
# bare run now refuses when the current season is absent from this file rather than
# re-downloading 41 closed seasons and exiting 0.  The "2021/2022 and later return empty
# tables" claim above was VERIFIED IN MAY 2026 AND HAS NOT BEEN RE-TESTED SINCE -- the
# extension is self-validating either way (_fetch_harvest_year raises when the response
# carries no <table>, and a run that uploads nothing now exits non-zero), so the first
# scheduled fire IS the probe.  If those seasons are genuinely still empty, the schedule
# goes RED weekly by design: extend this list to the seasons the portal really serves, or
# drop --through-current-season from the descriptor -- do not restore the silent no-op.

source: unica
# idMn=32 → Production and Milling / Per Harvest (tipoHistorico=4)
url: "https://unicadata.com.br/historico-de-producao-e-moagem.php?idMn=32&tipoHistorico=4&idioma=2"
region: centro_sul

playwright:
  page_load_wait_ms: 10000
  table_wait_ms: 20000

# Available harvest years (labels as they appear in the safra <select>).
# The Per-Harvest view returns real 28-row state-level data for 1980/1981–2020/2021
# (verified May 2026).  Years 2021/2022 onward return empty 4-row tables on this
# endpoint; use the unica_biweekly pipeline for post-2020/2021 data.
harvest_years:
  - "1980/1981"
  - "1981/1982"
  - "1982/1983"
  - "1983/1984"
  - "1984/1985"
  - "1985/1986"
  - "1986/1987"
  - "1987/1988"
  - "1988/1989"
  - "1989/1990"
  - "1990/1991"
  - "1991/1992"
  - "1992/1993"
  - "1993/1994"
  - "1994/1995"
  - "1995/1996"
  - "1996/1997"
  - "1997/1998"
  - "1998/1999"
