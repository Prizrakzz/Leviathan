# UNICA (Brazilian Sugarcane Industry Association) — Production and Milling History
#
# Source: UNICADATA portal — https://unicadata.com.br/historico-de-producao-e-moagem.php
# Region: Brazil Center-South (Centro-Sul) only.
# Cadence: Fortnightly (quinzenal) during the milling season (April–November).
# Data: Cumulative totals per fortnight — cane crushed, sugar produced, ethanol produced.
#
# The portal is JavaScript-rendered; data is loaded via AJAX after the user
# selects a harvest year.  The fetch job uses Playwright (headless Chromium)
# to drive the form and capture the rendered HTML table.
#
# Harvest year format used by UNICA: "YYYY/YY" (e.g. "2025/26").
# S3 key format: raw/production/source=unica/harvest_year=YYYY_YY/production_milling.html

source: unica
url: "https://unicadata.com.br/historico-de-producao-e-moagem.php?idioma=2"
region: centro_sul

# Playwright selectors — verify on first run with --debug-html flag.
# The form exposes two <select> dropdowns (start/end harvest year) and a submit button.
playwright:
  page_load_wait_ms: 10000
  table_wait_ms: 20000

# Historical range.  First known harvest year with consistent data: 2005/06.
harvest_years:
  - "2005/06"
  - "2006/07"
  - "2007/08"
  - "2008/09"
  - "2009/10"
  - "2010/11"
  - "2011/12"
  - "2012/13"
  - "2013/14"
  - "2014/15"
  - "2015/16"
  - "2016/17"
  - "2017/18"
  - "2018/19"
  - "2019/20"
  - "2020/21"
  - "2021/22"
  - "2022/23"
  - "2023/24"
  - "2024/25"
  - "2025/26"
