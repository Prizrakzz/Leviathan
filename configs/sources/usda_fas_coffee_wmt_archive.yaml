# USDA FAS Coffee: World Markets and Trade — complete archive manifest
#
# All 47 entries scraped from fas.usda.gov/data/search on 2026-05-18.
# The FAS website blocks automated HTTP clients (WAF/TLS fingerprint filtering),
# so this manifest is maintained manually.  Update cadence: ~2 new entries/year
# (June + December).  Use curl_cffi to download — it impersonates Chrome at the
# TLS layer and is not blocked.
#
# Known FAS data issue: The December 22, 2012 entry is a duplicate — the FAS
# detail page incorrectly links to the June 2012 PDF (coffee-june2012.pdf)
# instead of a separate December 22 circular.  It is retained here for
# completeness; the S3 key will differ but the bytes will be identical to the
# June 22, 2012 entry.

