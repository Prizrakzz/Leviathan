# CONAB Boletim da Safra de Café — complete archive manifest
#
# All entries scraped from www.gov.br/conab on 2026-05-18.
# gov.br/conab only retains surveys from safra 2023 onwards (10 entries).
# Historical surveys (safra 2005–2022) were not migrated to gov.br and are
# not available via automated download.
#
# Two PDF URL patterns exist on gov.br (both serve valid PDF bytes):
#   A) Direct .pdf extension: .../{slug}.pdf
#   B) Plone file object (no extension): .../{slug}   ← same bytes, no .pdf
#
# crop_year format: "YYYY_YY"   (e.g. "2024_25")
# CONAB marketing year runs April–March:
#   safra {N} = crop_year {N-1}_{last 2 of N}
#   e.g. safra 2026 = crop_year "2025_26"
#
# S3 key template:  raw_conab_key(crop_year, survey_number)
#   → raw/production/source=conab/crop_year={crop_year}/survey={NN}/boletim_cafe_{crop_year}_{NN}.pdf

