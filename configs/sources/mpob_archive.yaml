# MPOB (Malaysian Palm Oil Board) — BEPI production statistics
#
# Source: Board of Engineers Palm Oil Board — BEPI
# URL:    https://bepi.mpob.gov.my
# CMS:    Joomla 4.x; no WAF; standard requests with Chrome UA works
#
# Two report series are ingested:
#
#   annual_summary  — "Summary Of The Malaysian Palm Oil Industry {year}"
#                     One HTML page per calendar year.
#                     Published annually (typically Q1 of following year).
#                     URL pattern: /index.php/summary-2/{catid}-{year}/{artid}-summary-...
#
#   monthly_release — "{Month} {year}"
#                     One HTML page per calendar month; published ~10th of following month.
#                     URL pattern: /index.php/monthly-release/{catid}-monthly-release-{year}/{artid}-{month}-{year}
#
# Variables (national totals in tonnes unless noted):
#   Production:     CPO, Palm Kernel, CPKO (Crude Palm Kernel Oil), PKC (Palm Kernel Cake)
#   Closing Stock:  Palm Oil (CPO+PPO), Palm Kernel, CPKO, PPKO, Total PKO, PKC
#   Export:         Palm Oil, Palm Kernel Oil, PKC, Oleochemical, Biodiesel
#   Import:         CPO, PPO, Palm Oil (CPO+PPO), Total PKO
#   FFB Price:      RM/tonne (1% OER)
#
# Monthly release additionally includes regional breakdown:
#   Regions: Peninsular Malaysia, Sabah, Sarawak
#   Variables (regional): CPO production, Palm Kernel production, CPO closing stock
#
# Historical depth:
#   BEPI site launched ~2017; HTML tables available from 2017-present.
#   Pre-2016 data: Overview PDFs only (deferred; not in this manifest).
#
# Update cadence:  Monthly (monthly_release); Annual (annual_summary)
#
# Probe script:    scratch/mpob/probe_mpob_articles.py
# Fetch job:       jobs/ingest/fetch_mpob.py
# S3 path prefix:  raw/production/source=mpob/
#
# This manifest is generated by the probe script and may be updated manually
# when new annual or monthly releases are published.

releases:

  # --------------------------------------------------------------------------
  # Annual summaries — "Summary Of The Malaysian Palm Oil Industry {year}"
  # URL pattern: /stat/web_report1.php?val={YYYY}84  (confirmed 2017-2026)
  # Published annually, typically Q1 of the following year.
  # --------------------------------------------------------------------------

  - release_type: annual_summary
    year: 2017
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=201784"

  - release_type: annual_summary
    year: 2018
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=201884"

  - release_type: annual_summary
    year: 2019
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=201984"

  - release_type: annual_summary
    year: 2020
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202084"

  - release_type: annual_summary
    year: 2021
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202184"

  - release_type: annual_summary
    year: 2022
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202284"

  - release_type: annual_summary
    year: 2023
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202384"

  - release_type: annual_summary
    year: 2024
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202484"

  - release_type: annual_summary
    year: 2025
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202584"

  - release_type: annual_summary
    year: 2026
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202684"

  # --------------------------------------------------------------------------
  # Monthly releases — "{Month} {year}"
  # URL pattern: /stat/web_report1.php?val={YYYY}75&val1={MM:02d}
  # Note: the val+val1 pattern is only used for years 2020 and 2026.
  # Years 2021-2025 have no published monthly release pages in this format
  # (confirmed by exhaustive article scan art=1008-1248; all use standalone
  # val codes without val1 for annual tables, not monthly releases).
  # --------------------------------------------------------------------------

  # 2026 — April only (val=202675, art=1249); earlier months under construction
  - release_type: monthly_release
    year: 2026
    month: 4
    stat_url: "https://bepi.mpob.gov.my/stat/web_report1.php?val=202675&val1=04"

  # NOTE: 2020 monthly releases (val=202075, art=996-1007) are not included.
  # The Joomla articles exist but the stat server returns "under construction"
  # for all 12 months (val=202075&val1=01 through val1=12). These can be
  # re-added if the pages become available in future.
  #
  # NOTE: 2021-2025 monthly releases are not available in val+val1 format.
  # Exhaustive scan of art=1008-1248 found zero val1 entries; those years use
  # standalone val codes per stat table (annual-style), not monthly wrappers.
