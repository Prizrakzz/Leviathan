# World Bank Commodity Markets Outlook (CMO Outlook) — source config
#
# The CMO Outlook is the World Bank's flagship commodity research publication.
# Published semi-annually (April + October) since 2018; monthly/quarterly in
# earlier eras back to November 1994.  Each issue contains:
#
#   - Executive Summary            — directional outlook, headline price moves
#   - Energy chapter
#   - Agriculture chapter          ← primary signal for Leviathan
#   - Fertilizers chapter          ← primary signal for Leviathan
#   - Metals & Precious Metals chapter
#   - Special Focus section        ← highest-density causal narrative per issue
#
# PRIMARY USE: GraphRAG macro overlay — structural causal chains explaining
# price moves not visible in time-series data (Ukraine war → corridor blockage
# → wheat/corn supply shock; 2010–11 food crisis; 1997–98 El Niño → tropical
# commodity disruptions; 2002–2007 China demand supercycle).
#
# P3 priority: raw PDF ingest only.  Bronze/GraphRAG extraction deferred to P5.
#
# Archive page (server-rendered; BeautifulSoup-compatible):
#   https://www.worldbank.org/en/research/commodity-markets/report-archive
#
# Link structure (three tiers):
#   Tier A (2018–present):  openknowledge.worldbank.org/bitstreams/{id}/download
#   Tier B (2008–2013):     openknowledge.worldbank.org/handle/10986/{id}
#                           → follow landing page to extract bitstream URL
#   Tier C (2015–2017, some older): no direct link — Wayback CDX fallback
#
# S3 key pattern:
#   raw/production/source=wb_cmo_outlook/release={YYYY-MM}/{filename}.pdf
#
# Release partition normalisation (all eras → YYYY-MM):
#   Semi-annual:  H1 → YYYY-04,  H2 → YYYY-10
#   Quarterly:    Q1 → YYYY-01,  Q2 → YYYY-04,  Q3 → YYYY-07,  Q4 → YYYY-10
#   Monthly:      actual month
#
# Update schedule:  semi-annual DAG fires first Tuesday of April + October.
#   Cron: "0 14 1-7 4,10 2"

source_id: wb_cmo_outlook
display_name: "World Bank Commodity Markets Outlook"
publisher: "World Bank Group"
url: "https://www.worldbank.org/en/research/commodity-markets"
archive_url: "https://www.worldbank.org/en/research/commodity-markets/report-archive"

publication_frequency: semi-annual   # 2018–present; quarterly/monthly in earlier eras
first_issue: "1994-11"               # November 1994 (earliest in archive)
format: pdf

# DAG schedule: first Tuesday of April and October at 14:00 UTC
dag_schedule: "0 14 1-7 4,10 2"

# Minimum file size guard (bytes)
# Modern reports: 3–8 MB.  Older monthly notes: 100–300 KB.
# 50 KB floor catches HTML error pages and empty redirects.
min_file_size_bytes: 50000

# Manifest path (generated by --discover; hand-editable for notes/wayback fixes)
manifest_path: "configs/sources/wb_cmo_outlook_manifest.yaml"

# Wayback CDX query template for Tier C entries (2015–2017, dead links)
wayback_cdx_query: "https://web.archive.org/cdx/search/cdx?url=openknowledge.worldbank.org*&output=json&filter=statuscode:200&fl=timestamp,original&limit=5&from={from_year}0101&to={to_year}1231&matchType=prefix"

# Chapters/sections relevant to Leviathan's 31-commodity corpus.
# These heading strings are used as anchor text in P5 GraphRAG chunking.
high_value_sections:
  - "Agriculture"
  - "Fertilizers"
  - "Special Focus"
  - "Executive Summary"

# Commodity groups mentioned in Agriculture chapter — used for entity tagging
# in P5 GraphRAG extraction.
agriculture_commodities:
  grains:
    - wheat
    - corn / maize
    - rice
    - soybeans
  softs:
    - coffee (arabica, robusta)
    - cocoa
    - cotton
    - sugar
    - frozen orange juice
  oilseeds_and_oils:
    - palm oil
    - soybean oil
    - canola / rapeseed

# Fertilizer series tracked in the Fertilizers chapter.
# These overlap directly with the Pink Sheet series of interest.
fertilizer_series:
  - urea
  - DAP (diammonium phosphate)
  - potassium chloride (potash)
  - phosphate rock
  - natural gas (US Henry Hub)
  - natural gas (Europe TTF / NBP)

# High-value special focus topics by issue (for GraphRAG node labelling).
# Populated during --discover; confirmed list below for reference.
# Format: "YYYY-MM: <topic>"
special_focus_index:
  "2026-04": "The Effects of Geopolitical Oil Supply Shocks"
  "2025-10": "New Shocks, Old Tools: Revisiting International Commodity Agreements in a Fragmented World"
  "2025-04": "Post-Pandemic Commodity Cycles: A New Era?"
  "2024-10": "Commodity Price Synchronization: A New Era?"
  "2024-04": "Forecasting Industrial Commodity Prices: An Assessment"
  "2023-10": "Potential Near-Term Implications of the Conflict in the Middle East for Commodity Markets"
  "2023-04": "Forecasting Industrial Commodity Prices"
  "2022-10": "Pandemic, War, Recession: Drivers of Aluminum and Copper Prices"
  "2022-04": "The Impact of the War in Ukraine on Commodity Markets"
  "2021-10": "Urbanization and Commodity Demand"
  "2021-04": "Causes and Consequences of Metal Price Shocks"
  "2020-10": "Persistence of Commodity Shocks"
  "2020-04": "A Shock Like No Other: The Impact of COVID-19 on Commodity Markets"
  "2019-10": "The Role of Substitution in Commodity Demand"
  "2019-04": "Food Price Shocks: Channels and Implications"
  "2018-10": "The Changing of the Guard: Shifts in Industrial Commodity Demand"
  "2018-04": "Oil Exporters: Policies and Challenges"
  "2015-10": "Understanding El Niño: What Does It Mean for Commodity Markets?"
  "2016-07": "From Energy Prices to Food Prices: Moving in Tandem?"
  "2017-01": "Investment Weakness in Commodity Exporters"
