source: cftc_cot

notes: >
  CFTC Commitments of Traders (COT) — Disaggregated weekly position reports.

  The CFTC publishes COT data every Friday (positions as-of Tuesday close, 3-day lag).
  The Disaggregated format (introduced September 2006) breaks reportable traders into
  four categories: Producer/Merchant, Swap Dealer, Managed Money, and Other Reportables.
  Managed Money net position is the primary signal — it captures the directional stance
  of trend-following hedge funds, CTAs, and commodity pool operators.

  Two report types are ingested:
    disagg_futures  — Disaggregated Futures Only.  The pure futures book.
    disagg_combined — Disaggregated Futures-and-Options Combined.  CFTC delta-adjusts
                      options positions and adds them to the futures totals before
                      publishing, so positions remain in futures-equivalent contracts.

  Rationale for ingesting both:
    The difference (combined minus futures-only) isolates options-based directional
    exposure (mm_options_equiv = mm_net_combined - mm_net_futures_only).  This detects
    when managed money is expressing views through options rather than outright futures —
    a strategy common when implied vol is cheap or they want defined-risk exposure.
    Both inputs are free from CFTC; computing mm_options_equiv requires no vendor data.

  Coverage:
    14 of Leviathan's 30 commodity contracts are covered by CFTC disaggregated data
    (all CBOT, ICE US, MGE, and CME-listed contracts).  The remaining 15 contracts
    (MATIF, ICE Canada, DCE, ZCE, JSE, BMF) are not covered by the CFTC.

  Staleness note:
    3-day lag (Tuesday positions published on Friday) is acceptable for annual-horizon
    ML forecasting.  Intraweek flow is not observable — use mm_net_change (weekly delta)
    as a flow-momentum supplement to the level signal.

  Pipeline maintenance risk:
    CFTC occasionally publishes corrections to prior weeks. Contract codes may be
    retired or renumbered when exchanges relist.  Null tokens (".") appear for thin
    contracts in some periods.  The validation layer must check for header integrity
    and presence of key contract codes on every download.

historical_depth: 2006

publication_cadence: weekly

update_schedule: >
  CFTC publishes every Friday (0 18 * * 5 UTC).
  Run --mode weekly on Friday after 18:00 UTC to capture the release.
  Positions are as-of the prior Tuesday close.

report_types:
  disagg_futures:
    description: "Disaggregated Commitments of Traders — Futures Only"
    bulk_zip_url: "https://www.cftc.gov/files/dea/history/fut_disagg_txt_hist_2006_2016.zip"
    annual_zip_url_pattern: "https://www.cftc.gov/files/dea/history/fut_disagg_txt_{year}.zip"
    weekly_txt_url: "https://www.cftc.gov/dea/newcot/f_disagg.txt"
    bulk_year_label: "2006_2016"
    annual_start_year: 2017

  disagg_combined:
    description: "Disaggregated Commitments of Traders — Futures and Options Combined"
    bulk_zip_url: "https://www.cftc.gov/files/dea/history/com_disagg_txt_hist_2006_2016.zip"
    annual_zip_url_pattern: "https://www.cftc.gov/files/dea/history/com_disagg_txt_{year}.zip"
    weekly_txt_url: "https://www.cftc.gov/dea/newcot/c_disagg.txt"
    bulk_year_label: "2006_2016"
    annual_start_year: 2017

s3_key_patterns:
  backfill_bulk:  "raw/production/source=cftc_cot/{report_type}/backfill/{prefix}_{bulk_label}.txt"
  backfill_annual: "raw/production/source=cftc_cot/{report_type}/backfill/{prefix}_{year}.txt"
  weekly: "raw/production/source=cftc_cot/{report_type}/year={year}/as_of={YYYYMMDD}/{prefix}_{YYYYMMDD}.txt"

