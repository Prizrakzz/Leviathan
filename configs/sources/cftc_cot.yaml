ml_priority: P8
graphrag_priority: P5

schema:
  format: CSV (comma-delimited, UTF-8, with header row)
  null_token: "."
  key_columns:
    Market_and_Exchange_Names: {type: str,   description: "Contract name + exchange, e.g. 'CORN - CHICAGO BOARD OF TRADE'"}
    As_of_Date_In_Form_YYMMDD: {type: str,   description: "Report date (as-of Tuesday) in YYMMDD format"}
    CFTC_Contract_Market_Code: {type: str,   description: "6-digit CFTC contract code; use to join to target_contracts"}
    Open_Interest_All:         {type: int,   description: "Total open interest across all trader categories"}
    M_Money_Positions_Long_All:  {type: int, description: "Managed Money gross long futures (core ML signal)"}
    M_Money_Positions_Short_All: {type: int, description: "Managed Money gross short futures (core ML signal)"}
    M_Money_Positions_Spread_All:{type: int, description: "Managed Money spread positions"}
    Change_in_M_Money_Long_All:  {type: int, description: "Week-over-week change in MM long (flow signal)"}
    Change_in_M_Money_Short_All: {type: int, description: "Week-over-week change in MM short (flow signal)"}
    Pct_of_OI_M_Money_Long_All:  {type: float, description: "MM long as % of OI"}
    Pct_of_OI_M_Money_Short_All: {type: float, description: "MM short as % of OI"}
    Conc_Gross_LE_4_TDR_Long_All: {type: float, description: "Concentration — top 4 traders, long side (crowding proxy)"}
    Conc_Gross_LE_4_TDR_Short_All:{type: float, description: "Concentration — top 4 traders, short side"}
    Conc_Gross_LE_8_TDR_Long_All: {type: float, description: "Concentration — top 8 traders, long side"}
    Conc_Gross_LE_8_TDR_Short_All:{type: float, description: "Concentration — top 8 traders, short side"}
  total_columns: 64
