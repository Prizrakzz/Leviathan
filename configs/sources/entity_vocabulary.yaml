# ---------------------------------------------------------------------------
# Section → commodity group mapping (WASDE and WAP section headers)
# Used by the chunker to annotate each section chunk with candidate slugs.
# The extractor can then narrow to the specific commodity from context.
# ---------------------------------------------------------------------------
section_commodity_groups:
  WHEAT:
    - soft_red_winter_wheat_cbot
    - hard_red_winter_wheat_kcbt
    - hard_red_spring_wheat_mgex
    - french_wheat_matif
    - french_maize_matif
  COARSE GRAINS:
    - corn_cbot
    - campinas_corn_reference_bmf
    - french_maize_matif
    - rough_rice_cbot
    - south_african_white_maize_jse
    - south_african_yellow_maize_jse
  RICE:
    - rough_rice_cbot
  OILSEEDS:
    - soybeans_cbot
    - soybean_meal_cbot
    - soybean_oil_cbot
    - french_rapeseed_matif
    - canola_ice
    - rapeseed_oil_zce
    - rapeseed_meal_zce
    - malaysian_crude_palm_oil_cme
    - palm_olein_dce
  COTTON:
    - cotton
  SUGAR:
    - raw_sugar
    - white_sugar
  COFFEE:
    - arabica_coffee
    - brazilian_arabica_coffee
    - robusta_coffee
  COCOA:
    - cocoa
  TROPICAL OILS:
    - malaysian_crude_palm_oil_cme
    - palm_olein_dce
    - soybean_oil_cbot

