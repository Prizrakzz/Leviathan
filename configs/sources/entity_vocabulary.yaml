# entity_vocabulary.yaml
# Canonical entity names for GraphRAG extraction.
# The extractor passes this to Claude Haiku as a constraint — all extracted
# entity names must resolve to one of the canonical forms listed here.
# Update when new commodities, countries, or stress types are added to the corpus.

# ---------------------------------------------------------------------------
# Commodities
# Maps common aliases (including WASDE/WAP section-level groupings) to the
# canonical leviathan slug. The extractor resolves aliases before writing.
# ---------------------------------------------------------------------------
