# ---------------------------------------------------------------------------
# Causal linguistic markers
# Phrases used by Claude Haiku to identify causal_link relationships.
# Only extract links anchored by one of these markers — reduces false positives.
# ---------------------------------------------------------------------------
causal_markers:
  - "as a result of"
  - "as a result"
  - "due to"
  - "because of"
  - "in response to"
  - "following"
  - "consequently"
  - "triggered by"
  - "led to"
  - "resulted in"
  - "driven by"
  - "attributed to"
  - "stemming from"
  - "owing to"
  - "in the wake of"
  - "prompted by"
  - "caused by"
  - "as a consequence of"
  - "this led to"
  - "which led to"
  - "which resulted in"
  - "expected to lead to"
  - "likely to result in"

