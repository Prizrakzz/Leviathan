# THE SOYBEANS BOARD NOW CARRIES THREE OF THE SEVEN ROWS (`rv_beans_meal`, `rv_beans_oil` and this
# one). That is stated rather than balanced away: the owner's question is the arc's origin and the
# board it anchors is the one the design's three target answers are written on. The Scan cost probe's
# trio is UNCHANGED and still spans three different fans, so the cost row stays attributable.
#
# ── THE SCAN COST PROBE IS A NAMED SUBSET OF THIS DECK, NOT ANOTHER DECK ────────────────────────────
# Design 10.3 prices "a 3-id Scan cost probe x 2 = 6". It runs through `--only-ids` over THREE of the
