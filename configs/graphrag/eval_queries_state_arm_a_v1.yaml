# STATE-ENGINE ARM A deck v1 (2026-09-11) -- the panel ids, authored ONCE for the board's own arm.
#
# THE ARM THIS SERVES (design docs/private/STATE_ENGINE_DESIGN_2026-09-07.md sec 10.3):
# `GRAPHRAG_STATE_BOARD` ON vs OFF, everything else identical, at seat parity (writer `claude-opus-5`,
# numbers `claude-sonnet-5` with adaptive thinking, `--via-orchestrator`, `--model` explicit in BOTH
# cells because the eval's `--model` WINS over env), with the FOUR dark legs lit in BOTH cells
# (`GRAPHRAG_EXTREME_LOCATOR`, `GRAPHRAG_RV_REGIONAL`, `GRAPHRAG_COT_OUTCOMES`,
# `GRAPHRAG_CASCADE_CONTEXT`) and `GRAPHRAG_STRIP_AUDIT=on` in both. The env for both cells is the
# STORED base -- `configs/graphrag/arm_env_base.yaml`, refreshed from `leviathan-dev-serving:133` --
# and the two cells differ by exactly ONE `--env`:
#
#   treatment:  --env-base configs/graphrag/arm_env_base.yaml --env GRAPHRAG_STATE_BOARD=on
#   control:    --env-base configs/graphrag/arm_env_base.yaml           (the flag defaults off)
#
# VENUE: in-VPC on the ON-DEMAND Batch queue, `--job-definition leviathan-dev-graphrag-eval`. OFF-VPC
# the board declines `pg_not_live` on EVERY turn and the arm measures a board that never fired --
# three prior instances of that artifact class are on the record. `BoardFired == 1` on every treatment
# turn is a PRECONDITION read BEFORE any bar, never a result.
#
# THE ROWS ARE THE SIX BANKED rv PAIRS, VERBATIM from `eval_queries_rv_reading_v1.yaml` (2026-08-29,
# a frozen instrument) -- same ids, same contracts, same question text, so the arm's answers are
# comparable to the banked draws and to the blind panel's own pairs (design 10.4). They are COPIED
# rather than referenced because a deck that re-pointed at another file would make an arm's population
# depend on an edit nobody diffs. The `category` is re-stamped `state_arm_a` so the artifact can tell
# an arm row from an rv-reading row at a glance; nothing else moves.
#
# NO PINNED asof, DELIBERATELY AND FOR TWO REASONS. The rv reading rides the price_replay belt (any
# historical asof drops it whole), and design 10.3's as-of parity rule binds both cells of ANY
# comparison to the LIVE as-of inside ONE calendar window -- never one banked and one fresh, because
# new WASDE / ESR / COT prints land between two days and would be read as the treatment.
#
# EXPECTATIONS ARE MINIMAL (`needs_evidence` only), exactly as the rv deck's are: the arm's bars read
# the artifact's DETERMINISTIC counters -- `timing_ms.{fill,rest,numbers,quantify,synth_llm}` p50/p90,
# `ms_board`, `BoardPoolDeclined`, `BoardEvidenceBorrows`, `BoardReplayLabelled`, strips, `by_rule`,
# register trips, `n_tool_uses`, and the TWELVE coverage counters the S7 seam now publishes -- never
# per-row expect blocks.
#
# ── THE SEVENTH ID: FOUND, FILLED, AND ATTRIBUTED TO THE OWNER'S OWN TURN ───────────────────────────
# Design 10.3 and 10.4 both say SEVEN: "the six banked rv pairs + THE OWNER'S SOYBEAN QUESTION". This
# header has now been wrong TWICE about that question's provenance, in opposite directions, and both
# corrections are kept in place rather than tidied away because the pattern is the lesson: each draft
# searched a narrower place than the claim it then made.
#   DRAFT 1 (2026-09-11 morning) said the text "exists in no deck, no design section and no scratch
#     file in this repo" and left the slot EMPTY. Refuted by two in-tree sources (below).
#   DRAFT 2 (round 1) filled the slot from those two sources but wrote `owner_verbatim: false` and the
#     sentence "no source in the tree says these are the words the OWNER TYPED ... the design quotes
#     the scenario, never the operator". That searched THE TREE and then made a claim about THE RECORD
#     -- and the record is not only the tree. Refuted below, and the flag is now TRUE.
#
# THE THREE SOURCES, weakest to strongest:
#
#   src/leviathan/graphrag/state/__main__.py:20 and :777  the shipped offline harness's `soybeans_now`
#     scenario -- same text, same as-of, same tier. AGENT-authored, derived.
#   docs/private/STATE_ENGINE_DESIGN_2026-09-07.md:152  sec 0.3, "Scenario 1 -- \"what is the situation
#     on soybeans now? how is it looking 3 months from now?\" (as-of 2026-09-07, Cascade)", the FIRST of
#     "the three target answers as the spec"; sec 0.2 names the arc's origin as "the owner's first live
