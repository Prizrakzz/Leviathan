#   THE LIVING MEMORY, `project_dec_evidence_corpus.md:2041` -- "OWNER CASCADE SMOKE #2 VERIFIED 09-07
#     10:47-10:49Z (rev 131 + bundle index-9Oj2bNiB): GET /v1/respond/stream ... mode=max on 'what is
#     the situation on soybeans now? how is it looking 3 months from now?'", with the turn's own end-of-
#     turn metrics beside it (writer claude-opus-5, CascadeFired 1/4, CitedN 29, CostUsd $0.461,
#     AnswerChars 21,431) and :2044 recording the owner's READ of that very answer ("OWNER READ OF THE
#     FIRST CASCADE ANSWER 09-07 ~11:20-11:50Z (soybeans)", the three challenges that became the
#     then/now doctrine and this whole arc). THAT IS THE OPERATOR'S OWN TURN, at the right date, the
#     right tier and the right revision -- and the string is BYTE-EQUAL to the `question:` below
#     (verified by comparison, not by eye).
#
# WHY `owner_verbatim: true`, AND EXACTLY WHAT GRADE OF EVIDENCE THAT IS. The record is a LOGGED
# REQUEST from the owner's own browser stream, not a keystroke capture, and that distinction was
# weighed rather than skipped: the `q=` of a `GET /v1/respond/stream` is the text the owner typed into
# the Terminal input, transported. The only thing a request string can lose that a transcript keeps is
# whitespace normalisation at the input boundary -- which is a transport detail, not an authorship
# question. Nothing in the chain is agent-authored, nothing is at the wrong date, and the same file
# records the owner reading the answer it produced. Calling that "not the owner's words" would set a
# bar no evidence in this estate could ever clear, which is the opposite of what the flag is for.
# SO THE ARM REPORT SAYS: the seventh row is the owner's 2026-09-07 Cascade turn, as logged in the
# living memory at :2041, at mode=max on rev 131.
# THE ALTERNATIVE THAT WAS NOT CHOSEN, recorded so the choice is reviewable: the S6b smoke harness's
# `soybeans_deep` turn -- "what is the state of the world for soybeans and where is it going over the
# next two quarters?" (scratchpad writer_board_use/smoke_real/smoke_real_run.py TURNS, 2026-09-10). It
# is an AGENT-authored smoke question at the wrong date with no owner attribution at all, so it is
