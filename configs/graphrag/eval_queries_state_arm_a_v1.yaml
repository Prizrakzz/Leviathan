#
# WHAT THE SEVENTH ROW COSTS: the arm becomes 7 x {Analysis, Cascade} x 2 cells = 28 turns, plus the
# unchanged 3-id Scan cost probe x 2 = 6, so 34 turns and $33.5 .. $56.6 (midpoint ~$45) against the
