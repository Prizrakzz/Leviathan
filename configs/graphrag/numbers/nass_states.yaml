# NASS state-code reference -- STATE ENGINE DESIGN sec 2.6 item 3 / sec 2.1, landed at sitting S0.
#
# WHAT IT IS. `silver_nass_crop_progress` repurposes its `country_col` as a GEO axis holding a 2-letter
# USPS code, with 'US' as the national roll-up (registry card: `country_col: state`). Every other geo
# axis in the estate speaks country NAMES: `cascade._scope_ex` resolves a driver's region token through
# `region_map` to a country name ('US_Midwest' -> 'United States'), and the numbers agent types a name.
# A name against a USPS column matches ZERO rows -- the July name-vs-code lesson class, one layer over.
# This file is the numbers-owned static reference that turns the name into the code, exactly as
# `esr_destinations.yaml` (FAS codes) and `faostat_areas.yaml` (M49 display strings) do for their cards.
#
# HOW IT IS CONSUMED. Its loader is `query._COUNTRY_REF_LOADERS['numbers/nass_states.yaml']`, and the
# card that names it carries `country_name_ref: numbers/nass_states.yaml`. build_sql then emits
# `CAST(state AS varchar) IN ('IA')` for country='Iowa' and `IN ('US')` for country='United States';
# an UNRESOLVED name fails CLOSED (an IN list matching zero rows), never a silent national total.
#
# NOT YET WIRED, ON PURPOSE (S0 finding). The loader entry and the card key MUST land in ONE commit:
# `query._country_ref` RAISES on a `country_name_ref` no loader serves, so a card key landing ahead of
# its loader turns today's honest zero-row NASS lookup into a hard error on every NASS read that names
# a country. The design's phase table put the card key in phase 1a and the loader in 1b; that ORDER is
# the same class as the `TableSpec` `extra="forbid"` note ("the field precedes the key in one commit"),
# and it is corrected by holding BOTH for S1. This file is therefore INERT at S0: nothing loads it, no
# card names it, and `state/lint.py` fails closed if any card ever declares a `country_name_ref` that
# `query._COUNTRY_REF_LOADERS` does not serve.
#
# THE LOADER IS NOT esr_destinations' MODEL VERBATIM. Two differences the S1 loader must carry: the
# codes are keyed by STRING (a USPS code), not by int; and `kind` is {state, national}, not the ESR
# Kind enum. Every key below is QUOTED so no code is ever resolved as a YAML 1.1 boolean.
#
# COVERAGE IS DECLARED, NOT PROBED. This reference names all 50 states plus DC plus the national
# roll-up. WHICH of them the card's data actually holds is a SEPARATE question that needs a live read
# of the mirror, and this seat has no network: `audit.probed_table` is null and the S0 report parks the
# probe (`country='US'` returns rows) as S1's gate. A code present here but absent from the data
# resolves to a real IN filter that returns zero rows -- an honest empty read, never a wrong figure.

