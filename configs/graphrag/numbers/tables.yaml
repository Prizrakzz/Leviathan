    notes: >
      World Bank Pink Sheet MONTHLY AVERAGES -- these are world benchmark CASH/spot averages over a
      calendar month, NOT exchange settlement prices. Never quote one as a futures settle, a close,
      or a contract price; if the question is about a board move on a given day, this table cannot
      answer it and silver_futures_eod can. Series begin 1960+. No commodity/country filter -- the
      metric name IS the series. agg=latest returns the newest knowable month; window with
      period_start/period_end 'YYYY-MM-DD'. The table is LATEST-ONLY and WB revises months
      retroactively, so there is NO true as-of replay -- values are as-published at the CURRENT WB
      release (see revision_stamp: "as published, WB release <latest_release_ym>").
      HOW STRETCHED A SERIES IS, IS A SECOND METRIC HERE, NOT A CALCULATION: every price carries a
      companion '<metric>_zscore_5yr' metric (urea_usd_mt -> urea_usd_mt_zscore_5yr,
      natural_gas_us_usd_mmbtu -> natural_gas_us_usd_mmbtu_zscore_5yr, and so on for all 38). Look the
      z up as its own lookup beside the level -- one lookup for the number, one for the sigma. Prefer
      the stored z over computing one from a history read: it is point-in-time-clean by construction,
      whereas a z computed off a capped or windowed series inherits whatever that window happened to be.
      Per-series validity floors null early z-scores (a z is null until its 5-yr window fills, and
      three F062 series are floored later than their first month because the WB repeated an annual
      average 12x before monthly data existed: raw_sugar_eu from 1964, chicken from 1961, tsp from 1967).
      UNITS. Every agricultural price on this table is USD/tonne, including the eleven series the WB
      publishes in USD/kg (world/EU/US sugar, cocoa, both coffees, orange, beef, chicken, cotton
      A-Index, rubber) -- the producer scales those x1000 so any two ag columns can be differenced
      directly. The non-ag columns are USD/mt (fertilizers, TSP, copper), USD/bbl (Brent), USD/mmbtu
      (US and EU gas) and one index (blended NPK, which is urea+DAP+potash only -- TSP is NOT in it).
      WHAT THE 2026-08-20 ADDITIONS PRICE. Nine legs give a price to context commodities that had
      narrative coverage and no number: coconut_oil (coconut), groundnuts + groundnut_oil (peanut,
      seed and crush), palm_kernel_oil (palm_kernel), fish_meal (marine protein / the soymeal
      substitute), sunflower_oil (the Black Sea vegoil), barley and sorghum (feed-grain
      substitution), orange (fresh citrus). Eleven give a world cash benchmark to contract nodes this
      card used to decline on: cotton, rubber, arabica, robusta, cocoa, rice, maize (i.e. CORN),
      EU and US sugar, beef and chicken. Two more complete the phosphate chain (tsp, beside
      phosphate rock and DAP) and give the metals macro slice one leg (copper).
      THREE TRAPS ON THE NEW COLUMNS. (1) barley_usd_t and sorghum_usd_t were DISCONTINUED by the
      World Bank after 2020-08 -- the last value is a 2020 value, so agg=latest returns a five-year-old
      number. Say the date or do not use them. (2) orange_usd_t is FRESH FRUIT, not frozen concentrate;
      it is an input-cost signal for the FCOJ contract, never a substitute for an FCOJ quote.
      (3) copper_usd_mt is here only as an industrial-activity gauge for the metals macro-context
      slice. It is not an agricultural price and must never be offered as one.
      THE SUGAR TRIO IS A SPREAD, NOT THREE QUOTES. raw_sugar_world_usd_t is the world dumping price;
      raw_sugar_eu_usd_t and raw_sugar_us_usd_t are POLICY-ADMINISTERED import prices. The EU-world
      and US-world gaps are the import_quota_trq / subsidy / us_farm_program wedge, which is the
      reason all three are carried. All three are USD/tonne, so the subtraction is direct.
      STILL UNCOVERED -- decline honestly rather than substituting a different series. The World Bank
      publishes NO copra and NO olive oil, so the `olive_oil` context node has no price leg here at
      all. There is also no ethanol, cottonseed, DDGS, used cooking oil, tallow, HFCS or pulses
      column; no canola or rapeseed SEED (only rapeseed oil); no rapeseed meal, no palm olein, no
      white (refined) sugar, no hard red spring wheat, and no frozen orange juice.

      A z-score is NULL wherever its 5-year window has NO DISPERSION -- the source pins
      some series flat for years (phosphate rock sat at 44.0 for 102 straight months,
      1999-2007). A NULL z there means "no dispersion, no z", never missing data; the
      price column itself stays populated. Ratified Option A, 2026-08-20; exactly 43
      published months moved 0.0 -> NULL, one column, in the same fire as the widening.

  # D-LD TRANCHE 2 (LIGHT THE DARK, 2026-08-18) -- WORLD BANK CONSUMER-PRICE INFLATION, the macro
  # pressure gauge behind export-restriction risk. From the dark-table readiness sweep (CARD-READY-ISH
  # list: flat, projection forbidden, value_columns present, PIT trio null). The table has been in silver
  # since the P65 baseline and feeds the feature layer; it has never been readable by the agent.
  #
  # WHAT THE TABLE ACTUALLY IS, MEASURED 2026-08-18 RATHER THAN ASSUMED, because the NAME is wrong and a
  # card that inherits a wrong subject line mints wrong citations (the mpoc lesson): `food_cpi` serves
  # World Bank indicator FP.CPI.TOTL.ZG, which is OVERALL consumer-price inflation, not a food sub-index.
  # The producer says so in its own data note (transforms/raw_to_bronze/world_bank_food_cpi.py:6-19: the
  # World Bank publishes no standardised country-level food CPI; overall CPI is carried as a PROXY because
  # food is 35-50% of the basket in these four countries and governments react to the headline). The
  # column name `cpi_yoy_pct` is the honest one and this card follows the column, not the table name.
  #
  # 264 rows: FOUR countries (IND, IDN, RUS, UKR) x 66 calendar years 1960-2025, zero duplicates on the
  # natural key. cpi_yoy_pct is non-null on 198 of 264 rows -- Russia and Ukraine have NO Soviet-era
  # reading (1960-1992 = 33 null rows each, cpi_available=0). The z columns are STORED, strictly-prior
  # ROLLING windows (shift(1)+rolling; 5yr needs >=3 prior observations, 10yr needs >=5), so they are
  # no-lookahead by construction and are served AS STORED -- the pink-sheet *_zscore_5yr precedent.
  # NOTE FOR THE NEXT READER: the transform's MODULE docstring calls them "expanding-window"; the code
  # and the function docstring beside it (bronze_to_silver/world_bank_food_cpi.py:69-88) are ROLLING and
  # explain why. This card describes the CODE.
  #
  # PIT: data_date on the year-end observation date + a publication lag, the silver_pink_sheet idiom for
  # the SAME publisher (latest-only, retroactively revised, one global release stamp). Both PIT columns
  # are DERIVED BY THE PRODUCER PRE-STEP (the WIRING WAVE-1 Card B/C mechanism -- conab survey_release_date,
  # sagis week_ending_date): `data_date` = 'YYYY-12-31' for the observation year, `release_date` = the
  # World Bank API's own `lastupdated` metadata field, which the bronze parser read and THREW AWAY.
  # release_date rides as provenance_col -> `revision_stamp`, exactly as latest_release_ym does on the
  # pink sheet. The producer re-run AND the live Glue REPLACE COLUMNS BOTH LANDED 2026-08-18 -- the
  # REPLACE (not an ADD) because the same migration corrected four DECLARED TYPES that had never matched
  # the physical parquet: cpi_yoy_pct / cpi_yoy_z_5yr / cpi_yoy_z_10yr were declared `float` (Athena
  # `real`) over DOUBLE parquet, so Athena REFUSED to read every served metric ("HIVE_BAD_DATA:
  # Malformed Parquet file ... incompatible with type real") while strings, `year`, `cpi_available` and
  # count(*) all succeeded -- the table looked alive and no measure column was readable.
  #
  # publication_lag_days: 195 IS MEASURED, NOT GUESSED, and the evidence is one release: the raw JSON now
  # in S3 carries "lastupdated": "2026-07-13" and CONTAINS data year 2025 -- i.e. year Y was published no
  # later than 194 days after Y's year-end. +195 makes year Y citable from 2026-07-14 for Y=2025, one day
  # after the release we can date, so the guard provably never runs ahead of the one release we hold.
  # It may be TIGHTENED later against a second dated release; it must never be loosened by guess.
  # THAT LAG GUARDS THE AS-OF AXIS ONLY: dag_catalog FRESHNESS_LAG_OVERRIDES pins the WRITE-recency
  # ceiling at the annual cadence default (400) so the 195 is never ADDED to it -- the producer fires
  # MONTHLY (cron(0 16 8 * ? *), beside pink_sheet) whatever the content lag, and summing the two is the
  # banked category error the D-LD review caught on fgis and fnc.
  #
  # NO commodity_values FENCE IS AVAILABLE HERE and that is a limitation, not an omission: the closed set
  # on this card is on the COUNTRY axis (four ISO3 codes) and the registry offers a code fence only for
  # commodities. Repurposing commodity_col for the country axis was considered and REJECTED -- the tool
  # schema would ask the model for a "commodity" and get a country, and _geo()/geographies resolution
  # would be pointed at nonsense. So the four-country fence is PROSE, twice (description + notes), with
  # the D-PQ CLASS-1 caveat understood: prose moved the NASS leak twice without stopping it.
  #
  # SARGABLE PARTITION DISCIPLINE: none needed, and that is a FACT about this table rather than an
  # omission -- flat, projection forbidden, partition_keys []. Do NOT add partition_cols; reconcile_numbers
  # would then require them to be real Glue partition keys and fail the build. It also enters NO
  # cascade_map / complex_map / chain_map: this is a direct-lookup macro card only.
  silver_food_cpi:
    description: >
      World Bank consumer-price inflation for the four food-policy countries this platform tracks --
      India, Indonesia, Russia and Ukraine. ANNUAL: one row per country per CALENDAR YEAR (India and
      Indonesia from 1960, Russia and Ukraine from 1993), carrying that year's percent change in the
      consumer price index plus two stored z-scores of it against that country's own recent history.
      It is HEADLINE CPI, NOT A FOOD SUB-INDEX: the source series is World Bank FP.CPI.TOTL.ZG (overall
      consumer prices), carried here as a PROXY for food-price pressure because the World Bank publishes
      no standardised country-level food CPI -- say "consumer price inflation" when you cite it, never
      "food inflation". A whole calendar year is one observation and the figure is a year-AVERAGE over
      the prior year-average, so it is not the monthly year-on-year print a news story quotes.
    grain: "one row per country_iso x year (annual, latest-only, one World Bank release for the whole table)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "264 rows: FOUR countries (IND, IDN, RUS,
    # UKR) x 66 calendar years 1960-2025". ANNUAL and one year behind -> the newest year is fixed until the
    # next WB release
    row_count: 264
    first_obs: "1960"
    last_obs: "2025"
    cadence: annual
    shape: wide
    commodity_col: null                 # NO commodity axis (macro table) -- see notes: a commodity passed here is IGNORED
    country_col: country_iso            # ISO3 in CAPITALS; the closed four-value set lives in notes (no code fence exists)
    period_col: year
    period_type: year
    period_sql_type: int                # year is a bigint calendar year, e.g. 2025
    date_col: data_date                 # PRE-STEP DERIVED: 'YYYY-12-31', the year-end observation date
    knowledge_semantics: data_date
    knowledge_date_col: data_date
    publication_lag_days: 195           # measured against WDI lastupdated 2026-07-13 carrying data year 2025
    provenance_col: release_date        # PRE-STEP DERIVED: the WB API `lastupdated` -> alias revision_stamp
    metrics:
      cpi_yoy_pct:
        label: "CPI year-over-year %"
        unit: "pct"
        desc: >
          annual percent change in the country's consumer price index (overall CPI, calendar-year average
          against the prior year's average -- NOT December-over-December and NOT a monthly print). Carried
          as a proxy for food-price pressure; it is economy-wide inflation, never a crop or food price.
      cpi_yoy_z_5yr:
        label: "CPI year-over-year z-score (5-year)"
        unit: "sigma vs prior 5 yrs"
        desc: >
          cpi_yoy_pct expressed in sigma against the mean and sd of the FIVE STRICTLY PRIOR years
          (pre-computed, no-lookahead, served as stored). Null until 3 prior observations exist.
      cpi_yoy_z_10yr:
        label: "CPI year-over-year z-score (10-year)"
        unit: "sigma vs prior 10 yrs"
        desc: >
          the same reading against the TEN STRICTLY PRIOR years -- the structural context window for
          countries with episodic hyperinflation, where a 5-year baseline over-normalises. Null until 5
          prior observations exist.
      cpi_available:
        label: "CPI availability flag"
        unit: "0/1"
        desc: >
          1 if the source published a reading for that country-year, 0 if it did not (Russia and Ukraine
          before 1993). A COVERAGE flag, never an inflation reading and never a zero percent.
    notes: >
      ONE LOOKUP = ONE METRIC AND ONE COUNTRY. This card carries four metrics and a free country axis,
      the exact shape that invites a metric-less country sweep: `metric` is REQUIRED, there is no
      all-metrics read, and a comparison across countries is one call per (metric, country) pair. A call
      that omits `metric` is rejected before anything is queried and costs you a lookup from the budget.
      ALWAYS PASS A COUNTRY. country takes the ISO3 code in CAPITALS and only four exist: IND (India),
      IDN (Indonesia), RUS (Russian Federation), UKR (Ukraine). With NO country the read spans all four
      and a latest-value read returns ONE arbitrary country's row -- an Indonesian number wearing an
      Indian label. Anything else -- China, Brazil, Egypt, Nigeria, Vietnam, Thailand, the United States,
      the EU, any other importer or exporter -- is NOT in this table: decline rather than substituting a
      different country, and never generalise these four to "emerging markets".
      THERE IS NO COMMODITY AXIS. A commodity passed to this card is IGNORED, not applied: the number
      that comes back is the country's economy-wide consumer-price inflation, not wheat, rice, palm or
      any crop. Never present it as a food price, a crop price or a food-inflation rate; it is headline
      CPI carried as a proxy for food-price pressure, and the honest sentence names the country and the
      year ("India's consumer price inflation was X% in 2025").
      ANNUAL AND ONE YEAR BEHIND. One observation per CALENDAR YEAR, and a year is not citable until
      roughly mid-July of the FOLLOWING year (publication_lag_days 195, measured against the World Bank
      release that carried 2025). So at a mid-2026 as-of the newest citable reading is 2025, and in the
      first half of a year it is the year before last. That is the source's cadence, not missing data.
      Cite the reading's OWN year and never call a dated reading 'current' -- the same discipline the IOD
      and NASS cards state. A monthly inflation headline in the news will NOT match this number.
      NULLS ARE PUBLISHED ABSENCES, NOT ZEROS. Russia and Ukraine have no reading before 1993 (66 rows
      across the two, cpi_yoy_pct null, cpi_available 0): a pre-1993 lookup returns a ROW whose value is
      NULL. Say "the World Bank publishes no reading for that year", never zero and never an interpolation.
      z-scores start later still: 1963 for India/Indonesia, 1996 for Russia/Ukraine.
      THE z IS A SECOND LOOKUP, NOT A CALCULATION, and it is UNWINSORIZED. Look cpi_yoy_z_5yr up beside
      cpi_yoy_pct -- one lookup for the level, one for the sigma; prefer the stored z over computing one
      from a history read, which inherits whatever window it happened to be capped to. Unlike gold_weather_z
      there is NO plausibility cap here: seven rows exceed six sigma and the largest is 36.39 (Indonesia
      1998). A large magnitude is REAL but rests on a five-observation standard deviation, so report it as
      "far outside its own recent range", never as a probability or an odds statement.
      LEVELS ARE ERA-CORRECT AND ENORMOUS AT THE START. Ukraine 1993 prints 4,734.9 percent, Russia 1993
      874.2, Indonesia 1966 1,136.3 -- real hyperinflation prints, not defects, and each is one calendar
      year of one country. Never blend them into an average across countries or eras.
      LATEST-ONLY, SO THERE IS NO TRUE AS-OF REPLAY. The World Bank revises the whole back series at every
      release and this table keeps only the current one, so a historical as-of serves the CURRENTLY
      published value with the publication lag applied -- see revision_stamp ("as published, World Bank
      release <release_date>"), which every row carries. Quote that stamp when the figure is doing real work.
      WHAT THIS TABLE IS FOR, AND ITS HARD EDGE: it is MACRO CONTEXT for export-policy pressure. It
      contains no policy, no announcement, no ban and no quota -- inflation being high has preceded export
      restrictions, and this card can say what inflation was, in which country, in which year. It can never
      say a restriction is coming, likely, or imminent; a policy claim minted from a CPI number is exactly
      the invention this card refuses. For the crop balance sheet behind such a decision use silver_psd;
      for world price LEVELS use silver_pink_sheet (the same publisher, MONTHLY averages, no CPI series);
      for the currency leg use silver_fred_fx.

  # PRICE_OBSERVABILITY W4 (v2): CFTC Commitments of Traders MANAGED-MONEY positioning, registered
  # read-side under the SAME leakage-safe harness. Flat, projection forbidden. leviathan_slug holds
  # CONTRACT slugs (corn_cbot, ...), so a bare base name matches ZERO rows. POSITIONING IS HISTORICAL
  # CONTEXT ONLY -- levels + z, past tense; it NEVER drives a forecast or a fork (R9).
  # R9 AS AMENDED (D1, ratified 2026-08-01): silver_cot may enter the cascade map ONLY as a fetched
  # past-tense CONTEXT leg; it may never be a fork ref, a regime-MARKER ref, or a chain/transmission hop.
  # The shape that counts as "context" is cascade.positioning_context_violations -- leg_mode current (no
  # era legs, so it can never reach the cross-era fork), period_type date, no reroute trade metric, no
  # 0/1 flag, a sub-annual pace grain -- and config_check._check_positioning_lane is build-failing on
  # every other shape AND on any chain_map/complex_map/transmission_map reference at all.
  # What that does NOT say: the causal DAGs' positioning drivers are convergence-regime members today
  # and stay so. graph.regimes fires on ACTIVE DRIVER IDS and never reads a numbers map, so that
  # membership is invisible to R9 in both directions -- "regime" here is the numbers-map marker lane.
  # MANAGED-MONEY ONLY: this wave carries no producer/merchant/swap-dealer categories and no
  # percentiles (8 of 191 raw cols kept, W4b).
  silver_cot:
    description: >
      CFTC Commitments of Traders (COT) -- WEEKLY managed-money positioning by futures contract.
      One row per contract per report_date: total open interest plus managed-money long / short /
      spreading / net positions, the signed managed-money net percent of open interest, and 3-year
      trailing z-scores of the net measures. Positioning is UNREVISED, so latest-only is genuinely
      point-in-time-clean. HISTORICAL CONTEXT ONLY -- levels and z, cited past tense; positioning
      never drives a forecast or a fork. R9 AS AMENDED (D1, ratified 2026-08-01): this table may enter
      the cascade map ONLY as a fetched past-tense CONTEXT leg (cot_mm_positioning); it may never be a
      fork ref, a regime-MARKER ref, or a chain/complex/transmission hop.
    grain: "one row per contract x report_date (weekly Tuesday positions)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "the three US wheat classes now start
    # 2006-06-13 like the CBOT five; the ICE four start 2007-09-04" (the 2026-08-21 re-key). LIVE weekly
    # front -> no last_obs
    first_obs: "2006-06-13"
    cadence: weekly
    shape: wide
    commodity_col: leviathan_slug        # CONTRACT slugs (corn_cbot, soybeans_cbot, ...); base names match 0 rows
    period_type: date
    date_col: report_date                # the Tuesday DATA date of the positions
    knowledge_semantics: data_date
    knowledge_date_col: report_date
    publication_lag_days: 6              # S2.F6: Tuesday data, NORMALLY Friday 15:30 ET release; +6 (Tue->Monday)
    #                                      covers the holiday-Friday slips CFTC batches to the next business day
    #                                      several times a year. Fixed-lag model -- shutdown-era replay is
    #                                      approximate (catch-ups batch-release weeks late); max_lag_days=10 alarms.
    metrics:
      open_interest:   {label: "open interest", unit: "contracts", desc: "total open interest across all reportable and nonreportable traders"}
      mm_long:         {label: "managed-money longs", unit: "contracts", desc: "managed-money long positions"}
      mm_short:        {label: "managed-money shorts", unit: "contracts", desc: "managed-money short positions"}
      mm_spread:       {label: "managed-money spreading positions", unit: "contracts", desc: "managed-money spreading positions"}
      mm_net:          {label: "managed-money net position", unit: "contracts", desc: "managed-money net position (mm_long minus mm_short)"}
      mm_pct_oi:       {label: "managed-money share of open interest", unit: "pct of OI (signed)", desc: "managed-money NET position as a SIGNED percent of open interest (mm_net/OI*100; negative = net short)"}
      mm_net_z_3yr:    {label: "managed-money net position 3-year z-score", unit: "sigma vs 3-yr mean", desc: "managed-money net, sigma vs the 3-yr trailing window (PIT-clean)"}
      mm_pct_oi_z_3yr: {label: "managed-money share of open interest 3-year z-score", unit: "sigma vs 3-yr mean", desc: "managed-money net percent-of-OI, sigma vs the 3-yr trailing window (PIT-clean)"}
    notes: >
      CFTC disaggregated MANAGED-MONEY ONLY (no producer/merchant/swap categories in this wave).
      commodity = the CONTRACT slug (corn_cbot, ...); a bare base name ('corn') matches zero rows.
      Positioning is unrevised -> latest-only is genuinely point-in-time-clean. 15 slugs live
      (COT-recovery re-key 2026-08-21: the join moved from market NAME to CFTC code, which recovered
      FCOJ -- 1,049 weeks silently lost to a rename mismatch since inception -- plus canola_ice from
      2018 and the CME USD Malaysian palm contract from 2021, and closed the W4b legacy-name gap so
      the three US wheat classes now start 2006-06-13 like the CBOT five; the ICE four start
      2007-09-04, when ICE entered the disaggregated report). Positive contracts = net long,
      negative = net short. POSITIONING IS HISTORICAL CONTEXT ONLY: cite levels and z past tense; it
      never drives a forecast or a fork. Under R9 as amended (D1, 2026-08-01) it may enter cascade_map
      ONLY as the past-tense context leg `cot_mm_positioning` -- never a fork ref, a regime-MARKER ref,
      or a chain/complex/transmission hop, and never on an OUTLOOK turn (the flow fence is released
      there by design, so the engine refuses the leg rather than hand that register a number).
      Data-staleness note (RE-MEASURED 2026-08-01, item 88): max(report_date) = 2026-07-28 against
      asof 2026-08-01 = 4 days, inside publication_lag_days=6 and well inside freshness_sla
      max_lag_days=10 -- the "~6 weeks stale at the 2026-07-18 census" note this replaces is now stale
      in the other direction, and a stale staleness note is how a healthy table gets written off. The
      PIT guard still serves what is known WITH its date; max_lag_days=10 alarms on staleness.

  # SEAM C (ENGINE SEAMS rev-52): futures v1.5-lite (Option A, LEVELS-ONLY). Daily CONTINUOUS FRONT-MONTH
  # close prices (yfinance Yahoo quotes) for 12 US/NY exchange contracts. Flat, projection forbidden. NONE enters
  # cascade_map/complex_map (no engine leg). The card is REGISTERED + linted (config_check.check_futures_lite)
  # but WHITELIST-ABSENT from serving by DEFAULT (registry.WHITELIST_ABSENT_DEFAULT drops it from the loaded
  # registry, exactly like a GRAPHRAG_NUMBERS_DISABLE entry) until the SEAM-C no-judge gate AND the yfinance
  # freshness-stall fix (chain wrote nothing since 2026-06-05: worker image lacked yfinance) BOTH pass;
  # whitelisting = removing it from that set. Post-whitelist kill-switch = GRAPHRAG_NUMBERS_DISABLE.
  # LEVELS-ONLY: a roll-spliced continuous series has NO true vintage and NO PIT-safe cross-date delta, so
  # the agent serves agg=latest single-date levels ONLY (levels_only=true -> build_sql RAISES on any other
  # agg / any window) and DECLINES change / window / series / curve / spread / named-contract asks with honest
  # templates (numbers/agent.py FUTURES_DECLINE_TEMPLATES). close is the ONLY whitelisted metric -- the
  # derived columns (log_return / price_z_2yr / realized_vol_30d / momentum_*) span roll boundaries and are
  # EXCLUDED. DP-5: the physical `date` column is a TIMESTAMP -> date_col_type=timestamp normalizes both
  # backends to 'YYYY-MM-DD' in the SELECT extras AND every predicate (sargable substr guard, never a
  # raw-timestamp compare). knowledge = data_date + a 1-day publication lag (the close for trading date D is
  # public the next session). Distinct from the World Bank Pink Sheet MONTHLY averages and the USDA WASDE
  # season-average FARM price.
  silver_futures_prices:
    description: >
      Daily CONTINUOUS FRONT-MONTH futures close prices (yfinance Yahoo quotes) for 12 US/NY exchange
      contracts -- grains, oilseeds and the softs. Wide table, one row per contract per trading date. The
      served value is the front-month `close` (Yahoo quote); it is a continuous, roll-spliced series, so it
      is LEVELS-ONLY: a single-date close as-of a date, never a change / window / curve / named-contract
      read (the roll splice between expiries contaminates any cross-date delta). Point-in-time via the
      trading date plus a one-day publication lag.
    grain: "one row per contract x trading date (daily front-month close, Yahoo quote)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): daily continuous close; no census stated
    cadence: daily
    shape: wide
    commodity_col: leviathan_slug        # CONTRACT slugs (corn_cbot, ...); the front-month CONTINUOUS series
    period_type: date
    date_col: date                        # trading DATA date; PHYSICAL TYPE IS TIMESTAMP (DP-5)
    date_col_type: timestamp              # DP-5: normalize to 'YYYY-MM-DD' in extras AND every predicate
    knowledge_semantics: data_date
    knowledge_date_col: date
    publication_lag_days: 1               # the close for trading date D is public the next session (D+1)
    levels_only: true                     # SEAM C: agg=latest single-date levels only; build_sql RAISES otherwise
    metrics:
      # close-only whitelist: OHLC open/high/low + volume + the derived columns are EXCLUDED. unit_overrides
      # is the GOVERNING serving unit; per-contract exchange convention, magnitudes probe-verified 2026-06-05
      # (corn 417.75 c/bu, cocoa 3828 USD/mt, rough rice 12.625 USD/cwt, ...). FUTURES v1.5 (2026-07-23, D2
      # KEEP): the silver table now ALSO carries a physical per-row `unit` column (schema_version 2) written
      # from the same single-source UNIT_MAP (transforms/raw_to_bronze/yfinance_futures.py) -- the override
      # stays the serving contract (build_sql never selects the physical column; _apply_unit_overrides
      # clobbers r["unit"] post-fetch), redundant-but-consistent BY LINT. config_check (check_futures_lite)
      # BINDS the unit_overrides keys to the exact 12-slug set and the values to the strings below AND to
      # UNIT_MAP (three-way; drift any way fails the build).
      close:
        label: "closing price"
        desc: >
          front-month CONTINUOUS close (daily Yahoo quote). LEVELS-ONLY: report as an observed level on its
          trading date, framed as the CONTINUOUS FRONT-MONTH close (Yahoo quote) -- never a specific expiry,
          never a change / window / curve read. Per-contract exchange units are returned on each row.
        unit_overrides:
          corn_cbot:                  "US cents/bushel"
          soybeans_cbot:              "US cents/bushel"
          soft_red_winter_wheat_cbot: "US cents/bushel"
          hard_red_winter_wheat_kcbt: "US cents/bushel"
          soybean_oil_cbot:           "US cents/lb"
          arabica_coffee:             "US cents/lb"
          cotton:                     "US cents/lb"
          raw_sugar:                  "US cents/lb"
          frozen_orange_juice:        "US cents/lb"
          soybean_meal_cbot:          "USD/short ton"
          cocoa:                      "USD/metric ton"
          rough_rice_cbot:            "USD/cwt"
    notes: >
      12 contracts: corn_cbot, soybeans_cbot, soft_red_winter_wheat_cbot, hard_red_winter_wheat_kcbt,
      soybean_oil_cbot, soybean_meal_cbot, arabica_coffee, cotton, raw_sugar, frozen_orange_juice,
      rough_rice_cbot, cocoa. commodity = the CONTRACT slug. The served value is the CONTINUOUS FRONT-MONTH
      close (Yahoo quote) -- SAY 'front-month' when you cite it, and NEVER present it as a specific delivery
      month ('December corn') or a term-structure/curve read (front-month only; named contracts + the curve
      need a paid vendor, not served). agg=latest returns the close (Yahoo quote) as-of a date; change /
      window / series / curve / named-contract asks are DECLINED (roll splices contaminate any cross-date
      delta). This is a DAILY front-month close quote, distinct from the World Bank Pink Sheet MONTHLY
      averages and the USDA WASDE season-average FARM price. PROVENANCE (v1.5 W4.2): the served value IS the
      Yahoo Finance continuous front-month close (not official exchange settlement) -- cite it as that, never
      as an official exchange print. ROLL POLICY (roll_policy_version: 1, mirrored in the silver registry
      provenance.roll_policy): yfinance continuous front-month, chained UNADJUSTED; roll rule
      vendor-undocumented; rolls detected empirically at 5%-jump masking in bronze; derived/return columns
      are NaN-masked at rolls and are NEVER served. The silver table carries a physical per-row `unit`
      column (schema_version 2) lint-bound equal to unit_overrides above.

  # PRICE_AND_PLAYBOOKS W1.0 (ratified 2026-07-28): the PER-DELIVERY-MONTH futures EOD table. ADDITIVE to
  # silver_futures_prices above, which stays untouched and served throughout W1/W2 and W3's soak -- the flat
  # table has natural_key [leviathan_slug, date] and no room for a delivery month without breaking it.
  # The card is REGISTERED + linted (config_check.check_futures_eod) but WHITELIST-ABSENT from serving by
  # DEFAULT (registry.WHITELIST_ABSENT_DEFAULT drops it at load, exactly like a GRAPHRAG_NUMBERS_DISABLE
  # entry) for ALL of W1.0 / W1 / W2: the table vanishes from the agent tool enum + its system-prompt card,
  # and every build_sql lookup raises KeyError -- fail-closed while nothing has been produced yet.
  # Whitelisting = removing it from that set (W3, after the producers and their gates land); the
  # post-whitelist rollback lever is the ordinary GRAPHRAG_NUMBERS_DISABLE=silver_futures_eod env idiom.
  # NOT levels_only, unlike the flat sibling: these are REAL per-expiry series with no roll splice, so a
  # cross-date delta on one delivery month is legitimate. What is NOT here is roll/continuous -- no
  # is_front_month, no log_return, no adjusted series; roll policy is a QUERY-TIME decision, never a column.
  # DP-5: the physical `trade_date` column is a TIMESTAMP -> date_col_type=timestamp normalizes both
  # backends to 'YYYY-MM-DD' in the SELECT extras AND every predicate (the pg-parity requirement).
  # grain_cols is EXPLICIT: without it the latest-vintage ROW_NUMBER would key on commodity alone and tie
  # across every delivery month, making pg-vs-Athena row selection nondeterministic.
  silver_futures_eod:
    description: >
      Daily END-OF-DAY prices for EVERY DELIVERY MONTH of 29 exchange futures contracts plus two Brazilian
      cash references -- grains, oilseeds, softs, the vegoil complex and the South African / Chinese /
      European boards. One row per contract per delivery month per trading date. The served value is
      `settle`, and the row's own `settle_kind` column says exactly what that number is: an official
      exchange `settlement`, a JSE `mark_to_market`, a CEPEA `cash_index`, or a session `close` standing in
      where the settlement series was not purchased. Units and currencies are SOURCE-FAITHFUL exchange
      convention -- there is no FX conversion anywhere in this table. GLBX rows are the vendor's UTC
      daily buckets: the Sunday-evening session appears as a sparse SUNDAY-dated partial bar
      (~70 per long-lived contract), distinct from Monday's session bar -- real prints, never fill. Point-in-time via the trading date
      plus a one-day publication lag.
    grain: "one row per contract x delivery month x trading date (per-delivery-month EOD)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "COVERAGE FLOORS: history starts 2010-06
    # (CME), 2018-12 (ICE), 2015-10 (CZCE), 2006 (DCE)" -- the EARLIEST venue floor; the per-venue floors
    # and the two 2026 venues stay in the notes, where they are per-contract facts
    first_obs: "2006"
    cadence: daily
    shape: wide
    commodity_col: leviathan_slug        # CONTRACT slugs (corn_cbot, ...); all 31 registry contracts
    period_type: date
    date_col: trade_date                  # exchange SESSION date; PHYSICAL TYPE IS TIMESTAMP (DP-5)
    date_col_type: timestamp              # DP-5: normalize to 'YYYY-MM-DD' in extras AND every predicate
    knowledge_semantics: data_date
    knowledge_date_col: trade_date
    publication_lag_days: 1               # the EOD print for session D is public the next session (D+1)
    grain_cols: [leviathan_slug, contract_month, trade_date]
    # PHYSICAL LAYOUT (the F010 contract + the checked-in DDL): REGISTERED Glue partitions
    # [leviathan_slug, trade_year], projection FORBIDDEN. leviathan_slug is pinned by the ordinary
    # commodity equality -- so every lookup MUST name a contract or build_sql raises; trade_year is pinned
    # by the SARGABLE YEAR BOUNDS build_sql derives from the query's own date window (year_col below),
    # never by an equality: a price window legitimately spans years, so an equality would silently return
    # ZERO rows. Same discipline as silver_nasa_power's registered [commodity, year] layout -- catalog-side
    # pruning, no projected grid to enumerate (the Jul-2026 LIST-storm class stays out).
    partition_cols: [leviathan_slug, trade_year]
    year_col: trade_year                  # the REGISTERED year partition key -> sargable bounds ride with
    #                                       the as-of guard and the period_start/period_end window
    # W3.1 SERVED DIMENSIONS. contract_month makes the delivery month expressible at all (an equality for a
    # named contract, IN(...) for a CURVE read across expiries) and puts the expiry label ON every row --
    # a curve row without it is unattributable, since every row of a multi-expiry read carries the same
    # slug and the same trade date. settle_kind and currency travel with it for the same reason: an ICE row
    # is a session CLOSE, not an official settlement, and ten currencies share this table with NO FX
    # conversion anywhere. `unit` is deliberately NOT declared as unit_col -- exactly like the flat sibling,
    # unit_overrides is the GOVERNING serving unit and _apply_unit_overrides clobbers r["unit"] post-fetch.
    contract_month_col: contract_month    # 'YYYY-MM'; NULL for exactly the two CEPEA cash references
    settle_kind_col: settle_kind          # settlement | close | mark_to_market | cash_index
    currency_col: currency                # ISO-4217, source-faithful, never converted
    # D-PQ A' (the EXCHANGE-SETTLE ANCHOR): the two PHYSICAL activity-metric columns this table carries
    # that the ONE named query-time roll rule reads (front-by-open-interest where the exchange publishes
    # it, front-by-volume otherwise). Declaring them is what makes `agg=front_expiry` expressible HERE and
    # nowhere else. They are NOT served metrics and do not join the settle-only whitelist: they ride the
    # SELECT of that single branch, are consumed by the rule, and are STRIPPED off the row before it is
    # returned -- a provenance column the reader could quote as a figure is exactly what the whitelist
    # exists to prevent. The list is BOUND at the seam to the rule module's own declared input contract
    # (query._front_expiry_input_cols raises on drift), so it can never become a second copy of "which
    # method reads which column".
    roll_input_cols: [open_interest, volume]
    metrics:
      # settle-ONLY whitelist: open/high/low/close + volume + open_interest are carried in silver for
      # provenance but are NOT served -- they are NULL by construction on every settle-only source, so a
      # served OHLC metric would be a mostly-empty column pretending to be a series. unit_overrides is the
      # GOVERNING serving unit and is bound THREE-WAY by config_check.check_futures_eod to
      # leviathan.silver.futures_eod_contracts.CONTRACT_MAP (the single source the physical `unit` column
      # is written from) and to config_check._FUTURES_EOD_UNIT_OVERRIDES: drift in any direction fails the
      # build. The vocabulary is wide on purpose (ten currencies), which is exactly why it is bound.
      settle:
        label: "settlement price"
        desc: >
          the end-of-day price for a SPECIFIC delivery month on its trading date. ALWAYS cite it together
          with the row's `settle_kind` -- an ICE row is a session close, not an official settlement, and a
          CEPEA row is a cash index with no delivery month at all. Per-contract exchange units and
          currencies are returned on each row and are never converted.
        unit_overrides:
          # databento_glbx_mdp3
          corn_cbot:                      "US cents/bushel"
          soybeans_cbot:                  "US cents/bushel"
          soft_red_winter_wheat_cbot:     "US cents/bushel"
          hard_red_winter_wheat_kcbt:     "US cents/bushel"
          soybean_oil_cbot:               "US cents/lb"
          soybean_meal_cbot:              "USD/short ton"
          rough_rice_cbot:                "USD/cwt"
          # databento_ifus_impact
          arabica_coffee:                 "US cents/lb"
          raw_sugar:                      "US cents/lb"
          cocoa:                          "USD/metric ton"
          cotton:                         "US cents/lb"
          frozen_orange_juice:            "US cents/lb"
          canola_ice:                     "CAD/t"
          # databento_ifeu_impact
          robusta_coffee:                 "USD/metric ton"
          white_sugar:                    "USD/metric ton"
          # czce
          rapeseed_meal_zce:              "CNY/t"
          rapeseed_oil_zce:               "CNY/t"
          # dce
          palm_olein_dce:                 "CNY/t"
          soybean_meal_dce:               "CNY/t"
          soybean_oil_dce:                "CNY/t"
          soybeans_no_1_dce:              "CNY/t"
          soybeans_no_2_dce:              "CNY/t"
          # jse_safex
          south_african_white_maize_jse:  "ZAR/t"
          south_african_yellow_maize_jse: "ZAR/t"
          # cepea
          brazilian_arabica_coffee:       "BRL/60-kg bag"
          campinas_corn_reference_bmf:    "BRL/60-kg bag"
          # bursa
          malaysian_crude_palm_oil_cme:   "MYR/t"
          # miax -- DOLLARS/bushel, not CBOT cents: the settlement CSV publishes 7.0250, a factor
          # of 100 from corn's ~430. Source-faithful; never scaled to match the CBOT convention.
          hard_red_spring_wheat_mgex:     "USD/bushel"
          # euronext_matif
          french_wheat_matif:             "EUR/t"
          french_maize_matif:             "EUR/t"
          french_rapeseed_matif:          "EUR/t"
    notes: >
      31 contract slugs across 10 publication sources. commodity = the CONTRACT slug; the delivery month is
      the `contract_month` column ('YYYY-MM'), which is NULL for exactly the two CEPEA cash references
      (brazilian_arabica_coffee, campinas_corn_reference_bmf) -- `instrument_kind` (futures | cash_index)
      is the discriminator that makes that NULL legal rather than a defect. DELIVERY MONTH: a read that
      does not name an expiry returns EVERY delivery month the query's window covers, and a latest-value
      read returns the NEAREST listed expiry -- that is a deterministic tie-break, NOT "the front month".
      The front month is a named query-time roll rule (front-by-open-interest where the exchange
      publishes it), this table stores no front-month flag and no continuous series, and the two are not
      the same contract for much of the year. So never quote a level as "the price": read the row's own
      contract_month and say WHICH EXPIRY it is, or read several rows and describe the curve. A
      delivery-month FILTER does exist in the engine (one expiry, or a comma-separated list for a curve
      read at one as-of) -- but it is available to you only when `contract_month` is listed in the tool's
      input schema; if it is not listed there, do not try to pass it. WITH delivery months NAMED, agg=latest
      returns the newest session ON OR BEFORE the as-of FOR EACH named expiry -- one row per expiry, which
      IS the curve at a single as-of; the nearest-listed-expiry tie-break above applies only to a read that
      names NO month. Every row comes
      back carrying its own contract_month, settle_kind and currency -- state them with the number, never a
      bare figure, and never attach a delivery month to a row that has none.
      THE THREE-PART QUOTE IS MANDATORY AND HAS NO EXCEPTIONS: a settle from this table is quotable ONLY
      as <level> + <unit/currency> + <delivery month> + <what kind of print it is>. "corn settled at 446"
      is not an answer this card supports; "CBOT corn December 2026 settled at 446 US cents/bushel, an
      exchange settlement, on the 2026-06-05 session" is. This binds the agg=front_expiry read exactly as
      hard as a named-month read -- HARDER, if anything, because that read chose the expiry FOR you and
      the reader has no other way to learn which one it picked. The three labels are rendered onto the
      number row you are handed; if one of them is absent from the row, say the level is unattributable
      rather than quoting it bare. PROVENANCE HONESTY: the
      `settle_kind` column is the label, and it is not decorative -- databento_glbx_mdp3 rows are true
      exchange settlements; databento_ifus_impact / databento_ifeu_impact rows are ohlcv-1d session CLOSES
      (the ICE `statistics` settlement schema costs ~$1,960 and was deliberately excluded), so never call
      an ICE number an official settlement; jse_safex rows are the SAFEX mark-to-market; cepea rows are a
      cash index. CAVEAT (Databento open issue, plan F4): IFEU OHLCV bars have an acknowledged
      system-priced-leg contamination issue, so robusta_coffee and white_sugar bars are SUSPECT until
      checked against a free ICE settlement reference -- say so when citing them. UNITS: source-faithful
      exchange convention, ten currencies, NEVER FX-converted at ingest or at serving; the per-row `unit`
      and `currency` columns are the authority and unit_overrides above is lint-bound equal to them.
      THE FRONT-MONTH SETTLE IS AN AGG, NOT A GUESS: agg=front_expiry reads the newest session on or
      before the as-of and lets the named, versioned roll rule name the front delivery month, returning
      ONE row with its own contract_month, settle_kind, currency and unit. That is the read for "what is
      corn trading at" / "where did CBOT wheat settle" when no delivery month is named -- use it instead
      of quoting the nearest listed expiry, and instead of substituting any other table's price (the World
      Bank monthly average or the USDA season-average FARM price are NOT the exchange settle and must
      never be offered as one). It takes no contract_month (it SELECTS one) and no date window (it is one
      session's LEVEL; a front-month series would splice across the roll). It returns NOTHING for the two
      CEPEA cash references (no delivery-month axis) and for any contract whose session rows do not carry
      the activity metric the rule reads -- an honest absence, so say the front-month level is unavailable
      or name an expiry, never approximate it.
      ROLL / CONTINUOUS ARE OUT OF SCOPE for this table: there is no front-month flag and no adjusted
      series -- a stored front-month flag IS roll policy, and roll policy is a named, versioned query-time
      decision, which is exactly what agg=front_expiry runs (it stores nothing and adjusts nothing). This
      is a PER-DELIVERY-MONTH EOD table, distinct from silver_futures_prices (the yfinance
      CONTINUOUS front-month close), the World Bank Pink Sheet MONTHLY averages, and the USDA WASDE
      season-average FARM price. COVERAGE FLOORS: history starts 2010-06 (CME via Databento), 2018-12 (ICE
      via Databento), 2015-10 (CZCE), 2006 (DCE) -- and the venues whose producers were switched on
      recently have NO deep history at all: that series starts the day its producer first runs. JSE SAFEX
      begins 2026-07-29 and Euronext MATIF (the three french_* contracts) begins 2026-08-06 (measured
      first banked trade date; the leg was armed 2026-08-05 and the serving answer flipped 2026-08-20).
      For those two venues a question about any earlier period has no per-delivery-month record here and
      no continuous-series fallback either -- it is DECLINED, and the decline names the date the record
      begins. Do not read a short history as a thin market: it is a young SERIES, not a young contract,
      and never compare its span to a Databento leg's as though both measure the same thing.

  gold_pattern_records:
    # T2B pattern-records ledger (plan sec 4 / D1 / D7). The engine's OWN recorded verdict history: one
    # row per (record_kind, contract, driver_or_chain_id, as_of_date) recording whether the deterministic
    # cascade/pace/chain engine FIRED or DECLINED for that pair at that as-of, plus the recorded values.
    # Served as an ORDINARY observed table so persistence / base-rate / first-recorded claims are [N] facts
    # read from SQL, not prose the verifier strips. GATED by GRAPHRAG_PATTERN_RECORDS (agent.py filters the
    # card + tool enum + ## Conventions bullet out when the flag is OFF -> byte-identical pre-feature).
    description: >
      The engine's recorded verdict ledger. Each row is ONE (record_kind, contract, driver, as_of_date)
      observation of whether the deterministic cascade/pace/chain quantification FIRED or DECLINED at that
      as-of, with the recorded values (streak_len, window_change, n_points, n_rows). Use it to answer how
      many past sweeps a (driver, contract) pair fired on, when it was first/last recorded, and the recorded
      decline reasons -- an OBSERVATION register: report the COUNT and the DATES only, and add NO conclusion
      or direction word (the reader interprets). provenance='daily_sweep' is the recorded daily firing history
      (accrues one partition per day); provenance='backfill_grid' is a SEPARATE labelled ENGINE base rate over
      vintaged-leg weekly replay asofs -- NEVER blend the two, and phrase a backfill rate as 'weekly replay
      asofs', not recent daily firing. If no firing is recorded for a pair, say so plainly; never infer a run length.
    grain: "one row per record_kind x contract x driver_or_chain_id x as_of_date"
    # COVERAGE (PA-1, hoisted from this card's own measured text): the daily sweep accrues one partition per
    # day
    cadence: daily
    grain_cols: [record_kind, contract, driver_or_chain_id, as_of_date]
    shape: wide
    commodity_col: contract
    period_col: as_of_date
    period_type: date
    period_sql_type: string
    date_col: written_at
    date_col_type: timestamp        # written_at is a physical TIMESTAMP -> DP-5 substr-normalized in the guard
    knowledge_date_col: written_at
    knowledge_semantics: ingest     # a row is KNOWN when written; a backfill_grid row (written_at >> as_of_date)
    #                                 is invisible at a past-asof PIT query BY DESIGN (plan F7)
    # NO `metrics` (deliberate): this is an AGGREGATION-only card. The plan's use cases (base rate,
    # run length, first/last-recorded, decline history) are COUNT/MIN aggregations over verdict + as_of_date
    # (pattern_records.presence_sql), NOT lookup_number metric reads. Declaring the flat numeric columns
    # (streak_len/window_change/n_points/n_rows/n_hops) as `metrics` would make the F010 generator derive
    # them as silver value_columns + a 0.5 non-null floor -- WRONG for an observation ledger where those
    # columns are legitimately NULL off their kind (plan sec 1.1: no value_columns / non-null floor). They
    # mirror to pg as TEXT (the presence SQL never does math on them); the reader gets them via aggregation.
    metrics: {}
    notes: >
      GATED behind GRAPHRAG_PATTERN_RECORDS (default OFF). commodity = the focus CONTRACT slug (corn_cbot);
      driver_or_chain_id = the driver node id (export_pace, La_Nina) or the chain id. record_kind is one of
      cascade|pace|chain (the fork kinds comove/reroute/price_leg are reserved but not written in v1). verdict
      is fired|declined; a declined row carries decline_reason and NO fabricated values. The base-rate / streak
      / first-recorded reads are SCALAR COUNT/MIN aggregations (never a bare GROUP-BY): an in-catalog pair whose
      sweeps all declined returns a materialized recorded_firings=0 (a citable 0), distinct from a pair not yet
      swept (sweeps_total=0). ALWAYS pin ONE provenance class in an aggregation -- daily_sweep for recorded
      history, backfill_grid for the labelled engine base rate. The engine RECORDS and the reader interprets:
      never mint a threshold from the count, and never add a conclusion or direction word to it.

  # D-LD (2026-08-18) -- USDA FGIS EXPORT INSPECTIONS, the physical counterpart to silver_esr's bookings.
  # The estate has carried this table since the 2026-05 bulk backfill and it feeds export_pace_z_* in the
  # feature layer, but it has never been readable by the numbers agent. 113,072 rows, five contracts,
  # 196 destinations, weekly from January 1983. Nothing is ingested or re-derived by this card.
  #
  # PIT: data_date on week_ending_date + publication_lag_days: 13, and the 13 is MEASURED, not assumed.
  # FGIS's own report week runs Friday->Thursday, and our fetch snapshots the rolling CY file every
  # Thursday 12:00 UTC (cron(0 12 ? * THU *), dag_schedules fgis, ENABLED + promote_mode autonomous since
  # 2026-08-16). Three consecutive snapshots measured the same gap exactly: as_of Thu 2026-07-30 carried
  # certifications through 2026-07-23; as_of Thu 08-06 through 07-30; as_of Thu 08-13 through 08-06 --
  # as_of MINUS max(cert_date) = 7 days, three for three. Our week_ending_date is a DERIVED 7-day bucket
  # end whose weekday drifts year to year (it is anchored to the marketing-year start, not to a weekday),
  # so a certification dated exactly on a bucket end reaches us at the first Thursday >= cert+7, i.e.
  # between +7 and +13 days. 13 is the worst case and therefore the only value that never leaks.
  # WHAT THE 13 ACTUALLY WITHHOLDS, measured: at asof 2026-08-18 the newest week in storage is the bucket
  # ending 2026-08-09, and it is PARTIAL -- the 08-13 snapshot only reached certifications through 08-06,
  # so that bucket holds 4 of its 7 days and will be revised UP at the 08-20 run. The lag withholds it
  # (37 rows across the five slugs) and hands back the bucket ending 2026-08-02, which IS complete. A
  # smaller lag would have served a half-week as a week.
  #
  # PHYSICAL LAYOUT -- and the ONE place this card departs from the projected-table template. The table is
  # partition_mode: projected / projection: legacy-quarantined, grid = leviathan_slug enum (5) x
  # marketing_year integer 1982-2035 (54) = 270 candidate prefixes, of which 223 are real (MEASURED by
  # object listing). partition_cols pins the slug via the ordinary commodity equality, which cuts every
  # query to 54 candidates. `year_col` is DELIBERATELY NOT DECLARED and this is not an oversight:
  # marketing_year is a MARKETING year, not a calendar year, and _filters emits `year_col >=
  # int(period_start[:4])` on any window (query.py:406-407). Corn/soy marketing year Y spans Sep Y to Aug
  # Y+1, so a perfectly ordinary window like period_start='2026-06-01' would emit `marketing_year >= 2026`
  # against rows that legitimately live in marketing_year 2025 and return ZERO ROWS SILENTLY -- for eight
  # of twelve calendar months on corn and soybeans, five of twelve on wheat. That is the same class as the
  # "projected partition that is also year_col" landmine, arrived at from the other side. Declaring it
  # would buy 54 prefix LISTs (a fraction of a second, four to five orders of magnitude below the 6.1M-cell
  # silver_esr grid behind the Jul-2026 $134 storm) at the price of a silent wrong answer, and the marketing
  # year is reachable anyway: period_col = marketing_year compiles to `marketing_year = 2025`, an exact
  # partition equality, whenever the caller pins a season. The pg mirror is the serving backend regardless.
  silver_fgis:
    description: >
      USDA FGIS export INSPECTIONS -- the tonnage of US corn, soybeans and wheat actually inspected and
      certified for export at US ports each week, BY DESTINATION COUNTRY, from January 1983. These are
      legal certifications under the US Grain Standards Act: grain PHYSICALLY LOADED for that country --
      not sales booked, not commitments, not forecasts. One row per contract x marketing year x week x
      destination, carrying that week's tonnage and the season-to-date running total for that destination.
      Whole metric tons (silver_esr is thousands of MT -- not the same scale). Five contracts only: corn,
      soybeans and the three wheat classes. The United States is the reporter, never a destination. This is
      the SHIPMENTS half of the US export program; silver_esr is the SALES half, and the two are different
      quantities that must never be added or substituted.
    grain: "one row per contract x marketing year x week x destination country"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "113,072 rows, five contracts, 196
    # destinations, weekly from January 1983". LIVE weekly front (Thursday fire) -> no last_obs
    row_count: 113072
    first_obs: "1983-01"
    cadence: weekly
    shape: wide
    commodity_col: leviathan_slug        # PARTITION key = the contract slug; the equality is what prunes
    # D-PQ CLASS-1 code fence: the five slugs, DECLARED, so an off-list lookup is refused at spec level
    # with a teaching error before any SQL is compiled. This list and the "five contracts and only these
    # five" sentence in `notes` are the same fact said twice on purpose -- notes teach, this enforces.
    commodity_values: [corn_cbot, soybeans_cbot, hard_red_winter_wheat_kcbt,
                       hard_red_spring_wheat_mgex, soft_red_winter_wheat_cbot]
    country_col: destination_country     # FGIS's OWN uppercase abbreviations -- see the notes, this is the
    #                                      WASDE Title-Case class and there is no name-resolution ref here
    period_col: marketing_year           # the MY START year, our convention already (no period_offset)
    period_type: marketing_year
    period_sql_type: int                 # compiles to `marketing_year = 2025` = an exact partition pin
    date_col: week_ending_date           # a physical DATE column (not a timestamp -- no date_col_type)
    knowledge_semantics: data_date
    knowledge_date_col: week_ending_date
    publication_lag_days: 13             # MEASURED worst case; see the block comment above
    partition_cols: [leviathan_slug]     # projected; pinned by the commodity equality. marketing_year is
    #                                      NOT listed: it is not a NumberQuery field, so _partition_filters
    #                                      would raise "requires a static marketing_year equality" on every
    #                                      lookup -- and it must not be year_col either (comment above).
    metrics:
      exports_mt_weekly: {label: "weekly export inspections", unit: "MT", desc: "tonnage inspected and certified for export to that destination DURING that week (a weekly flow, not a running total)"}
      exports_mt_ctd:    {label: "season-to-date export inspections", unit: "MT", desc: "season-to-date CUMULATIVE tonnage to that destination, a running total that only ever climbs within one marketing year and resets at the next"}
    notes: >
      THIS IS GRAIN LOADED, NOT GRAIN SOLD. FGIS certifies physical shipments leaving US ports; silver_esr
      reports SALES -- new sales booked, outstanding unshipped commitments, and its own shipments line. An
      FGIS number is never a sales figure and never an export FORECAST (that is silver_wasde / silver_psd).
      The two also disagree on units: FGIS is whole METRIC TONS, silver_esr is THOUSANDS of MT, so a raw
      comparison is off by 1000 before any definitional gap. Say which one you read -- "inspected for
      export" or "sold" -- and route sales-pace or unshipped-commitment questions to silver_esr, not here.
      COMMODITY IS REQUIRED (it is the partition axis, so a lookup without one is refused before any SQL is
      compiled) and only five exist: corn_cbot, soybeans_cbot, hard_red_winter_wheat_kcbt,
      hard_red_spring_wheat_mgex, soft_red_winter_wheat_cbot. Sorghum, barley, oats, durum, white wheat,
      rice, cotton and every processed product are NOT here -- decline rather than substituting a different
      grain. ONE LOOKUP = ONE METRIC AND ONE DESTINATION: `metric` is required, there is no all-metrics
      read, and a Mexico-versus-Japan comparison is one call per (metric, destination) pair.
      NAME THE DESTINATION, OR ASK FOR THE NATIONAL TOTAL PROPERLY. With no country the read spans every
      destination that shipped that week and agg=latest returns ONE ARBITRARY row: measured on the corn
      week ending 2026-08-02, that row is JORDAN at 24 MT out of a 1,512,126 MT national week, because the
      tiebreak is ascending value. A national figure is agg=sum on exports_mt_weekly with country omitted,
      never agg=latest. Every row carries its own destination -- name it whenever you quote a number.
      DESTINATION STRINGS ARE FGIS'S OWN UPPERCASE ABBREVIATIONS AND NOTHING RESOLVES THEM: the value is
      compared literally, and a wrong one returns no rows silently rather than erroring. 'KOREA REP' (not
      'South Korea'), 'UN KINGDOM' (not 'United Kingdom'), 'DOMINICN REP', 'REP S AFRICA', 'UN ARAB EM',
      'COTE DIVOIRE', 'CONGO (BRAZ)', 'NETH ANTIL'; the ordinary ones are simply capitalised ('MEXICO',
      'JAPAN', 'CHINA', 'TAIWAN', 'EGYPT', 'SPAIN', 'VIETNAM'). The record also carries defunct entities
      ('USSR', 'YUGOSLAVIA', 'ZAIRE', 'BURMA', 'GERM FR (W)') and an 'UNKNOWN' pseudo-destination -- 196
      strings across the full history, 98 of them in marketing year 2023 or later. When unsure of a
      spelling, read the season with no country and quote the destination the row itself carries.
      exports_mt_ctd IS CUMULATIVE, PER DESTINATION, WITHIN ONE MARKETING YEAR -- a running total that
      resets each season. Never delta it against a weekly figure or across a season boundary, and NEVER SUM
      IT ACROSS DESTINATIONS: a destination only has a row in weeks it actually received grain, so summing
      that column over one week's rows drops every buyer that was quiet. Measured on corn 2025/26 through
      the week ending 2026-08-02 that gives 67,469,343 MT against a true 75,673,883 MT -- a 10.8 percent
      undercount, 28 of the season's 47 destinations having been quiet that week. A national season total
      is agg=sum on exports_mt_weekly over the window.
      A MISSING WEEK MEANS NO SHIPMENT, NOT MISSING DATA. Series have real holes (corn to ALGERIA has 12 of
      48 weeks in 2025/26, CANADA 8, MEXICO all 48), so a destination's cumulative position at a given week
      is the last row ON OR BEFORE it. An empty result is a genuine finding: corn to CHINA has ZERO rows in
      2025/26, the last season with any being 2024/25 at 33,476 MT. Report that as no shipments -- never as
      no data, and never by quietly switching destination, crop or table.
      PERIOD IS THE MARKETING-YEAR START YEAR, AND THE CROPS DISAGREE ABOUT WHICH ONE IS CURRENT. period is
      an integer start year (2025 = the 2025/26 season), the convention silver_psd and silver_esr use. Corn
      and soybeans run Sep 1 - Aug 31; all three wheat classes run Jun 1 - May 31. So at an as-of in August
      2026 the current corn and soybean season is 2025 while the current wheat season is 2026 -- one date,
      different labels by crop. A wrong pin returns no rows, indistinguishable from absence, so when unsure
      omit period and window with period_start/period_end on the week-ending date instead.
      week_ending_date IS A DERIVED 7-DAY BUCKET END, NOT A REPORT DATE: the producer buckets certifications
      into fixed 7-day windows counted from the marketing-year start (Sep 1 or Jun 1) and stamps the last
      day of the window, so the weekday drifts between seasons and the stamp is NOT the FGIS report
      Thursday. Quote the date itself ("the week ending 2026-08-02"); never call it a Thursday or a release.
      FRESHNESS. The weekly run publishes certifications through the previous Thursday, so the newest bucket
      in storage is normally still PARTIAL; the publication lag withholds it and agg=latest returns the
      newest COMPLETE week. Cite the reading's own week-ending date and never call a dated reading
      'current'. Density is about 18 destination rows per corn week (~750 rows per season for corn, ~840
      for soybeans, 270-340 per wheat class), so one destination's full season is 40 to 50 rows.
      NO REVISION VINTAGE: latest snapshot only, no as-of axis, so a late-posted certification updates
      history in place. Rare (these are legal certifications, not a survey), but it means this card cannot
      answer "what did we think last month" -- for that use silver_esr, whose weekly reports ARE retained.

  # D-LD (2026-08-18) -- USDA FAS WORLD AGRICULTURAL PRODUCTION (WAP) TABLE 01, THE REVISION LEDGER.
  # The DARK CAPABILITY CENSUS's #2, and the ONE table in the estate whose subject is not a level but the
  # CHANGE BETWEEN TWO USDA PRINTS. Nothing is ingested, re-chunked or re-derived; this card is the whole fix.
  #
  # THE D-PQ REFUSAL, AND EXACTLY HOW IT IS DISCHARGED. tests/unit/test_dpq_dark_tables.py refused this
  # table on 2026-08-07 for a FREE AXIS: `vintage_type` splits value_mmt into two different quantities and
  # NumberQuery has no field to choose between them (measured then: 1-3 rows per (release, commodity,
  # country, marketing_year)). Re-measured 2026-08-18, both halves of that verdict are TRUE and both are
  # now closed by CARD MECHANISM rather than by a producer change:
  #   (a) THE AXIS. 96,410 rows split 49,188 `vintage_type='year'` / 47,222 `'month'`. The YEAR rows are
  #       the marketing-year preliminary/projection estimates and they are UNIQUE on
  #       (release_month, commodity, country, marketing_year) -- 49,188 groups, EVERY ONE of size 1,
  #       zero exceptions. The MONTH rows are the circular's this-month/last-month comparison block and
  #       they are a DIFFERENT quantity: their `marketing_year` is IMPUTED by the producer from the
  #       block's proj. row (wap_table01._derive_marketing_year_for_months), and they reconcile to NO
  #       annual figure -- only 14.6% of current-month rows equal the same release's year projection
  #       (n=24,406), and at 2026-07 world wheat the monthly row prints 820.0 against a 2026/27
  #       projection of 843.8, a 23.8 MMT gap. So the card serves the YEAR rows and FENCES the month
  #       rows out, twice over: `row_filters` emits `vintage_type IN ('year')` on every read, and the
  #       `vintage_tiebreak` role_order ranks 'year' ahead of 'month' if the filter is ever removed.
  #       The fence is unconditional in practice because `unit_overrides` already RAISES on any
  #       commodity-less query (see UNITS below), and row_filters keys on the commodity.
  #   (b) THE SERIES. The refusal's second half was correct and load-bearing: "the vintage branch applies
  #       its ROW_NUMBER collapse to EVERY agg, so a revision SERIES across release months -- the entire
  #       desk story -- is structurally unreachable". It is unreachable only when the RELEASE is absent
  #       from the grain. `grain_cols` puts `release_month` IN the identity group (the silver_esr idiom:
  #       ESR keys on the WEEK, not the marketing year), so the ROW_NUMBER de-duplicates the ROW_LABEL
  #       axis and NEVER the release axis. Compiled and verified: agg=series over period_start/period_end
  #       returns one row per release across the window (2026-05 843.8 / 2026-06 844.4 / 2026-07 843.8 for
  #       wheat-world-2026/27), while agg=latest still collapses to the single freshest release.
  #       That is the correct grain for a revisions table: the observation IS "the estimate printed at
  #       release R", and R is part of its identity.
  #
  # PIT: VINTAGE on release_month, minted here. The F010 contract said `year_month`, which is NOT
  # EXPRESSIBLE -- query._guard RAISES `year_month semantics needs year_col + month_col` and this table
  # has neither (12 physical columns, no year, no month). release_month is an explicit 'YYYY-MM'
  # PUBLICATION label, so vintage is both the compilable and the truthful semantics. The guard compiles
  # to `CAST(release_month AS varchar) <= '<asof - 12d>'`: a 'YYYY-MM' label compared lexically against a
  # 'YYYY-MM-DD' cutoff is a PREFIX compare, so it admits a month exactly while the cutoff is inside it
  # or later, and byte order is identical on Presto and on the pg mirror's TEXT COLLATE "C".
  #
  # publication_lag_days: 12, and the arithmetic is exact rather than conservative-by-feel. asof - 12d
  # lands on day 1 of the same month when asof is the 13th, and on the LAST DAY OF THE PRIOR MONTH when
  # asof is the 12th -- in EVERY calendar month, February included. So a circular is withheld through the
  # 12th of its own month and becomes citable on the 13th, forever, with no month-length special case.
  # USDA publishes WAP alongside the WASDE, whose observed calendar is the 8th-12th, so 13 is never early
  # on the observed record; a slipped release would be a one-day HISTORICAL-REPLAY leak, never a live one
  # (the row does not exist yet in live use). Verified by the oracle: at asof 2026-07-12 the 2026-07
  # circular is WITHHELD, at 2026-07-13 it is served.
  #
  # SARGABLE PARTITION DISCIPLINE: none needed, and that is a FACT rather than an omission -- the table is
  # partition_mode flat / projection forbidden / partition_keys [], one object under the flat root. There
  # is no projected grid, no LIST-storm class, and NO partition_cols may be declared: reconcile_numbers
  # requires every spec partition_col to be a real Glue partition key and would fail the build.
  #
  # NOT in cascade_map (no engine leg) and NOT in cascade.PACE_TABLES -- a monthly ESTIMATE-REVISION
  # ledger is not a pace surface, and a pace [N] rendered off it would narrate USDA's editing as a flow.
  silver_wap_table01_revisions:
    # D-LD review fold: period_required is the CODE half of the always-pass-period rule the
    # notes teach -- the CLASS-1 idiom (teach AND enforce; prose alone moved the leak twice).
    period_required: true
    description: >
      USDA FAS World Agricultural Production (WAP) circular, Table 01 -- the MONTH-OVER-MONTH REVISION
      ledger for world PRODUCTION. One row per monthly circular x commodity group x country x marketing
      year, carrying the estimate printed in THAT circular, the estimate the PREVIOUS circular carried for
      the same series, and the change between them. This is the only table in the estate whose subject is
      the REVISION itself: "did USDA raise or cut this crop, and by how much" is a lookup here, not a
      comparison you have to assemble. Six commodity groups, and they are WAP AGGREGATES, not exchange
      contracts: total_grains, coarse_grains, wheat, rice, oilseeds and cotton. Nineteen country labels
      including the aggregates world, total_foreign and all_others. PRODUCTION ONLY -- there are no stocks,
      no use, no trade and no price on this table. Monthly, 2006-12 onward; a circular is published in the
      first half of its own month and is citable from the 13th.
    grain: "one row per release_month x commodity x country x marketing_year (the year-vintage rows)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): 49,188 `vintage_type='year'` rows -- the
    # SERVED half of the 96,410 (the month rows are fenced out by row_filters); "228 circulars, 2006-12
    # through 2026-07". LIVE monthly circular -> no last_obs
    row_count: 49188
    first_obs: "2006-12"
    cadence: monthly
    shape: wide
    commodity_col: commodity            # the WAP aggregate GROUP, not a contract slug (see notes)
    # D-PQ CLASS-1 code fence: the six groups, DECLARED, so an off-list ask is refused at spec level with a
    # teaching error BEFORE any SQL. This list and the "only these six exist" sentence in `notes` are the
    # same fact said twice on purpose -- the notes teach, this enforces.
    commodity_values: [coarse_grains, cotton, oilseeds, rice, total_grains, wheat]
    country_col: country                # lower_snake WAP country label; 'world'/'total_foreign' are AGGREGATES
    period_col: marketing_year
    period_type: marketing_year
    period_sql_type: string             # marketing_year is a string like '2026/27'
    date_col: release_month             # the circular's own 'YYYY-MM' label -- the chronological axis AND
    #                                     the publication event; declaring it is what makes agg=latest a
    #                                     single freshest-release row and what makes a release WINDOW
    #                                     expressible at all (period_start/period_end, as 'YYYY-MM')
    knowledge_date_col: release_month
    knowledge_semantics: vintage
    publication_lag_days: 12            # withheld through the 12th of its own month, citable from the 13th
    provenance_col: vintage_status      # DP-2: surfaces 'prel.' | 'proj.' as `revision_stamp` on EVERY row,
    #                                     so a figure carries whether it is a preliminary estimate of a
    #                                     finished crop or a projection of one still in the ground
    # THE FREE-AXIS CLOSURE. release_month is IN the grain (the silver_esr week idiom) so the vintage
    # ROW_NUMBER de-duplicates the ROW_LABEL axis and never the release axis -- which is what keeps the
    # revision SERIES reachable. Measured: the year rows are unique on these four columns in all 49,188
    # groups, so _rn=1 is a de-duplication, never a silent pick.
    grain_cols: [commodity, country, marketing_year, release_month]
    vintage_tiebreak:
      - {col: vintage_type, role_order: [year, month]}   # the annual estimate wins; the monthly-comparison
      #                                                    block is a different quantity (see the header)
      - {col: row_label, dir: asc, nulls: last}          # final deterministic total-order key
    metrics:
      value_mmt:
        label: "WAP estimate"
        unit: "MMT (cotton: million 480-lb bales)"
        desc: "the production estimate for that marketing year as printed in THIS circular"
        # UNITS ARE HETEROGENEOUS AND THE COLUMN NAME LIES. There is no unit column on this table, and
        # `value_mmt` is million metric tonnes for five of the six groups but MILLION 480-LB BALES for
        # cotton -- measured, not assumed: world cotton reads 119.3 (2025/26) and 121.9 (2026/27) at the
        # 2026-07 circular and US cotton reads 14.4/13.9, which are bale figures; the same rows in tonnes
        # would be ~26 and ~3. Rice is MILLED basis (world 545.7). unit_overrides is the doctrinal remedy
        # and its documented consequence is load-bearing here: a commodity-less query RAISES, which is
        # exactly the fence this card wants (see "ALWAYS PASS A COMMODITY" in notes).
        unit_overrides: {coarse_grains: "MMT", cotton: "million 480-lb bales", oilseeds: "MMT",
                         rice: "MMT, milled basis", total_grains: "MMT", wheat: "MMT"}
        # THE ROW FENCE: serve the marketing-year vintage rows ONLY. The monthly-comparison rows carry an
        # IMPUTED marketing_year and a value that reconciles to no annual figure (14.6% exact match).
        row_filters:
          coarse_grains: {vintage_type: [year]}
          cotton:        {vintage_type: [year]}
          oilseeds:      {vintage_type: [year]}
          rice:          {vintage_type: [year]}
          total_grains:  {vintage_type: [year]}
          wheat:         {vintage_type: [year]}
      prior_value_mmt:
        label: "prior-month WAP estimate"
        unit: "MMT (cotton: million 480-lb bales)"
        desc: "the SAME series' estimate at the previous circular in which it appeared -- the baseline the revision is measured from, not the prior marketing year"
        unit_overrides: {coarse_grains: "MMT", cotton: "million 480-lb bales", oilseeds: "MMT",
                         rice: "MMT, milled basis", total_grains: "MMT", wheat: "MMT"}
        row_filters:
          coarse_grains: {vintage_type: [year]}
          cotton:        {vintage_type: [year]}
          oilseeds:      {vintage_type: [year]}
          rice:          {vintage_type: [year]}
          total_grains:  {vintage_type: [year]}
          wheat:         {vintage_type: [year]}
      revision_mmt:
        label: "month-over-month revision"
        unit: "MMT change (cotton: million 480-lb-bale change)"
        desc: "this circular minus the previous one for the same series: positive = USDA RAISED the crop, negative = CUT it. A change in the ESTIMATE, never a change in the crop"
        unit_overrides: {coarse_grains: "MMT change", cotton: "million 480-lb-bale change",
                         oilseeds: "MMT change", rice: "MMT change, milled basis",
                         total_grains: "MMT change", wheat: "MMT change"}
        row_filters:
          coarse_grains: {vintage_type: [year]}
          cotton:        {vintage_type: [year]}
          oilseeds:      {vintage_type: [year]}
          rice:          {vintage_type: [year]}
          total_grains:  {vintage_type: [year]}
          wheat:         {vintage_type: [year]}
    notes: >
      ALWAYS PASS A COMMODITY. Every metric on this card carries per-commodity unit overrides because the
      table has NO unit column and its units are not uniform, so a commodity-less lookup is REJECTED
      before anything is queried and costs you a lookup from the budget. commodity takes exactly these
      six WAP AGGREGATE GROUPS and nothing else: total_grains, coarse_grains, wheat, rice, oilseeds,
      cotton. THESE ARE NOT CONTRACT SLUGS AND THEY ARE NOT INTERCHANGEABLE WITH CROPS. coarse_grains is
      corn PLUS sorghum, barley, oats, rye and millet -- it is NOT corn, and a coarse_grains figure must
      never be narrated as a corn number or read against corn_cbot; oilseeds is every oilseed, not
      soybeans. total_grains is exactly coarse_grains + wheat + rice (verified to the decimal at the
      2026-07 circular: 1624.3 + 843.8 + 545.7 = 3013.8). There is no corn, soybean, sugar, coffee or
      cocoa row here; decline rather than substituting the group for the crop, and for a single crop use
      silver_wasde or silver_psd.
      ALWAYS PASS A COUNTRY, AND SAY WHICH ONE. country takes lower_snake WAP labels and only these
      nineteen exist: world, total_foreign, us, canada, mexico, eu27, russia, ukraine, china, india,
      indonesia, pakistan, thailand, argentina, brazil, australia, south_africa, turkey, all_others.
      ALWAYS PASS A PERIOD TOO, AND ITS SPELLING IS THE SLASH FORM: period is the marketing-year LABEL
      exactly as WAP prints it, a string like '2026/27' -- '2026' alone or '2026-27' matches ZERO rows
      silently. THIS IS THE CARD'S SHARPEST TRAP, measured: every circular carries TWO marketing years
      side by side (the prior year's near-final estimate and the current year's projection), and with
      period free an agg=latest read returns the PRIOR year's row -- 'USDA's latest world wheat
      production' would answer 799.7 (the finished 2025/26 crop) when the desk means 843.8 (the 2026/27
      projection). The right crop is a named period, never a default. Every row also rides out with a
      revision_stamp of 'prel.' (a preliminary estimate of a finished or finishing crop) or 'proj.' (a
      projection of the crop still in the field) -- quote it with the number so the reader knows which
      of the two the figure is.
      THIS CARD SERVES THE MARKETING-YEAR BLOCK ONLY. Each circular also prints a month-over-month
      comparison block; that half of the table is deliberately NOT served here (the query is fenced to
      the marketing-year vintage rows). A this-circular-vs-last-circular delta IS answerable -- that is
      the revision_mmt metric; a question about the circular's own monthly-comparison lines is not.
      Three of those are AGGREGATES, not places: 'world' is the global total, 'total_foreign' is world
      minus the US (world = total_foreign + us, exact on every commodity at the 2026-07 circular), and
      'all_others' is the residual of everything not itemised. With NO country the read spans every label
      and a latest-value read returns ONE arbitrary country's row -- a Ukrainian number wearing a world
      label. eu27 IS DEAD FOR GRAINS AND OILSEEDS: the source stopped printing an EU-27 line for
      coarse_grains, wheat, rice, oilseeds and total_grains after the 2018-07 circular (cotton alone still
      carries it, through 2026-07), so an EU wheat read at any modern as-of correctly returns NO ROWS --
      that is a source coverage end, not a query error, and it must not be back-filled from another table
      and called WAP.
      ONE LOOKUP = ONE METRIC AND ONE COUNTRY. This card carries three metrics and a free country axis:
      `metric` is REQUIRED and there is no all-metrics read, so "the print, the prior print and the
      change" for two origins is six calls -- value_mmt for brazil, then revision_mmt for brazil, and so on.
      REVISION_MMT IS A CHANGE IN USDA'S ESTIMATE, NOT A CHANGE IN THE CROP AND NOT A FLOW. Positive means
      the analyst raised the number between two circulars; it is not production growth, not a year-on-year
      change, and not a trade figure. prior_value_mmt is the SAME marketing year at the PREVIOUS circular,
      never the previous marketing year -- for a year-on-year comparison read two marketing years, not this
      column. Values are levels in million metric tonnes EXCEPT cotton, which is MILLION 480-LB BALES
      (measured: world cotton 121.9 at the 2026-07 circular, US 13.9) -- never convert one to the other
      here, and rice is on a MILLED basis.
      THE MAY ROLL IS NOT MISSING DATA. Every May the marketing-year labels turn over: the crop that was a
      projection becomes the preliminary estimate and a new projection year appears. The revision link
      keys on that status, so at the MAY circular prior_value_mmt and revision_mmt are NULL for
      essentially every row (measured: 94.2% of May year rows, and 20 of 228 releases are wholly null this
      way), and the chain restarts. A marketing year lives about 12 circulars as a projection and about 12
      more as a preliminary, with the revision chain BREAKING at the switch -- so a "how has this crop been
      revised all the way through" ask is two chains, not one, and the May row is a chain start, never a
      zero revision. Overall only 14.1% of year rows carry a non-zero revision: USDA leaves most lines
      untouched most months, and a 0.0 is a real reading meaning "unchanged", not an absence.
      Window release months with period_start / period_end AS 'YYYY-MM' -- the comparison is made against
      the release LABEL, so a full ISO date at period_start ('2026-05-01') silently excludes that whole
      month (verified: it drops 2026-05 and keeps 2026-06 onward). agg=latest returns the newest circular
      on or before the as-of; agg=series over a window returns ONE ROW PER CIRCULAR **only when a
      period is pinned** -- with period free the window returns BOTH marketing years' chains interleaved
      and ordered by marketing year first, not by release, so a revision path is readable only as
      (one period) x (a release window). The as-of guard compares the release label plus a 12-day
      publication lag, so a circular is withheld through the 12th of its own month and citable from the
      13th; cite the reading's OWN release month and never call a dated reading 'current'.
      COVERAGE AND ITS HOLES, MEASURED. 228 circulars, 2006-12 through 2026-07, about 216 served rows per
      circular. Eight calendar months are absent and that is the data: 2007-06 (the producer EXCLUDES it,
      confirmed commodity-row scrambling in the source PDF), 2013-10, 2019-01, 2023-04, 2024-03, 2024-04,
      2025-10 and 2025-11. A handful of PDF-extraction artefacts survive in the early record -- 48 of
      44,621 year rows carry a revision beyond +/-50 units, concentrated in the 2007-05, 2010-07, 2010-08,
      2015-02, 2016-08, 2016-09, 2018-07, 2018-08 and 2018-11 circulars and mostly on cotton, and one row
      (2016-08 cotton all_others) is NEGATIVE at -71.0. Treat any single-month revision of that magnitude
      as an extraction defect and say so rather than narrating it as a USDA action; genuine modern
      revisions are small (the largest in the last twelve circulars is +17.9 on world total_grains at
      2026-06).
      WHAT THIS TABLE IS NOT. PRODUCTION ONLY -- no beginning or ending stocks, no domestic use, no
      exports or imports, no stocks-to-use and no price. This is the production annex published alongside
      the WASDE, so for wheat, rice and cotton the same circular's numbers also appear as the `production`
      line on silver_wasde with a finer region axis and the full balance sheet beside them, and for a
      single crop's global picture silver_psd is the authority. What lives ONLY here is the AGGREGATE view
      (total_grains, coarse_grains, oilseeds) and the revision itself -- silver_wasde and silver_psd serve
      levels as-known and make you difference two vintages to see a revision; this card serves the
      difference USDA itself printed.

  # D-LD TRACK 1 (2026-08-18) -- FNC COLOMBIA MONTHLY COFFEE, from the LIGHT-THE-DARK census (row 10 of
  # the Track-1 table). The table has been in silver since the F010 baseline and the publish chain is
  # LIVE and autonomous (dag_schedules `fnc_colombia`, cron(0 12 15 * ? *), promote mode autonomous,
  # canonical re-written 2026-08-15) -- what was missing is the card. Nothing is ingested, re-chunked or
  # re-derived here.
  #
  # WHAT THE TABLE ACTUALLY IS, MEASURED 2026-08-18 against the canonical parquet rather than assumed:
  # 1,360 rows, ONE commodity (arabica_coffee), ONE country (colombia), ONE source (fnc_colombia), 114
  # years 1913-2026, exactly 12 rows per year through 2025 and 4 rows in 2026 (Jan-Apr). Zero duplicates
  # on the (year, month) natural key. The five value columns do NOT share one span, and that is the single
  # most load-bearing fact on this card:
  #     ex_dock_price_usd_cents_per_lb   1913-01 -> 2026-04   1360/1360 non-null, no gap years
  #     internal_price_cop_per_125kg     1944-01 -> 2026-04    988/1360
  #     production_bags_60kg             1956-01 -> 2026-04    844/1360
  #     exports_bags_60kg                1958-01 -> 2026-03    819/1360
  #     exports_value_usd_m              1958-01 -> 2026-03    819/1360
  # The pre-1956 rows EXIST and carry ONLY the ex-dock price; a production or exports read at an early
  # as-of returns rows whose value is NULL. That is a real absence, never a zero, and the notes say so.
  #
  # PIT: data_date on the first-of-month `date` column + a conservative 45-day publication lag. DERIVATION
  # (not a guess): the stamp is the FIRST of the data month, so the month itself is not complete until up
  # to 31 days later, and FNC's bulk workbook is picked up by this family's MONTHLY schedule on the 15th of
  # the following month -- 31 + 14 = 45. It shifts the as-of RHS literal, so the guard stays sargable
  # (D-W0.3 idiom, the MPOB/pink_sheet pattern). It is never early and at most ~2 weeks late. 45 is also
  # the number the estate already carries for this family (silver_observability.auto.tfvars.json,
  # silver_freshness_slas.fnc_colombia = 45), so the two agree by construction rather than by luck.
  #
  # WHAT THE LAG DOES NOT DO, STATED PLAINLY. It bounds when a month becomes CITABLE; it says nothing about
  # when FNC publishes the month at all. MEASURED: the workbooks were re-fetched 2026-08-15 and top out at
  # April-2026 (March-2026 for the two export columns). The source itself runs three to four months behind,
  # so at any realistic as-of the newest citable month is a QUARTER old. The family FreshnessLagDays alarm
  # cannot see this -- it scores the S3 WRITE date (2.7 days at the D-LD recon), not the newest data month
  # -- which is the same blind spot the ESR inversion records. The notes therefore carry the ceiling as a
  # caller rule, because no alarm will.
  #
  # PHYSICAL LAYOUT: partition PROJECTION (commodity enum 'arabica_coffee' x year 1913-2035 -> at most 114
  # live candidates today). Pruned exactly the way silver_nass_crop_progress is: the commodity equality is
  # emitted by the ordinary commodity filter (and query.py:355 REQUIRES it, because commodity is in
  # partition_cols), and the year axis is pinned by SARGABLE BOUNDS from year_col -- never an equality,
  # which would return zero rows for any multi-year window. `commodity` is the partition key holding the
  # slug; the in-file `leviathan_slug` column carries the same value and is deliberately NOT the
  # commodity_col, because filtering the partition is what prunes.
  #
  # NO CASCADE / COMPLEX / CHAIN / TRANSMISSION MAP ENTRY. This is a direct-lookup card only.
  silver_fnc_colombia_monthly:
    description: >
      FNC (Federacion Nacional de Cafeteros de Colombia) MONTHLY Colombian coffee statistics -- national
      green-coffee PRODUCTION and EXPORTS in 60-kilogram bags, the USD value of those exports, the FNC
      ex-dock reference PRICE in US cents per pound, and the FNC internal (domestic) price in Colombian
      pesos per 125-kg carga. One row per calendar month. Colombia is the world's largest producer of
      washed arabica, so this is the origin-side monthly print for that crop: what Colombia grew, what it
      shipped, what it earned and what growers were paid. The record is long but the five series do NOT
      start together -- the ex-dock price runs from 1913, the internal price from 1944, production from
      1956 and both export series from 1958. Point-in-time via the month's own first-of-month data date
      plus a conservative 45-day publication lag.
    grain: "one row per commodity x year x month (monthly, calendar months)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "1,360 rows ... 114 years 1913-2026";
    # "the newest month in the table is APRIL-2026" and the SOURCE runs three to four months behind -- a
    # content ceiling the notes state in the imperative
    row_count: 1360
    first_obs: "1913-01"
    last_obs: "2026-04"
    cadence: monthly
    shape: wide
    commodity_col: commodity            # PARTITION key holding the contract slug; REQUIRED on every lookup
    # The slug set, DECLARED, so the fence is code and not prose: this table has exactly ONE commodity and
    # a lookup naming anything else is refused at spec level with a teaching error before any SQL is
    # compiled (agent.CommodityOffCard). The same fact is said again in `notes` on purpose -- the notes
    # teach, this enforces -- and the paired test pins them equal. It matches the physical projection
    # domain byte-for-byte (projection.commodity.values = arabica_coffee).
    commodity_values: [arabica_coffee]
    country_col: null                   # SINGLE-GEOGRAPHY table: every row is Colombia. Deliberately not
    #                                     declared -- there is no geography to select, and passing
    #                                     country= on a card with no country_col is SILENTLY IGNORED
    #                                     (query._filters), so the fence has to be prose. See notes.
    period_type: date
    date_col: date                      # the DATA month, stamped FIRST-OF-MONTH; a physical DATE column
    knowledge_semantics: data_date
    knowledge_date_col: date
    publication_lag_days: 45            # first-of-month stamp + month completion (<=31d) + the monthly
    #                                     15th-of-M+1 pickup (~14d); never early, at most ~2 weeks late
    partition_cols: [commodity, year]   # projected; commodity via the commodity filter, year via bounds
    year_col: year                      # sargable year bounds prune the projection (never an equality)
    metrics:
      production_bags_60kg:
        label: "production"
        unit: "60-kg bags"
        desc: "green coffee produced in Colombia during that month, as a WHOLE COUNT of 60-kg bags (a 1.2 million reading means 1,200,000 bags, NOT thousands of bags)"
      exports_bags_60kg:
        label: "exports"
        unit: "60-kg bags"
        desc: "green coffee EXPORTED from Colombia during that month, whole count of 60-kg bags; a shipment flow, not a stock"
      exports_value_usd_m:
        label: "export value"
        unit: "USD million"
        desc: "FOB value of that month's coffee exports, in MILLIONS of US dollars (a 400 reading is USD 400 million)"
      ex_dock_price_usd_cents_per_lb:
        label: "ex-dock price"
        unit: "US cents/lb"
        desc: "FNC ex-dock reference price for Colombian green coffee in US cents per pound -- a PHYSICAL origin price carrying the Colombian differential, NOT the ICE arabica 'C' futures settle and NOT a World Bank monthly average"
      internal_price_cop_per_125kg:
        label: "internal price"
        unit: "COP per 125-kg carga"
        desc: "FNC internal (domestic grower) price in NOMINAL Colombian pesos per 125-kg carga -- never deflated, never FX-converted, and NOT comparable across eras (see notes)"
    notes: >
      COLOMBIA ONLY, AND THERE IS NO COUNTRY FILTER ON THIS CARD. Every row is national Colombia as
      reported by the FNC; there is no department, port, or grade breakdown here and no other origin. A
      `country` argument is not offered and passing one changes NOTHING -- the read still returns
      Colombia -- so a Brazilian, Vietnamese, Ethiopian, Central American or world coffee question must
      NOT be answered from this card. For Brazil use silver_conab_coffee (arabica / robusta production
      surveys by region); for the USDA global coffee balance sheet use silver_psd; for the Brazilian
      arabica CASH reference or the ICE arabica futures curve use the futures cards. Say "Colombia" out
      loud whenever you quote a figure from here.
      ALWAYS PASS commodity='arabica_coffee'. It is the ONLY value and it is REQUIRED (it is the
      partition key), so a lookup without it is rejected before anything is queried; a lookup naming any
      other slug is refused with a teaching error. There is no robusta row in this table.
      ONE LOOKUP = ONE METRIC. This card carries FIVE metrics, `metric` is REQUIRED and there is no
      all-metrics read: production plus exports plus the ex-dock price is THREE calls, not one, and a
      call that omits `metric` is rejected before anything is queried and still costs you a lookup from
      the budget.
      UNITS, AND THE BAG TRAP. production_bags_60kg and exports_bags_60kg are WHOLE COUNTS of 60-kg bags
      -- a monthly reading near 1.2 million means 1,200,000 bags. silver_conab_coffee's
      production_thousand_bags is THOUSAND 60-kg bags, so the two cards are 1000x apart in the same
      nominal unit: divide THIS card's figure by 1,000 before setting it beside a CONAB figure, and say
      which convention you are using. exports_value_usd_m is in MILLIONS of USD.
      THE TWO PRICES ARE DIFFERENT ANIMALS AND NEITHER IS AN EXCHANGE PRICE.
      ex_dock_price_usd_cents_per_lb is the FNC ex-dock (Colombian port) reference for physical green
      coffee in US cents per pound: it embeds the Colombian quality differential and it is NOT the ICE
      arabica 'C' settle, NOT the continuous front-month close, and NOT a World Bank monthly average (the
      Pink Sheet carries no coffee series at all). Label it "the FNC ex-dock price" every time.
      internal_price_cop_per_125kg is the FNC internal grower price in NOMINAL Colombian pesos per 125-kg
      carga -- a DIFFERENT physical unit from the 60-kg green bag the volume metrics use, so never convert
      between them by ratio. Its decade medians run 92 COP in the 1940s to 1.91 million COP in the 2020s;
      almost all of that is peso debasement, not coffee, and there is no COP series in silver_fred_fx to
      convert it with. NEVER compare COP levels across eras, never read a rise in the COP price as a
      rally, and never blend it into a USD price series. For any cross-era or cross-market price
      comparison use ex_dock_price_usd_cents_per_lb.
      THE FIVE SERIES DO NOT SHARE ONE SPAN, AND THE PRE-1956 ROWS ARE NOT EMPTY ROWS -- THEY ARE ROWS
      WITH EMPTY COLUMNS. ex_dock_price_usd_cents_per_lb runs 1913-01 onward (complete, no gap months);
      internal_price_cop_per_125kg from 1944-01; production_bags_60kg from 1956-01; exports_bags_60kg and
      exports_value_usd_m from 1958-01. A production or exports read before its start returns ROWS whose
      value is NULL, which is an absence of measurement and never a zero -- report it as "the FNC series
      does not start until <year>", not as no output. Within their spans all five series are gapless.
      CONTENT CEILING, MEASURED 2026-08-18, AND IT IS A QUARTER OLD BY DESIGN OF THE SOURCE: the newest
      month in the table is APRIL-2026 for production and both prices, and MARCH-2026 for the two export
      series -- the export columns are ONE MONTH SHORTER than the rest, so a "production and exports for
      the same month" ask stops a month earlier than a production-only ask. The FNC bulk workbook was
      re-fetched on 2026-08-15 and still ended there, so this is the SOURCE running three to four months
      behind, not a broken pipeline and not a gap to apologise for. Expect the newest citable month to
      trail today by roughly a quarter, cite the reading's OWN year and month, and never call a dated
      reading 'current'.
      GRAIN AND WINDOWING: monthly, ~12 rows per year, 1,360 rows over 1913-2026 -- a decade window is
      ~120 rows and the whole record fits well inside the row cap. Window with period_start/period_end as
      'YYYY-MM-DD' against the first-of-month date, or agg=latest for the newest knowable month on or
      before the as-of; agg=sum over twelve months is how an annual total is read.
      LEVELS, FLOWS AND WHICH YEAR: production and exports are monthly FLOWS (bags in that month), so a
      month-on-month delta is a change in the flow, never a stock build, and there are no stocks in this
      table at all. The period axis is the CALENDAR month, and this table carries NO marketing-year label
      -- Colombia's coffee year runs October to September, so any twelve-month total summed here is a
      CALENDAR-year total and must be labelled as one, never presented as a crop-year or coffee-year
      figure. These are FNC's reported actuals, not a forecast: for forward estimates use silver_psd (USDA
      world coffee balance) or silver_conab_coffee (Brazil surveys).

  # D-LD (LIGHT THE DARK, 2026-08-18) -- FNC COLOMBIA EXPORTS BY PORT x COFFEE TYPE, from the projected
  # tranche of the dark census. Nothing is ingested, re-chunked or re-derived: the table has been silver
  # CERTIFIED since 2026-07 (canonical re-published 2026-08-15, run
  # silver_fnc_colombia_exports_port_type-1786795686372) and had no numbers card, so every Colombian
  # export-logistics question routed away from a served table.
  #
  # PIT: data_date on the first-of-month `date` + a conservative 45-day publication lag. FNC restates the
  # monthly port/type sheet inside an annually-republished Excel workbook; the month is not public on the
  # first of the month it is stamped with, so +45d makes month M citable from roughly the 15th-18th of
  # M+1 -- never early, at most a couple of weeks late. (Same idiom as silver_pink_sheet's +40 on its
  # first-of-month stamp; the lag shifts the as-of RHS literal, so the guard stays sargable.)
  #
  # THE SECOND AXIS PROBLEM, AND WHY THE CARD IS GREEN-COFFEE-ONLY BY CODE. The physical grain is
  # commodity x year x month x PORT x COFFEE_TYPE. A TableSpec has exactly one free geo slot
  # (country_col), so one of those two axes cannot be filtered and cannot be surfaced by _extras -- and an
  # unsurfaced axis is the silver_wasde region incident exactly (the latest ROW_NUMBER collapsed ACROSS
  # regions and kept one arbitrary region's row). MEASURED here: with no port passed, agg=latest compiles
  # to `ORDER BY date DESC, year, knowledge_date, value LIMIT 1` and returns the SMALLEST row of the
  # newest month -- 155 bags at an airport freight terminal, wearing a national label. So `port` takes the
  # geo slot (17 slugs, the logistics content) and `coffee_type` is PINNED IN CODE to cafe_verde via
  # Metric.row_filters (the silver_wasde soybeans-unit mechanism, mirrored in apply_pit_filter). Green
  # coffee is 90.9-93.0 pct of export volume every year of the file (2025: 12,220,205 of 13,138,884 bags),
  # so the card serves the dominant, comparable, ICE-relevant flow and DECLINES the processed types
  # instead of interleaving them unlabelled.
  #
  # CONTENT CEILING, STATED RATHER THAN DISCOVERED (measured 2026-08-18): 2,147 rows total / 552 green,
  # 111 month-slices 2017-01 .. 2026-03, 3-9 green rows per month. The fnc_colombia DAG is scheduled and
  # ENABLED (cron 0 12 15 * ? *, autonomous promote) and fired on 2026-08-15 -- but the bronze fetch is
  # pinned to ONE workbook URL in configs/sources/fnc_excel_sources.yaml
  # (Exportaciones-2026-2.xlsx, the 2026-04 edition), so the monthly run re-derives the SAME months and
  # the table has sat at 2026-03 since April. That is a SOURCE-CONFIG gap, not a data gap, and the read
  # path already tells the truth about it: every row is stamped with its own month and the recency
  # machinery cites that stamp. Bumping the workbook URL + a FreshnessLagDays row are separate items by
  # design -- a card that waits for its source config is a card that stays dark.
  #
  # PHYSICAL LAYOUT: partition PROJECTION (commodity enum {arabica_coffee} x year 2017-2035 = ~19
  # candidates -- four orders of magnitude below the silver_esr grid behind the Jul-2026 LIST storm, but
  # pruned the same way): the commodity equality is emitted by the ordinary commodity filter and sargable
  # YEAR BOUNDS come from year_col, so no query enumerates the projected space. `year` is BOTH a projected
  # partition key AND an in-file int64 column (12 parquet columns vs 11 Glue columns); the partition value
  # wins on Athena and the pg loader's _probe_body_columns already drops such keys from the partitioning
  # schema and loads them from the body -- the two are byte-equal on every row (verified 2026-08-18).
  silver_fnc_colombia_exports_port_type:
    description: >
      FNC (Federacion Nacional de Cafeteros) COLOMBIA -- monthly GREEN COFFEE (cafe verde) exports BY
      PORT OF EMBARKATION, in 60-kg bags and in US dollars of FOB export value. One row per port per
      calendar month from January 2017. This is the physical shipment file: which Colombian port cleared
      how many bags of green arabica in a given month, and what those bags were declared at. Buenaventura
      (Pacific) and Cartagena / Santa Marta / Barranquilla (Caribbean) carry essentially all of it; the
      inland airports and border crossings are rounding errors. Colombia and arabica only, monthly, no
      destination and no grade breakdown.
    grain: "one row per port x month (green coffee; the physical table also carries three processed types)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "2,147 rows total / 552 green, 111
    # month-slices 2017-01 .. 2026-03" -- row_count is the SERVED (cafe_verde) half; the bronze fetch is
    # pinned to one workbook edition, so 2026-03 is a ceiling until that config moves
    row_count: 552
    first_obs: "2017-01"
    last_obs: "2026-03"
    cadence: monthly
    shape: wide
    commodity_col: commodity            # PARTITION key holding the contract slug; exactly one value exists
    commodity_values: [arabica_coffee]  # D-PQ CLASS-1 code fence: one slug, CLOSED. Off-list = pre-SQL refusal.
    country_col: port                   # repurposed as the GEO axis: the snake_case port-of-embarkation slug
    period_type: date
    date_col: date                      # FIRST-OF-MONTH stamp (a physical DATE): a MONTH LABEL, not a day
    knowledge_semantics: data_date
    knowledge_date_col: date
    publication_lag_days: 45            # FNC restates the month in the following month's workbook edition
    partition_cols: [commodity, year]   # projected; commodity via the commodity filter, year via bounds
    year_col: year                      # sargable year bounds prune the projection (never an equality)
    metrics:
      exports_bags_60kg:
        label: "exports"
        unit: "60-kg bags"
        desc: >
          GREEN coffee shipped from that port that month, counted in bags of 60 kg (an ACTUAL bag count,
          not thousands of bags -- the whole country ships roughly 12-13 MILLION bags a year and one
          strong Buenaventura month is roughly 500,000-800,000). Physical embarkations, not sales, not
          registrations and not a balance-sheet export line.
        row_filters:
          arabica_coffee:
            coffee_type: ["cafe_verde"]     # GREEN ONLY, in code (see notes for the three excluded types)
      exports_value_usd:
        label: "export value"
        unit: "USD"
        desc: >
          Declared PROVISIONAL export value of that port-month's green coffee, in US DOLLARS (the source
          column is "valor provisional de la exportacion (USD)" -- actual dollars, NOT millions, and
          provisional means it can be restated in a later workbook edition). Dividing it by
          exports_bags_60kg gives an FOB average value per bag for that one port-month; that is not a
          market price and must never be quoted as one.
        row_filters:
          arabica_coffee:
            coffee_type: ["cafe_verde"]     # GREEN ONLY, in code (see notes for the three excluded types)
    notes: >
      GREEN COFFEE ONLY, AND SAY SO. The physical table splits every port-month four ways -- cafe_verde
      (green beans), soluble (instant), tostados (roasted) and extractos (extracts) -- and this card
      serves cafe_verde and nothing else, enforced in the query, not in prose. Green is 91-93 percent of
      Colombian export VOLUME in every year of the file (2025: 12.22 of 13.14 million bags), so a figure
      from this card is NOT Colombia's total coffee exports and will not reconcile with an all-types
      national number: it is the green-bean flow, the part that trades against ICE arabica. A question
      specifically about instant / roasted / extract volumes is NOT answerable here -- say so rather than
      handing back a green number.
      ALWAYS PASS A PORT. country selects the geography and takes the lowercase snake_case port slug:
      buenaventura, cartagena, santa_marta, barranquilla, ipiales, medellin, manizales, bogota,
      barrancabermeja, aerp_el_dorado, aerp_jose_m_cordoba, aerp_alfonso_bonilla, aerp_matecana (the
      'aerp_' ones are airports). With NO port a latest read returns ONE arbitrary port's row -- measured:
      the SMALLEST row of the newest month, an airport shipment of a few hundred bags dressed as a
      national figure. Every row carries its own port in the country field: name the port you are
      quoting, always. For a national green total use agg=sum with NO port over an explicit month window,
      and call the result the green-coffee total, never Colombia's coffee exports.
      ONE LOOKUP = ONE METRIC AND ONE PORT. `metric` is REQUIRED and there is no all-metrics and no
      all-ports read, so a Pacific-versus-Caribbean comparison is one call per (metric, port) pair --
      exports_bags_60kg for buenaventura, then exports_bags_60kg for cartagena, and so on. A call that
      omits `metric` is rejected before anything is queried and costs you a lookup from the budget.
      COLOMBIA ONLY, ARABICA ONLY. commodity is a CLOSED set of exactly one value, arabica_coffee, and
      every row is Colombian. This is not Brazil (that is silver_conab_coffee), not the world coffee
      balance sheet (silver_psd), and not a coffee price (ICE arabica settles are silver_futures_eod /
      silver_futures_prices). Colombia's national all-types monthly export and production series lives on
      a different FNC table and is not served here, so do not add this card's ports up and present the
      total as the national series.
      MONTHLY, FIRST-OF-MONTH STAMPED. `date` is the first day of the DATA month and is a month LABEL,
      not a shipment day -- a row stamped 2026-03-01 is all of March. FNC restates the month in the
      following month's workbook, so a month becomes citable about six weeks after it starts. Cite the
      reading's OWN month and never call a dated reading 'current' (the discipline the IOD and NASS cards
      state for their cadences). AND EXPECT IT TO BE OLDER THAN THE LAG: the bronze fetch is pinned to
      one annually-republished workbook edition, so the newest month here typically trails today by
      several months -- as this card lands the file ends at March 2026. Report the age of the reading
      rather than implying it is the latest month that exists in the world.
      NOT A PRICE, NOT A FLOW RATE. exports_value_usd is a declared provisional FOB value, so
      value-per-bag is an average realisation for one port-month; it moves with quality mix, contract
      timing and differentials, and it is not the arabica market. exports_bags_60kg is a monthly total,
      not a running season-to-date cumulative (unlike silver_sagis_weekly_exports' prog_exports_mt) --
      month-on-month deltas are legitimate, but a month is a month, not a week.
      NO DESTINATION AND NO GRADE AXIS. Which country bought it, and what quality it was, are not in this
      table -- decline rather than inferring a destination from a port.
      SHAPE AND DENSITY. Window months with period_start/period_end as 'YYYY-MM-DD' on the first-of-month
      date, agg=latest for the newest published month on or before the as-of, or agg=sum for a period
      total. Roughly five green rows exist per month across all ports (three to nine), so one port's full
      history is about 111 rows and a whole-file series is about 552 -- both far inside the row cap.
      Coverage starts January 2017; only thirteen of the seventeen ports ever ship green coffee, and the
      small inland ones appear in scattered months only, so an empty result for a minor port in a given
      month means no green shipment cleared there, not a data outage.

  # D-LD TRANCHE 2 (2026-08-18) -- FNC COLOMBIA ANNUAL COFFEE AREA BY DEPARTMENT, from the dark-table
  # census. Dark since silver landed (F010 consumers: feature_layer, numbers_ref: null); this card is the
  # whole fix -- nothing is ingested, re-chunked or re-derived. Colombia is the world's largest ARABICA
  # exporter and this is the only table in the estate that says WHERE the trees are.
  #
  # THE P0 PRE-STEP, NOW LANDED (2026-08-18). This card names `ingest_date`, which the silver table did
  # not carry: the producer dropped it, even though the bronze series HAS the column (verified on
  # bronze/production/source=fnc_excel/series=area_departamento/part-000.parquet -- ingest_date
  # '2026-06-02', beside source_file 'Precios-area-y-produccion-de-cafe-2026-1.xlsx') and
  # transforms/bronze_to_silver/fnc_colombia.AREA_OUTPUT_COLUMNS simply did not select it. With NO date,
  # month or knowledge column the as-of guard could not be built at all: query._guard RAISED on every
  # lookup, and the year_month branch was unreachable too (year exists, month does not). The pre-step was
  # the WIRING_WAVE1 pre-step idiom (conab survey_release_date, sagis week_ending_date): add
  # "ingest_date" to AREA_OUTPUT_COLUMNS, re-run the bronze->silver task (the bronze stamp is preserved),
  # apply the gated Glue ADD COLUMNS, regenerate the DDL + the F010 contract. Producer re-run AND the
  # live ALTER both landed 2026-08-18 (7-column catalog).
  #
  # PIT = INGEST, the silver_production idiom. FNC republishes the whole workbook and the producer
  # overwrites the table (F010 write_mode: overwrite, vintage_retention: latest-only), so there are no
  # vintages to collapse and no publication lag to shift: ingest_date IS the date this edition became
  # known to us, and it advances only when a NEW workbook is fetched and extracted (the monthly silver
  # re-publish re-reads the same bronze, so the stamp is stable at 2026-06-02 today). publication_lag_days
  # is therefore ABSENT here and stays null in F010 -- byte-equal, exactly as silver_production does it.
  # THE COST, STATED RATHER THAN DISCOVERED: an as-of BEFORE the snapshot's ingest_date returns ZERO rows.
  # That is fail-CLOSED (it can never leak) but it means this card cannot answer "what did we know in
  # 2019" -- it is a current-structure table, not a backtest surface. The notes say so.
  #
  # PHYSICAL LAYOUT: partition PROJECTION (commodity enum {arabica_coffee} x year 2002-2035 = 34 candidate
  # prefixes -- the SMALLEST projected grid in the registry, five orders of magnitude below the silver_esr
  # grid behind the Jul-2026 LIST storm, and pruned exactly the same way). The commodity equality is
  # emitted by the ordinary commodity filter; `year` is the declared year_col, so it is pinned by SARGABLE
  # BOUNDS and never by an equality (query.py:357-358) -- an equality would return ZERO rows for any
  # multi-year window. The in-file `leviathan_slug` column carries the same value as the `commodity`
  # partition key and is deliberately NOT the commodity_col: filtering the PARTITION is what prunes.
  #
  # SCHEDULE, AUDITED NOT ASSUMED: dag_schedules.fnc_colombia = cron(0 12 15 * ? *), enabled, gated by
  # silver_rebuild_gate over all three fnc tables; canonical last written 2026-08-15. The content is
  # ANNUAL and ends at year 2025, so a monthly fire is a re-publish, not a new year. F010
  # freshness_sla.cadence is already `annual`; max_lag_days stays null (no real SLA -- OP-8/AV-11), and
  # NO dag_catalog FRESHNESS_LAG_OVERRIDES entry is added because this card declares no publication lag,
  # so there is no grace to sum and the fnc FAMILY ceiling (45) is untouched.
  silver_fnc_colombia_area_department:
    description: >
      FNC (Federacion Nacional de Cafeteros) Colombia -- ANNUAL area under coffee BY DEPARTMENT, in
      HECTARES, one row per department per calendar year from 2002. Colombia grows arabica only, so the
      single commodity slug is arabica_coffee, and every row is a Colombian department: this is the map of
      WHERE the trees are, not how much they produced. Twenty-three departments; Huila overtook Antioquia
      as the largest in 2012 and the national area has drifted down from a ~974k ha peak in 2013 to
      833,059 ha in 2025. There is NO national total row -- the country figure is the SUM across
      departments for one year. Point-in-time by the snapshot's ingest date: FNC republishes the whole
      workbook, so this table holds one non-revising edition, not a vintage history.
    grain: "one row per commodity x department x calendar year (annual, 2002+)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "one row per department per calendar year
    # from 2002"; "The newest year in the table is 2025 (measured 2026-08-18)" and a new year appears
    # roughly once a year
    first_obs: "2002"
    last_obs: "2025"
    cadence: annual
    shape: wide
    commodity_col: commodity            # PARTITION key = the contract slug (ONE value; see notes)
    # D-PQ CLASS-1: the closed slug set, DECLARED, so the fence is code and not prose. A lookup naming
    # robusta_coffee -- or any other crop -- is refused at spec level with a teaching error before any SQL
    # is compiled. This list and the `arabica_coffee is the only slug` sentence in `notes` are the same
    # fact said twice on purpose: the notes teach, this enforces.
    commodity_values: [arabica_coffee]
    country_col: department             # repurposed as the GEO axis: the snake_case FNC department
    period_col: year
    period_type: year
    period_sql_type: int                # year is the int partition key, e.g. 2025
    knowledge_date_col: ingest_date     # P0 pre-step column (bronze stamp, carried through by the producer)
    knowledge_semantics: ingest         # non-revising snapshot; the silver_production idiom
    partition_cols: [commodity, year]   # projected; commodity via the commodity filter, year via bounds
    year_col: year                      # sargable year bounds prune the projection (never an equality)
    metrics:
      area_ha: {label: "area", unit: "ha", desc: "area under coffee in that department that calendar year, in HECTARES (the source publishes thousand ha; silver multiplies by 1000). It is planted/standing area, never production and never a yield."}
    notes: >
      COLOMBIA ONLY, ARABICA ONLY. Every row is one Colombian department in one calendar year as published
      by the Federacion Nacional de Cafeteros. commodity = arabica_coffee and that is the ONLY slug this
      table has -- Colombia does not grow robusta at scale -- so a lookup naming robusta_coffee, a
      Brazilian, Vietnamese or Central American crop, or a bare 'coffee' is refused before anything is
      queried; decline rather than substituting a different origin.
      ALWAYS PASS A YEAR. period is the calendar year as an integer ('2025'). With no period the read
      returns that department's WHOLE 2002-2025 history, and on this card agg=latest does NOT collapse to
      one row: the table has no date axis, so 'latest' compiles to the same ascending series and the
      HEADLINE row of an ascending series is its OLDEST year. Pin period, or pin period_start/period_end
      ('YYYY-MM-DD', which bounds the year axis), on every lookup.
      ALWAYS PASS A DEPARTMENT, in lower-case snake_case with no accents. country selects the department
      and the twenty-three values are exactly: antioquia, arauca, bolivar, boyaca, caldas, caqueta,
      casanare, cauca, cesar, choco, cundinamarca, huila, la_guajira, magdalena, meta, n_santander (Norte
      de Santander), narino (Narino, written with an n-tilde in Spanish), putumayo, quindio, risaralda,
      santander, tolima, valle (Valle del Cauca). 'Huila', 'HUILA' or an accented spelling matches ZERO
      rows. With no department the read spans every department, and every row carries its own department
      in the country field: say which department you are quoting, always.
      THERE IS NO NATIONAL TOTAL ROW. Colombia's total area is the SUM across departments for ONE year:
      agg=sum WITH period pinned. agg=sum without a period silently adds all twenty-four years together,
      which is not a number that means anything. And the department ROSTER GROWS: 16 departments report in
      2002-2006, 20 in 2007-2012, 22 in 2013-2019 and 23 from 2020 on, so a national sum from an early
      year is not the same coverage as a recent one (the added departments are all small -- arauca,
      putumayo and choco are each under 5,000 ha -- but say so rather than presenting a clean trend).
      AREA IS NOT PRODUCTION AND NOT A YIELD. These are hectares standing, never 60-kg bags: a department
      with more area is not automatically producing more, and area cannot be converted to a crop here.
      Colombian production, exports and the internal price live on silver_fnc_colombia_monthly (bags of
      60 kg); Colombian exports by port and coffee type on silver_fnc_colombia_exports_port_type; the
      Brazilian crop on silver_conab_coffee; the global coffee balance sheet on silver_psd.
      AN ANNUAL SERIES IS NOT A STALE ONE. The newest year in the table is 2025 (measured 2026-08-18) and
      a new year appears only when FNC publishes a new edition of the workbook -- roughly once a year, not
      monthly. Cite the YEAR you are quoting and never call a dated reading 'current'.
      POINT-IN-TIME: this is one non-revising snapshot stamped by the date its edition entered our system,
      not a vintage history. An as-of EARLIER than that stamp correctly returns nothing at all, so this
      card answers "where is the area today" and cannot answer "what was believed in 2019".
      Zero is a real value here, not a null: putumayo reports 0.0 ha in 2016.

  # D-LD (LIGHT THE DARK, 2026-08-18) -- USDA NASS CITRUS FORECAST, the numbers home of the
  # frozen_orange_juice contract. This is the sharpest remaining instance of the dark class after
  # D-CW-2a: the estate registers frozen_orange_juice as a contract, carries a full causal DAG for it
  # (configs/graphrag/causal/frozen_orange_juice.yaml) and TWO citrus driver slices
  # (orange_greening_disease, citrus_canker_psyllid) -- and has ZERO observed quantities behind any of
  # it. silver_psd carried no orange-juice slug at all (PSD_UNSERVED_SLUGS, DISTINCT probe 2026-07-11,
  # cascade.py:347) and CFTC covers no FCOJ positioning (cftc_cot.yaml not_covered), so four FCOJ
  # cascade legs are explicitly WAIVED as honest data absence (cascade_census._WAIVERS: ending_stocks,
  # consumption_demand, US_section301_tariffs, tenderable_collapse). configs/ml/psd_metric_targets.yaml
  # :338 already names the remedy in words -- "FCOJ needs NASS citrus or WASDE citrus targets". This
  # card is that remedy on the READ path. Nothing is ingested, re-chunked or re-derived.
  #
  # SUPERSEDED IN PART, D-EC XC-7 (2026-08-20) -- the PSD half of the paragraph above is HISTORY now.
  # The 13 -> 47 commodity widening bound 585100 (Orange Juice) and 571120 (Oranges, Fresh) and its
  # cloud re-run landed at 10:01 with 746 FCOJ rows / 25 countries and 1,646 fresh_citrus rows / 48, so
  # frozen_orange_juice LEFT PSD_UNSERVED_SLUGS and the psd card now serves both slugs. This card is
  # unaffected in substance -- a US in-season forecast in thousand boxes is not a global marketing-year
  # balance sheet -- but it is no longer the ONLY citrus read, and its description says so. The CFTC
  # half stands unchanged. The four cascade waivers are NOT touched here: they name a leg-level
  # absence whose replacement needs a cascade_map entry, and un-waiving them without one would red the
  # census on a leg that is dark for the OTHER documented reason (the paragraph below).
  #
  # WHAT IT DOES NOT DO, SAID FIRST SO IT IS NEVER MIS-READ AS DONE. It does NOT un-waive those four
  # cascade legs. They are waived against silver_psd, and the FCOJ DAG's own
  # `Florida_orange_production` driver carries `silver_ref: nass_citrus_revisions` /
  # `silver_status: available` while cascade_map.yaml has NO ref of that name -- so the ENGINE leg
  # stays dark until a cascade_map entry lands (with the F010 cascade_ref back-pointer
  # reconcile_cascade requires). That is a separate, documented change, deliberately not taken here --
  # the conab_production_revision precedent three cards up.
  #
  # PIT: VINTAGE on release_date, publication_lag_days 0 -- and both were ALREADY on the F010 contract
  # (knowledge_date_col release_date / knowledge_semantics vintage / publication_lag_days 0), so this
  # card ADOPTS a derived trio rather than minting one, unlike D-CW-2a and D-PQ tranche 1a. release_date
  # IS the publication event (the printed NASS release date), so there is nothing to lag.
  #
  # NO vintage_tiebreak, AND THAT IS MEASURED RATHER THAN OMITTED. The engine-order tie hazard (the F2
  # Branch-A break) needs >1 row per grain at one knowledge_date. Here (season, release_date, crop,
  # state) is the F010 natural key, the tracked producer RAISES on a duplicate of it
  # (transforms/bronze_to_silver/nass_citrus.py:95-96), and the physical parquet carries ZERO duplicates
  # on that key AND zero on (release_date, crop, state) across all 2,450 rows. The ROW_NUMBER over
  # (crop, state, season) therefore cannot tie. `report_month` would be the obvious tiebreak column and
  # is worthless as one: it equals month(release_date) in 2450/2450 rows.
  #
  # PHYSICAL LAYOUT: FLAT (partition_mode flat, projection forbidden, partition_keys [], one 17.7 KiB
  # object). NO partition_cols and NO year_col -- there is no projected grid to prune, so there is no
  # LIST-storm class here, and declaring partition_cols would make reconcile_numbers demand real Glue
  # partition keys and fail the build (the silver_mpoc_stock_comparison rule). The as-of guard's
  # CAST(release_date AS varchar) is a no-op on a string column and costs nothing on a single-object
  # flat table; it is NOT the WASDE non-sargable-partition class, which needs a projected key.
  #
  # TWO VALUE COLUMNS SERVED, TWO PHYSICAL COLUMNS DELIBERATELY NOT. Both F010 value_columns ship.
  # revision_1000_boxes is NOT the sagis_cec/conab D4 exclusion class: those are producer-computed
  # cross-vintage deltas, whereas this is current_forecast MINUS prior_forecast where BOTH numbers are
  # printed in the SAME NASS release (bronze col_type current_forecast / prior_forecast, transform
  # :81-89) -- fully knowable at that release_date, PIT-legal, and not reconstructible by differencing
  # our own stored vintages (our release history is gappy before 2014-15; probed 1987/2019 agreement,
  # every disagreement a missing intermediate release). EXCLUDED: `hlb_trend_factor` -- the tracked
  # transform's own docstring records that the ORIGINAL factor "used a Florida-orange baseline this
  # rebuild cannot reconstruct" and calls it "a diagnostic, not a value-census-gated column", so the
  # physical values in silver have a definition we cannot state; serving a number whose formula is
  # unknown is exactly what a card must not do. EXCLUDED: `report_month`, redundant with release_date.
  silver_nass_citrus:
    description: >
      USDA NASS Citrus Forecast -- the monthly, in-season US production forecast for oranges,
      grapefruit and tangerines by state, in THOUSAND BOXES. One row per crop x state x season per
      release. NASS forecasts the crop from October through July and revises it every month, so each
      release carries both the current forecast and the change from the previous month's forecast;
      as-of a date = the latest release published on or before it. Florida, California, Texas and
      Arizona plus a 'united_states' national row. This is the estate's only US in-season citrus
      FORECAST -- and it is US ONLY, with no Brazilian crop in it at all. Since 2026-08-20 the GLOBAL
      marketing-year balance sheets behind the same contract live on silver_psd (frozen_orange_juice =
      the juice, fresh_citrus = the orange fruit): a different grain, a different question, and the two
      reads are never mixed into one figure.
    grain: "one row per crop x state x season, per monthly release_date"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "all 2,450 rows"; "the newest release in
    # this table is 2025-07-11" and NASS has published no 2025-26 season -- a PAUSED source, so the end is a
    # ceiling. No first_obs: the oldest seasons are mis-parsed fragments the notes forbid quoting
    row_count: 2450
    last_obs: "2025-07-11"
    cadence: monthly
    shape: wide
    commodity_col: crop                  # NASS crop label, NOT a contract slug (see notes)
    # D-PQ CLASS-1 code fence: the six crop labels the table physically carries, DECLARED, so an
    # off-list ask (orange_juice, frozen_orange_juice, lemons, limes, a Brazilian crop) is REFUSED at
    # spec level with a teaching error before any SQL is compiled. The same fact is said again in
    # `notes` on purpose -- the notes teach, this enforces.
    commodity_values: [all_orange, valencia_orange, non_valencia_orange, grapefruit,
                       tangerine_mandarin, tangelo]
    country_col: state                   # repurposed GEO axis: lower_snake FULL names, 'united_states' = national
    period_col: season
    period_type: marketing_year
    period_sql_type: string              # season is a string like '2024-25' -- HYPHEN, not the WASDE slash
    knowledge_date_col: release_date
    knowledge_semantics: vintage
    publication_lag_days: 0              # release_date IS the publication event
    grain_cols: [crop, state, season]    # latest-release collapse per (crop, state, season)
    metrics:
      forecast_1000_boxes: {label: "production forecast", unit: "1000 boxes", desc: "the season's production forecast for that crop and state as printed in that release, in THOUSAND boxes (a box is a pack unit whose net weight differs by state and by crop -- never converted to tonnes here)"}
      revision_1000_boxes: {label: "forecast revision", unit: "1000 boxes", desc: "the change from the PREVIOUS month's forecast, as printed in that same release (this month's forecast minus last month's); negative = the crop was cut. NULL on a season's FIRST release (October has no prior month) and on some Novembers"}
    notes: >
      ONE LOOKUP = ONE METRIC, ONE CROP AND ONE STATE. This card carries two metrics and TWO free
      axes with no default on either, which is the shape that invites a metric-less or state-less
      sweep: `metric` is REQUIRED and there is no all-metrics and no all-states read, so comparing
      Florida against California is one call per (metric, crop, state) triple -- forecast_1000_boxes
      for all_orange in florida, then the same for california. A call that omits `metric` is rejected
      before anything is queried and costs you a lookup from the budget.
      THIS TABLE IS THE UNITED STATES AND NOTHING ELSE. Every row is a US state or the national
      roll-up, reported by USDA NASS. There is no Brazilian, Sao Paulo, CitrusBR, Fundecitrus,
      Mexican, Spanish or South African citrus number in this table -- and Brazil, not Florida, is the
      majority of world orange-juice supply, so a Florida box count is NOT a read on the world OJ
      balance and is not a proxy for one. Say "US" (or the state) out loud whenever you quote a figure
      from this card, and on a question about the global juice market label it explicitly as the US
      side or do not use it.
      ALWAYS PASS A STATE. country takes lower_snake FULL names and only these five exist: florida,
      california, texas, arizona and 'united_states' -- pass country='united_states' for the national
      figure. With no state (and no season) the read returns EVERY state's row for EVERY season in
      one deduped set, sorted with the OLDEST season first -- and the oldest season here is the
      mis-parsed 2003-04 fragment this card's own history note forbids quoting, so the headline row
      of an unpinned read is precisely the row you must never cite. Pin the state AND the season (or
      a season window from 2009-10 on) before quoting anything. NEVER RECONSTRUCT
      THE NATIONAL FIGURE BY ADDING STATES: the 'united_states' row is NASS's own published total and
      it equals the sum of the state rows in only about three quarters of releases (grapefruit's US
      total excludes arizona; some releases print a state the total does not carry). Read the
      'united_states' row.
      commodity = the NASS CROP LABEL and only these six exist: all_orange, valencia_orange,
      non_valencia_orange, grapefruit, tangerine_mandarin and tangelo. These are NOT contract slugs --
      there is no orange_juice, frozen_orange_juice, lemon or lime row here; anything else is not in
      this table, so decline rather than substituting a different crop. THE ORANGE CROPS OVERLAP:
      all_orange IS valencia_orange plus non_valencia_orange exactly, in every release, so quoting the
      three together double-counts the crop -- pick all_orange for the headline or the two varieties
      for the split, never both. tangelo is FLORIDA ONLY and NASS stopped reporting it after the
      2015-16 season. tangerine_mandarin has no texas row at all, and arizona reports grapefruit (plus
      a handful of tangerine seasons) and nothing else.
      period = the season string with a HYPHEN, e.g. '2024-25' -- NOT the '2024/25' slash form
      silver_wasde uses; the slash matches zero rows. A season runs October to July.
      VALUES ARE THOUSAND BOXES, WHICH IS NOT A WEIGHT. A box is a packing unit whose net weight
      differs by state and by crop (NASS prints the per-state box weights in the report's own
      footnote); this table carries NO weight column and NO conversion, so a boxes figure must never
      be converted to tonnes here, and boxes must never be summed across crops or across states into a
      tonnage. Quote boxes as boxes.
      AGG=LATEST HERE MEANS AS-KNOWN, NOT ONE ROW. This card has no separate data-date axis, so
      agg=latest collapses each (crop, state, season) to its newest release on or before the as-of and
      returns ONE ROW PER SEASON -- pass period='2024-25' to get a single season's current forecast.
      agg=series with a period is how the within-season revision path is read (one row per season at
      its latest vintage; to see a season's month-by-month path you must query at successive as-ofs).
      SEASONALITY IS NOT STALENESS, AND THEN THE SOURCE IS PAUSED ON TOP OF IT. NASS releases monthly
      from October to July and publishes NOTHING in August or September, so there is a two-month gap
      every year and a September as-of correctly returns the July close. Separately and more
      importantly: THE SOURCE IS PAUSED -- the newest release in this table is 2025-07-11, the July
      close of the 2024-25 season, and NASS has published no 2025-26 season (probed 2026-07-23). At
      any as-of after mid-2025 the freshest citable reading is therefore more than a season old, and
      that is the SOURCE's state, not a pipeline stall. Cite the reading's OWN release date and season
      and never call a dated reading 'current'.
      COVERAGE IS CONTINUOUS ONLY FROM 2014-15. Ten releases per season hold from 2014-15 onward (and
      for 2009-10); 2011-12, 2012-13 and 2013-14 carry two to four releases each; and 2003-04, 2004-05
      and 2008-09 are single-release fragments whose two one-row entries carry mis-parsed values (a
      texas all_orange of 3 and a california valencia of 20). Do not quote anything before 2009-10,
      and treat any pre-2014 season as a partial revision history rather than a monthly path.
      Forecasts are FORECASTS: even the July release is the season's last in-season forecast, not an
      audited final utilization figure, and a monthly revision is a forecast change, not production
      that happened.
      CROSS-TABLE: the GLOBAL marketing-year balance sheets behind this contract now live on
      silver_psd -- frozen_orange_juice is the JUICE sheet and fresh_citrus is the orange FRUIT
      sheet, both served since 2026-08-20 -- and THIS card remains the US in-season production
      FORECAST in thousand boxes. Different grain, different question, different unit: read whichever
      one the question actually asks for, cite it by name, and NEVER MIX THE TWO INTO ONE FIGURE -- a
      PSD tonnage and a NASS box count are not addable, not a ratio of each other, and not each
      other's cross-check. There is still NO CFTC positioning for frozen_orange_juice, so on a
      positioning question decline rather than reaching for another commodity's book. For
      weekly US crop CONDITIONS and planting/harvest pace use silver_nass_crop_progress, which is a
      DIFFERENT NASS table with a DIFFERENT vocabulary: its state axis is the 2-letter USPS code in
      CAPITALS ('FL', 'US') and its commodity axis is contract slugs, while this card's state axis is
      lower_snake full names ('florida', 'united_states') and its commodity axis is crop labels.
      Passing one table's vocabulary to the other returns nothing at all.

  # D-LD (2026-08-18) -- MPOC MALAYSIAN MONTHLY PALM-OIL EXPORT TONNAGE. The third MPOC table and the
  # second to be carded. It was RANKED AND REFUSED once already: tests/unit/test_dpq_dark_tables.py
  # `_SKIPPED` carries it as `"stale"  # guardable, but content stops 2023-12 behind a 21d-old object`.
  # THAT VERDICT IS DISCHARGED HERE BY RE-MEASUREMENT, not waived. The 2023 ceiling is real and it is
  # PERMANENT, but it is not staleness: configs/sources/mpoc_archive.yaml enumerates the MPOC
  # trade_statistics series as FIFTEEN annual pages, 2009 through 2023, and there is no 2024 or 2025
  # page to fetch. This is a CLOSED HISTORICAL ARCHIVE that the pipeline re-publishes faithfully (the
  # canonical object was rewritten 2026-08-15, CERTIFIED, and still holds exactly the same 180 rows).
  # A closed archive is a legitimate thing to serve; what it may never do is answer a "right now"
  # question, and the notes carry that fence in the imperative.
  #
  # WHAT THE TABLE ACTUALLY IS, measured 2026-08-18 rather than assumed: 180 rows = 15 years x 12
  # months, 2009-01..2023-12, zero nulls, zero duplicates on (year, month), `source` = 'mpoc' on every
  # row. NO commodity column, NO country column, NO destination or grade axis -- one national monthly
  # number. exports_mt runs 900,558 (2021-02) to 1,843,602 (2011-10) MT/month, ~15.1-18.5 MMT/year,
  # which is Malaysia's actual palm-oil export scale.
  #
  # WHY THIS CARD EXISTS AT ALL, given silver_mpob already serves Malaysian palm monthly: DEPTH OF
  # HISTORY, and only that. Cross-checked row by row against silver_mpob on their 85 overlapping
  # months, exports_mt vs exports_palm_oil_mt agree to a MEDIAN of 0.000% (39 of 85 byte-exact, mean
  # -0.056%, worst case -2.18%) -- MPOC republishes MPOB's numbers. But silver_mpob's canonical parquet
  # begins 2016-12 and runs to 2026-04, while this table begins 2009-01. The 95 months from 2009-01 to
  # 2016-11 are Malaysian monthly palm export history that exists NOWHERE ELSE in the numbers registry.
  # That is the whole unlock, and the notes say so plainly so the model does not treat two views of one
  # series as two independent confirmations.
  #
  # imports_mt IS DELIBERATELY NOT A METRIC. Measured: on 2020, 2021 and 2022 (36 of 180 rows) the
  # column holds the PRIOR YEAR'S EXPORTS, not imports. imports[2020] is byte-exact equal to
  # exports[2019] on 12 of 12 months; imports[2022] is byte-exact equal to exports[2021] on 12 of 12;
  # imports[2021] matches exports[2020] exactly on 5 of 12 and within 0.002-1.12% on the rest (an
  # unrevised vintage of the same series). The magnitudes clinch it: imports/exports runs 0.012-0.20
  # (mean 0.053) across the twelve clean years and 0.81-1.39 across those three, and silver_mpob's
  # imports_palm_oil_mt for the SAME 36 months is 32,311-120,000 MT against MPOC's 0.9-1.8 MILLION
  # (mean gap 1,337,731 MT) while matching EXACTLY on 44 of the 49 clean overlap months. Mechanism, from
  # the producer: the source page carries a two-row header ['', 'Exports', 'Imports'] over a year
  # sub-header, and transforms/bronze_to_silver/mpoc_trade_stats_monthly.py::_group_year_column FALLS
  # BACK to the group's first column when the page year is not found in that group's year cells --
  # landing on a prior-year EXPORTS column. The producer's own drift check passes because both header
  # tokens are present. There is NO per-year metric fence in the registry (row_filters key on
  # commodity, and this table has no commodity axis at all), so a served imports_mt would be wrong by
  # ~20x on 20% of the series with no way to withhold it, and wrong invisibly: the values are non-null
  # and are a plausible magnitude for a big tonnage. Excluding it is the sagis_cec/conab D4 idiom
  # applied to a defect instead of a semantics mismatch. The producer fix is its own item.
  #
  # PIT: year_month, minted here (the F010 contract carried nulls for all three knowledge fields before
  # this card, exactly like silver_nass_crop_progress at D-CW-2a and silver_mpoc_stock_comparison at
  # D-PQ tranche 1a). The as-of guard is the ONI/IOD one -- (year*100 + month) <= asof year-month.
  #
  # THE LEAK THAT GUARD LEAVES OPEN IS BIGGER HERE THAN ON THE STOCK-COMPARISON CARD, and it is stated
  # rather than inherited. That card's leak is "the data month plus the print lag, up to ~45 days",
  # because MPOC prints a month around the middle of the next one. THIS series is published as ONE
  # ANNUAL PAGE PER CALENDAR YEAR (fifteen stat_urls in configs/sources/mpoc_archive.yaml, one per
  # year), so a month is not knowable until its YEAR'S page exists -- up to ~12 months after the month
  # itself, not ~45 days. A replay as-of 2015-06 is handed the 2015-06 row by the guard (verified: the
  # python oracle keeps it), and no such row could have been read in June 2015. LIVE SERVING IS
  # UNAFFECTED because the archive closed at 2023-12 and every row is years old; every HISTORICAL
  # REPLAY / BACKTEST as-of inside a data year LEAKS. That is a bound on how this card may be used, not
  # a claim that the gap is closed.
  #
  # publication_lag_days is deliberately NOT set, and the reason is STRUCTURAL rather than a choice:
  # the year_month branch of query._guard returns BEFORE _pub_lagged_asof is applied, so a lag declared
  # here could not shift anything -- it would be inert decoration that the F010 reconcile would then
  # have to carry as a real number. The cadence sentence in `notes` is a WARNING to the reader, never
  # a fix.
  #
  # SARGABLE PARTITION DISCIPLINE: none needed, and that is a FACT about this table rather than an
  # omission. F010 says partition_mode flat / projection forbidden / partition_keys [], and the DDL is
  # a flat five-column external table over one object. There is no projected grid to prune and no
  # LIST-storm class here; the bare `year <= <asof year>` bound the year_month guard already emits is
  # the whole story. Do not add partition_cols -- reconcile_numbers would then require them to be real
  # Glue partition keys and fail the build.
  #
  # commodity_values ON A CARD WITH NO commodity_col: this is a SPEC-LEVEL FENCE ONLY and compiles to
  # NOTHING. query._filters emits a commodity equality only `if spec.commodity and ts.commodity_col`,
  # and commodity_col is unset here, so no SQL changes; what the list does is let
  # agent._check_commodity_class REFUSE an off-subject lookup (soybean oil, Indonesian palm, corn)
  # before any SQL is compiled, instead of silently handing back Malaysia's palm number under whatever
  # label the caller had in mind. That is the measured D-PQ CLASS-1 leak class, and this is the single
  # most substitutable card in the registry: a bare tonnage with no commodity axis on a platform
  # carrying 31 commodities. The two accepted values are NOT invented -- they are the exact strings the
  # sibling cards' physical columns carry (silver_mpob.commodity = 'malaysian_crude_palm_oil_cme';
  # silver_mpoc_stock_comparison.oil_type = 'palm_oil'), so a caller arriving from either sibling is
  # accepted. IF A FUTURE PRODUCER ADDS A COMMODITY COLUMN and someone sets commodity_col, this list
  # becomes SQL and MUST be re-derived from the physical DISTINCT set first -- that is the WASDE
  # Title-Case class waiting to happen, and it is the only way this declaration can ever bite.
  silver_mpoc_trade_stats_monthly:
    description: >
      MPOC (Malaysian Palm Oil Council) monthly palm-oil EXPORT tonnage for MALAYSIA -- the national
      monthly export flow, one row per calendar month. This is a CLOSED HISTORICAL ARCHIVE: it begins
      2009-01, ENDS 2023-12, and will never extend, because MPOC published the series as one annual page
      per year and stopped after 2023. Its value is DEPTH, not recency -- it reaches back seven years
      further than silver_mpob, which is the authority for 2016-12 onward and runs to the present. There
      is no commodity, destination, grade or product axis here: one number per month, in metric tonnes.
    grain: "one row per year x month (Malaysia national total; no commodity, destination or grade axis)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "180 rows = 15 years x 12 months,
    # 2009-01..2023-12" -- a CLOSED archive that "will never extend"
    row_count: 180
    first_obs: "2009-01"
    last_obs: "2023-12"
    cadence: monthly
    shape: wide
    period_type: date                   # cosmetic here (no period_col) -- the ONI/IOD/stock_comparison idiom
    year_col: year                      # year_month semantics: (year*100+month) is the guard/window axis
    month_col: month
    knowledge_semantics: year_month     # as-of guard = (year*100+month) <= asof year-month
    # SPEC-LEVEL FENCE ONLY -- there is no commodity_col, so this compiles to no SQL (see the comment
    # block above). It refuses an off-subject commodity BEFORE any query, with the teaching message.
    # Both strings are measured physical values of the sibling tables, never invented.
    commodity_values: [malaysian_crude_palm_oil_cme, palm_oil]
    metrics:
      exports_mt: {label: "exports", unit: "MT", desc: "Malaysia's total palm-oil exports in that calendar month, metric tonnes (a MONTHLY FLOW, not cumulative and not a stock)"}
    notes: >
      MALAYSIA ONLY, PALM OIL ONLY, EXPORTS ONLY, ONE NUMBER PER MONTH. There is no commodity column,
      no destination column and no grade column in this table: it cannot tell you who bought it, which
      product it was, or what any other origin shipped. Indonesia is NOT here. For destination splits
      use silver_esr (US) or the MPOC country table (which has no card); for the annual world palm
      balance sheet use silver_psd.
      THE SERIES ENDS 2023-12 AND WILL NEVER EXTEND. MPOC published this as one annual page per
      calendar year and the archive stops at 2023, so agg=latest at ANY modern as-of returns
      December 2023 -- which is a real, correctly-guarded reading and is ALSO years out of date. Never
      present a figure from this card as current, recent or "the latest" Malaysian export number, and
      never call a dated reading 'current': say the reading's own year and month out loud every time.
      A question about where Malaysian palm exports are running NOW is not answerable here at all --
      it is answerable from silver_mpob, and the honest move is to go there rather than serve a 2023
      number without its date.
      USE THIS CARD FOR THE PRE-2017 HISTORY AND silver_mpob FOR EVERYTHING SINCE. silver_mpob's
      exports_palm_oil_mt begins 2016-12 and runs to the present; this table begins 2009-01. The 95
      months from 2009-01 to 2016-11 exist nowhere else in this registry, and that is the reason to
      come here. Where the two overlap they are THE SAME QUANTITY republished, agreeing to a median of
      0.000% (worst case ~2%), so they are one series seen twice -- never cite both as independent
      confirmation of each other, never add them, and never delta one against the other and call the
      difference a revision.
      IMPORTS ARE NOT SERVED BY THIS CARD, and that is a data verdict rather than an omission. The
      physical imports_mt column is CORRUPT on 2020, 2021 and 2022 -- it carries the PRIOR YEAR'S
      EXPORTS there, roughly twenty times the true import figure -- so no import, re-export or net-trade
      question may be answered from this table. Malaysia's palm imports (it imports Indonesian oil to
      refine and re-export, so the question is a real one) live on silver_mpob as imports_palm_oil_mt
      from 2016-12, and on silver_psd annually.
      exports_mt is a MONTHLY FLOW in metric TONNES -- the tonnage shipped in that month alone. It is
      not cumulative, so unlike the SAGIS weekly card a month-on-month difference is a genuine change
      in the flow; and it is not a stock, so it is never a stocks-to-use input. For Malaysian closing
      stocks and production use silver_mpob.
      Window months with period_start/period_end as 'YYYY-MM', or agg=latest for the newest month on or
      before the as-of. The table is small and dense -- 12 rows per year, 180 rows in total -- so the
      entire fifteen-year series fits far inside one lookup's row cap and a multi-year comparison is
      one windowed call, not one call per year.
      THE AS-OF GUARD COMPARES MONTH LABELS, NOT PUBLICATION EVENTS: (year*100 + month) <= asof
      year-month admits the CURRENT, incomplete month. Worse here than on a monthly-release table,
      because MPOC printed a whole YEAR at a time -- a month was not knowable until its year's page
      existed, up to about twelve months later. In live use this is moot: the archive closed in 2023 and
      every row is years old. In a HISTORICAL REPLAY it is not moot -- an as-of inside a data year will
      be handed months of that same year that nobody could have read yet, so treat any month in the
      as-of's own calendar year as NOT YET PUBLISHED regardless of what the guard returns, and do not
      replay this card as though it were vintage.

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # D-LD TRANCHE 3 (2026-08-19) -- THE UNICA BRAZIL SUGAR/ETHANOL FAMILY.
  #
  # Five silver tables, THREE cards. The unica family gate passes (5 tables, zero reds, 2026-08-18)
  # and the canonical republish is gate-clean, so what follows is a SERVING decision per table and
  # not a data-availability one.
  #
  # THE OWNER'S RATIFICATION, and it is the reason this tranche exists at all: "you can have them
  # but PIT aware with its ceiling, so for example if someone asked about something that happened in
  # 2021, it would fetch that data but if someone asked a run down over july 2026, it can't use that
  # data." The three cards below implement exactly that and nothing more. History serves normally
  # through the ordinary as-of guard; a post-ceiling question returns NO ROWS, and it does so
  # SELF-ENFORCINGLY -- `fortnight_date <= asof - lag` cannot return a row the table does not hold,
  # so no extra code fence exists or is needed. What the cards add is the WHY: each notes block
  # states where its own series stops and what stopped it, so the answer agent explains the gap
  # instead of narrating a February-2026 reading as the current crush.
  #
  # THE CEILING, MEASURED PER TABLE (pyarrow over s3://leviathan-dev-shahem-001, 2026-08-19; the
  # ceilings are NOT common to the family and were not assumed from one another):
  #   silver_unica_biweekly_season_history  fortnight_date 2012-04-16 .. 2026-02-01 (season 2025_2026
  #                                         position 01/02, 29 rows that season)
  #   silver_unica_corn_ethanol             fortnight_date 2021-04-16 .. 2026-02-01 (same last
  #                                         bulletin, DIFFERENT table -- measured, not inherited)
  #   silver_unica_monthly_ethanol_sales    month_date 2012-04-01 .. 2025-11-01, ONE ceiling again
  #                                         since the 2026-08-19 producer repair recovered the
  #                                         2025/26 season's values (the dual-ceiling era is over;
  #                                         8 rows remain honestly all-null -- 2022/23 months 5-11
  #                                         + Sep-2012, a bronze-side content truth, task #72).
  #
  # WHY 2026/27 IS EMPTY, carried on all three cards because it is the question a July-2026 ask
  # actually raises: the 2026/27 season has ZERO parseable bulletins. The origin PRUNES superseded
  # bulletins, so the running season is not archived as it goes; the manifest's only Apr-2026 row
  # (idm 32820684) is a MISLABELLED off-topic season-close document, the single Wayback capture is
  # doc_type=unknown (an unparseable variant layout), and May-Aug 2026 have no captures at all. A
  # force-overwrite bronze rebuild returned written=0, which makes the emptiness CONTENT truth
  # rather than a pipeline stall. There is nothing to serve for 2026/27 and there may never be.
  #
  # ── THE FOURTH TABLE IS REFUSED, AND THE REFUSAL IS THE MEASUREMENT ────────────────────────────
  # silver_unica_biweekly_release_series was in this tranche's scope and IS NOT CARDED. It has no
  # date column of any kind: its only temporal field is `position_date`, a Glue STRING carrying
  # free-text bulletin stamps. Anchoring the guard on it does not merely fail to help -- it produces
  # a predicate that is worse than absent, because `CAST(position_date AS varchar) <= '<asof>'` is a
  # LEXICOGRAPHIC compare over 'DD/MM/YYYY' text. MEASURED against the canonical parquet: 119 of 122
  # rows pass that guard at EVERY as-of tried, including asof 2015-01-01, at which the February-2026
  # bulletin rows ('01/02/2026' -> '0' < '2') are admitted while March-2025 rows ('31/03/2025' ->
  # '3' > '2') are dropped. That is a live PIT LEAK pointed the wrong way, and it is precisely the
  # thing the owner's ratification is a ratification OF.
  # The date text cannot be repaired at card level either: the column mixes DD/MM/YYYY with
  # MM/DD/YYYY ('10/16/2025', 3 rows) and carries DAY/MONTH-SWAPPED DUPLICATES of bulletins that are
  # already present under their correct stamp -- '05/01/2024' holds byte-identical digits to
  # '01/05/2024' (50.612 vs 50612.000, 18.978 vs 18978.000, 31.634 vs 31634.000), i.e. one bulletin
  # ingested twice under two parses and two scales. Its `cane_crushed_current_t` is additionally
  # NULL in 109 of 122 rows and the remaining metric columns hold each other's quantities on ~90% of
  # rows (at position 01/10/2021 centro_sul, `sugar_produced_current_t` = 467,439 is the CANE figure
  # the season-history table stores as 467,439,086 t). The card is refused pending a producer fix
  # that emits a real DATE anchor; nothing here is a judgement about the underlying bulletin.
  # PRODUCER FIX LANDED 2026-08-19 (commit 717bba03): position_date is now a resolved ISO string
  # (text order == chronological order, the lexicographic leak CLOSED), swapped-stamp duplicates
  # collapsed (122 -> 105 rows), column roles unshifted, identities exact 105/105. The table is now
  # CARDABLE; the refusal pin stands until a card wave lands it deliberately.
  # silver_unica_annual_state stays DARK this wave by the same wave's scope decision.
  #
  # ── A DATA VERDICT THAT RIDES ALL THREE CARDS ── REPAIRED 2026-08-19 (commit 717bba03) ─────────
  # The defects below were fixed in the silver transform and the chain re-fired gate-green the same
  # day (identities exact on every published row; stamps now ISO; the notes carry the repair record
  # instead of decline lists). This block is kept as the historical WHY of the provenance_col
  # declarations, which stay valuable regardless.
  # A minority of rows in each table came out of the parser WRONG, in two measured mechanisms, and
  # both are BULLETIN-SCOPED: every affected row carries the same `source_position_date`. That is
  # why all three cards declare `provenance_col: source_position_date` -- every returned row carries
  # its originating bulletin stamp as `revision_stamp`, so the defect is checkable ON THE ROW rather
  # than only in prose. The notes name the bad stamps explicitly.
  #   (1) COLUMN MIS-ASSIGNMENT (season_history only). Bulletin 16/07/2022 shifted every metric one
  #       column left; bulletins 01/02/2013 and 16/03/2013 duplicated cane into ethanol_total_m3 and
  #       sugar into ethanol_anhydrous_m3.
  #   (2) pt-BR THOUSANDS SEPARATOR read as a decimal point -- values exactly 1000x too small.
  #       Bulletin 10/16/2025 (season_history + corn_ethanol) and 09/01/2022 (corn_ethanol).
  # THE CLASSIFICATION IS PROVEN, not inferred: excluding exactly those stamps leaves 252/305
  # season-history rows on which ethanol_anhydrous + ethanol_hydrous == ethanol_total to a maximum
  # relative error of 0.0, and 64/64 corn rows on which the quinzenal identity holds to 0.0 -- while
  # 43 of the 300 rows in the full table breach that identity by more than 1%. The clean set is also
  # exactly additive across regions (centro_sul == sao_paulo + demais_estados, max rel err 0.0).
  # WHAT THE CARD CANNOT DO ABOUT IT, said plainly rather than implied: the registry offers no
  # row-level exclusion. `Metric.row_filters` is keyed by commodity and these cards have no
  # commodity column, so the enforcement available today is the provenance stamp plus the notes --
  # a CLASS-1 weak fence by the estate's own doctrine. The durable fix is a producer re-parse, and
  # until it lands these cards trade a documented, row-stamped defect against three tables that are
  # otherwise unreachable.
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  silver_unica_biweekly_season_history:
    description: >
      UNICA (Uniao da Industria de Cana-de-Acucar) Brazil -- the BIWEEKLY sugarcane harvest bulletin,
      season-to-date. One row per harvest season x region x fortnight position: how much cane has been
      crushed, how much sugar made and how much ethanol distilled SINCE THE SEASON OPENED, as of that
      fortnight. This is the Centro-Sul crush report the sugar market trades off -- the physical
      Brazilian supply print behind raw and white sugar, and behind Brazilian hydrous ethanol. It is
      CUMULATIVE, not a per-fortnight flow. Three regions: sao_paulo, demais_estados (the rest of the
      Centro-Sul) and centro_sul, which is their SUM and not a fourth place. Coverage is bulletin-
      sparse -- nine seasons between 2012/13 and 2025/26 with 2016/17 through 2020/21 absent entirely.
    grain: "one row per harvest_year x region x fortnight position (biweekly, season-to-date cumulative)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "fortnight_date 2012-04-16 .. 2026-02-01"
    # (per-table ceiling census); "The table now holds 335 rows" after the 2026-08-19 repair. 2026/27 has
    # ZERO parseable bulletins -> a real ceiling
    row_count: 335
    first_obs: "2012-04-16"
    last_obs: "2026-02-01"
    cadence: biweekly
    shape: wide
    commodity_col: null                 # no product column -- every row is Brazilian cane and its output
    # D-PQ CLASS-1 on a card with NO commodity axis (the mpoc_exports idiom). `commodity` emits no SQL
    # here, but an EMPTY commodity_values would let a corn, cocoa or palm lookup sail through and return
    # a Brazilian cane tonnage wearing the wrong label. agent._check_commodity_class reads
    # commodity_values ALONE (never commodity_col), so the closed set is a free pre-SQL teaching refusal.
    # Both sugar slugs are listed on purpose: the table's sugar output is the deliverable behind BOTH the
    # ICE raw (#11) and white (#5) contracts, and refusing a caller for picking one of two names for the
    # same physical product would be a manufactured decline. Corn slugs are DELIBERATELY EXCLUDED even
    # though ethanol is served here -- Brazilian CORN ethanol is a different table
    # (silver_unica_corn_ethanol) and letting corn_cbot through would defeat that separation.
    commodity_values: [raw_sugar, white_sugar]
    country_col: region                 # repurposed as the GEO axis (the fnc area-by-department idiom)
    period_col: harvest_year
    period_type: marketing_year
    period_sql_type: string             # values are '2025_2026' with an UNDERSCORE (probed)
    date_col: fortnight_date            # Glue `date`; the fortnight POSITION the cumulative total is at
    knowledge_date_col: fortnight_date
    knowledge_semantics: data_date
    publication_lag_days: 14            # position date -> bulletin print; see the POINT-IN-TIME note
    provenance_col: source_position_date  # DP-2 -> alias `revision_stamp`: the originating bulletin
    metrics:
      cane_crushed_t:       {label: "cane crushed", unit: "MT", desc: "sugarcane crushed in that region SINCE THE SEASON OPENED, cumulative metric tonnes (not the fortnight's own crush)"}
      sugar_produced_t:     {label: "sugar produced", unit: "MT", desc: "sugar produced season-to-date, cumulative metric tonnes"}
      ethanol_total_m3:     {label: "total ethanol produced", unit: "m3", desc: "total ethanol produced season-to-date, cumulative cubic metres (== anhydrous + hydrous, exactly, on clean rows)"}
      ethanol_anhydrous_m3: {label: "anhydrous ethanol produced", unit: "m3", desc: "ANHYDROUS ethanol season-to-date, cumulative cubic metres -- the gasoline-blending grade"}
      ethanol_hydrous_m3:   {label: "hydrous ethanol produced", unit: "m3", desc: "HYDROUS ethanol season-to-date, cumulative cubic metres -- the neat fuel sold at the pump"}
    notes: >
      EVERY NUMBER ON THIS CARD IS CUMULATIVE SEASON-TO-DATE, AND THAT IS THE EASIEST THING TO GET
      WRONG. cane_crushed_t at position 01/02 is everything crushed since the season opened in April,
      not the crush of that fortnight. A fortnight's own throughput is the DIFFERENCE between two
      consecutive positions of the SAME season and region, and it is only valid inside one season --
      differencing across a season boundary subtracts a full year's total from a two-week one. Never
      compare a cumulative figure to a weekly or monthly flow from another table, and never call a
      season-to-date total "this fortnight's crush".
      ALWAYS PASS A REGION. country selects the region and there are exactly three values:
      sao_paulo, demais_estados and centro_sul. With no region the read spans all three and a
      latest-value read returns ONE arbitrary region's row. centro_sul IS THE SUM OF THE OTHER TWO --
      verified exactly, to a maximum relative error of 0.0 across all five metrics -- so it is a TOTAL
      and not a third place: never add the three together, and never present centro_sul beside its two
      components as though they were peers. There is no north-northeast region here and no Brazil
      national total: UNICA's biweekly bulletin covers the Centro-Sul only, so a Brazil-wide cane or
      sugar figure is NOT available from this card and must not be manufactured by scaling one up.
      period is the SEASON, written '2025_2026' with an UNDERSCORE -- not '2025/26', not '2025-26' and
      not a bare year. The Brazilian cane season runs April to March, so season 2025_2026 opens in
      April 2025 and its positions run into early 2026: a question about "2025" has to choose which
      season it means, and the answer must say which one it used.
      COVERAGE IS BULLETIN-SPARSE AND THE GAPS ARE NOT ZEROS. Nine seasons are present -- 2012_2013,
      2013_2014, 2014_2015, 2015_2016, 2021_2022, 2022_2023, 2023_2024, 2024_2025, 2025_2026 -- and
      2016_2017 through 2020_2021 are ABSENT ENTIRELY. Within a season only the positions carried by an
      archived bulletin exist: season 2025_2026 holds positions 1-2 and 14-20 with 3-13 missing,
      because UNICA prunes superseded bulletins and the intermediate ones were never captured. A
      missing position did not have zero crush; it was not archived. Never narrate a gap as a stop, a
      collapse or a drought, and never interpolate across one.
      THE SERIES STOPS AT 2026-02-01 AND THE REASON IS NOT STALENESS. That position -- season
      2025_2026, fortnight 01/02 -- is the newest row this table holds, so agg=latest at any as-of from
      2026-02-15 onward returns it. The 2026/27 season has ZERO parseable bulletins: the origin prunes
      superseded bulletins so the running season is not archived as it goes, the only April-2026
      manifest entry is a mislabelled off-topic document, the single web-archive capture is an
      unparseable layout variant, and May through August 2026 have no captures at all. A
      force-overwrite rebuild wrote zero rows, which makes this CONTENT truth rather than a pipeline
      stall. A question about the 2026/27 crush, or about where the crush stands in mid-2026, IS NOT
      ANSWERABLE HERE: say that the series ends with the 1 February 2026 position of the 2025/26
      season and that no 2026/27 bulletin has been published in a readable form, rather than offering
      the February figure as though it were current. Say the reading's own season and position date out
      loud on every figure and never call a dated reading 'current'.
      THE FOUR HISTORICALLY-CORRUPT BULLETINS WERE RE-PARSED AND REPAIRED ON 2026-08-19 (silver
      transform: column-shift detection keyed on the published additivity identity, thousands-separator
      scale repair, and a season-calendar date bijection). The table now holds 335 rows and
      ethanol_anhydrous + ethanol_hydrous == ethanol_total holds to a maximum relative error of 0.0 on
      EVERY row that publishes the split; season 2022/23 is fully usable (its stamps are 2022-05-01 and
      2022-07-16). Every row still carries its originating bulletin as revision_stamp, now normalised
      to ISO YYYY-MM-DD. ONE HONEST RESIDUAL: 18 rows publish the ethanol TOTAL with a null
      anhydrous/hydrous split (the source page truncated both legs; the aggregate is real, the split
      was not invented) -- treat a null split as unpublished, never as zero, and never derive one leg
      by subtraction on those rows.
      UNITS ARE RAW TONNES AND RAW CUBIC METRES, not thousands and not the source page's own display
      scale. On the clean rows cane_crushed_t spans 5,674,389 to 649,389,303 MT, sugar_produced_t
      179,554 to 42,245,297 MT and ethanol_total_m3 221,200 to 34,958,563 m3. Ethanol is a VOLUME and
      sugar is a MASS: they cannot be added, netted, or converted into one another on this card, and a
      sugar-versus-ethanol MIX is a ratio the source publishes separately and this table does not carry.
      commodity IS OPTIONAL AND THERE IS NO PRODUCT AXIS -- every row covers cane and both of its
      outputs at once. If you pass one, pass raw_sugar or white_sugar; a corn, palm, coffee or cocoa
      lookup is refused before anything is queried. Brazilian CORN ethanol is NOT here: it is a
      separate table, silver_unica_corn_ethanol, and the ethanol columns on this card are cane ethanol
      only, so adding the two cards' ethanol together double-counts nothing but describes two different
      feedstocks that must be labelled apart.
      POINT-IN-TIME: each row is stamped with its own fortnight POSITION date and a 14-day publication
      lag, so the 01/02 position becomes citable on 15 February. UNICA prints the bulletin roughly ten
      days after the position closes, so the lag is deliberately generous -- never early, at most a few
      days late. One consequence worth stating: a row's position date is a DATA date, not the date this
      table acquired it, and several early-season rows were in fact parsed out of a much later
      bulletin's restatement. The quantity was public at the position date either way, which is what
      the guard encodes; but there is NO vintage axis here, so never present a figure from this card as
      "as published on" any particular date, and never difference two rows and call it a revision.

  silver_unica_corn_ethanol:
    description: >
      UNICA Brazil -- BIWEEKLY CORN ethanol production, the second feedstock. One row per harvest
      season x fortnight position, carrying BOTH the fortnight's own output (the `quinzenal` columns)
      AND the season-to-date cumulative (`accum`), split anhydrous / hydrous / total. This is the
      fastest-growing supply line in Brazilian ethanol and it is the CORN half only: cane ethanol lives
      on silver_unica_biweekly_season_history. There is no region axis -- one national series per
      position -- and coverage starts with the 2021/22 season, which is when UNICA began publishing the
      corn table at all.
    grain: "one row per harvest_year x fortnight position (biweekly; corn ethanol, national)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "fortnight_date 2021-04-16 .. 2026-02-01
    # (same last bulletin, DIFFERENT table -- measured, not inherited)"; "All 86 rows"
    row_count: 86
    first_obs: "2021-04-16"
    last_obs: "2026-02-01"
    cadence: biweekly
    shape: wide
    commodity_col: null                 # no product column -- every row is Brazilian corn ethanol
    # The closed set is CORN, and deliberately so: the reflex reach for a Brazilian corn-ethanol ask is
    # the Brazilian corn slug, and the US benchmark is the reflex reach for anyone thinking in CBOT
    # terms. Sugar slugs are EXCLUDED even though the publisher is a sugar body -- a raw_sugar lookup
    # landing here would return a corn-ethanol volume under a sugar label, which is exactly the
    # cross-feedstock confusion this card exists to prevent.
    commodity_values: [corn_cbot, campinas_corn_reference_bmf]
    country_col: null                   # single-geography (Brazil); no region column exists here
    period_col: harvest_year
    period_type: marketing_year
    period_sql_type: string             # '2025_2026', underscore (probed)
    date_col: fortnight_date            # Glue `date`
    knowledge_date_col: fortnight_date
    knowledge_semantics: data_date
    publication_lag_days: 14            # same bulletin, same cadence as the cane card
    provenance_col: source_position_date  # DP-2 -> alias `revision_stamp`
    metrics:
      total_quinzenal_kl:     {label: "fortnight ethanol output (total)", unit: "m3", desc: "corn ethanol produced IN THAT FORTNIGHT ALONE, kilolitres (== cubic metres); a FLOW, not cumulative"}
      anhydrous_quinzenal_kl: {label: "fortnight anhydrous output", unit: "m3", desc: "ANHYDROUS corn ethanol in that fortnight alone, kilolitres (a FLOW, not cumulative) -- the gasoline-blending grade"}
      hydrous_quinzenal_kl:   {label: "fortnight hydrous output", unit: "m3", desc: "HYDROUS corn ethanol in that fortnight alone, kilolitres (a FLOW, not cumulative) -- the neat pump fuel"}
      total_accum_kl:         {label: "season-to-date ethanol output (total)", unit: "m3", desc: "corn ethanol produced SINCE THE SEASON OPENED, cumulative kilolitres"}
      anhydrous_accum_kl:     {label: "season-to-date anhydrous output", unit: "m3", desc: "anhydrous corn ethanol season-to-date, cumulative kilolitres"}
      hydrous_accum_kl:       {label: "season-to-date hydrous output", unit: "m3", desc: "hydrous corn ethanol season-to-date, cumulative kilolitres"}
    notes: >
      THIS CARD CARRIES BOTH A FLOW AND A CUMULATIVE, AND MIXING THEM IS THE PRIMARY HAZARD. The
      `_quinzenal_` metrics are that fortnight's own production; the `_accum_` metrics are everything
      since the season opened in April. They are not interchangeable and they differ by more than an
      order of magnitude late in a season (a fortnight runs ~110,000-433,000 kl while a full season
      accumulates to ~8,190,625 kl). Pick one deliberately, say which one you quoted, and never
      difference two `_accum_` rows and present the result beside a `_quinzenal_` figure as though the
      two were the same measurement. Differencing `_accum_` is only valid WITHIN one season.
      KILOLITRES ARE CUBIC METRES. The column names say kl and the unit is m3 -- 1 kl == 1 m3 exactly,
      so these volumes are directly comparable with the cane-ethanol columns on
      silver_unica_biweekly_season_history without any conversion. What they must NOT be is silently
      added to them without saying so: cane ethanol and corn ethanol are different feedstocks with
      different economics, and Brazil's total ethanol supply is their sum stated AS a sum.
      ANHYDROUS + HYDROUS == TOTAL, exactly, on every clean row (maximum relative error 0.0 across 64
      rows), so the split is a real decomposition and never needs recomputing. Anhydrous is blended
      into gasoline under the Brazilian mandate; hydrous is sold neat at the pump and competes with
      gasoline on a per-kilometre basis. A question about blending demand is the anhydrous line; a
      question about flex-fuel pump economics is the hydrous line.
      period is the SEASON, written '2025_2026' with an UNDERSCORE. Five seasons exist and no more --
      2021_2022, 2022_2023, 2023_2024, 2024_2025 and 2025_2026 -- because UNICA did not publish a corn
      table before 2021/22. There is no history here for the corn-ethanol build-out before that, and no
      earlier figure may be inferred from the cane card, which does not carry corn at all.
      NO REGION AXIS. This is a single national series: there is no sao_paulo / centro_sul split for
      corn ethanol the way there is for cane, so a regional corn-ethanol question is not answerable
      here and must not be answered by borrowing the cane card's regions.
      THE SERIES STOPS AT 2026-02-01, THE SAME LAST BULLETIN AS THE CANE CARD -- and that is a measured
      coincidence of the shared publication, not an inherited assumption: this table's own ceiling was
      sampled independently. agg=latest at any as-of from 2026-02-15 onward returns the 01/02 position
      of season 2025_2026 (total_accum_kl 7,646,774 kl). The 2026/27 season has ZERO parseable
      bulletins -- the origin prunes superseded bulletins, the only April-2026 manifest entry is a
      mislabelled off-topic document, the one web-archive capture is an unparseable layout variant, and
      May through August 2026 have no captures at all; a force-overwrite rebuild wrote zero rows. A
      2026/27 corn-ethanol question, or "how much corn ethanol is Brazil making now" asked in mid-2026,
      IS NOT ANSWERABLE HERE: say the series ends at the 1 February 2026 position and why, rather than
      presenting that figure as the current rate. Never call a dated reading 'current'.
      THE TWO HISTORICALLY-CORRUPT BULLETINS AND THE YEAR-EARLY DATE WERE REPAIRED ON 2026-08-19
      (silver transform: thousands-separator scale repair plus a season-calendar seq 1-24 date
      bijection). All 86 rows now satisfy anhydrous_quinzenal + hydrous_quinzenal == total_quinzenal
      to a maximum relative error of 0.0; season 2025/26 is fully usable under its single surviving
      stamp 2026-02-01 (the corrupt October-2025 bulletin's rows were superseded outright); and season
      2024/25 position 24 now carries its calendar-correct fortnight_date 2025-04-01, so the season
      sorts chronologically and nothing is citable a year early. Every row carries its originating
      bulletin as revision_stamp, now normalised to ISO YYYY-MM-DD.
      SPARSENESS AND NULLS: season 2022_2023 position 1 is present with every metric null, and the
      `_accum_` columns carry more nulls than the `_quinzenal_` ones (6 and 12 of 86) because a
      bulletin sometimes prints the fortnight without restating the running total. A null is a missing
      print, never a zero.
      commodity IS OPTIONAL AND THERE IS NO PRODUCT AXIS. If you pass one, pass corn_cbot or
      campinas_corn_reference_bmf; a sugar, palm or coffee lookup is refused before anything is
      queried, because this card would otherwise hand back a corn-ethanol volume under a sugar label.
      POINT-IN-TIME: each row is stamped with its own fortnight position date plus a 14-day publication
      lag, so the 01/02 position is citable from 15 February. There is NO vintage axis: one value per
      (season, position), taken from whichever archived bulletin carried it, so never present a figure
      from this card as as-published-on-a-date and never difference two rows and call it a revision.

  silver_unica_monthly_ethanol_sales:
    description: >
      UNICA Brazil -- MONTHLY ethanol SALES by Centro-Sul mills, with the year-ago month printed beside
      each figure. One row per harvest season x month: total volume sold, split into the DOMESTIC
      (internal) and EXPORT (external) channels, each with its own prior-year comparator. This is the
      DEMAND side of the Brazilian ethanol book -- what left the mills, as against what the biweekly
      cards say was produced. It is a monthly FLOW, not cumulative. Coverage is thin and holed: 58 rows
      across nine seasons, only the April-November months of each season, and 16 of those rows carry no
      figures at all.
    grain: "one row per harvest_year x calendar month (monthly ethanol sales, Centro-Sul mills)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "month_date 2012-04-01 .. 2025-11-01, ONE
    # ceiling again" after the 2026-08-19 recovery; "58 rows"
    row_count: 58
    first_obs: "2012-04-01"
    last_obs: "2025-11-01"
    cadence: monthly
    shape: wide
    commodity_col: null                 # no product column -- every row is Brazilian cane ethanol
    # Sugar slugs, for the same reason the cane card carries them: this is UNICA's cane-mill book and
    # its ethanol is the co-product of the sugar the ICE contracts deliver. Corn slugs are EXCLUDED --
    # corn ethanol is silver_unica_corn_ethanol and it has no sales table at all, so admitting
    # corn_cbot here would answer a corn question with a cane number.
    commodity_values: [raw_sugar, white_sugar]
    country_col: null                   # single-geography (Centro-Sul); no region column exists here
    period_col: harvest_year
    period_type: marketing_year
    period_sql_type: string             # '2024_2025', underscore (probed)
    date_col: month_date                # Glue STRING, but ISO 'YYYY-MM-01' in 58/58 rows (probed), so
    #                                     the plain CAST-as-varchar compare orders it correctly on both
    #                                     backends. date_col_type stays "string" -- it is not a
    #                                     TIMESTAMP, so the DP-5 substr normalization does not apply.
    knowledge_date_col: month_date
    knowledge_semantics: data_date
    publication_lag_days: 45            # month START -> month end (~30d) -> the following bulletin (~15d)
    provenance_col: source_position_date  # DP-2 -> alias `revision_stamp`
    metrics:
      total_current_m3:    {label: "ethanol sales (current month)", unit: "m3", desc: "total ethanol SOLD by Centro-Sul mills in that month, cubic metres (a monthly FLOW; == internal + external where both are printed)"}
      total_prior_m3:      {label: "ethanol sales (prior-year month)", unit: "m3", desc: "the SAME month one year earlier, as printed in the source beside the current figure -- a stored comparator, never recompute it"}
      internal_current_m3: {label: "domestic ethanol sales (current month)", unit: "m3", desc: "DOMESTIC-market ethanol sales that month, cubic metres"}
      internal_prior_m3:   {label: "domestic ethanol sales (prior-year month)", unit: "m3", desc: "domestic sales in the same month one year earlier, as printed"}
      external_current_m3: {label: "export ethanol sales (current month)", unit: "m3", desc: "EXPORT ethanol sales that month, cubic metres (sparse -- see notes)"}
      external_prior_m3:   {label: "export ethanol sales (prior-year month)", unit: "m3", desc: "export sales in the same month one year earlier, as printed"}
    notes: >
      SALES ARE NOT PRODUCTION. This card is what mills SOLD; silver_unica_biweekly_season_history is
      what they MADE. The two are different quantities on different cadences (monthly flow versus
      biweekly cumulative) and the gap between them is inventory, not an error -- so never difference
      one against the other and call the result a stock build, and never substitute a production figure
      for a sales question or the reverse.
      THESE ARE MONTHLY FLOWS. Unlike the two biweekly cards, nothing here is cumulative: a
      month-on-month difference is a genuine change in the sales rate. internal + external ==
      total, exactly, on every row where all three are printed.
      THE PRIOR-YEAR COLUMNS ARE STORED, NOT DERIVED. total_prior_m3, internal_prior_m3 and
      external_prior_m3 are the source's own year-ago comparators printed beside each current figure.
      Read them; never recompute a year-on-year change by reaching for another row of this table, and
      always quote the base beside any percentage so the comparison is visible.
      EXPORT SALES ARE ALMOST ENTIRELY MISSING, and that is coverage rather than zero exports.
      external_current_m3 is populated in only 10 of 58 rows -- seasons 2012_2013 and 2013_2014 and
      nowhere else. A null export figure means the bulletin's export column was not captured, NOT that
      Brazil exported no ethanol that month. An export-share or domestic-versus-export split is
      therefore NOT ANSWERABLE for any month after 2013: decline rather than treating a null as zero or
      inferring exports as total minus internal, which for those months would be an invented number.
      internal_current_m3 is itself null in 11 of 58 rows.
      ONLY APRIL THROUGH NOVEMBER EXIST. month_num takes the values 4 to 11 and nothing else, so
      December, January, February and March are ABSENT from every season in this table. A full-season
      or calendar-year ethanol sales total CANNOT be assembled here -- it would silently omit four
      months, including the inter-harvest period. Say which months a figure covers, and decline a
      calendar-year total.
      THE 2025/26 SEASON WAS RECOVERED ON 2026-08-19 (silver repair: rows carrying values now win the
      per-month dedup over empty skeletons), so the table has ONE ceiling again: the newest row AND the
      newest populated month are both 2025-11-01 (total_current_m3 = 2,700,274 m3, internal 2,637,528,
      external 62,746). EIGHT ROWS REMAIN PRESENT AND ENTIRELY EMPTY, and that is content truth, not a
      parse gap: season 2022_2023 months May through November (7 rows -- the only covering bulletins
      are English-language editions whose sales values were destroyed upstream of this table; a
      bronze-side repair is banked separately) and September 2012 (1 row). The as-of guard will return
      those rows: report that the month exists but was never populated -- never present a null row as a
      zero.
      WHY IT STOPS AT NOVEMBER 2025. No 2026/27 rows exist because the 2026/27 season has ZERO
      parseable bulletins: the origin prunes superseded bulletins so the running season is never
      archived, the only April-2026 manifest entry is a mislabelled off-topic document, the single
      web-archive capture is an unparseable layout variant, and May through August 2026 have no
      captures; a force-overwrite rebuild wrote zero rows. A question about Brazilian ethanol sales in
      mid-2026 is NOT ANSWERABLE from this card -- say the series ends at November 2025 and why,
      rather than narrating it as the current pace. Never call a dated reading 'current'.
      is_partial IS PRESENT AND IS NOT SERVED, and that is a data verdict rather than an omission. The
      column flags exactly ONE row (October 2020) as partial, while at least three other rows are
      obviously part-months and are flagged False: November 2020 reads 143,814 m3 against a prior-year
      2,847,663; October 2021 reads 358,018 against 3,049,853; November 2021 reads 240,529 against
      2,731,050. The flag therefore cannot be trusted to mark a partial month, so it is not offered as
      a metric. Apply the check by hand instead: a total_current_m3 far below its own total_prior_m3 --
      the full months in this table run 1,395,305 to 3,119,327 m3 -- is a PART-MONTH print, and quoting
      it as a monthly rate or annualising it would be wrong by a factor of several.
      MONTH LABELS ARE MIXED-LANGUAGE and must not be used as the time axis. month_label carries both
      Portuguese and English abbreviations for the same months (Abr/Apr, Mai/May, Ago/Aug, Set/Sep,
      Out/Oct) because different bulletin vintages were parsed differently. Use month_date, which is a
      clean ISO 'YYYY-MM-01' string in all 58 rows, and note that it is the FIRST of the month while
      the figure covers the WHOLE month.
      period is the SEASON, written '2024_2025' with an UNDERSCORE, and the Brazilian season runs April
      to March -- so season 2024_2025's months here are April to November 2024. Nine seasons appear and
      2016/17 through 2019/20 are absent entirely.
      commodity IS OPTIONAL AND THERE IS NO PRODUCT AXIS. If you pass one, pass raw_sugar or
      white_sugar; a corn lookup is refused before anything is queried, because Brazilian corn ethanol
      has no sales table and answering a corn question with this cane-mill number would be a
      cross-feedstock substitution.
      POINT-IN-TIME: each row is stamped with the FIRST of its own month plus a 45-day publication lag,
      so a month becomes citable about six weeks after it opens -- the month has to finish (~30 days)
      and then appear in the following bulletin (~15 days). The lag is deliberately generous: never
      early, at most a couple of weeks late. There is NO vintage axis -- one value per (season, month)
      from whichever archived bulletin carried it -- so never present a figure as as-published-on-date
      and never difference two rows and call it a revision.

  gold_board_crush:
    description: >
      The CBOT SOYBEAN BOARD CRUSH -- the processor's gross margin, in US DOLLARS PER BUSHEL, for one
      trading session. It is a SPREAD computed from three exchange settlements the platform already
      stores: the value of the meal and oil a bushel yields, minus what the bushel costs.
      crush = 0.022 x soybean meal (USD/short ton) + 0.11 x soybean oil (US cents/lb)
      - 0.01 x soybeans (US cents/bushel), the standard 44 lb meal / 11 lb oil board convention;
      each coefficient is a unit conversion, not a fitted parameter. The three legs are the CBOT
      front-month contracts chosen by the platform's ONE named front-month rule (front-by-open-interest
      on GLBX), and that rule's version rides every row. One row per trading session on which all three
      legs printed; CBOT only.
    grain: "one row per trading session (a single global CBOT spread -- no commodity axis, no country axis)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "RE-MEASURED 2026-08-22 from the SERVED
    # parquet: 2,652 rows, 2015-11-19..2026-08-18". LIVE daily session front -> no last_obs (a stale end
    # date on a daily card declines sessions the table holds)
    row_count: 2652
    first_obs: "2015-11-19"
    cadence: daily
    shape: wide
    # THE TWO INVISIBLE AXES, declared rather than left absent. This table has NO commodity column and
    # NO country column: the board crush is ONE number per session, not a number per commodity. The
    # closed commodity set below is therefore a pre-SQL teaching refusal exactly as it is on
    # silver_food_cpi -- agent._check_commodity_class reads commodity_values ALONE and never consults
    # commodity_col, so naming a set costs nothing at query time and stops a corn or palm lookup from
    # coming back with a soy margin wearing the wrong label.
    commodity_col: null
    country_col: null
    # THE THREE CBOT LEGS AND NOTHING ELSE. The DCE and ZCE soy slugs are DELIBERATELY EXCLUDED even
    # though the same economics drive them: this number is denominated in USD per BUSHEL off Chicago
    # settlements, and handing it to a Dalian or Zhengzhou crush question would substitute one venue's
    # margin for another's across an FX rate this estate never converts. soy_complex is admitted
    # because it is the hierarchy's own name for the three legs together, which is precisely what a
    # crush IS.
    # `soybeans` ADMITTED 2026-08-22 (GN-2 W1.3): the class DAG (configs/graphrag/causal/soybeans.yaml)
    # carries two cbot_board_crush_margin drivers, so the class contract asks this card legitimately --
    # it is the US complex's parent, not a foreign venue. The DCE/ZCE fence below is unchanged.
    commodity_values: [soybeans_cbot, soybean_meal_cbot, soybean_oil_cbot, soybeans, soy_complex]
    period_type: date
    date_col: trade_date                  # exchange SESSION date; Glue STRING, ISO 'YYYY-MM-DD'
    knowledge_semantics: data_date
    knowledge_date_col: trade_date
    publication_lag_days: 1               # inherited EXACTLY from silver_futures_eod: the crush is
    #                                       available when its last leg's EOD print is, i.e. D+1. It is
    #                                       not made later by being computed -- arithmetic adds no lag.
    partition_cols: []                    # flat gold object; projection FORBIDDEN, no LIST surface
    # PROVENANCE IS THE RULE, NOT A REVISION. Exchange settlements do not revise, so this table has no
    # vintage axis and no source revision date to stamp. What a reader genuinely needs to know is WHICH
    # DEFINITION produced the number -- which coefficients, which legs, which roll -- so
    # crush_rule_version is what rides out as revision_stamp. Quote it whenever the figure is doing
    # real work; a crush under one rule version is not comparable to a crush under another.
    provenance_col: crush_rule_version
    # period_required IS DELIBERATELY NOT SET, and the refusal is pinned in
    # tests/unit/test_capability_wiring.py rather than left as an absence. The fence exists for the WAP
    # trap -- a table where several rows share a period, so agg=latest returns ONE ARBITRARY row. This
    # card has no free axis at all: no commodity, no country, one row per session. agg=latest therefore
    # returns THE newest session on or before the as-of, which is the only row it could return and
    # exactly the right answer. Requiring a period here would refuse the most natural question this
    # table exists to answer -- where the crush stands -- to fence a hazard it does not have.
    metrics:
      crush_margin_usd_bu:
        label: "board crush margin"
        unit: "USD/bushel"
        desc: >
          THE board crush for that session: meal value + oil value - bean cost, in US dollars per
          bushel of soybeans. A MARGIN, not a price. Negative readings are real.
        # THE ROLL FENCE (GN-2 W1.3, 2026-08-22). Every served read excludes roll-boundary sessions
        # (is_roll_boundary=1: a leg's front contract changed vs the previous emitted session) -- the
        # series steps there because the CONTRACTS changed, not the market (2022-06-02's sole negative
        # print was old-crop beans vs new-crop products for one session), and a window endpoint landing
        # on one narrates a contract change as a market move. Cost: a "latest" read on a roll day
        # serves the prior session -- one session older and honestly comparable. The producer emits
        # the column as a STRING '0'/'1' (build_sql's row_filters emit is a quoted literal with no
        # cast, which type-errors on an Athena INT column; string compares identically on Athena, pg
        # and the pure-Python oracle). Keyed per asking commodity (row_filters is per-commodity by
        # design); the five keys are exactly commodity_values.
        row_filters:
          soybeans_cbot:     &crush_roll_fence
            is_roll_boundary: ["0"]
          soybean_meal_cbot: *crush_roll_fence
          soybean_oil_cbot:  *crush_roll_fence
          soybeans:          *crush_roll_fence
          soy_complex:       *crush_roll_fence
      meal_value_usd_bu:
        label: "meal value per bushel"
        unit: "USD/bushel"
        desc: >
          the meal leg's contribution -- 0.022 x the soybean-meal front-month settle (USD/short ton),
          i.e. what the 44 lb of meal from one bushel was worth that session.
        # same roll fence as the margin: each leg's value steps at its own roll
        row_filters:
          soybeans_cbot:     *crush_roll_fence
          soybean_meal_cbot: *crush_roll_fence
          soybean_oil_cbot:  *crush_roll_fence
          soybeans:          *crush_roll_fence
          soy_complex:       *crush_roll_fence
      oil_value_usd_bu:
        label: "oil value per bushel"
        unit: "USD/bushel"
        desc: >
          the oil leg's contribution -- 0.11 x the soybean-oil front-month settle (US cents/lb), i.e.
          what the 11 lb of oil from one bushel was worth that session.
        row_filters:
          soybeans_cbot:     *crush_roll_fence
          soybean_meal_cbot: *crush_roll_fence
          soybean_oil_cbot:  *crush_roll_fence
          soybeans:          *crush_roll_fence
          soy_complex:       *crush_roll_fence
      bean_cost_usd_bu:
        label: "bean cost per bushel"
        unit: "USD/bushel"
        desc: >
          the input cost -- the soybean front-month settle converted from US cents to dollars per
          bushel. Subtracted from the two product values to give the margin.
        row_filters:
          soybeans_cbot:     *crush_roll_fence
          soybean_meal_cbot: *crush_roll_fence
          soybean_oil_cbot:  *crush_roll_fence
          soybeans:          *crush_roll_fence
          soy_complex:       *crush_roll_fence
    notes: >
      A MARGIN IS NOT A PRICE, AND THIS IS THE ONE ERROR THIS CARD EXISTS TO PREVENT. Every figure here
      is a SPREAD in dollars per bushel -- what a processor earns for crushing, not what anything costs
      or trades at. "Soybeans were $1.85" is wrong in a way a reader cannot detect; "the board crush was
      $1.85 per bushel" is right. For the LEVEL of any leg use silver_futures_eod, which serves the
      per-delivery-month settle with its own unit, currency and settle_kind attached.
      NEGATIVE IS A REAL READING, NOT A DEFECT. A negative crush means the meal and oil a bushel yields
      were worth LESS than the bushel -- a processor squeeze, which is exactly when the number matters
      most. Never clamp it at zero, never call it missing, and never describe a move from -0.20 to +0.30
      as a percentage change: a percentage of a margin that crosses zero is meaningless. Quote spread
      moves in dollars per bushel -- the crush widened by 30 cents -- and never in percent.
      WIDER AND NARROWER, NEVER HIGHER AND LOWER. A crush WIDENS when processing gets more profitable
      and NARROWS when it gets less. It widens because meal or oil rose, or because beans fell -- three
      different stories behind one number, which is why meal_value_usd_bu, oil_value_usd_bu and
      bean_cost_usd_bu are served beside it. When a move is worth explaining, look up the parts: they
      reconstruct the whole exactly (meal + oil - beans == crush on every row), so the attribution is
      arithmetic rather than a guess.
      NEVER CALL A DATED CRUSH CURRENT. Every row is one SESSION, stamped with its own trade date and a
      one-day publication lag. Say the date out loud on every figure -- the crush settled at $1.85 on 13
      August 2026 -- and never "the crush is" or "these days" or "at the moment". The same discipline the
      futures and IOD cards state, and it bites harder here because a spread can invert inside a week.
      IT IS A FRONT-MONTH CRUSH AND THE ROLL IS A DECISION, NOT A FACT. The three legs are selected by
      the platform's single named front-month rule (front-by-open-interest, since all three trade on
      GLBX), and roll_rule_version plus crush_rule_version ride every row. On and around a roll the
      series steps because the underlying contracts changed, not because the market moved: a
      day-over-day difference across a roll boundary is NOT a market move. The beans_contract_month,
      meal_contract_month and oil_contract_month columns are carried so that boundary stays visible,
      and since 2026-08-22 the producer marks it outright: is_roll_boundary (STRING '0'/'1') is '1' on
      any session where a leg's front contract differs from the previous emitted session's. Every
      served metric excludes those sessions via row_filters (see the metric blocks) -- the boundary
      rows remain in the TABLE for provenance, they are simply never quoted as market moves.
      THE TEXTBOOK BOARD CRUSH USES ALIGNED DELIVERY MONTHS AND THIS CARD DOES NOT ENFORCE THAT. Each
      leg is rolled independently by open interest, so on most sessions the three agree and on some they
      do not. When they disagree the row is a front-month crush rather than a same-expiry board crush;
      the three contract-month columns say which case a row is, and a figure quoted from a mixed-month
      session should say so.
      CBOT ONLY. There is no Dalian import crush and no Zhengzhou rapeseed crush in this table, and that
      is a refusal rather than a gap: those venues quote in CNY per tonne, so a crush there needs an FX
      leg (and, for the import crush, freight), and this platform converts NOTHING at ingest -- units are
      source-faithful by doctrine. A question about Chinese crush margins is NOT ANSWERABLE here; say so
      rather than offering the Chicago number as a proxy.
      THE RAW LEG SETTLES ARE CARRIED BUT NOT SERVED. beans_settle, meal_settle and oil_settle sit on
      every row for provenance -- they are what the arithmetic consumed -- and they are deliberately
      absent from the metric list, because each is in a DIFFERENT unit (cents/bushel, dollars/short ton,
      cents/pound) and a served metric whose unit changes by column is a mis-quote waiting to happen.
      Every metric this card serves is in ONE unit, USD per bushel. For a leg's own level, with its own
      unit and its settle_kind label, use silver_futures_eod.
      SETTLE KIND TRAVELS WITH THE NUMBER. All three legs are CME/CBOT via GLBX and print official
      SETTLEMENTS, so settle_kind reads settlement on every ordinary row; a session whose legs disagreed
      reads mixed and should be quoted with that said out loud. A crush built from session closes is a
      different object from one built from settlements.
      COVERAGE STARTS 2015-11-19 AND THERE IS NO HISTORY BEFORE IT (RE-MEASURED 2026-08-22 from the
      SERVED parquet: 2,652 rows, 2015-11-19..2026-08-18 -- the earlier "2010-06-06" figure was the
      GLBX floor for the LEGS, not the floor of the three-leg INTERSECTION this card serves; the
      producer's own notes carry the same fact). A crush for 2014 or 2008 is NOT ANSWERABLE from this
      card. Decline rather than splicing a different series in front of it.
      commodity IS OPTIONAL AND THERE IS NO PRODUCT AXIS -- every row is the same single CBOT spread. If
      you pass one, pass soybeans_cbot, soybean_meal_cbot, soybean_oil_cbot or soy_complex; anything
      else, including the Dalian and Zhengzhou soy slugs, is refused before anything is queried.
      POINT-IN-TIME: each row is stamped with its own session date plus a one-day lag, exactly as
      silver_futures_eod is -- the arithmetic adds no lag of its own. There is NO vintage axis: exchange
      settlements do not revise, so there is one value per session. Never present a figure from this card
      as as-published-on-a-date, and never difference two rows and call the result a revision.
      revision_stamp carries crush_rule_version, the DEFINITION the number was computed under.
      WHAT THIS CARD IS FOR, AND ITS HARD EDGE: it quantifies the crush driver the causal graph models in
      sixteen places and could never feed from text -- the corpus carries the phrase board crush in ZERO
      of 449 sampled documents, because attache reports and WASDE narrative do not discuss market
      microstructure. It says what the margin WAS, on which session, and how the meal, oil and bean legs
      contributed. It cannot say what processors will do about it, what crush VOLUMES were, or where the
      margin is going; a crush-capacity or crush-volume claim minted from this number is exactly the
      invention it refuses. For the soybean balance sheet behind a crush story use silver_psd; for the
      leg prices themselves use silver_futures_eod.

  # LIGHT THE CARD (2026-08-20) -- MINAGRO UKRAINIAN GRAIN, PULSE AND FLOUR EXPORTS. The SERVING half of
  # the four-checkmark law: the producer chain landed this week (raw_to_bronze + bronze_to_silver
  # minagro_grain_exports, driven by jobs/ingest/run_minagro_pipeline.py) and the rows have been in
  # silver and in the F010 contract since. Nothing here ingests, re-parses or re-derives anything -- the
  # card is what makes an already-published table reachable, and until it existed every question about
  # Ukrainian export PACE routed away from the one table in the estate that measures it.
  #
  # PROOF OF ROWS, Athena-measured 2026-08-20: the live table answers at as_of_date 2026-08-14 with ten
  # rows, one per crop_slug -- wheat 1291.0 / 219.0 / 1517.0, barley 339.0 / 40.0 / 463.0, corn 1403.0 /
  # 89.0 / 827.0 (my_cumulative_kt / month_to_date_kt / prior_my_cumulative_kt), rye a true 0.0 in every
  # column, the four flour rows, and the two totals: grains_pulses_total 3093 / 348 / 2818 and
  # grain_flour_total 3097 / 350 / 2826. Two arithmetic facts fall straight out of that snapshot and are
  # taught in `notes` rather than left for a reader to rediscover: the grand total EXCEEDS the grains
  # total by exactly the flour-in-grain-equivalent row (3097 - 3093 = 4), and the four NAMED cereals do
  # NOT exhaust the grains total (1291 + 339 + 1403 + 0 = 3033 against 3093 -- the ~60 kt residual is the
  # pulses and minor grains the ministry does not break out).
  #
  # WRITTEN FOR ONE CAPTURE AND FOR HUNDREDS, DELIBERATELY. A wayback backfill is landing archived
  # captures in parallel and will extend the history to roughly 2024-03; the description and notes below
  # therefore carry NO row count, NO history-start date and NO span claim of any kind. Everything they
  # state is a fact about the GRAIN and the SEMANTICS, both of which are identical whether the table
  # holds one as-of or four hundred, and the one coverage sentence tells the reader to read the as-of
  # stamps of the rows that actually came back instead of trusting a number in a card. That is the
  # mpoc/fnc content-ceiling idiom inverted: those cards state a ceiling because their sources are
  # closed, this one refuses to state a span because its series grows from BOTH ends.
  #
  # PIT: data_date on as_of_date, publication_lag_days 0 -- ADOPTED from the F010 contract rather than
  # minted (knowledge_date_col as_of_date / knowledge_semantics data_date / publication_lag_days 0 were
  # already on it), the silver_nass_citrus posture and not the D-CW-2a one. WHY LAG 0 IS HONEST HERE, and
  # it is a measurement rather than a convention: the page carries TWO dates, its own "as of" date (the
  # date the State Customs figures describe, which is what the producer keys on) and a separate CMS
  # publish stamp, and on the measured capture they are the SAME DAY -- published 09:05 Kyiv on
  # 2026-08-14 for figures as of 14.08.2026. So a row is admitted by the guard only on the day it was
  # published and the residual exposure is INTRA-DAY on a weekly series. The transform refuses to key on
  # the publish stamp for the documented reason (the ministry re-publishes the page in place, which would
  # mint a fresh later "vintage" of numbers that never changed) -- see
  # transforms/raw_to_bronze/minagro_grain_exports.py's module docstring.
  #
  # NO VINTAGE AXIS, AND THAT IS THE PRODUCER'S GUARANTEE RATHER THAN AN OMISSION. write_mode overwrite /
  # vintage_retention latest-only: silver holds ONE row per (as_of_date, crop_slug) and each capture is a
  # NEW observation, not a revision of an older one -- the ministry does not restate a past as-of, and
  # build_silver FAILS CLOSED (MinagroConflictError) if two captures ever carry different values for one
  # key. data_date is therefore the right semantics; there is no vintage ROW_NUMBER on this branch at
  # all, so no grain_cols and no vintage_tiebreak are expressible or needed (the engine-order tie hazard
  # the F2 Branch-A break named requires the vintage branch, which this card never enters).
  #
  # PHYSICAL LAYOUT: FLAT (partition_mode flat, projection forbidden, partition_keys [], one object under
  # the flat root). partition_cols is declared EMPTY and there is NO year_col -- there is no projected
  # grid to prune, so there is no Jul-2026 LIST-storm class here, and a partition_col that is not a real
  # Glue partition key is a hard reconcile_numbers failure (SILVER-F047 / the mpoc_stock_comparison
  # rule). The guard's CAST(as_of_date AS varchar) is the correct compare on both backends: as_of_date is
  # a Glue `date`, not a TIMESTAMP, so the DP-5 substr normalization does not apply (the
  # sagis_weekly_deliveries reading, byte-identical).
  #
  # THE TEN VALUES ARE THE PRODUCER'S OWN COMPLETENESS FLOOR, not a hand-listed set. They are exactly
  # raw_to_bronze/minagro_grain_exports.REQUIRED_CROP_SLUGS, and the parse HARD-FAILS a capture missing
  # any of them ("an absent wheat row reads to a desk as a collapse in wheat exports rather than as a
  # parse failure"), so the fence and the physical DISTINCT set are one universe by construction rather
  # than by luck. The opposite case is deliberately asymmetric: an UNKNOWN label (the ministry adding,
  # say, an oats row) is logged and skipped, never fatal -- so a new commodity would be dark here until
  # CROP_LABELS and this fence widen TOGETHER, which is the same one-change discipline the nass_annual
  # card states for its projection enum.
  #
  # THE MEASURED LEAK THE COMMODITY FENCE ALSO CLOSES, which is why "ALWAYS PASS A COMMODITY" is in the
  # notes as a hazard and not as etiquette: with no commodity, agg=latest compiles to
  # `ORDER BY as_of_date DESC, knowledge_date, value LIMIT 1` -- knowledge_date ties across all ten rows
  # of one snapshot, so the tiebreak falls through to `value` ASCENDING and the read returns the SMALLEST
  # number in the table. That is the rye row, a true 0.0, wearing whatever label the caller had in mind:
  # "Ukraine has exported nothing". The citrus card's unpinned-headline hazard, arriving through a
  # zero-valued row instead of through a mis-parsed fragment, and pinned in tests/unit/
  # test_capability_wiring.py rather than trusted to prose.
  gold_futures_spreads:
    description: >
      SAME-UNIT TWO-LEG FUTURES SPREADS, one row per (spread_id, trading session): the front-month
      spread between two contracts the platform serves, under the ONE named roll rule, with both
      legs' identity on the row. Two spreads today: kc_chi (HRW minus SRW wheat, US cents/bushel --
      the protein class premium) and white_yellow (JSE white minus yellow maize, ZAR/t -- the food
      premium). Each spread is single-unit BY LAW (both legs' unit and currency asserted equal at
      build; a venue re-quote refuses, never rescales).
    grain: "one row per spread_id x trading session"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "kc_chi history starts at the GLBX
    # open-interest floor (2015-11-19)"; white_yellow starts 2026-07-29 and stays a per-spread fact in the
    # notes
    first_obs: "2015-11-19"
    cadence: daily
    shape: wide
    commodity_col: spread_id
    commodity_values: [kc_chi, white_yellow]
    country_col: null
    period_type: date
    date_col: trade_date                  # exchange SESSION date; ISO 'YYYY-MM-DD' string
    knowledge_semantics: data_date
    knowledge_date_col: trade_date
    publication_lag_days: 1               # inherited from silver_futures_eod, arithmetic adds no lag
    partition_cols: []                    # flat gold object; projection FORBIDDEN
    provenance_col: spread_rule_version
    metrics:
      spread_value:
        label: "front-month spread"
        unit: "per-spread (see unit_overrides)"
        desc: >
          long-leg front settle minus short-leg front settle, in the pair's OWN unit (the unit column
          rides every row). SIGNED: negative means the short leg over the long leg -- a real reading.
        unit_overrides:
          kc_chi: "US cents/bushel"
          white_yellow: "ZAR/t"
        # THE ROLL FENCE (the gold_board_crush precedent, from day one): every served read excludes
        # sessions where EITHER leg's front contract changed vs the previous emitted session.
        row_filters:
          kc_chi:       &spread_roll_fence
            is_roll_boundary: ["0"]
          white_yellow: *spread_roll_fence
    notes: >
      A SPREAD IS NOT A PRICE: quote it as a premium/discount in its own unit ("HRW settled 104.5
      cents over SRW on 13 August 2026"), never as a level of either leg. NEGATIVE IS REAL (KC-Chi
      inverted in 2016 and 2023; a white-under-yellow print is a real food-demand signal). NEVER a
      percent change on a spread -- it crosses zero (the board-crush law). NEVER compare across
      spread_ids: different units, different currencies, different markets. kc_chi history starts at
      the GLBX open-interest floor (2015-11-19, the crush's own floor; earlier dates are REFUSED by
      the roll rule's input contract, not missing). white_yellow history starts 2026-07-29 -- the JSE
      feed is YOUNG: cite the session date, never "historically". Roll-boundary sessions stay in the
      TABLE for provenance and are never served (row_filters); the legs' own levels live in
      silver_futures_eod with their own units.

  silver_minagro_grain_exports:
    description: >
      MINAGRO (Ukraine's Ministry of Agrarian Policy and Food) -- the Ukrainian State Customs table of
      GRAIN, PULSE and FLOUR EXPORTS, marketing-year cumulative, in THOUSAND TONNES (kt). One row per
      as-of date x crop row: for each crop the season-to-date total since the marketing year opened on
      1 July, how much of that total came in the CURRENT CALENDAR MONTH, and the same two figures for
      the PREVIOUS marketing year at the same point of the season -- the ministry's own year-ago
      comparison, printed on the row. This is what physically cleared Ukrainian customs, an OBSERVED
      export pace and not a forecast. UKRAINE ONLY, and there is no destination axis at all: it says how
      much left the country, never where it went. The ministry republishes the page IN PLACE roughly
      weekly, so every row is one snapshot of a running total; the series accumulates as each weekly
      capture lands and its history extends BACKWARD as archived captures are added, so read the as-of
      stamps you actually get back rather than assuming a span.
    grain: "one row per as_of_date x crop_slug (one weekly snapshot of the ministry's cumulative table)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): NEITHER end is declarable and that is the
    # CARD'S OWN RULE: "COVERAGE GROWS FROM BOTH ENDS, SO NEVER STATE THIS TABLE'S SPAN FROM MEMORY" --
    # captures extend it forward weekly and backward as the wayback backfill lands
    cadence: weekly
    shape: wide
    commodity_col: crop_slug             # the ministry's ROW LABEL, NOT a contract slug (see notes)
    # D-PQ CLASS-1 fence: the ten row labels this table physically carries, DECLARED, so an off-list ask
    # (corn_cbot, a US wheat slug, sunflower oil, a Russian crop) is REFUSED at spec level with a
    # teaching error before any SQL is compiled. The list is the producer's REQUIRED_CROP_SLUGS -- the
    # completeness floor build_bronze hard-fails on -- so the fence and the physical DISTINCT set cannot
    # drift apart. The same facts are said again in `notes` on purpose: the notes teach, this enforces.
    commodity_values: [grains_pulses_total, wheat, barley, rye, corn,
                       wheat_flour, other_flour, flour_total, flour_grain_equivalent,
                       grain_flour_total]
    country_col: null                    # SINGLE-GEOGRAPHY table: every row is national Ukraine.
    #                                      Deliberately not declared -- there is no geography to select,
    #                                      and passing country= on a card with no country_col is SILENTLY
    #                                      IGNORED (query._filters), so the fence has to be prose. The
    #                                      fnc_colombia_monthly idiom; see notes.
    period_type: date
    date_col: as_of_date                 # the table's OWN "as of" date; a physical Glue DATE column
    knowledge_semantics: data_date
    knowledge_date_col: as_of_date       # the as-of IS the knowledge date -- one date, declared by the
    #                                      data, identical in the raw key, in bronze and in silver
    publication_lag_days: 0              # measured: the CMS publish stamp and the as-of date are the
    #                                      SAME DAY (09:05 Kyiv), so a row is citable only on the day it
    #                                      published; the residual is intra-day on a weekly series
    partition_cols: []                   # flat object; projection FORBIDDEN, no LIST surface, no year_col
    metrics:
      my_cumulative_kt:
        label: "marketing-year cumulative exports"
        unit: "kt"
        desc: >
          MARKETING-YEAR CUMULATIVE exports of that crop in THOUSAND TONNES -- the running season-to-date
          total since the marketing year opened on 1 July. A LEVEL, not a flow: within a season it only
          ever rises, and it resets at the next 1 July.
      month_to_date_kt:
        label: "month-to-date exports"
        unit: "kt"
        desc: >
          the part of that cumulative exported so far in the CURRENT CALENDAR MONTH ("of which"), in
          thousand tonnes. It is INCLUDED in my_cumulative_kt and is never added to it, and it resets on
          the 1st -- so it is a month-TO-DATE figure, and a completed monthly total only in the last
          capture before the month turns.
      prior_my_cumulative_kt:
        label: "prior marketing-year cumulative exports"
        unit: "kt"
        desc: >
          the PREVIOUS marketing year's season-to-date cumulative for the same crop at the same point of
          the season, as the ministry prints it on that same row -- the built-in year-ago comparison.
          Use it for pace; do not fetch a second as-of a year back.
      prior_my_month_kt:
        label: "prior marketing-year same-month exports"
        unit: "kt"
        desc: >
          the previous marketing year's same-month figure at that same point of the season -- the
          year-ago twin of month_to_date_kt, printed on the same row.
    notes: >
      UKRAINE AND NOTHING ELSE, AND THERE IS NO COUNTRY FILTER ON THIS CARD. Every row is the NATIONAL
      Ukrainian export total counted by the State Customs Service and republished by the ministry. There
      is no Russian, Kazakh, Romanian, Bulgarian, EU or aggregate "Black Sea" figure in this table:
      Ukraine is ONE origin of the Black Sea complex and is never a proxy for the corridor as a whole and
      never a proxy for Russia. A `country` argument is not offered and passing one changes NOTHING -- the
      read still returns Ukraine -- so say "Ukraine" out loud whenever you quote a figure from here. For
      Russia, or for USDA's own view of Ukraine's marketing-year balance, use silver_psd; for USDA's
      month-over-month revisions to Ukrainian PRODUCTION use silver_wap_table01_revisions with
      country='ukraine'.
      AND THERE ARE NO DESTINATIONS. This card says how much left Ukraine, never where it went: there is
      no destination, buyer, port or grade column anywhere in the table. "How much Ukrainian wheat went to
      Egypt / China / the EU" is NOT ANSWERABLE here -- decline rather than reaching for a US destination
      table, because silver_esr (sold) and silver_fgis (inspected, by destination) are US-ORIGIN flows and
      answer a question about a different exporter entirely.
      ONE LOOKUP = ONE METRIC AND ONE CROP. This card carries four metrics on a free crop axis with no
      default on either. `metric` is REQUIRED and there is no all-metrics and no all-crops read, so wheat
      against corn is one call per (metric, crop) pair, and a call that omits `metric` is rejected before
      anything is queried and still costs you a lookup from the budget.
      ALWAYS PASS A COMMODITY, AND THIS IS A MEASURED HAZARD RATHER THAN ETIQUETTE. With no crop named,
      a latest read orders by the as-of date and then breaks the ten-way tie on the VALUE ascending, so it
      returns the SMALLEST number in the snapshot -- which is the rye row, a published 0.0, wearing
      whatever label the question had in mind. The headline row of an unpinned read is precisely the row
      you must never cite. Name the crop.
      commodity = THE MINISTRY'S ROW LABEL, NOT A CONTRACT SLUG, and exactly these ten exist: wheat,
      barley, rye, corn, grains_pulses_total, wheat_flour, other_flour, flour_total,
      flour_grain_equivalent and grain_flour_total. corn_cbot, soft_red_winter_wheat_cbot, a NASS crop
      label, sunflower or sunflower oil, and any other origin's crop are not in this table and are refused
      before any SQL runs; decline rather than substituting a different crop or a different exchange's
      slug. Note that SUNFLOWER OIL -- Ukraine's largest ag export by value -- is NOT here: this is the
      grain, pulse and flour table only.
      THE TEN ROWS OVERLAP AND MUST NEVER BE SUMMED TOGETHER. grains_pulses_total is the total of all
      grains AND pulses, and the four named cereals are a SUBSET of it: wheat + barley + rye + corn does
      NOT equal the total, because the pulses and the minor grains are inside it and are not broken out --
      so never present the four as if they added up, and never call the residual missing data.
      wheat_flour + other_flour = flour_total. flour_grain_equivalent is that SAME flour restated as the
      grain it took to mill it, so flour is in the table TWICE in two different weights. grain_flour_total
      is the ministry's own grand total and equals grains_pulses_total + flour_grain_equivalent. Pick the
      total OR the parts, never both, and never add a flour-weight figure to a grain figure -- only
      flour_grain_equivalent is commensurable with grain at all.
      kt = THOUSAND TONNES. A reading of 1,291 kt is 1.291 MMT, i.e. 1,291,000 tonnes. Quote it as
      thousand tonnes (or convert explicitly and say you did); never present a kt figure as tonnes, which
      is wrong by a factor of a thousand, and never set one beside silver_psd's or silver_wasde's `_mt`
      columns without converting first -- those are RAW metric tonnes.
      A PUBLISHED 0.0 IS DATA, NOT ABSENCE. rye in particular prints a genuine 0.0 in all four columns in
      the weeks Ukraine ships none, and that is an OBSERVATION -- "no rye has moved this season" -- not a
      missing value, not a gap and not a parse failure. Report the zero as the finding it is. An absent
      measurement would be NULL, which is a different thing and must be reported as unknown rather than as
      zero.
      THE CUMULATIVE IS A RUNNING TOTAL AND THE SEASON RESETS ON 1 JULY. Ukraine's marketing year runs
      1 July to 30 June, so my_cumulative_kt climbs through the season and drops back to near zero at the
      turn. A difference between two as-ofs INSIDE one marketing year is the tonnage exported between
      those two captures -- a pace, and a legitimate read. A difference ACROSS the 1 July boundary is
      MEANINGLESS and must never be narrated as a collapse in exports. For the same reason a cumulative
      here is never differenced against a weekly FLOW from another table (silver_esr weekly sales,
      silver_fgis weekly inspections): a running total and a weekly flow are different objects.
      month_to_date_kt IS INSIDE THE CUMULATIVE, NEVER BESIDE IT. It is the ministry's "of which" column,
      so adding it to my_cumulative_kt double-counts the month. It resets on the 1st of each calendar
      month, so an early-month capture prints a small number that is NOT a monthly total and must never be
      annualised or compared with a full month; only the last capture before the month turns approximates
      the completed month.
      USE THE PRIOR-YEAR COLUMNS FOR THE YEAR-AGO COMPARISON -- DO NOT FETCH A SECOND AS-OF.
      prior_my_cumulative_kt and prior_my_month_kt are the ministry's OWN year-ago figures for the same
      crop at the same point of the season, printed on the same row, so "is the pace running ahead of or
      behind last year" is ONE lookup and a ratio of two numbers you already hold. Pinning an as-of twelve
      months back answers a DIFFERENT question -- that season's own snapshot, at a different calendar date,
      and possibly a date this table holds no capture for. The year-ago comparison date is the ministry's
      own basis and is not carried as a column, so describe it as "the same point last season" and never
      as an exact date.
      THE AS-OF IS THE PERIOD AXIS AND IT IS WEEKLY-IRREGULAR. The ministry updates this page IN PLACE,
      roughly weekly, and each row is one snapshot stamped with the table's own as-of date. There is NO
      vintage axis: a past as-of is never restated, so two rows are two OBSERVATIONS and never two
      versions of one figure -- never difference two rows and call the result a revision. agg=latest
      returns the newest snapshot on or before the as-of, which is the right shape for "where does the
      pace stand"; window a stretch with period_start/period_end as 'YYYY-MM-DD' against the as-of date.
      Captures are IRREGULAR -- a week can be missing and the gap between two rows is not always seven
      days -- so quote the as-of date on every figure, never assume the previous row is exactly a week
      earlier, and never call a dated reading 'current'.
      COVERAGE GROWS FROM BOTH ENDS, SO NEVER STATE THIS TABLE'S SPAN FROM MEMORY. New captures extend the
      series forward every week and archived captures extend it BACKWARD, so both the oldest and the
      newest readable as-of move. Read the as-of stamps of the rows you actually got back and cite those;
      if a requested date returns nothing, say no capture is held for it rather than presenting the
      nearest earlier snapshot as though it were that date -- a latest read on this card silently answers
      with the newest capture on or before your as-of, which can be older than you assumed.
      CROSS-TABLE: THIS IS THE CUSTOMS COUNT, NOT THE BALANCE SHEET. silver_psd carries USDA's ESTIMATE
      and forecast of Ukraine's marketing-year exports in raw metric tonnes; this card carries what
      actually cleared customs, week by week, in thousand tonnes. They are different objects with
      different units and different authors -- never mix them into one figure, and treat a divergence
      between them as a real question (USDA's forecast versus the realised pace) rather than as an error.
      For US export pace use silver_esr (sold) and silver_fgis (inspected and loaded); for the macro
      pressure behind Ukrainian export-restriction risk use silver_food_cpi.
