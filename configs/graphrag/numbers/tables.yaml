      No commodity/country filter. agg=latest returns the rate as-of a date; period_start/end + agg for a window.
      Direction is the "local currency per USD" convention (verify against source before hard sizing).
      THE ARGENTINE PESO SERIES IS DEAD AT SOURCE: ars_usd's last non-null observation is 2020-10-30 (the
      ECB stopped publishing an ARS reference rate) -- the column stays for history, but never quote it as
      a current rate and never say the estate lacks ARS "data": it has sixteen years of history and a
      dead front. The ELEVEN NEW CROSSES (2026-08-25) fill forward from the next daily fetch across the
      full 2004+ history; until that first post-widening fire lands they exist on the card but hold no
      rows, and an as-of read before it honestly returns nothing.

  silver_noaa_oni:
    description: >
      NOAA Oceanic Nino Index (ONI) — the canonical ENSO state, MONTHLY. oni_anom is the 3-month running SST
      anomaly (>= +0.5 El Nino, <= -0.5 La Nina); flags mark El Nino / La Nina months and the Brazil/Argentina
      teleconnection regimes. No date column — identified by year + month, known at month end (year_month guard).
    grain: "one row per year x month"
    # COVERAGE (PA-1, hoisted from this card's own measured text): monthly ENSO state; no census stated
    cadence: monthly
    shape: wide
    period_type: date
    year_col: year
    month_col: month
    knowledge_semantics: year_month
    metrics:
      oni_anom:     {label: "ONI anomaly", unit: "degC", desc: "ONI 3-month SST anomaly (>= +0.5 El Nino, <= -0.5 La Nina)"}
      oni_lag3:     {label: "ONI (3-month lag)", unit: "degC", desc: "ONI lagged 3 months"}
      oni_lag6:     {label: "ONI (6-month lag)", unit: "degC", desc: "ONI lagged 6 months"}
      el_nino_flag: {label: "El Nino episode flag", unit: "0/1", desc: "1 if the month is classified El Nino"}
      la_nina_flag: {label: "La Nina episode flag", unit: "0/1", desc: "1 if the month is classified La Nina"}
    notes: >
      No commodity filter (global ENSO state). agg=latest = the current ONI as-of a date. as-of compares
      (year*100 + month) <= asof year-month, so a mid-month asof sees only completed months.

  # WIRING WAVE-1 (Card A): NOAA Indian Ocean Dipole, the ONI sibling. year_month semantics (year+month,
  # no date col). Serves the observed DMI + its 3-month running mean; iod_phase (string categorical) and
  # iod_dmi_ethiopia_lag4 (a commodity-specific engineered feature) are EXCLUDED -- the numbers pipeline
  # serves numeric observed values, not a string metric or a modelling input. NaN-honesty: the producer
  # TRIMS any trailing all-NaN placeholder tail, so the max present (year,month) IS the last real reading
  # and agg=latest serves a real number, never a sentinel. Flat, projection-forbidden.
  # C3 (2026-08-01) -- CORRECTED. This line used to read "enters NO cascade_map (global climate state, no
  # engine leg)". That recorded wiring-wave-1's SCOPE, not a doctrine: the table is the exact structural
  # twin of silver_noaa_oni, whose oni_climate row has been mapped since P9-B. It now ENTERS cascade_map
  # as `iod_climate`, an era/current climate-state leg. NO pace leg -- silver_noaa_iod is absent from
  # cascade.PACE_TABLES while its ONI sibling is present, which is a deliberate code fact and where to
  # look if a pace claim on IOD is ever expected.
  # IOD SOURCE SWITCH (ADR_IOD_SOURCE_SWITCH, RATIFIED 2026-07-24, Option B): the basis moved from the
  # FROZEN NOAA PSL HadISST1.1 file (dead at 2025-04, ~13 months without a regeneration) to the LIVE
  # NOAA CPC ERSSTv5 IODMI record (1950-01..present). The card text is re-cut with it: the old
  # "many months stale" framing described a dead source and is replaced by the live monthly cadence +
  # the ~30-45d publication lag + the 45d freshness SLA. Table id, metrics and PIT fields are unchanged
  # (decision 6.4), so this is a TEXT-only card edit -- reconcile_numbers stays clean by construction.
  silver_noaa_iod:
    description: >
      NOAA Indian Ocean Dipole (Dipole Mode Index, DMI) -- the canonical IOD state, MONTHLY, from the
      NOAA CPC IODMI record (ERSSTv5 SSTs, anomalies vs the FIXED 1991-2020 climatology), 1950-01
      onward. dmi_value is the west-minus-east tropical Indian Ocean SST-anomaly gradient (positive IOD
      warms the west / East Africa and cools the east / Indonesia-Australia); iod_dmi_3month_avg is its
      3-month running mean. No date column -- identified by year + month (year_month guard). A completed
      month is published about 30-45 days after month end, so the newest available month normally trails
      today by roughly one month; that is the source's live cadence, not a gap. Global climate state; no
      commodity filter.
    grain: "one row per year x month"
    # COVERAGE (PA-1, hoisted from this card's own measured text): NOAA CPC ERSSTv5 IODMI record,
    # 1950-01..present (description + the ADR note)
    first_obs: "1950-01"
    cadence: monthly
    shape: wide
    period_type: date
    year_col: year
    month_col: month
    knowledge_semantics: year_month
    metrics:
      dmi_value:          {label: "IOD dipole index", unit: "degC", desc: "IOD Dipole Mode Index, monthly SST-gradient anomaly (positive = positive IOD)"}
      iod_dmi_3month_avg: {label: "IOD dipole index 3-month average", unit: "degC", desc: "DMI 3-month running mean (seasonal IOD signal)"}
    notes: >
      No commodity/country filter (global IOD state). agg=latest = the latest published DMI as-of a
      date; window months with period_start/period_end as 'YYYY-MM'. as-of compares (year*100 + month)
      <= asof year-month, so a mid-month asof sees only completed months. The source is LIVE and
      monthly with a ~30-45 day publication lag, held to a 45-day freshness SLA (registry
      freshness_sla.max_lag_days, F082 staleness alarm): cite the reading's own month and let the
      one-month cadence gap stand as normal -- never call a dated reading 'current' and never treat the
      lag as missing data. Units are degC SST anomalies vs the FIXED 1991-2020 climatology (ERSSTv5,
      served as published), so magnitudes are comparable across the whole 1950+ record but NOT with
      pre-2026 HadISST-basis figures quoted elsewhere (the 1997 peak reads 1.55 here, 1.28 on the
      retired basis). A climate index in degC, never a price or a crop-outcome forecast; positive-IOD
      teleconnections (East-Africa/arabica, Australia) are qualitative context, not a served number.

  gold_weather_z:
    description: >
      Gold weather z-table (Phase D-W4) — MONTHLY, per commodity growing region, point-in-time-safe
      standardized weather-stress anomalies derived transform-upstream from the silver weather sources
      (NASA POWER temperatures + CHIRPS precipitation). Tall/long: one row per commodity x country x region
      x year x month x metric. Each z compares the month against the SAME MONTH in the trailing prior years
      (the baseline excludes the observation year), so a value for year Y never sees Y. Non-revising
      observational anomalies — as-of a date = months whose (year, month) is on or before the as-of
      year-month. Decoupled from BOTH the deferred MLOps gold.feature_spine (silverleg.py:16-20 bars the
      cascade from it) AND the projected raw-observation weather layer upstream of it (the Jul-2026
      LIST-storm class); this table is non-projected and mirror-friendly, and it is the ONLY weather table
      you can look up -- there is no raw daily temperature or precipitation card here, so a raw-value
      weather ask is answered as an ANOMALY (z) or declined, never routed to another weather table.
    grain: "one row per commodity x country x region x year x month x metric"
    # COVERAGE (PA-1, W0-5 projection wave 2026-08-25): MEASURED across the 31 live gold parquets
    # (footer census). NO last_obs -- the table refreshes on the weather cycle. Lane 2's basin work
    # re-measures this in the same change that adds the tail-share/cells metrics (a gold re-run
    # rewrites all 31 objects).
    row_count: 779213
    first_obs: "1981"
    cadence: monthly
    shape: tall
    commodity_col: commodity
    country_col: country
    # period_type mirrors the ONI year_month sibling ('date'): the registry period_type enum has no
    # 'year_month' member and this field is cosmetic here (only agent.py prints it, and only when period_col
    # is set — gold_weather_z has none). The as-of + windowing machinery is driven by knowledge_semantics
    # below, NOT by this field. The cascade_map row that un-defers onto this table (D-W5) sets its OWN
    # period_type: year_month (config_check.py:138 accepts it there).
    period_type: date
    year_col: year                       # year_month semantics: (year*100+month) is the window/guard axis
    month_col: month
    knowledge_semantics: year_month       # as-of guard = (year*100+month) <= asof_ym (no CAST, no partition)
    metric_col: metric                    # tall: the metric NAME lives here
    value_col: value                      # tall: the z-score / flag value lives here
    metrics:
      drought_z:        {label: "drought z-score", unit: "z", desc: "longest consecutive dry-day run in the month, z vs prior-year same months (CHIRPS)"}
      heat_stress_z:    {label: "heat-stress z-score", unit: "z", desc: "count of days above the heat threshold in the month, z vs prior-year same months"}
      gdd_z:            {label: "growing-degree-day z-score", unit: "z", desc: "growing-degree-days accumulated in the month, z vs prior-year same months"}
      tmax_anomaly:     {label: "max-temperature anomaly", unit: "z", desc: "mean daily max temperature in the month, z vs prior-year same months"}
      frost_event_flag: {label: "frost occurrence", unit: "0/1", desc: "1 if the monthly minimum temperature fell below the frost threshold"}
      # -- AGGREGATE rows only (GN-2 W1.1 + W-2/W-3/W-4, 2026-08-25; weather_z._basin_rows): rows whose
      # country is a BASIN surface ('West Africa', 'EU Belt', 'SE Asia Palm Belt', 'Northern Plains')
      # at region <basin>_basin, or a MEMBER country at region <member>_country -- the per-country tail
      # tier. On a per-CELL row these have ZERO rows: honest absence, never an error. The country tier
      # deliberately carries NO <metric> mean -- the per-cell rows already sit under that same country
      # surface and region is not a v1 filter, so a same-named mean would double-count the country
      # against itself. STORED share values are raw fractions 0-1; the cascade's tail line serves them
      # as % via the sanctioned scale knob (the su_ratio ratio-normalizer precedent), so the narration
      # quotes "18.2 %" while the pg row keeps 0.1818 -- figures in analyst units, always beside the
      # plain-language framing, never one without the other (owner's word 2026-08-22).
      drought_z_tail_share:     {label: "share of basin cells in drought-z tail", unit: "share of basin cells", desc: "share of the basin's (or member country's) cells at or beyond +2 sigma drought_z that month (0-1)"}
      heat_stress_z_tail_share: {label: "share of basin cells in heat-stress tail", unit: "share of basin cells", desc: "share of the basin's (or member country's) cells at or beyond +2 sigma heat_stress_z that month (0-1)"}
      gdd_z_tail_share:         {label: "share of basin cells in GDD tail", unit: "share of basin cells", desc: "share of the basin's (or member country's) cells at or beyond +2 sigma gdd_z that month (0-1)"}
      tmax_anomaly_tail_share:  {label: "share of basin cells in max-temperature tail", unit: "share of basin cells", desc: "share of the basin's (or member country's) cells at or beyond +2 sigma tmax_anomaly that month (0-1)"}
      frost_event_share:        {label: "share of basin cells with frost", unit: "share of basin cells", desc: "share of the basin's (or member country's) cells whose monthly minimum fell below the frost threshold (0-1; the flag renamed at aggregate grain so a fraction is never misread as a flag)"}
      # -- <metric>_cells (W-3, the fidelity guard that ships WITH the basins): how many member cells the
      # aggregate row above was built from, at BOTH grains. Integer counts stored as floats. The
      # >=2-member-countries test runs on the WHOLE commodity frame across ALL metrics, but the sources
      # do not cover the members equally: CHIRPS stops at latitude 50 (configs/sources/chirps.yaml,
      # coverage.lat_max). MEASURED 2026-08-25 -- french_rapeseed_matif loses ALL 4 German, ALL 3 Polish
      # and 1 of 5 French drought cells; french_wheat_matif 3 of 4 German, ALL 3 Polish and 1 of 6
      # French; hard_red_spring_wheat_mgex 2 of 3 CANADIAN. So an 'EU (France/Germany/Poland)' drought
      # leg is answered by a basin holding ZERO German or Polish drought cells, and a 'Northern Plains'
      # one by a basin that is 4/5 US -- while the temperature metrics on the SAME surface carry every
      # member. Reading drought_z_cells BESIDE tmax_anomaly_cells (8 vs 16) is what makes that visible;
      # a member with no cells for a metric simply has NO country-tier row for it.
      drought_z_cells:          {label: "member cells behind the drought-z read", unit: "cells", desc: "count of member grid cells contributing to this basin or member-country drought_z aggregate that month (source-coverage provenance; short against a sibling metric's count means the source does not cover every member)"}
      heat_stress_z_cells:      {label: "member cells behind the heat-stress read", unit: "cells", desc: "count of member grid cells contributing to this basin or member-country heat_stress_z aggregate that month"}
      gdd_z_cells:              {label: "member cells behind the GDD read", unit: "cells", desc: "count of member grid cells contributing to this basin or member-country gdd_z aggregate that month"}
      tmax_anomaly_cells:       {label: "member cells behind the max-temperature read", unit: "cells", desc: "count of member grid cells contributing to this basin or member-country tmax_anomaly aggregate that month"}
      frost_event_flag_cells:   {label: "member cells behind the frost read", unit: "cells", desc: "count of member grid cells contributing to this basin or member-country frost_event_share that month"}
    notes: >
      z-scores are dimensionless (scale 1 — never delta a z against a level). country is the PSD Title-Case
      surface form ('United States', 'Brazil', 'European Union') so a country_rule=region weather leg
      resolves against it instead of going DARK. region is carried through but is NOT a query filter in v1
      (a windowed leg aggregates across the commodity's regions). period =
      year+month; as-of compares (year*100 + month) <= asof year-month. A mid-month asof sees only
      COMPLETE months because the transform drops any month not covering every calendar day (RCA
      2026-07-24: a ~23-day July's GDD sum z-scored against full-month baselines served gdd_z=-13.16) —
      the latest row can therefore lag up to ~5 weeks behind today; that staleness is honest, not a gap.
      z values are winsorized at +/-6: a serve of exactly +/-6.0 means "at or beyond the plausibility
      cap" (thin same-month baselines make larger magnitudes statistical noise), and any |z|>6 from this
      table is a data defect, never a real reading. frost_event_flag is a 0/1 flag, not a z.

  # NUMBERS-DEPTH WAVE (Track A): three UDP/B-wave-certified silver tables wired into the numbers
  # stack so the agent surfaces observed, point-in-time-correct cocoa / Malaysian-palm / SA-maize
  # figures behind the SAME leakage-safe harness as PSD/WASDE/ESR. All three are flat, projection
  # forbidden (no LIST-storm class), and NONE enters cascade_map (the reroute-v2 engine is untouched).
  # The three su_ratio columns below are DIFFERENT formulas from the PSD-World stocks-to-use the
  # reroute engine reads -- a naming collision only; each card labels its own formula.

  silver_icco_cocoa:
    description: >
      ICCO Quarterly Bulletin of Cocoa Statistics -- the authoritative WORLD cocoa balance sheet,
      collapsed to one row per cocoa marketing year. Grindings (world use), production, end stocks
      and stocks-to-use, each taken from the latest ICCO release that carried it. Annual grain.
    grain: "one row per cocoa_year (world balance sheet)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): one row per cocoa_year; no census stated
    cadence: annual
    shape: wide
    commodity_col: null                 # single-commodity (cocoa); no commodity filter (W0-5)
    country_col: null                   # world aggregate; no country axis
    period_col: cocoa_year
    period_type: marketing_year
    period_sql_type: string             # values are '2024/25' (probed)
    knowledge_date_col: latest_release_date
    knowledge_semantics: vintage
    publication_lag_days: 0             # latest_release_date IS the publication event
    grain_cols: [cocoa_year]            # one row per year already; vintage guard just withholds future releases
    metrics:
      production_kt:  {label: "production", unit: "1000 MT", desc: "world cocoa production (thousand tonnes)"}
      grindings_kt:   {label: "grindings", unit: "1000 MT", desc: "world cocoa grindings = world use (thousand tonnes)"}
      end_stocks_kt:  {label: "end stocks", unit: "1000 MT", desc: "world end-of-year cocoa stocks (thousand tonnes)"}
      su_ratio:       {label: "stocks-to-use ratio", unit: "ratio",   desc: "ICCO stocks-to-use = end_stocks_kt / grindings_kt (ANNUAL; NOT the PSD-World su_ratio)"}
    notes: >
      Single-commodity WORLD table (cocoa) -- omit commodity/country. period = cocoa marketing year
      as a string '2024/25'. Values are in THOUSAND tonnes (kt). su_ratio is ICCO's annual
      stocks/grindings ratio. Bronze QBCS is quarterly but silver retains only the ANNUAL
      balance sheet, one row per cocoa_year, stamped with the latest release that published it.

  silver_mpob:
    description: >
      MPOB (Malaysian Palm Oil Board) monthly palm-oil statistics -- production, closing stocks,
      exports/imports and a monthly stocks-to-exports ratio for Malaysian crude palm oil. Monthly
      grain; each month's stats are published ~10th of the FOLLOWING month.
    grain: "one row per commodity x month (first-of-month data date)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "silver_mpob's canonical parquet begins
    # 2016-12 and runs to the present" (the mpoc_trade_stats cross-check block). LIVE front -> no last_obs
    first_obs: "2016-12"
    cadence: monthly
    shape: wide
    commodity_col: commodity            # single value malaysian_crude_palm_oil_cme (probed)
    period_type: date
    date_col: date                      # first-of-month DATA month, string '2016-12-01' = Dec-2016 stats
    knowledge_semantics: data_date
    knowledge_date_col: date
    publication_lag_days: 43            # D1: conservative fixed lag -- see calibration
    metrics:
      production_cpo_mt:          {label: "production crude palm oil", unit: "MT", desc: "crude palm oil production in the month"}
      closing_stocks_palm_oil_mt: {label: "palm oil closing stocks", unit: "MT", desc: "end-of-month palm oil stocks"}
      exports_palm_oil_mt:        {label: "exports palm oil", unit: "MT", desc: "palm oil exports in the month"}
      imports_palm_oil_mt:        {label: "imports palm oil", unit: "MT", desc: "palm oil imports in the month"}
      su_ratio:                   {label: "stocks-to-use ratio", unit: "ratio", desc: "MONTHLY closing stocks / that-month exports (NOT the PSD annual stocks-to-use)"}
    notes: >
      commodity = malaysian_crude_palm_oil_cme (the only value). date is the DATA month stamped
      first-of-month; window with period_start/period_end 'YYYY-MM-DD' or agg=latest for the newest
      published month. Values in metric tonnes. This is MONTHLY -- for the USDA ANNUAL palm balance
      sheet use silver_psd. su_ratio here is a monthly stocks/exports ratio.
      (ffb_price_myr_per_mt remains excluded: MYR-native with no MYR in fred_fx -- deferred to
      futures v1.5 under PRICE_OBSERVABILITY_DECISION; the price fence now lives in the REGISTER,
      not the data.)

  # D-PQ TRANCHE 1a (2026-08-07) -- MPOC IMPORTER-COUNTRY VEGETABLE-OIL STOCKS. From the dark-table
  # resurrection matrix (docs/private/recon/dark-table-resurrection-matrix.md, row 4): canonical is
  # current, the publish chain is intact (mpoc DAG, cron 0 12 15 * ? *, silver --publish-mode shadow
  # then a promote phase in canonical mode; publish_class A, retrofit_landed true) and the SILVER-F010
  # contract is complete. Nothing is ingested, re-chunked or re-derived -- this card is the whole fix.
  #
  # WHAT THE TABLE ACTUALLY IS, measured 2026-08-07 rather than assumed: 272 rows, 5 IMPORTING
  # countries (bangladesh, china, india, pakistan, usa) x 4 oils (palm_oil, rapeseed_oil, soybean_oil,
  # sunflower_oil) x 18 months, 2025-01..2026-06, zero nulls, zero duplicates on the full natural key.
  # The recon deck's headline for this table ("Malaysian palm ending stocks vs Indonesia's") does NOT
  # describe it -- there is no Malaysia row and no Indonesia row. It is the DESTINATION-side stock
  # picture: what the big buyers are sitting on. That is the honest desk story and the card says so,
  # because a card that inherits a wrong subject line mints wrong citations.
  #
  # PIT: year_month, minted here (the F010 contract carried nulls for all three knowledge fields
  # before this card, exactly like silver_nass_crop_progress at D-CW-2a). The as-of guard is the
  # ONI/IOD one -- (year*100 + month) <= asof year-month.
  #
  # WHAT THAT GUARD DOES **NOT** DO, STATED PLAINLY BECAUSE THE FIRST DRAFT OF THIS CARD OVERCLAIMED IT.
  # It compares MONTH LABELS, not publication events, so the CURRENT month is always admitted: at asof
  # 2026-06-01 a 2026-06 row passes the guard, and MPOC does not print June until roughly 2026-07-15.
  # The leak window is therefore the whole data month PLUS the print lag -- up to ~45 days, not the
  # "~2 weeks" this comment used to claim -- and "a mid-month as-of sees only COMPLETED months" is
  # simply false (the incomplete current month is admitted, and the ONI/IOD wording this inherited was
  # never a no-leak guarantee either). LIVE SERVING IS SAFE ONLY BECAUSE THE ROW IS PHYSICALLY ABSENT
  # until MPOC publishes it; every HISTORICAL REPLAY / BACKTEST as-of leaks, because the row exists by
  # then. That is the honest statement of the gap, and it is a bound on how this card may be used
  # (do not replay it as though it were vintage), not a claim that the gap is closed.
  #
  # publication_lag_days is deliberately NOT set, and the reason is STRUCTURAL rather than a choice:
  # the year_month branch of the guard returns BEFORE the publication-lag shift is applied
  # (query._guard -> the year_month branch returns above _pub_lagged_asof), so a lag declared here
  # could not shift anything -- it would be inert decoration that the F010 reconcile would then have
  # to carry as a real number. Closing the ~45-day window needs a real knowledge column on the F010
  # contract (or a lag-aware year_month branch), which is its own change; the cadence sentence in
  # `notes` is a WARNING to the reader, never a fix.
  #
  # SARGABLE PARTITION DISCIPLINE: none needed, and that is a FACT about this table rather than an
  # omission. It is flat (partition_mode flat, projection forbidden, partition_keys []), so there is
  # no projected grid to prune and no LIST-storm class here; the bare `year <= <asof year>` bound the
  # year_month guard already emits is the whole story. Do not add partition_cols -- reconcile_numbers
  # would then require them to be real Glue partition keys and fail the build.
  silver_mpoc_stock_comparison:
    description: >
      MPOC (Malaysian Palm Oil Council) monthly ENDING STOCKS of the four major vegetable oils held in
      the large importing markets -- Bangladesh, China, India, Pakistan and the United States. One row
      per country x oil type x month. This is the DESTINATION-side stock picture (what the buyers hold),
      NOT origin stocks: for Malaysian production / closing stocks / exports use silver_mpob, and for
      the USDA annual world oilseed balance sheet use silver_psd. Monthly grain; a completed month is
      published around the middle of the following month.
    grain: "one row per country x oil_type x year x month"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "272 rows, 5 IMPORTING countries ... x 4
    # oils x 18 months, 2025-01..2026-06" (2026-08-07). The month front still MOVES (notes: expect it to
    # trail by one to two months) -> no last_obs
    row_count: 272
    first_obs: "2025-01"
    cadence: monthly
    shape: wide
    commodity_col: oil_type             # the OIL axis; values are oil names, NOT contract slugs (see notes)
    country_col: country                # the HOLDING country (lower_snake); this is a destination axis
    period_type: date                   # cosmetic here (no period_col) -- the ONI/IOD/gold_weather_z idiom
    year_col: year                      # year_month semantics: (year*100+month) is the guard/window axis
    month_col: month
    knowledge_semantics: year_month     # as-of guard = (year*100+month) <= asof year-month
    metrics:
      ending_stocks_mt: {label: "ending stocks", unit: "MT", desc: "end-of-month stocks of that oil held in that country (metric tonnes)"}
    notes: >
      ALWAYS PASS BOTH A COUNTRY AND AN OIL. This table carries TWO free axes and neither has a
      default: with no country the read spans every holding country and a latest-value read returns
      ONE arbitrary country's row, and with no oil it returns one arbitrary oil -- a Pakistani
      sunflower number wearing an Indian palm label. commodity selects the oil and takes exactly
      palm_oil, rapeseed_oil, soybean_oil or sunflower_oil (oil names, NOT contract slugs -- there is
      no corn/wheat/cocoa row here). country takes lower_snake names and only these five exist:
      bangladesh, china, india, pakistan, usa (lower case, unlike the Title-Case surface form
      gold_weather_z uses). Anything else -- Indonesia, Malaysia, the EU, any origin country -- is NOT
      in this table; decline rather than substituting a different country.
      Values are metric TONNES of end-of-month stocks: a LEVEL, never a flow. A month-on-month delta
      is a stock BUILD or DRAW, which is a different quantity from imports or exports (those live in
      silver_mpoc_trade_stats_monthly, which has no card, and in silver_psd).
      COVERAGE IS SHORT AND THAT IS THE DATA: the series starts 2025-01, so there is no multi-year
      history to z-score against and no same-month analog before 2025 -- refuse a "how unusual is
      this versus history" ask on this table rather than computing a two-observation baseline.
      Window months with period_start/period_end as 'YYYY-MM', or agg=latest for the newest published
      month on or before the as-of. THE AS-OF GUARD COMPARES MONTH LABELS, NOT PUBLICATION DATES:
      (year*100 + month) <= asof year-month admits the CURRENT, incomplete month, and MPOC does not
      print a month until roughly the middle of the NEXT one -- so the guard alone does not prove a
      reading was knowable at the as-of. In live use the row simply does not exist yet; in a historical
      replay it does, and the guard will hand it to you. Treat any month at or after the as-of month as
      NOT YET PUBLISHED regardless of what the guard returns, expect the newest genuinely-published
      month to trail today by one to two months, and cite the reading's own year and month -- never
      call a dated reading 'current' (the same discipline the IOD card states for its monthly cadence).

  # D-LD TRANCHE 2 (2026-08-18) -- MPOC MALAYSIAN PALM EXPORTS BY DESTINATION COUNTRY, the annual
  # DESTINATION-side twin of silver_mpoc_stock_comparison directly above. It is the second half of the
  # same MPOC trade-statistics page the stocks card already serves.
  #
  # THE D-LD PLAN'S ROW 5 SAID `wide/year_month` AND THAT WAS WRONG, recorded here rather than
  # quietly fixed: this table has NO month column (year x country x exports_mt x source, four
  # columns, measured). year_month semantics RAISE at query._guard:439 without year_col AND
  # month_col, so the plan's designation belongs to the sibling silver_mpoc_trade_stats_monthly.
  # D-PQ tranche 1a had already refused this table on exactly that ground
  # (tests/unit/test_dpq_dark_tables.py, `_SKIPPED[...] = "guard"`).
  #
  # WHAT UNBLOCKED IT: the D-LD Tranche-2 pre-step (the WIRING-WAVE-1 idiom the SAGIS weekly-exports
  # card used for week_ending_date) added ONE producer-derived column, `year_ending_date` DATE =
  # <year>-12-31, and the same batch re-run discharged the CHINA P.R / U.S.A normalizer aliases that
  # were silently dropping 9 rows. PIT is therefore data_date on the period-END date plus a
  # conservative publication lag -- the sagis_weekly_exports shape exactly, one grain coarser.
  # CATALOG STATE, stated so a reader does not mistake it for drift: the column is STAGED HIDDEN in
  # the F010 contract (CURATION_OVERRIDES additive_columns_hidden, glue_type null) and present in the
  # checked-in hand DDL, which config_check.check_numbers_schema_pins reads -- so the card resolves
  # while the generated DDL still renders FOUR columns == live Glue until the gated ADD COLUMNS lands.
  # That is the SILVER-F059 sagis staging precedent, column for column.
  #
  # PUBLICATION LAG CALIBRATION (conservative, provisional -- the MPOB D1 idiom). The Jan-Dec total
  # is complete only after December, and MPOC's year page carries the full-year destination table in
  # the FOLLOWING January (Malaysian December trade data prints ~10-20 Jan). +60d makes calendar
  # year Y citable from (Y+1)-03-01: never early, at most ~6 weeks late. The lag shifts the as-of RHS
  # LITERAL (_pub_lagged_asof), so the guard stays sargable and backend-agnostic. It guards the AS-OF
  # axis and NOTHING ELSE: dag_catalog FRESHNESS_LAG_OVERRIDES pins the WRITE-recency ceiling at the
  # annual cadence default (400) so the 60 is never ADDED to it (the mpoc DAG fires monthly on the
  # 15th regardless of content lag -- the banked fgis/fnc category error).
  #
  # SARGABLE PARTITION DISCIPLINE: none needed, and that is a FACT about this table, not an omission
  # -- partition_mode flat, projection forbidden, partition_keys [], one 3.9 KB object. There is no
  # projected grid to prune and no LIST-storm class here. Do NOT add partition_cols: reconcile_numbers
  # would then require them to be real Glue partition keys and fail the build. No year_col either --
  # it would only duplicate the `period` extra alias on the same physical column and buy no pruning.
  silver_mpoc_exports_by_country:
    description: >
      MPOC (Malaysian Palm Oil Council) MALAYSIAN PALM OIL EXPORTS BY DESTINATION COUNTRY -- one row
      per calendar year x destination, the Jan-Dec tonnage Malaysia shipped to that market. This is
      the DESTINATION-side export book (who bought Malaysian palm), NOT origin-side output: for
      Malaysian production / closing stocks / national monthly exports use silver_mpob, for the
      destination-side vegetable-oil ENDING STOCKS those same buyers hold use
      silver_mpoc_stock_comparison, and for the USDA annual world palm balance sheet use silver_psd.
      Each year publishes a TOP-DESTINATION panel of eight to ten countries ranked by that year's own
      volume, so the country list CHANGES year to year. Annual grain; a completed calendar year is
      published the following January.
    grain: "one row per calendar year x destination country (annual top-destination panel)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): FIFTEEN annual pages 2009-2023
    # (mpoc_archive.yaml, enumerated in the trade-stats block); "COVERAGE STOPS AT CALENDAR YEAR 2023" is a
    # CLOSED archive, so the ceiling is declarable
    first_obs: "2009"
    last_obs: "2023"
    cadence: annual
    shape: wide
    country_col: country                # the DESTINATION country (lower_snake); the only free axis
    period_col: year                    # the CALENDAR year of the flow (Jan-Dec), an integer
    period_type: year
    period_sql_type: int
    date_col: year_ending_date          # D-LD pre-step DERIVED ISO date (<year>-12-31)
    knowledge_semantics: data_date
    knowledge_date_col: year_ending_date
    publication_lag_days: 60            # Jan-Dec complete + the following-January print; never leaks
    # D-PQ CLASS-1, applied to a card with NO commodity axis. There is no product column here (every
    # row is Malaysian palm oil), so `commodity` emits no SQL -- but an EMPTY commodity_values means a
    # lookup naming corn_cbot or cocoa would sail through and return a palm tonnage wearing a grain
    # label. agent._check_commodity_class reads commodity_values ALONE (it never consults
    # commodity_col), so declaring the closed set here is a free, pre-SQL, teaching refusal. Both
    # surface forms are listed on purpose: `palm_oil` is the sibling MPOC card's oil vocabulary and
    # `malaysian_crude_palm_oil_cme` is the routed contract slug silver_mpob serves, and refusing a
    # caller for picking the other one of the two names for the SAME product would be a manufactured
    # decline. contract_check (C002) does not DISTINCT-probe this field, so no zero-row hazard.
    commodity_values: [palm_oil, malaysian_crude_palm_oil_cme]
    metrics:
      exports_mt: {label: "exports", unit: "MT", desc: "Malaysian palm oil exported to that destination in that calendar year (metric tonnes, Jan-Dec total)"}
    notes: >
      ALWAYS PASS A COUNTRY. This card carries ONE metric and ONE free axis, and that axis has no
      default: with no country the read spans every destination in the panel and a latest-value read
      returns ONE arbitrary country's row -- a Kenyan tonnage wearing an Indian label. country takes
      lower_snake destination names and only these appear anywhere in the table: bangladesh is NOT
      one of them (see the shortlist rule below) -- the observed set is china, egypt, eu, india,
      iran, italy, japan, kenya, netherlands, pakistan, philippines, saudi_arabia, south_korea,
      turkey, ukraine, usa, vietnam. There is no malaysia row and no indonesia row: Malaysia is the
      ORIGIN of every tonne here and can never be a destination, and Indonesian exports are not in
      this dataset at all -- decline rather than substituting a different country or a different
      origin.
      IT IS A TOP-DESTINATION PANEL, NOT A DESTINATION LIST, AND THAT IS THE SINGLE EASIEST WAY TO
      MISREAD IT. Each MPOC year page publishes only the eight to ten largest destinations RANKED BY
      THAT YEAR, so the country set changes from year to year and only india and pakistan appear in
      all fifteen years. A COUNTRY MISSING FROM A YEAR WAS NOT ZERO AND DID NOT STOP BUYING -- it
      fell outside that year's published shortlist, and the smaller destinations (bangladesh,
      australia, egypt after 2014, and roughly 170 others) are simply not carried. Never narrate a
      gap in a series as a collapse, and when a series has holes say that the country was outside
      the published top list in those years.
      `eu` IS A BLOC AND ITS DISAPPEARANCE IS A REPORTING CHANGE. MPOC listed `eu` through 2015 and
      switched from 2016 to naming the NETHERLANDS (Rotterdam) instead. The step down across that
      boundary is a change of reporting basis, not a change in European demand, and the two lines
      must never be spliced into one series or differenced against each other.
      THERE IS NO TOTAL AND NO SHARE. The source's own TOTAL row is excluded because it is only the
      sum of the listed shortlist, not Malaysia's national exports (~15 Mt/yr against a ~9 Mt panel
      total in 2023) -- so a percent-of-Malaysian-exports figure CANNOT be computed from this card.
      If a share is genuinely needed, the national denominator is silver_mpob exports_palm_oil_mt
      (monthly -- sum the twelve months of the year) or the silver_psd annual palm balance, and the
      answer must say which table supplied the denominator.
      COVERAGE STOPS AT CALENDAR YEAR 2023 AND THAT IS THE DATA, NOT A STALENESS BUG. The newest year
      this table can serve is 2023, so agg=latest at ANY as-of from 2024-03-01 onward returns the 2023
      reading. Say "2023" out loud on every figure, never "currently" / "these days" / "the latest
      year" without the year attached, and refuse a 2024, 2025 or 2026 destination number rather than
      extrapolating one -- the MPOC archive carries no page past 2023.
      Values are RAW metric TONNES of a calendar-year (Jan-Dec) export FLOW, not a stock level:
      measured range 206,839 to 4,409,511 MT. A year-on-year delta is a change in annual offtake,
      which is a different quantity from the month-on-month stock BUILD or DRAW that
      silver_mpoc_stock_comparison supports. period selects the calendar year as an integer
      (period=2019); window years with period_start/period_end 'YYYY-MM-DD' on the year-ending date,
      or agg=latest for the newest published year on or before the as-of.
      commodity IS OPTIONAL HERE AND THERE IS NO PRODUCT AXIS -- every row is Malaysian palm oil. If
      you pass one, pass palm_oil or malaysian_crude_palm_oil_cme; any other commodity is refused
      before anything is queried, because a grain or cocoa lookup against this card would return a
      palm tonnage under the wrong label.
      POINT-IN-TIME: each row is stamped with its year-ending date (31 December of its own year) and
      a 60-day publication lag, so calendar year Y becomes citable on (Y+1)-03-01 -- MPOC's year page
      carries the completed Jan-Dec destination table in the following January and the lag is
      deliberately generous. Cite the reading's OWN year and never call a dated reading 'current'
      -- the same discipline the IOD and NASS cards state for their cadences.
      NO REVISION HISTORY. One value per (year, country), taken from that calendar year's own MPOC
      page; MPOC's later pages restate a prior year slightly (the 2023 page shows 2,891,422 MT for
      India in 2022 where this table stores 2,898,770 MT from the 2022 page). There is no vintage
      axis, so never present a figure from this card as a revised or as-published-on-date number.

  silver_sagis_cec:
    description: >
      South Africa Crop Estimates Committee (SAGIS/CEC) production estimates -- the numbered sequence
      of national crop estimates by crop and reporting scope. Vintage table: each estimate carries a
      release_date; as-of a date = the latest estimate published on or before it.
    grain: "one row per crop x scope x production_year x report_month x estimate_number per release_date"
    # COVERAGE (PA-1, hoisted from this card's own measured text): numbered CEC estimates; no census stated
    cadence: release
    shape: wide
    commodity_col: crop                 # SAGIS crop code: total_maize/white_maize/yellow_maize/wheat/... (W0-7)
    country_col: scope                  # W0-2/D5: repurposed for the reporting scope total|commercial|developing
    period_col: production_year
    period_type: year
    period_sql_type: int
    knowledge_date_col: release_date
    knowledge_semantics: vintage
    publication_lag_days: 0
    grain_cols: [crop, scope, production_year]   # latest-vintage collapse picks newest estimate as-known
    vintage_tiebreak:
      - {col: estimate_number, dir: desc}        # deterministic total order if two rows share a release_date
    metrics:
      current_estimate_t: {label: "CEC production estimate", unit: "MT", desc: "current CEC production estimate (metric tonnes)"}
      area_planted_ha:    {label: "area planted", unit: "ha", desc: "area planted"}
    notes: >
      South Africa ONLY. commodity is a SAGIS crop code (total_maize for all maize; white_maize /
      yellow_maize for the split). country selects the SCOPE: pass 'total' for the national headline
      estimate ('commercial'/'developing' are the sub-scopes). period = production_year integer.
      current_estimate_t is in metric TONNES. Revision fields (revision_t / revision_pct /
      revision_surprise) are excluded -- they are cross-vintage DELTAS, not point-in-time levels (D4).

  # WIRING WAVE-1 (Card B): CONAB Brazilian coffee production surveys. Survey-VINTAGE on the DERIVED
  # survey_release_date (WIRING_WAVE1 pre-step, producer conab_coffee.py): each safra publishes up to four
  # numbered surveys on a fixed annual calendar, so as-of a date = the latest survey published on/before it,
  # with survey_number DESC the deterministic tiebreak (a higher survey always has a later derived release --
  # no Dec/Jan wrap, unlike WASDE). The pre-step derived survey_release_date CONSERVATIVELY (first-of-month-
  # AFTER the real mid-month release: S1->Mar-1(Y), S2->Jun-1(Y), S3->Oct-1(Y), S4->Feb-1(Y+1)), so the
  # derived date is always >= the real release -> zero leak, <=~4wk withhold. The REVISION columns
  # (production_revision_*, area_revision_ha, ...) are EXCLUDED -- cross-survey DELTAS, not PIT levels
  # (the sagis_cec D4 rule). Flat, projection-forbidden. cascade_map repoint (conab_production_revision)
  # is a documented TODO next to the `production` ref -- gated on a producer region='brazil' filter that this
  # wave does not land (see cascade_map.yaml).
  silver_conab_coffee:
    description: >
      CONAB (Brazil) coffee production surveys -- the numbered progressive estimates of the Brazilian
      coffee crop by variety (arabica / robusta) and region. Survey-vintage: each safra carries up to
      four surveys published across the crop year; as-of a date = the latest survey published on or
      before it. National ('brazil' region) headline plus state/region detail.
    grain: "one row per commodity x region x safra_year x survey_number"
    # COVERAGE (PA-1, hoisted from this card's own measured text): up to four numbered surveys per safra
    cadence: release
    shape: wide
    commodity_col: commodity            # arabica_coffee | robusta_coffee
    country_col: region                 # repurposed as the geo axis; pass region='brazil' for national
    period_col: safra_year
    period_type: marketing_year
    period_sql_type: int
    knowledge_date_col: survey_release_date   # WIRING_WAVE1 pre-step DERIVED column (producer)
    knowledge_semantics: vintage
    publication_lag_days: 0             # survey_release_date IS the (conservatively-derived) publication event
    grain_cols: [commodity, region, safra_year]   # latest-survey collapse per (variety, region, safra)
    vintage_tiebreak:
      - {col: survey_number, dir: desc}          # deterministic total order (later survey wins the tie)
    metrics:
      production_thousand_bags: {label: "production", unit: "1000 60-kg bags", desc: "CONAB production estimate (thousand 60-kg bags)"}
      area_in_production_ha:    {label: "area in production", unit: "ha", desc: "area in production"}
      yield_bags_per_ha:        {label: "yield", unit: "bags/ha", desc: "yield (60-kg bags per hectare)"}
    notes: >
      Brazil ONLY. commodity = arabica_coffee | robusta_coffee. region selects the geo scope -- pass
      region='brazil' for the national headline (state codes/names are sub-scopes). period = safra_year
      integer. production_thousand_bags is thousand 60-kg bags. The survey REVISION columns
      (production_revision_*, area_revision_ha, ...) are EXCLUDED -- they are cross-survey DELTAS, not
      point-in-time levels (mirrors the sagis_cec D4 exclusion). Each safra collapses to its latest
      survey as-known at asof. For the USDA global coffee balance sheet use silver_psd.
      SAFRA RE-PARSE 2026-08-22 (commit c8366016): the bronze parser previously read the PRIOR safra's
      final column of CONAB's merged two-row header, so every value sat one year late and identical
      across surveys; the canonical republished this date carries each bulletin's OWN safra (arabica
      safra-2026 corrected 35,763 -> 45,773 at survey 2) and the per-survey estimates now genuinely
      vary -- answers citing pre-2026-08-22 vintages carried the shifted labels.

  # WIRING WAVE-1 (Card C): SAGIS South-African WEEKLY cumulative grain export pace. DATA-DATE on the
  # DERIVED week_ending_date (WIRING_WAVE1 pre-step, producer sagis_weekly_exports.py: the free-text
  # week_ending range END parsed to an ISO date32; canonical parquet 1204 rows, 0 nulls, 2003-05..2024-04).
  # The main loop APPLIED the gated Glue ADD COLUMNS migration (live catalog now = 9 cols, week_ending_date
  # DATE), so Card C lands the numbers TableSpec here. data_date + a conservative publication_lag_days:5
  # (the cumulative file posts a few days after the week's end -- the +5d shifts the as-of RHS literal back,
  # sargable, mirrors the ESR/MPOB pub-lag pattern). prog_exports_mt is CUMULATIVE season-to-date; the
  # pre-computed pct_of_prior_yr and z_vs_3yr_avg are SERVED AS STORED (the producer feeds them ONLY
  # strictly-earlier seasons, sagis_weekly_exports.py:124-176 -- no-lookahead, so recomputing at query time
  # would duplicate that guarantee; the Pink Sheet *_zscore_5yr precedent). National crop total only (no
  # destination/grade axis); distinct from US ESR weekly sales and from SAGIS/CEC production estimates.
  silver_sagis_weekly_exports:
    description: >
      SAGIS South Africa WEEKLY cumulative (progressive) grain export pace by crop -- maize and wheat.
      One row per season x crop x week_number: the season-to-date exported tonnage plus a percent-of-
      prior-year and a z-score vs the trailing 3-year same-week average. Point-in-time via the week's
      ending date plus a conservative publication lag.
    grain: "one row per season x crop x week_number"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "canonical parquet 1204 rows, 0 nulls,
    # 2003-05..2024-04" (Card C block). The file STOPPED at 2024-04 (the deliveries card names the 27-month
    # gap as this tranche's sharpest hazard) -> the end is a ceiling
    row_count: 1204
    first_obs: "2003-05"
    last_obs: "2024-04"
    cadence: weekly
    shape: wide
    commodity_col: crop                 # maize | wheat (SAGIS crop label, NOT a contract slug)
    period_type: date
    date_col: week_ending_date          # WIRING_WAVE1 pre-step DERIVED ISO date (producer) -- REQUIRED
    knowledge_semantics: data_date
    knowledge_date_col: week_ending_date
    publication_lag_days: 5             # cumulative file posted weekly; conservative +5d never leaks
    metrics:
      prog_exports_mt:  {label: "season-to-date exports", unit: "MT", desc: "season-to-date (cumulative) exports through the week"}
      pct_of_prior_yr:  {label: "% of prior year", unit: "pct", desc: "prog_exports as a percent of the prior season, SAME week (pre-computed, no-lookahead)"}
      z_vs_3yr_avg:     {label: "z-score vs 3-year average", unit: "sigma vs 3-yr", desc: "prog_exports z vs the trailing <=3 prior seasons, same week (pre-computed, no-lookahead)"}
    notes: >
      South Africa ONLY. crop = maize | wheat. prog_exports_mt is CUMULATIVE season-to-date (a running
      total, NOT a weekly flow -- never delta it against a weekly ESR figure). Window weeks with
      period_start/period_end 'YYYY-MM-DD' on the week-ending date, or agg=latest for the newest week
      on/before the as-of. pct_of_prior_yr and z_vs_3yr_avg are SERVED AS STORED (pre-computed strictly
      no-lookahead by the producer) -- never recomputed. No destination/grade breakdown (national crop
      total only). It is the weekly export PACE file, distinct from silver_sagis_cec production estimates.

  # D-LD TRANCHE 2 (2026-08-18) -- SAGIS WEEKLY PRODUCER DELIVERIES, the SUPPLY-SIDE twin of the
  # export-pace card directly above. Same source file family, same season x crop x week grain, same
  # free-text week label, same producer-computed no-lookahead comparison columns. THREE things make it
  # not a copy:
  #   (1) FOUR crops, not two -- soybeans and sunflower join maize and wheat from 2018-19 (MEASURED:
  #       3,007 rows, maize 1,051 / wheat 1,074 / soybeans 441 / sunflower 441).
  #   (2) It carries the DENOMINATOR. prior_prog_total_mt is a real physical column here (92.5% populated)
  #       and the exports table has no equivalent, so pct_of_prior_yr is interpretable on this card in a
  #       way it never was on the sibling -- which is the whole reason it is served as a metric (see notes).
  #   (3) IT IS CURRENT AND ITS SIBLING IS NOT. Deliveries runs to week-ending 2026-08-07 (measured, the
  #       weekly job is on the clock); silver_sagis_weekly_exports ENDS 2024-04-26. A 27-month gap between
  #       two same-shaped SAGIS cards is the sharpest substitution hazard in this tranche, and the notes
  #       name it rather than trusting the model to notice.
  #
  # PIT: data_date on the DERIVED week_ending_date + the sibling's ratified +5d lag. The physical
  # `week_ending` is FREE TEXT and cannot anchor anything -- 3,005 of 3,007 derived dates are a FRIDAY, so
  # a Friday week-end plus +5 makes a week citable from the following Wednesday. The producer pre-step and
  # the gated Glue ADD COLUMNS BOTH LANDED 2026-08-18 (10-column catalog, week_ending_date DATE live; see
  # sql/athena/ddl/silver_sagis_weekly_deliveries.sql), so this card names a column that exists.
  # date_col_type is deliberately ABSENT: week_ending_date is a Glue `date`, not a TIMESTAMP, so the DP-5
  # substr normalization does not apply and the compiler's CAST(col AS varchar) is the correct compare on
  # both backends -- byte-identical to the exports sibling.
  #
  # FRESHNESS: publication_lag_days 5 is the AS-OF axis and nothing else. dag_catalog
  # FRESHNESS_LAG_OVERRIDES pins this table's WRITE-recency ceiling at the weekly cadence default (14),
  # because the Friday fire writes weekly regardless of the 5d content lag -- the D-LD review's banked
  # category error (summing the two silently widened the sagis FAMILY ceiling 14 -> 19).
  silver_sagis_weekly_deliveries:
    description: >
      SAGIS South Africa WEEKLY cumulative (progressive) PRODUCER DELIVERIES by crop -- maize, wheat,
      soybeans and sunflower. A delivery is grain moving from the farm into commercial storage, which is
      the first point the crop is counted: it is a SUPPLY-side arrival, NOT an export and NOT a shipment
      out of the country. One row per season x crop x week_number: season-to-date delivered tonnage, the
      same week's prior-season tonnage, the ratio between them, and a z-score versus the trailing 3-year
      same-week average. Point-in-time via the week's ending date plus a conservative publication lag.
    grain: "one row per season x crop x week_number"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "3,007 rows, maize 1,051 / wheat 1,074 /
    # soybeans 441 / sunflower 441". Seasons are 'YYYY-YY' LABELS, not month keys, so no first_obs is
    # declarable on this axis; the front is LIVE (weekly job on the clock) -> no last_obs
    row_count: 3007
    cadence: weekly
    shape: wide
    commodity_col: crop                 # maize | wheat | soybeans | sunflower (SAGIS crop LABEL, not a slug)
    # D-PQ CLASS-1 code fence. The four labels are the COMPLETE measured vocabulary of the physical column
    # (3,007/3,007 rows). Declared because this card's commodity axis is a raw SAGIS crop label and a caller
    # arriving from a routed South African contract will reach for `south_african_white_maize_jse` by
    # reflex: that lookup is refused at spec level with a teaching error naming these four, instead of
    # compiling to a silent zero-row read. The same fact is restated in `notes` on purpose -- notes teach,
    # this enforces.
    commodity_values: [maize, wheat, soybeans, sunflower]
    period_type: date
    date_col: week_ending_date          # DERIVED ISO date (producer pre-step) -- REQUIRED; see notes
    knowledge_semantics: data_date
    knowledge_date_col: week_ending_date
    publication_lag_days: 5             # cumulative file posted weekly; conservative +5d never leaks
    metrics:
      prog_total_mt:       {label: "season-to-date producer deliveries", unit: "MT", desc: "season-to-date (cumulative) producer deliveries into commercial storage through the week"}
      prior_prog_total_mt: {label: "prior-season deliveries to date", unit: "MT", desc: "the PRIOR season's cumulative deliveries at the SAME week number -- the denominator of pct_of_prior_yr, served so the ratio can be sanity-checked against its own base"}
      pct_of_prior_yr:     {label: "% of prior year", unit: "ratio vs prior season", desc: "prog_total_mt divided by prior_prog_total_mt, same week (pre-computed, no-lookahead). A RATIO, never a percentage: 1.02 means 2 percent above last year, NOT 1 percent of it"}
      z_vs_3yr_avg:        {label: "z-score vs 3-year average", unit: "sigma vs 3-yr", desc: "prog_total_mt z-score against the trailing <=3 PRIOR seasons' same week (pre-computed, no-lookahead, sample std)"}
    notes: >
      DELIVERIES ARE NOT EXPORTS. This card counts grain arriving from the farm into commercial storage
      inside South Africa. It does NOT measure anything leaving the country. The export-pace card is
      silver_sagis_weekly_exports and it is a DIFFERENT TABLE with a different metric (prog_exports_mt).
      Never answer an export question from this card and never answer a deliveries question from that
      one, and never net, subtract or ratio the two against each other -- they are cumulative totals on
      different season calendars measured at different points in the chain, so a difference between them
      is not a stocks figure, not an exportable surplus and not a domestic-consumption number.
      THE TWO SAGIS WEEKLY CARDS ARE NOT EQUALLY FRESH, and this is the trap that matters most. Deliveries
      runs to August 2026; the export-pace file stops in April 2024. If a question asks about EXPORTS,
      the honest answer is the export card's own last week with its date said out loud -- substituting a
      recent DELIVERIES number because it happens to be fresher is answering a different question with a
      better-looking date attached. Cite the table you actually read, by name.
      SOUTH AFRICA ONLY, national totals only. There is no province, silo, grade or destination
      breakdown on this card, and no other country's deliveries.
      crop = the SAGIS crop LABEL and only these four exist: maize, wheat, soybeans, sunflower. It is
      NOT a contract slug -- 'south_african_white_maize_jse' is not a value here; pass 'maize'. Maize is
      undifferentiated (white and yellow are NOT split on this table), so a white-maize or yellow-maize
      question can only be answered at the combined maize level, said as such. Anything else -- sorghum,
      barley, groundnuts, canola, any non-South-African crop -- is not in this table; decline rather
      than substituting a neighbouring crop.
      prog_total_mt IS CUMULATIVE season-to-date, a running total that only climbs. It is NOT a weekly
      flow. A week-on-week difference is a PACE, never a level, and a difference across a season boundary
      is meaningless. Never delta it against a weekly ESR figure, which is a flow.
      EVERY CROP HAS ITS OWN SEASON CALENDAR, so week_number is NOT comparable across crops. Measured
      week-1 anchors: maize starts early MAY, wheat starts early OCTOBER, soybeans and sunflower start
      late FEBRUARY. 'Week 20' is a different month for each of them, and the 'YYYY-YY' season label
      therefore spans different calendar windows per crop -- wheat's 2025-26 season is still reporting in
      August 2026 while maize is already 15 weeks into 2026-27. Always quote the week-ending DATE, not
      just the week number, and never line two crops up by week number and call it a comparison.
      COVERAGE IS NOT UNIFORM: maize and wheat go back to 2005-06, soybeans and sunflower only to
      2018-19. A pre-2018 soybean or sunflower delivery figure does not exist here; say so rather than
      reaching for a different crop or a different table.
      SEASONALITY IS NOT STALENESS: a crop reports weekly only within its own season, so agg=latest at an
      out-of-season as-of correctly returns the last week of that crop's previous season. There is also a
      recurring GAP OVER THE DECEMBER HOLIDAYS in the earlier years, where three weeks pass between
      consecutive readings, and a missing week is a publication pause, not a week of zero deliveries.
      Cite the reading's OWN week-ending date and never call a dated reading 'current' -- the same
      discipline the NASS and IOD cards state for their cadences. Roughly 52 rows per crop per season;
      the whole table is about 3,000 rows, so a multi-season series read fits inside the row cap but a
      single unfiltered read spans every crop at once.
      pct_of_prior_yr and z_vs_3yr_avg are SERVED AS STORED. The producer computes both strictly
      no-lookahead -- the ratio against the prior season's same week only, the z against the trailing two
      or three PRIOR seasons' same week only (sample standard deviation), never the current or a later
      season. Never recompute them, and never recompute them across a filtered subset.
      BOTH COMPARISON COLUMNS GO DEGENERATE EARLY IN A SEASON, and this is measured, not theoretical. In
      the first weeks the cumulative base is tiny, so the ratio explodes: the largest values in the table
      are 173.6 and 139.6 (2022-23 wheat, weeks 1 and 2, against prior-season bases of 16 and 114 tonnes).
      2.5 percent of rows carry a ratio above 3. ALWAYS read prior_prog_total_mt beside the ratio and say
      the base out loud -- 'ahead of a near-zero week last year' is the true statement, '17,000 percent
      ahead' is not. The z-score has the same failure from the other direction: 8.5 percent of rows carry
      |z| > 5, and the extreme tail (a maximum of 501 sigma, 2008-09 maize) comes from the 2006-2009 era
      when SAGIS published in thousands of tonnes, so two prior seasons rounded to almost the same
      thousand and the standard deviation nearly vanished. 225 rows have only TWO prior seasons available
      rather than three. Treat any |z| above about 5 as an artefact of a degenerate base, quote the
      underlying tonnages instead, and never narrate a triple-digit sigma as a record-breaking crop.
      Window weeks with period_start/period_end 'YYYY-MM-DD' on the week-ending date, or agg=latest for
      the newest published week on/before the as-of. A same-week analog across seasons is agg=series over
      a multi-season window plus the week-ending dates, one crop at a time.

  # D-LD TRANCHE 2 (2026-08-18) -- USDA AMS COTTON CLASSING, ANNUAL QUALITY. From the dark-table sweep:
  # flat, projection FORBIDDEN, contract complete (natural_key + value_columns non-empty), never carded.
  # It is the only card that measures what a HARVESTED crop turned out to be -- everything else serves
  # quantity (balance sheets, pace, positioning), price, or (NASS) an in-field CONDITION rating of the crop
  # still growing, which is a forward-looking judgement and not a measurement of the fibre.
  # Nothing is ingested, re-chunked or re-derived by this card.
  #
  # WHAT THE TABLE ACTUALLY IS, MEASURED 2026-08-18 rather than assumed: 27 rows. ONE commodity
  # ('cotton'), ONE geography ('us_total'), one row per crop season. There is no state, region or
  # regional-breakout axis in silver at all -- the producer DROPS the appendix/regional rows
  # (geography == 'unknown') and keeps only the national scope (ams_cotton_quality.py:_NATIONAL_GEOGRAPHY).
  # Seasons present: 1986-1998 continuous, then 2008, 2009, 2011, 2015, 2016, 2017, then 2018-2025
  # continuous. ABSENT: 1999-2007, 2010, 2012, 2013, 2014.
  #
  # PIT: vintage on the DERIVED `release_date` (pre-step AMS-1, producer ams_cotton_quality.py), the exact
  # conab_coffee Card B idiom. The producer re-run AND the live Glue ADD COLUMNS BOTH LANDED 2026-08-18
  # (13-column catalog; the column is APPENDED LAST, not third as the drafting package sketched -- column
  # ORDER is irrelevant to every card field, and appending is what keeps the ordered hand-DDL-vs-live-Glue
  # drift check clean). The AMS annual quality report for crop season Y is published during Y+1 (measured
  # lower bound: the season-2025 PDF was retrievable from AMS by 2026-07-16, our fetch stamp). The pre-step
  # derives release_date = (season + 1)-09-01 -- the start of the NEXT classing season, by which the prior
  # season's summary is unambiguously out. CONSERVATIVE BY CONSTRUCTION: the derived date is always >= the
  # real release, so the guard can never leak; the cost is a withhold of at most a few months on the
  # freshest season (season 2025 becomes citable 2026-09-01, ~7 weeks after we observed its PDF on the AMS
  # site). That cost is the price of deriving from ONE observation; tightening the pin to 08-01 needs three
  # observed AMS release dates first (the D-PR-16/17 "collect 3 fires then declare" idiom), and until then
  # the conservative pin stands.
  #
  # THERE IS NO date_col AND THAT IS DELIBERATE, not an omission. The DATA axis here is the season INTEGER,
  # which cannot be a date column; the only real date is the PUBLICATION event, and pointing date_col at a
  # vintage axis is the canary-banned pattern (vintage_dates_real, 2026-07-04) -- period-derived date bounds
  # would then window on RELEASE dates while the reader believes they windowed on crop years. The structural
  # twin already in the file is silver_icco_cocoa (annual, vintage, no date_col). The CONSEQUENCE is real and
  # is stated in `notes` rather than left for a caller to discover: with no chronological column
  # `query._order_col` returns None, so agg=latest does NOT collapse to the newest season (it returns one
  # row per season, ORDER BY period ASC) and period_start/period_end compile to NOTHING. Pass `period`.
  # period_required is deliberately NOT set: that fence refuses a period-less lookup outright, and it is
  # calibrated to the WAP trap -- ONE row returned and it is the WRONG CROP. Here a period-less read
  # returns the WHOLE season series with the season stamped on every row (the icco_cocoa shape), which the
  # notes teach how to read; refusing it would also refuse the legitimate arc read this card supports.
  #
  # EXCLUDED METRICS, and the exclusion is STRUCTURAL: avg_micronaire and avg_strength are 0/27 non-null --
  # micronaire never appears in the tracked corpus and strength appears only in the REGIONAL scope the
  # producer drops (ams_cotton_quality.py docstring, INV-2 note; both columns are the SILVER-F050
  # null_typed drift entries). Declaring them would be the drought_z zero-row class: a metric that compiles,
  # returns rows, and serves NULL forever. They stay off the card and `notes` says so, so a micronaire ask
  # gets an honest decline instead of a blank.
  #
  # SARGABLE PARTITION DISCIPLINE: none needed and that is a FACT, not an omission -- partition_mode flat,
  # projection forbidden, partition_keys [], Glue confirms zero partition keys. Do NOT add partition_cols;
  # reconcile_numbers would then demand they be real Glue partition keys and fail the build.
  silver_ams_cotton_quality:
    description: >
      USDA AMS Cotton Program -- the ANNUAL quality summary of the US cotton crop as measured by the
      classing offices, one row per crop season. percent_tenderable is the share of the season's classed
      bales meeting the tenderable (deliverable-grade) quality specification; avg_staple is the season
      average staple length in THIRTY-SECONDS OF AN INCH; samples_classed is how many bales came through
      classing that season. This is the QUALITY of the crop, never its size and never its price: for US
      cotton production, exports, ending stocks or the season-average farm price use silver_wasde and
      silver_psd, for weekly condition ratings and harvest pace use silver_nass_crop_progress, and for the
      ICE cotton level use silver_futures_prices. UNITED STATES NATIONAL TOTAL ONLY -- there is no state,
      region, foreign-origin or per-grade breakdown in this table. ANNUAL and slow: the report for crop
      season Y is published during the following year, so at any as-of the newest citable season is
      normally the PRIOR crop year, not the one now in the field.
    grain: "one row per crop season (US national cotton classing summary; commodity x geography x season)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "27 rows ... 1986 through 1998, then
    # 2008, 2009, 2011, 2015, 2016, 2017, then 2018 through 2025" (2026-08-18). ANNUAL: the newest season is
    # fixed until the next classing summary -- the SPAN, gaps in the notes
    row_count: 27
    first_obs: "1986"
    last_obs: "2025"
    cadence: annual
    shape: wide
    commodity_col: commodity             # single value 'cotton' (probed); the estate's ICE cotton slug
    # D-PQ CLASS-1 code fence: the slug set is CLOSED at exactly one value, so a lookup naming any other
    # commodity is refused at spec level with a teaching error BEFORE any SQL is compiled, instead of
    # returning zero rows that read as "not published". Said twice on purpose -- this enforces, `notes`
    # teaches -- and the wiring test pins the two equal.
    commodity_values: [cotton]
    country_col: null                    # SINGLE geography ('us_total'); exposing it would only create a
    #                                      zero-row trap for country='US' / 'United States'. The US-only
    #                                      fact lives in description + notes instead (sagis_weekly_exports
    #                                      idiom), where the model actually reads it.
    period_col: season
    period_type: marketing_year
    period_sql_type: int                 # season is a bigint crop year, e.g. 2025 = the 2025/26 US crop
    knowledge_date_col: release_date     # PRE-STEP AMS-1 DERIVED column (producer), ISO 'YYYY-MM-DD'
    knowledge_semantics: vintage
    publication_lag_days: 0              # release_date IS the (conservatively derived) publication event
    grain_cols: [commodity, geography, season]   # the TRUE grain; without geography the latest-vintage
    #                                              ROW_NUMBER would collapse across a scope axis the card
    #                                              does not expose (the WASDE region lesson), even though
    #                                              that axis holds one value today
    metrics:
      percent_tenderable:
        label: "percent tenderable"
        unit: "pct of bales classed"
        desc: >
          share of the season's classed US cotton meeting the TENDERABLE (deliverable-grade) quality
          specification, as AMS publishes it. Served exactly as published -- the specification is the
          classing program's own and nothing is recomputed here. A quality share, never a stocks or
          deliverable-supply figure.
      avg_staple:
        label: "average staple"
        unit: "32nds of an inch"
        desc: >
          season-average staple (fibre) length of the classed crop in THIRTY-SECONDS OF AN INCH -- 36.37
          means 36.37/32 in, about 1.14 in. Never report it as inches or millimetres without dividing by 32
          and saying so.
      samples_classed:
        label: "samples classed"
        unit: "bales classed"
        desc: >
          number of bales the AMS classing offices classed in the season. A CLASSING COUNT of what came
          through the offices -- close to but not equal to the crop, and NOT a USDA production estimate
          (that is silver_wasde / silver_psd) and not ginnings. Present only from season 2018.
    notes: >
      UNITED STATES NATIONAL TOTAL, COTTON, AND NOTHING ELSE. Every row is the US national classing summary
      ('us_total'): there is no state, no growing region, no per-grade split and no foreign origin here.
      There is no Brazilian, Australian, Indian, West African or Chinese cotton quality in this table, and a
      US classing figure is not a proxy for any of them -- say "US" out loud whenever you quote a number from
      this card. commodity takes exactly one value, 'cotton'; anything else is refused before anything is
      queried, and no neighbouring commodity on any other card stands in for it.
      PASS `period` FOR A SINGLE SEASON -- THIS CARD HAS NO DATE AXIS. period is the crop season as an
      INTEGER (2023 = the 2023/24 US cotton crop), the same START-year convention silver_psd and silver_esr
      use. Because the only date on the table is the publication stamp, agg=latest does NOT collapse to the
      newest season: it returns ONE ROW PER SEASON, oldest first, and period_start/period_end have NO EFFECT
      at all. Read one season with period=<year>; read the arc by taking the series and reading the season
      stamp on EVERY row. Never treat the first row of a series read as the newest -- it is the OLDEST.
      COVERAGE IS THIN AND GAPPED, AND THAT IS THE DATA (measured 2026-08-18): 27 seasons only -- 1986
      through 1998, then 2008, 2009, 2011, 2015, 2016, 2017, then 2018 through 2025. Seasons 1999-2007,
      2010, 2012, 2013 and 2014 ARE NOT IN THIS TABLE. A missing season is a MISSING REPORT: never a zero,
      never "quality collapsed", and never interpolated across the gap. samples_classed exists only from
      season 2018 (8 of 27 seasons); every earlier season returns NULL for it, which means that year's
      report did not yield the line, not that no bales were classed. With 27 rows in the whole table a
      series read can never hit the 5000-row cap, so no window is ever truncated here.
      MICRONAIRE AND STRENGTH ARE NOT SERVED. Both columns exist physically and are 100% NULL across every
      season (micronaire is absent from the tracked reports; strength appears only in the regional scope the
      silver transform drops). Decline a micronaire or strength ask plainly -- do NOT offer staple length or
      the tenderable percentage as a substitute for a fibre-quality attribute they do not measure.
      SEASON 2024 IS A DUPLICATE OF SEASON 2023 AND MUST NOT BE READ AS A SECOND OBSERVATION. The two rows
      carry identical values on every served metric because they carry the identical source PDF (the same
      source_file_etag) -- a known producer defect, not a crop that held its quality flat. Never narrate a
      2023-to-2024 comparison off this card, and prefer citing season 2023 or season 2025.
      ANNUAL AND SLOW: the season-Y report is published during Y+1 and the card withholds a season until
      that release, so at any as-of the newest citable season is normally the PRIOR crop year. Cite the
      SEASON the reading belongs to and never call a dated reading 'current' (the discipline the IOD and
      NASS cards state for their cadences). A quality reading says nothing about the crop now in the field.
      QUALITY IS NOT QUANTITY AND NOT PRICE. For US cotton production, exports, ending stocks, stocks-to-use
      or the season-average farm price use silver_wasde (commodity 'cotton', region 'united_states' or
      'u_s_cotton' across the 2011 split) and silver_psd; for the weekly US condition rating and harvest
      pace use silver_nass_crop_progress (commodity 'cotton', country 'US'); for the ICE cotton level use
      silver_futures_prices (commodity 'cotton', continuous front-month, levels-only). The link between a
      tenderable share and what is deliverable against the board is QUALITATIVE context, never a served
      number -- this card carries no certificated-stock, deliverable-supply or basis quantity.

  # D-CW-2a (2026-08-07) -- USDA NASS WEEKLY CROP PROGRESS, from the DARK CAPABILITY CENSUS (item 6):
  # the sharpest instance of the dark class. The table has been in silver since 2026-07 (6 contract
  # slugs, state + national, 1979+) and a SHIPPED eval already grades its citation key
  # (eval_queries_deepv2_width_v1.yaml:177, checklist :215) -- an eval no answer could ever pass,
  # because the numbers registry had no card for it. This card is the whole fix; nothing is ingested,
  # re-chunked or re-derived.
  #
  # PIT: data_date on the WEEK-ENDING date + a conservative 2-day publication lag. NASS publishes the
  # week ending Sunday on the FOLLOWING MONDAY at ~16:00 ET (~20:00 UTC), so a same-day Monday cutoff
  # would leak by hours and a Monday-holiday slip pushes the release to Tuesday. +2 makes a week citable
  # from the Tuesday after it -- never early, at most one day late, and it is the same day the weekly
  # schedule fires. (D-W0.3 idiom: the lag shifts the as-of RHS literal, so the guard stays sargable.)
  #
  # FRESHNESS, STATED RATHER THAN DISCOVERED (census finding, 2026-08-07): the transform and its jobdef
  # exist but dag_schedules carries NO entry -- built, never put on the clock. The last silver write was
  # 2026-06-01, so as this card lands the newest week is late May and ~9 weeks of the 2026 season are
  # missing. That is a SCHEDULING gap, not a data gap, and the read path already tells the truth about
  # it: every row is stamped with its own week-ending date and the recency machinery cites that stamp.
  # The catch-up run + the weekly schedule + the FreshnessLagDays row are D-CW-2a(i)-(iii), separate
  # from this card by design -- a card that waits for its schedule is a card that stays dark.
  #
  # PHYSICAL LAYOUT: partition PROJECTION (commodity enum x year 1979-2035 = ~342 candidates -- three
  # orders of magnitude below the silver_esr grid behind the Jul-2026 LIST storm, but pruned the same
  # way): the commodity equality is emitted by the ordinary commodity filter and trade-year-style
  # SARGABLE BOUNDS come from year_col, so no query enumerates the projected space. `commodity` is the
  # partition key holding the contract slug; the in-file `leviathan_slug` column carries the same value
  # and is deliberately NOT the commodity_col (filtering the partition is what prunes).
  silver_nass_crop_progress:
    description: >
      USDA NASS weekly Crop Progress -- US crop CONDITION ratings and planting / emergence / harvest
      PACE, BY STATE and for the US as a whole, week by week from 1979. One row per contract x state x
      week-ending date. pct_good_excellent and pct_poor_very_poor are the two tails of the weekly
      condition rating (percent of the crop's acreage in those categories); pct_planted / pct_emerged /
      pct_harvested are CUMULATIVE percent-of-acreage progress through the season, so they climb to 100
      and stay there. Six contracts only: corn, soybeans, rice, upland cotton, winter wheat and spring
      wheat. The week ending Sunday is published the following Monday afternoon and is citable from the
      Tuesday after it.
    grain: "one row per contract x state x week-ending date (weekly, in season)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "week by week from 1979". The end is a
    # SCHEDULING gap being closed (D-CW-2a(i)-(iii)), never a source ceiling -> no last_obs
    first_obs: "1979"
    cadence: weekly
    shape: wide
    commodity_col: commodity            # PARTITION key = the contract slug (6 values; see notes)
    # D-PQ CLASS-1: the six slugs, DECLARED, so the fence is code and not prose. A lookup naming anything
    # else is refused at spec level with a teaching error before any SQL is compiled. This list and the
    # `commodity = the CONTRACT slug and only these six exist` sentence in `notes` are the same fact said
    # twice on purpose -- the notes teach, this enforces -- and test_numbers_class_fence pins them equal.
    commodity_values: [corn_cbot, soybeans_cbot, rough_rice_cbot, cotton,
                       soft_red_winter_wheat_cbot, hard_red_spring_wheat_mgex]
    country_col: state                  # repurposed as the GEO axis: 2-letter USPS code, 'US' = national
    period_type: date
    date_col: date                      # the WEEK-ENDING date (a Sunday), a physical DATE column
    knowledge_semantics: data_date
    knowledge_date_col: date
    publication_lag_days: 2             # Sunday week-end -> Monday ~16:00 ET release; +2 never leaks
    partition_cols: [commodity, year]   # projected; commodity via the commodity filter, year via bounds
    year_col: year                      # sargable year bounds prune the projection (never an equality)
    metrics:
      pct_good_excellent: {label: "% rated good-to-excellent", unit: "pct of acreage", desc: "percent of the crop rated GOOD or EXCELLENT that week (the condition headline; higher = better crop)"}
      pct_poor_very_poor: {label: "% rated poor-to-very-poor", unit: "pct of acreage", desc: "percent of the crop rated POOR or VERY POOR that week (the stress tail; it is NOT 100 minus good/excellent -- the fair category sits between them)"}
      pct_planted:        {label: "% planted", unit: "pct of acreage", desc: "CUMULATIVE percent of intended acreage planted through that week"}
      pct_emerged:        {label: "% emerged", unit: "pct of acreage", desc: "CUMULATIVE percent of acreage emerged through that week"}
      pct_harvested:      {label: "% harvested", unit: "pct of acreage", desc: "CUMULATIVE percent of acreage harvested through that week"}
    notes: >
      ONE LOOKUP = ONE METRIC AND ONE STATE. This card carries FIVE metrics and a free state axis, which
      is the exact shape that invites a metric-less state sweep ("give me Iowa's conditions"): `metric` is
      REQUIRED and there is no all-metrics read, so an east-versus-west comparison is one call per
      (metric, state) pair -- pct_good_excellent for IA, then pct_good_excellent for IL, and so on. A call
      that omits `metric` is rejected before anything is queried and costs you a lookup from the budget.
      THIS TABLE IS THE UNITED STATES AND NOTHING ELSE. Every row is a US state (or the 'US' national
      roll-up) reported by USDA NASS: there is no French, EU, Black Sea, Brazilian, Argentine, Australian
      or Chinese crop here. A US winter-wheat condition is NOT a read on MATIF milling wheat, a US corn
      condition is NOT a read on a Brazilian or Chinese corn contract, and the two are not proxies for
      each other -- say "US" out loud whenever you quote a figure from this card, and on a question about
      a non-US contract either label it explicitly as the US analogue or do not use it at all.
      ALWAYS PASS A STATE. country selects the geography and takes the 2-letter USPS code in CAPITALS
      ('IA', 'IL', 'KS') or 'US' for the national figure -- pass country='US' for "the US corn condition".
      With NO state the read spans EVERY reporting state, and a latest-value read then returns ONE
      arbitrary state's row, which is a state number wearing a national label. Every row carries its own
      state in the country field: say which state (or 'US') you are quoting, always.
      commodity = the CONTRACT slug and only these six exist: corn_cbot, soybeans_cbot, rough_rice_cbot,
      cotton (upland), soft_red_winter_wheat_cbot (winter wheat) and hard_red_spring_wheat_mgex (spring
      wheat, excl. durum). Anything else -- durum, barley, sorghum, oats, any non-US crop -- is NOT in
      this table; decline rather than substituting a different crop.
      SEASONALITY IS NOT STALENESS: NASS reports weekly only during the growing season, so there is a
      long winter gap with no rows at all, and agg=latest at a February as-of correctly returns the last
      week of the previous season. Cite the reading's OWN week-ending date and never call a dated
      reading 'current' -- the same discipline the IOD card states for its monthly cadence.
      Window weeks with period_start/period_end 'YYYY-MM-DD' on the week-ending date, or agg=latest for
      the newest published week on/before the as-of; agg=series over a season is how a same-week analog
      across years gets read (one lookup per year, or a multi-year window plus the week-ending dates).
      Conditions are RATINGS, not a yield forecast: the percent good-to-excellent is what enumerators
      reported that week, never converted here into bushels, and a condition number is not a USDA yield
      estimate (that is silver_wasde / silver_psd).
      Values are percentages of acreage (0-100). pct_planted/emerged/harvested are cumulative, so a
      week-on-week delta is a PACE, not a level -- and a delta across a season boundary is meaningless.

  # D-LD TRANCHE 2 (2026-08-18) -- USDA NASS ANNUAL crop production, the STATE-level annual twin of
  # the weekly silver_nass_crop_progress card. Nothing is ingested, re-chunked or re-derived by this
  # card; the table has been in silver since the P65 baseline (593 canonical parquet objects, 14,631
  # rows, crop years 1866-2026) and rides the EXISTING weekly nass_crop_progress DAG
  # (configs/silver/dags/nass_crop_progress.json, cron(0 9 ? * TUE *), publish_mode shadow_canonical,
  # promote_mode autonomous, gate_tables already names silver_nass_annual).
  #
  # PIT, AND THE ONE PRE-STEP IT REQUIRED. The physical table carried NO temporal column at all --
  # measured on every canonical AND _shadow object: [leviathan_slug, country, state, year,
  # marketing_year, area_planted_ha, area_harvested_ha, yield_t_ha, production_mt, 4x *_cv_pct, source].
  # `year` is the CROP year, not a knowledge date, and there is no month, so neither the date_col branch
  # nor the year_month branch of _guard was expressible and knowledge_col() would return None ->
  # ValueError "no knowledge/date column to anchor the as-of guard" (query.py:446). The D-LD pre-step
  # (D-LD-9a) therefore derives ONE column in the producer -- release_date = '<year+1>-02-01' -- exactly
  # as WIRING WAVE-1 derived survey_release_date (conab) and week_ending_date (sagis exports). USDA NASS
  # publishes the Crop Production ANNUAL SUMMARY for crop year Y in the SECOND WEEK OF JANUARY of Y+1,
  # so first-of-the-month-AFTER is always >= the real release: ZERO leak, at most ~3 weeks of withhold.
  # publication_lag_days is 0 because release_date IS the (conservatively derived) publication event --
  # the conab_coffee construction, not the ESR/MPOB data-date-plus-lag one. Producer re-run AND the
  # gated Glue ADD COLUMNS BOTH LANDED 2026-08-18 (14-column catalog, release_date appended last).
  #
  # WHAT THAT VINTAGE DELIBERATELY DOES NOT SERVE: the IN-SEASON prints. NASS also publishes Prospective
  # Plantings (Mar 31) and Acreage (Jun 30) for the CURRENT crop year, and those numbers are physically
  # in the row the moment the weekly job re-reads QuickStats (crop year 2026 exists today with planted
  # and harvested acreage and NULL yield/production). One card carries ONE knowledge column, so serving
  # the June acreage print would mean stamping the whole row June -- and the row is OVERWRITTEN in
  # January with the settled production, which a June stamp would then leak on every historical replay.
  # This card is the ANNUAL SUMMARY vintage and nothing else: a crop year becomes citable only once its
  # January summary has published. In-season US acreage/pace lives on silver_nass_crop_progress.
  #
  # PHYSICAL LAYOUT: partition PROJECTION (commodity enum x year 1866-2035 = ~170 candidates -- four
  # orders of magnitude below the silver_esr grid behind the Jul-2026 $134 LIST storm, but pruned the
  # same way): the commodity equality is emitted by the ordinary commodity filter and sargable YEAR
  # BOUNDS come from year_col, so no query enumerates the projected space. `commodity` is the partition
  # key holding the contract slug; the in-file `leviathan_slug` column carries the byte-identical value
  # on all 14,631 rows (verified) and is deliberately NOT the commodity_col -- filtering the PARTITION is
  # what prunes. `year` is BOTH a Glue partition key and a physical body column (the silver_esr_compact
  # class): Athena serves the partition value, and load_pg_numbers._probe_body_columns already drops such
  # keys from the pyarrow partitioning schema and takes them from the body. No loader change.
  #
  # period_col IS year_col HERE, AND THAT IS DELIBERATE. `marketing_year` is a redundant physical twin of
  # `year` (measured EQUAL on 14,631 of 14,631 rows), so pointing period_col at it would be the same
  # fact said in a column that CANNOT prune. With period_col = year, a caller naming one crop year emits
  # `year = 2025` -- a partition equality that prunes 170 candidates to 1 -- while a period-less read
  # emits only the sargable `year <= <asof year>` bound. The W3.1 rule the doctrine states ("never emit
  # an equality on a projected partition that is also year_col") is about the WINDOW path, and that path
  # is untouched: _partition_filters skips the year equality (query.py:357-358) and only the caller's own
  # explicit single-year `period` can produce one.
  #
  # SILVER-F020 -- THE HIDDEN CANOLA PARTITIONS, RESTATED AS A SERVING FACT. 36 canonical
  # `commodity=canola_ice` objects (222 rows, crop years 1991-2026, 10 states) exist on S3 and are
  # INVISIBLE to Athena because the live projection enum omits canola_ice (live Glue TBLPROPERTIES read
  # 2026-08-18 == the checked-in DDL == the F010 contract). The gated SET TBLPROPERTIES migration
  # (reports/silver_readiness/R2_SA/F020_canola_migration.json) is authored and NOT applied. Until it is,
  # canola_ice is OFF THIS CARD: not because the data is bad but because the two backends would DISAGREE
  # about it -- load_pg_numbers reads the SILVER PARQUET straight from S3 (never the catalog's row set),
  # so the pg mirror WOULD carry canola while Athena returns zero rows, and a GRAPHRAG_NUMBERS_BACKEND
  # flip would silently change the answer. commodity_values is the engine-independent fence that makes
  # both backends refuse it identically. When F020 lands, canola_ice is added to the enum AND to
  # commodity_values AND to the notes IN ONE CHANGE.
  #
  # THE OTHER HALF OF THE ENUM DEFECT, MEASURED HERE FOR THE FIRST TIME: the enum also promises TWO slugs
  # that have NO physical partition at all -- soft_red_winter_wheat_cbot and hard_red_spring_wheat_mgex.
  # An S3 listing of the table root returns exactly five commodity prefixes (canola_ice, corn_cbot,
  # cotton, rough_rice_cbot, soybeans_cbot). The transform CAN emit both wheat slugs
  # (usda_nass_annual._canonical_slug) but the bronze slice yields none, so a wheat lookup would compile
  # cleanly and return ZERO rows -- the WASDE Title-Case "silently not yet published" class, arriving
  # through a partition enum instead of through a metric vocabulary. commodity_values excludes them for
  # exactly that reason, and the notes say out loud that US wheat is not in this table.
  # RESOLVED 2026-08-20 (D-EC wheat-lane repair, commit c4ebbf23 + canonical promote 117da844): the
  # paragraph above is the PRE-REPAIR record, kept as history. The wheat lane had dead map keys and had
  # never once run; the repaired transform published all ten partitions to canonical (verified by S3
  # listing post-promote) and the projection enum was ALTERed to the same ten in the same change. The
  # four-checkmark flip below happened only after both were live.
  silver_nass_annual:
    description: >
      USDA NASS annual US crop production -- the settled, state-by-state ANNUAL SUMMARY of planted and
      harvested ACREAGE, YIELD and PRODUCTION for the US corn, soybean, cotton (ALL CLASSES -- upland
      plus pima, which is what the `cotton` slug is fed from; upland_cotton, pima_cotton and cottonseed
      are also carried as their own slugs), rice, canola, and -- since the 2026-08-20 wheat-lane repair
      -- winter wheat (soft_red_winter_wheat_cbot; the NASS WINTER class, i.e. ALL winter wheat incl.
      hard red and white) and non-durum spring wheat (hard_red_spring_wheat_mgex) back to 1909,
      one row per crop x state x crop year, back to 1866 for corn and cotton. Every figure is in metric
      units (hectares, tonnes, tonnes per hectare), converted from the NASS acre/bushel/bale originals.
      Vintage table: a crop year becomes citable only when USDA publishes its Crop Production Annual
      Summary, in January of the FOLLOWING year -- so at any as-of the newest readable crop year is the
      one whose January summary has already appeared. This is the SETTLED annual record, not an
      in-season read: for weekly condition ratings and planting/harvest pace use
      silver_nass_crop_progress, and for the current marketing year's USDA forecast use silver_wasde.
    grain: "one row per commodity x state x crop year (annual, latest-revised)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "~26,081 rows" re-measured at the
    # 2026-08-20 promote; "crop years 1866-2026". last_obs is the newest CITABLE crop year (2026 exists but
    # is withheld until its January summary -- the notes carry that distinction)
    row_count: 26081
    first_obs: "1866"
    last_obs: "2025"
    cadence: annual
    shape: wide
    commodity_col: commodity            # PARTITION key = the contract slug (4 served values; see notes)
    # D-PQ CLASS-1 fence: the slugs this card can actually answer, DECLARED, so the refusal is code and
    # not prose. Measured (S3 prefix listing + a full 593-object read, 2026-08-18): five commodity
    # prefixes exist physically, of which canola_ice is HIDDEN by the projection enum (SILVER-F020) and
    # so is excluded here to keep Athena and the pg mirror answering IDENTICALLY; the enum's two wheat
    # slugs have NO physical partition at all and would return zero rows. What is left -- and what this
    # card serves -- is these four. This list and the `only these four crops exist` sentence in `notes`
    # are the same fact said twice on purpose: the notes teach, this enforces.
    #
    # FLIPPED 2026-08-20 (D-EC wheat-lane repair) -- the publish gate this comment used to declare was
    # satisfied before the widen, in order: (1) canonical promote SUCCEEDED (job 117da844, all ten
    # commodity partitions verified by S3 listing), (2) the Glue projection enum ALTERed to the same
    # ten values (Athena SUCCEEDED, same hour), (3) THEN this list widened. canola_ice rides the same
    # flip: it was physical-but-enum-hidden since F020, and the ALTER un-hid it. The ten below are
    # measured physical partitions, not promises. NASS still publishes NO annual area/yield for hard
    # red winter specifically -- kcbt stays refused in the transform (owner-ratified 2026-08-20);
    # the WINTER class rows live under soft_red_winter_wheat_cbot with the coarseness documented.
    commodity_values: [corn_cbot, soybeans_cbot, cotton, rough_rice_cbot, canola_ice,
                       soft_red_winter_wheat_cbot, hard_red_spring_wheat_mgex,
                       cottonseed, upland_cotton, pima_cotton]
    country_col: state                  # repurposed as the GEO axis: 2-letter USPS code, 'US' = national
    period_col: year                    # the CROP year; == the projected partition key (see the note above)
    period_type: year
    period_sql_type: int
    knowledge_date_col: release_date    # D-LD pre-step DERIVED column (producer): '<crop year + 1>-02-01'
    knowledge_semantics: vintage
    publication_lag_days: 0             # release_date IS the (conservatively derived) publication event
    partition_cols: [commodity, year]   # projected; commodity via the commodity filter, year via bounds
    year_col: year                      # sargable year bounds prune the projection (never an equality)
    grain_cols: [commodity, state, year]   # the true unique-observation identity (re-measured at the
    #                                        2026-08-20 promote: exactly ONE row per grain across all
    #                                        ~26,081 rows incl. the new wheat/cotton-class slugs --
    #                                        zero duplicate (slug,state,year) keys in the replay -- so
    #                                        the latest-vintage ROW_NUMBER is a no-op today and NO
    #                                        vintage_tiebreak is needed. Declared anyway because the
    #                                        inferred group would be identical but silent, and a future
    #                                        NASS class/utilization split would break it invisibly.)
    metrics:
      production_mt:      {label: "production", unit: "MT", desc: "production for the crop year, metric tonnes (converted from NASS bushels / 480-lb bales / cwt)"}
      yield_t_ha:         {label: "yield", unit: "MT/ha", desc: "yield, metric tonnes per hectare (US corn ~11.7 t/ha == ~186 bu/ac; multiply by 0.40468564 then divide by the crop's bushel weight to go back to bu/ac)"}
      area_harvested_ha:  {label: "area harvested", unit: "ha", desc: "area HARVESTED, hectares (1 ha = 2.47105 acres)"}
      area_planted_ha:    {label: "area planted", unit: "ha", desc: "area PLANTED, hectares -- planted minus harvested is abandonment, which is the whole cotton story most years"}
    notes: >
      THIS TABLE IS THE UNITED STATES AND NOTHING ELSE. Every row is a US state (or the 'US' national
      roll-up) reported by USDA NASS: there is no Brazilian, Argentine, Chinese, EU, Black Sea, Indian
      or Australian crop here, and country is always 'united_states'. A US corn yield is NOT a read on
      a Brazilian safrinha, US upland cotton is NOT a read on Indian or Brazilian cotton, and the two
      are not proxies for each other -- say "US" out loud whenever you quote a figure from this card,
      and on a question about a non-US origin either label it explicitly as the US analogue or do not
      use it at all. For any other country's annual production use silver_psd (global balance sheets by
      country and marketing year) or silver_production.
      ONE LOOKUP = ONE METRIC AND ONE STATE. This card carries FOUR metrics and a free state axis, which
      is the exact shape that invites a metric-less state sweep ("give me the Corn Belt"): `metric` is
      REQUIRED and there is no all-metrics read, so a two-state yield comparison is one call per
      (metric, state) pair -- yield_t_ha for IA, then yield_t_ha for IL, and so on. A call that omits
      `metric` is rejected before anything is queried and costs you a lookup from the budget.
      ALWAYS PASS A STATE. country selects the geography and takes the 2-letter USPS code in CAPITALS
      ('IA', 'IL', 'KS', 'TX') or 'US' for the national figure -- pass country='US' for "the US corn
      crop". Two codes are NOT states: 'US' is the national total and 'OT' is NASS's "other states"
      residual bucket (its acreage is sometimes a literal 0). With NO state the read spans every
      reporting state and a single-row read then returns ONE arbitrary state's number wearing a
      national label. Every row carries its own state in the country field: say which state (or 'US')
      you are quoting, always.
      NEVER ADD 'US' TO A LIST OF STATES. The national row IS the sum of the state rows including 'OT'
      (verified exactly: the 48 state rows plus OT sum to the 'US' row to the last tonne for US corn
      2024), so a "top states" total that also counts 'US' double-counts the entire crop. Take shares
      AGAINST the 'US' row, never as part of the set.
      commodity = the CONTRACT slug and exactly these ten exist here (since 2026-08-20): corn_cbot,
      soybeans_cbot, cotton (ALL CLASSES = upland + pima), upland_cotton, pima_cotton, cottonseed,
      rough_rice_cbot, canola_ice, soft_red_winter_wheat_cbot and hard_red_spring_wheat_mgex. THE TWO
      WHEAT SLUGS CARRY NASS CLASSES, NOT PURE CONTRACT GRADES: soft_red_winter_wheat_cbot holds the
      NASS WINTER class (ALL winter wheat -- hard red, soft red and white together, back to 1909) and
      hard_red_spring_wheat_mgex holds SPRING EXCL DURUM -- say "US winter wheat" / "US spring wheat"
      when quoting them, not the exchange grade. There is NO hard-red-winter-specific annual lane
      (NASS publishes no HRW area or yield): for HRW or any by-class balance-sheet figure use
      silver_wasde, and there are still no durum, barley, oat, sorghum, sunflower or sugar rows.
      Anything off the ten is refused before any SQL runs; decline rather than substituting a
      different crop or class.
      period = the CROP YEAR as an integer (2025 = the 2025 crop). Read one crop year with period=2025,
      or a run of them with period_start/period_end 'YYYY-01-01'/'YYYY-12-31' -- on this card those
      bounds bind the YEAR axis (there is no date column), so they select whole crop years inclusively.
      THERE IS NO 'LATEST' SHORTCUT HERE. This card has no date axis, so agg=latest does NOT collapse to
      one row the way it does on a weekly or daily card: an unnarrowed read returns the whole citable
      history ascending, up to the row cap. Corn alone is ~7,600 rows across every state and every year
      since 1866, which EXCEEDS the 5,000-row cap -- the cap keeps the newest rows and the provenance
      line says the early end is missing. Always narrow: name the crop year with period=, and name the
      state, and a long history read wants period_start/period_end as well.
      A CROP YEAR IS NOT CITABLE UNTIL ITS JANUARY SUMMARY. USDA publishes the Crop Production Annual
      Summary for crop year Y in January of Y+1, so at a mid-2026 as-of the newest complete crop year is
      2025 and the 2026 crop is not yet readable here at all -- even though NASS has already published
      2026 planted acreage in its June Acreage report. That in-season print is deliberately NOT served
      by this card (one card carries one knowledge date, and the row is rewritten in January): for the
      current season's acreage, conditions and planting/harvest pace use silver_nass_crop_progress, and
      for USDA's forecast of the current marketing year's production use silver_wasde or silver_psd.
      YIELD AND PRODUCTION STOP ONE YEAR EARLIER THAN ACREAGE. Measured content ceiling: production_mt
      and yield_t_ha carry values through crop year 2025 for all four crops; area_planted_ha and
      area_harvested_ha additionally exist for 2026 but are withheld until that year's summary. History
      starts at 1866 for corn and cotton, 1895 for rice and 1924 for soybeans on the harvested-area,
      yield and production series; the PLANTED-area series starts later (US national: corn 1926, cotton
      1909, rice 1929, soybeans 1924), so an early-era planted-vs-harvested abandonment read is simply
      not available and should be declined rather than approximated.
      LATEST-REVISED, NOT AS-FIRST-PRINTED. Silver keeps ONE row per crop year and overwrites it, so a
      historical as-of returns today's REVISED NASS figure for an already-published crop year, not the
      number that printed that January. NASS revises prior years (the following year's summary, and the
      five-yearly Census benchmark), so treat this as the settled record rather than as a vintage replay
      -- the same honesty the Pink Sheet card states for its retroactive WB revisions. What the as-of
      guard DOES guarantee is that a crop year whose summary had not yet published is never returned.
      UNITS ARE METRIC AND CONVERTED. production_mt is metric TONNES, yield_t_ha is tonnes per hectare
      and both area columns are HECTARES -- NASS publishes acres, bushels, 480-lb bales and cwt, and the
      transform converted them. Quote the metric figure, or convert explicitly and say you did; never
      present a hectare number as acres. The coefficient-of-variation columns NASS ships alongside
      (area_planted_cv_pct and its three siblings) are physically ALL NULL in silver and are not
      served -- there is no sampling-error metric on this card.
      Conditions are a DIFFERENT table. Percent good-to-excellent, planting pace and harvest pace are
      silver_nass_crop_progress (weekly, in-season, six slugs incl. the two wheats); this card is the
      settled annual outcome. A weekly condition rating is not a yield, and a yield here is not a
      forecast of anything -- the forecast for an unfinished crop year is silver_wasde's.

  # PRICE_OBSERVABILITY W2 (v1b): World Bank Pink Sheet monthly world benchmark price averages,
