    description: >
      World Bank "Pink Sheet" monthly commodity price benchmarks -- MONTHLY AVERAGES (not exchange
      settles) for edible oils, grains, sugar, fertilizers and energy, in US dollars. Wide table,
      one row per month. Point-in-time via a monthly data date plus a conservative publication lag.
    grain: "one row per month (first-of-month data date)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): "Series begin 1960+" (notes). LIVE
    # monthly front -> no last_obs
    first_obs: "1960"
    cadence: monthly
    shape: wide
    period_type: date
    date_col: date                       # first-of-month DATA month; PHYSICAL TYPE IS TIMESTAMP (DP-5)
