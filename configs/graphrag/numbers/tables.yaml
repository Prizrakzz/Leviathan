# Numbers registry — observed-value Athena tables the SQL agent may look up (point-in-time correct).
# One entry per table: SQL shape (wide|tall), commodity/country/period identification, and the KNOWLEDGE-DATE
# semantics (vintage|ingest|data_date) that anchors every as-of query. This file is the agent's cached
# system-prompt context AND the deterministic query builder's schema source. Keystone tranche (4); ESR + the
# rest fold in next.
tables:

  silver_psd:
    description: >
      USDA PSD (Production, Supply & Distribution) — the authoritative global commodity balance sheets by
      country and marketing year. Each row is one country x commodity x marketing-year estimate as published on
      a given release_date; estimates are revised across releases, so as-of a date means the latest release on
      or before it.
    grain: "one row per commodity x country x market_year x release_date"
    # COVERAGE (PA-1, hoisted from this card's own measured text): 247,036 rows / 63 slugs, measured at the
    # XC-1/XC-7 re-run (comment above)
    row_count: 247036
    cadence: annual
    shape: wide
    commodity_col: leviathan_slug
    # D-EC XC-1/XC-7 CARD FLIP (2026-08-20). ARM AND FLIP WERE SEPARATE and this is the flip half: the
    # producer widening (13 -> 47 commodity codes, commit e437eff7) re-ran in the cloud at 10:01 and the
    # live object now carries 247,036 rows across 63 DISTINCT leviathan_slug values, measured on that
    # rewrite (data/dec_p0/projection_census.json, silver_psd commodity-code family). The card moves WITH
    # the table and never ahead of it -- teaching beef and cheese before the re-run would have taught a
    # table that did not exist, which is exactly what test_psd_slug_map_widening.py pinned.
    # The set is GENERATED from `_PSD_COMMODITY_TO_SLUGS` (transforms/bronze_to_silver/usda_psd.py:263),
    # never hand-listed, and a test asserts the two are EQUAL in both directions: producer and fence are
    # ONE universe or the build fails. Without that pin the drift is silent in the worst direction -- a
    # 48th code lands in the transform, silver serves its rows, and this card refuses every ask for it.
    # D-PQ CLASS-1 code fence: an off-list ask (cocoa -- ICCO territory, PSD publishes no cocoa sheet at
    # all; palm_oil; a NASS crop label) is REFUSED at spec level with a teaching error before any SQL is
    # compiled. The same facts are said again in `notes` on purpose -- the notes teach, this enforces.
    commodity_values: [arabica_coffee, barley, brazilian_arabica_coffee, broilers_poultry, butter,
                       campinas_corn_reference_bmf, canola_ice, cattle_beef, cheese, chicken_meat, coconut,
                       coconut_oil, copra_meal, corn_cbot, cotton, cottonseed, cottonseed_meal, cottonseed_oil,
                       fish_meal, french_maize_matif, french_rapeseed_matif, french_wheat_matif, fresh_citrus,
                       frozen_orange_juice, hard_red_spring_wheat_mgex, hard_red_winter_wheat_kcbt, hogs,
                       malaysian_crude_palm_oil_cme, milk_fluid, milk_powder_nonfat, milk_powder_whole, millet,
                       mixed_grain, oats, olive_oil, palm_kernel, palm_kernel_meal, palm_kernel_oil,
                       palm_olein_dce, peanut, peanut_meal, peanut_oil, rapeseed_meal_zce, rapeseed_oil_zce,
                       raw_sugar, robusta_coffee, rough_rice_cbot, rye, soft_red_winter_wheat_cbot, sorghum,
                       south_african_white_maize_jse, south_african_yellow_maize_jse, soybean_meal_cbot,
                       soybean_meal_dce, soybean_oil_cbot, soybean_oil_dce, soybeans_cbot, soybeans_no_1_dce,
                       soybeans_no_2_dce, sunflower, sunflower_meal, sunflower_oil, white_sugar]
    country_col: country
    period_col: market_year
    period_type: marketing_year
    period_sql_type: int                 # market_year is a smallint, e.g. 2023 (= 2023/24 marketing year)
    knowledge_date_col: release_date
    knowledge_semantics: vintage
    metrics:
      production_mt:         {label: "production", unit: "MT", desc: "production for the marketing year"}
      exports_mt:            {label: "exports", unit: "MT", desc: "exports"}
      imports_mt:            {label: "imports", unit: "MT", desc: "imports"}
      beginning_stocks_mt:   {label: "beginning stocks", unit: "MT", desc: "carry-in stocks"}
      ending_stocks_mt:      {label: "ending stocks", unit: "MT", desc: "carry-out stocks"}
      consumption_mt:        {label: "consumption", unit: "MT", desc: "domestic consumption/use"}
      area_harvested_1000ha: {label: "area harvested", unit: "1000 ha", desc: "harvested area"}
      yield_mt_ha:           {label: "yield", unit: "MT/ha", desc: "yield"}
      su_ratio:              {label: "stocks-to-use ratio", unit: "ratio", desc: "stocks-to-use ratio"}
      # W0-2 (projection wave, 2026-08-25): four columns the producer has ALWAYS written, never advertised.
      # Coverage measured on the live object before authoring (the PA-1 law) -- see notes for the spans.
      su_ratio_yoy_delta:        {label: "stocks-to-use ratio change (YoY)", unit: "ratio",
                                  desc: "year-over-year change in the stocks-to-use ratio, compared at the SAME release month of the estimate cycle (apples-to-apples vintages)"}
      production_mt_revision:    {label: "production revision", unit: "MT",
                                  desc: "month-over-month revision of the production estimate between consecutive WASDE releases for the same marketing year"}
      ending_stocks_mt_revision: {label: "ending stocks revision", unit: "MT",
                                  desc: "month-over-month revision of the ending-stocks estimate between consecutive WASDE releases for the same marketing year"}
      consumption_mt_revision:   {label: "consumption revision", unit: "MT",
                                  desc: "month-over-month revision of the consumption estimate between consecutive WASDE releases for the same marketing year"}
    notes: >
      Values in `_mt` columns are RAW metric tonnes (verified: Argentina corn MY2023 ending stocks = 2,462,000
      = 2.46 MMT). period = the marketing year as an integer (e.g. 2023). Latest vintage <= asof = as-known.
      SIXTY-THREE SLUGS, NOT THIRTEEN CONTRACTS (2026-08-20). This card is the whole USDA balance-sheet book,
      not just the tradeable grains: each crush complex on its OWN sheets (cottonseed, peanut, coconut,
      palm_kernel and every family's meal and oil), the minor cereals (barley, sorghum, rye, oats, millet,
      mixed_grain), the livestock and dairy demand layer (cattle_beef, hogs, broilers_poultry, chicken_meat,
      milk_fluid, milk_powder_nonfat, milk_powder_whole, butter, cheese) and the citrus pair. NEVER SUM
      broilers_poultry AND chicken_meat -- the second sheet is BROADER than the first and overlaps it.
      THE CITRUS PAIR IS TWO SUBJECTS, NEVER ONE: frozen_orange_juice is the FCOJ contract's own balance
      sheet (the JUICE) and fresh_citrus is the ORANGE fruit; they are never added and neither stands in for
      the other. For the monthly US orange/grapefruit/tangerine FORECAST by state in thousand boxes use
      silver_nass_citrus -- that is a US in-season forecast, this is the global marketing-year balance sheet.
      A CONTENT CEILING INSIDE PSD, NOT A PIPELINE GAP: broilers_poultry's newest release_date is 2016-10-10
      -- the sheet simply stops there in the source file, ten years back -- so quote the year you are
      reading and never call that series current.
      PSD carries NO cocoa balance sheet at all -- cocoa supply/demand is silver_icco_cocoa.
      THE REVISION METRICS COVER THE WASDE-TRACKED ERA ONLY, PER SLUG -- never say "revisions back to
      1960". Measured on the live object (2026-08-25): production/ending-stocks/consumption revisions
      exist for marketing years 2014-2026 on 56 of the 63 slugs, and each slug's onset differs (the
      cottonseed family from MY2014; rye, coconut, copra_meal and palm_kernel_meal only from MY2025) --
      the pre-WASDE mass (MY 1960-2004, one pass-through print per year) has no prior estimate to revise
      against, so a "not published" there is structural, not a gap. su_ratio_yoy_delta DOES span the full
      book (MY 1961-2026, 61 slugs): a YoY comparison needs only last year's same-month print. A revision
      of 0 is a real "unchanged estimate"; an absent revision means no consecutive-month pair exists.
      THESE EIGHT COLUMNS ARE NOT THE WHOLE SHEET -- silver_psd_attributes is the LONG companion and it
      is where the rest of the book lives. CRUSH, the DEMAND DECOMPOSITION (feed, FSI, feed+waste, food
      use, industrial use), the TRADE-YEAR trio (TY exports, TY imports, TY imports from the U.S.), the
      COFFEE arabica/robusta production split and the SUGAR raw/refined trade split are all published by
      USDA and served there, in USDA's own units. Route those asks to silver_psd_attributes rather than
      answering "not published"; this card stays the MT-denominated balance-sheet spine, and the two
      cards share ONE commodity vocabulary (the same 63 slugs, from the same producer map).

  silver_psd_attributes:
    description: >
      USDA PSD -- the LONG companion to silver_psd. One row per leviathan_slug x country x
      market_year x wasde_release_month x attribute, with the value in USDA's OWN unit. silver_psd
      pivots EIGHT balance-sheet attributes into MT-denominated columns and discards the rest; this
      table carries all FIFTY-SIX attributes the bulk file publishes for in-scope commodities --
      Crush, the whole demand decomposition, the TY trade trio, the coffee and sugar variety splits,
      and the rate attributes no unit factor exists for. Estimates are revised across releases, so
      as-of a date means the latest release on or before it.
    grain: "one row per leviathan_slug x country x market_year x wasde_release_month x attribute"
    # THE SERVING GRAIN IS NOT THE PHYSICAL GRAIN, AND THE DIFFERENCE IS THE AS-OF MACHINERY. The
    # PHYSICAL grain above carries wasde_release_month: the F010 natural_key keeps it, the producer
    # dedups on it, and the table retains all ~13 WASDE vintages of every marketing year (389,283
    # rows carry month_code 0, the pre-WASDE-tracking mass, MY 1960-2004). grain_cols is
    # deliberately ABSENT: build_sql's latest-vintage ROW_NUMBER partitions by the tall fallback
    # (leviathan_slug, country, market_year, attribute) and orders by release_date DESC, which is
    # exactly what collapses those vintages to "the latest release on or before asof". Declaring
    # the physical grain here would make that collapse a structural no-op -- one row per partition,
    # _rn = 1 filters nothing -- and every ask would fan ~13 vintages per marketing year.
    # silver_psd omits release_date from its serving grain for the same reason. silver_wasde's
    # regression was the OPPOSITE error: it dropped SUBJECT dimensions (table_type, region), never
    # the vintage axis. The vintage axis belongs to the ROW_NUMBER; the subject axes belong to the
    # grain; and the one card that puts its vintage axis in grain_cols
    # (silver_wap_table01_revisions) does so because the revision SERIES is its subject, guarded by
    # row_filters + vintage_tiebreak this card does not carry.
    # COVERAGE (PA-1, projection wave Lane 3; RE-MEASURED 2026-08-26 on the FIRST CANONICAL OBJECT,
    # the apply-then-refresh law). row_count is the SERVED subset -- the declared metrics roster
    # below, which is also exactly what the pg mirror admits: 1,079,487 rows on the canonical
    # publish (3,397,958 physical rows / 0 grain dupes / 63 slugs / 56 labels / 810 releases,
    # certified manifest silver_psd_attributes-1787727710260). TWO PROVENANCES, BOTH REAL: the L2-0
    # census (data/dec_p0/psd_attribute_census.json, single 2026-08-13 bulk object) measured the
    # same roster at 1,033,407 with T1 = 742,057 (the D-6 admission figure); the canonical object
    # runs ~4.3% higher because the producer consumed every DISTINCT vendor snapshot in bronze
    # (raw-ETag dedup kept 3-4), so vintages that survive only in older or newer snapshots are
    # preserved -- more history, same grain, zero dupes. The per-metric row figures in the descs
    # below stay CENSUS-pinned (that is the artifact a reader can re-derive them from); this field
    # is the live serving figure. NO last_obs: the bulk file is cumulative and re-fires on days
    # 8-13 of every month, so the front moves; first_obs is the table-wide floor and the
    # PER-ATTRIBUTE onsets differ (Industrial Dom. Cons. from MY1961, Fresh Dom. Consumption and
    # Cows In Milk from MY1964) -- see notes.
    row_count: 1079487
    first_obs: "1960"
    cadence: annual
    shape: tall
    commodity_col: leviathan_slug
    # GENERATED from _PSD_COMMODITY_TO_SLUGS (transforms/bronze_to_silver/usda_psd.py:263), never
    # hand-listed -- the same both-directions equality test silver_psd's card already carries. The
    # two cards share ONE producer map and must never drift apart: a 48th code landing in the
    # transform with only one card moved is a table serving rows its own fence refuses.
    commodity_values: [arabica_coffee, barley, brazilian_arabica_coffee, broilers_poultry, butter,
                       campinas_corn_reference_bmf, canola_ice, cattle_beef, cheese, chicken_meat, coconut,
                       coconut_oil, copra_meal, corn_cbot, cotton, cottonseed, cottonseed_meal, cottonseed_oil,
                       fish_meal, french_maize_matif, french_rapeseed_matif, french_wheat_matif, fresh_citrus,
                       frozen_orange_juice, hard_red_spring_wheat_mgex, hard_red_winter_wheat_kcbt, hogs,
                       malaysian_crude_palm_oil_cme, milk_fluid, milk_powder_nonfat, milk_powder_whole, millet,
                       mixed_grain, oats, olive_oil, palm_kernel, palm_kernel_meal, palm_kernel_oil,
                       palm_olein_dce, peanut, peanut_meal, peanut_oil, rapeseed_meal_zce, rapeseed_oil_zce,
                       raw_sugar, robusta_coffee, rough_rice_cbot, rye, soft_red_winter_wheat_cbot, sorghum,
                       south_african_white_maize_jse, south_african_yellow_maize_jse, soybean_meal_cbot,
                       soybean_meal_dce, soybean_oil_cbot, soybean_oil_dce, soybeans_cbot, soybeans_no_1_dce,
                       soybeans_no_2_dce, sunflower, sunflower_meal, sunflower_oil, white_sugar]
    country_col: country
    period_col: market_year
    period_type: marketing_year
    period_sql_type: int                 # market_year is a smallint, e.g. 2023
    knowledge_date_col: release_date
    knowledge_semantics: vintage
    metric_col: attribute                # tall: the metric NAME is USDA's OWN label (see notes)
    value_col: value
    unit_col: unit
    # THE DECLARED ROSTER IS THE D-6 DECISION MADE FLESH, and it is not cosmetic: load_pg_numbers
    # filters every tall table to `attribute IN (declared metrics)`, so an attribute absent from this
    # roster is invisible to serving AND to the census whatever silver holds. Spellings are USDA's
    # own, byte-for-byte off the 2026-08-13 census (data/dec_p0/psd_attribute_census.json) -- the
    # silver_wasde Title-Case bug returned ZERO rows for every WASDE lookup for months, so a metric
    # key here is a source string, never a house one. Per-attribute row counts (in-scope, after R4's
    # fan-out) are stated so a later editor can re-derive the admission arithmetic without a re-run.
    metrics:
      # -- T1, the ranked payload: 742,057 rows, EXACTLY the D-6 admission number ------------------
      "Crush":                  {label: "crush", unit: "1000 MT", desc: "oilseed volume crushed for meal and oil -- 71,551 rows, 21 commodities, MY1960-2026. The estate's ONLY physical crush VOLUME; gold_board_crush is a Chicago MARGIN in $/bu and answers a different question"}
      "Feed Dom. Consumption":  {label: "feed use", unit: "1000 MT", desc: "domestic feed consumption -- 84,759 rows, 8 commodities, MY1960-2026"}
      "FSI Consumption":        {label: "food, seed and industrial use", unit: "1000 MT", desc: "food/seed/industrial consumption, the non-feed half of the split -- 84,759 rows, 8 commodities, MY1960-2026"}
      "Feed Waste Dom. Cons.":  {label: "feed and waste use", unit: "1000 MT", desc: "domestic feed-and-waste consumption (the wider feed line USDA prints for 24 commodities) -- 83,368 rows, MY1960-2026"}
      "Food Use Dom. Cons.":    {label: "food use", unit: "1000 MT", desc: "domestic food consumption -- 83,368 rows, 24 commodities, MY1960-2026"}
      "Industrial Dom. Cons.":  {label: "industrial use", unit: "1000 MT", desc: "domestic industrial consumption -- the corn-ethanol grind lives here; 57,127 rows, 17 commodities, MY1961-2026"}
      "TY Exports":             {label: "trade-year exports", unit: "1000 MT", desc: "exports on the TRADE year, not the marketing year -- the basis that reconciles ESR and FGIS against the balance sheet; 92,375 rows, 9 commodities, MY1960-2026"}
      "TY Imports":             {label: "trade-year imports", unit: "1000 MT", desc: "imports on the trade year -- 92,375 rows, 9 commodities, MY1960-2026"}
      "TY Imp. from U.S.":      {label: "trade-year imports from the United States", unit: "1000 MT", desc: "the destination's imports FROM the U.S. on the trade year -- each destination's US import share back to 1960; 92,375 rows, 9 commodities"}
      # -- THE FOUR CONSUMPTION LABELS. A consumption ask spans ALL FOUR or three commodity families
      #    silently drop; see the CONSUMPTION IS FOUR LABELS note below. 237,581 rows together.
      "Domestic Consumption":   {label: "domestic consumption", desc: "domestic consumption on 44 of the in-scope commodity codes -- 209,156 rows, MY1960-2026. THE ONE MULTI-UNIT METRIC ON THIS CARD: 40 codes print (1000 MT) 111,016 rows, plus (1000 MT CWE) 6,712 / (1000 60 KG BAGS) 4,616 / (MT) 746 -- so ALWAYS PASS A COMMODITY with this metric, the row's unit column governs, and these rows are NEVER summed across commodities"}
      "Total Disappearance":    {label: "total disappearance (sugar's consumption line)", unit: "1000 MT", desc: "the sugar sheet's consumption line -- raw_sugar and white_sugar publish NO 'Domestic Consumption'; 19,002 rows, MY1960-2026"}
      "Domestic Use":           {label: "domestic use (cotton's consumption line)", unit: "1000 480 lb. Bales", desc: "the cotton sheet's consumption line, in RUNNING BALES not tonnes -- 7,777 rows, MY1960-2026"}
      "Fresh Dom. Consumption": {label: "fresh domestic consumption (fresh citrus's consumption line)", unit: "1000 MT", desc: "the fresh-citrus sheet's consumption line -- 1,646 rows, MY1964-2025"}
      # -- THE VARIETY / REFINING SPLITS. Correctness, not depth: without these, three coffee slugs
      #    and two sugar slugs read IDENTICAL numbers off one shared sheet.
      "Arabica Production":     {label: "arabica production", unit: "1000 60 KG BAGS", desc: "arabica green-coffee production -- carried ONLY by arabica_coffee and brazilian_arabica_coffee (R4); 9,232 rows, MY1960-2026"}
      "Robusta Production":     {label: "robusta production", unit: "1000 60 KG BAGS", desc: "robusta green-coffee production -- carried ONLY by robusta_coffee (R4); 4,616 rows, MY1960-2026"}
      "Raw Imports":            {label: "raw sugar imports", unit: "1000 MT", desc: "imports of RAW sugar -- carried only by raw_sugar (R4); 9,501 rows, MY1960-2026"}
      "Raw Exports":            {label: "raw sugar exports", unit: "1000 MT", desc: "exports of RAW sugar -- carried only by raw_sugar (R4); 9,501 rows, MY1960-2026"}
      "Refined Imp.(Raw Val)":  {label: "refined sugar imports (raw-value basis)", unit: "1000 MT", desc: "imports of REFINED sugar, tonnage stated on the raw-sugar-equivalent accounting basis -- carried only by white_sugar (R4 / D-L3-6, owner-ratified: '(Raw Val)' is the BASIS, not the subject); 9,501 rows, MY1960-2026"}
      "Refined Exp.(Raw Val)":  {label: "refined sugar exports (raw-value basis)", unit: "1000 MT", desc: "exports of REFINED sugar on the raw-value accounting basis -- carried only by white_sugar (R4 / D-L3-6); 9,501 rows, MY1960-2026"}
      # -- THE HEAD COUNT, carried honestly because the unit column retires the hazard --------------
      "Cows In Milk":           {label: "cows in milk", unit: "1000 HEAD", desc: "milking herd size, a HEAD COUNT and not a tonnage -- 1,917 rows on milk_fluid, MY1964-2026. NEVER added to, differenced against or ratioed with any (1000 MT) row on this card"}
    notes: >
      VALUES ARE IN USDA'S NATIVE UNIT AND THE `unit` COLUMN IS AUTHORITATIVE -- this table converts
      nothing. Six units are live across the card ((1000 MT), (1000 MT CWE), (MT), (1000 60 KG BAGS),
      1000 480 lb. Bales, (1000 HEAD)), so never sum or difference two rows without checking that
      their units match, and never quote a figure without its unit. The COLUMN prints USDA's
      parenthesized spellings -- '(1000 MT)' -- while this card's unit fields unwrap them for prose;
      the row's unit column is the compare key. That honesty is the same mechanism that lets the
      table carry rates and head counts at all: silver_psd RAISES on any unit it cannot convert, and
      PERCENT/RATIO are deliberately absent from its factor table.
      CONSUMPTION IS FOUR LABELS, NOT ONE, AND AN ASK MUST SPAN ALL FOUR. USDA prints the same
      economic line under four different names: Domestic Consumption (44 commodity codes -- and the
      one multi-unit metric on this card, so ALWAYS PASS A COMMODITY with it), Total Disappearance
      (sugar -- raw_sugar and white_sugar have NO Domestic Consumption row), Domestic Use (cotton, in
      running bales) and Fresh Dom. Consumption (fresh_citrus). Together they are 237,581 rows =
      every slug-vintage exactly once: 44 + 1 + 1 + 1 = 47 commodity codes, the producer's whole
      mapped-code set. A consumption question answered off "Domestic Consumption" alone silently
      drops sugar, cotton and fresh citrus -- three families that each look like a data gap and are
      not one.
      METRIC NAMES ARE USDA'S OWN SPELLINGS, byte-for-byte, punctuation included ("Feed Waste Dom.
      Cons.", "TY Imp. from U.S.", "Refined Imp.(Raw Val)"). A house-cased variant matches ZERO rows
      and reads as "not published" -- the silver_wasde Title-Case bug, which hid every WASDE lookup
      for months.
      TWO ATTRIBUTES THE TABLE REFUSES BY NAME, both declines and neither a gap. Milling Rate
      (.9999) (attribute 182, code 422110 Rice, Milled; 7,616 rows/release) is a 1e4-scaled RATE the
      source labels "(1000 MT)" -- measured min 0 / median 6,500 / max 7,561, i.e. a milling rate of
      ~0.65, not 6.5 MMT. Serving it under its own false unit would be wrong by ~1e7, so the rows are
      declined at the transform (_PSD_UNIT_MISLABELLED_ATTR_IDS); reopening needs a value-scale
      column, never a rewritten unit string. And "Other Production" on the coffee sheet (the residual
      variety leg, 4,616 rows/release) belongs to NEITHER arabica nor robusta and there is no third
      coffee slug to carry it, so it is a declared no-slug drop.
      PER-SLUG AND PER-ATTRIBUTE CEILINGS, quoted with the year they belong to. broilers_poultry's
      newest release_date is 2016-10-10 -- the sheet stops there inside the source file, ten years
      back -- so never call that series current. Attribute onsets differ from the table's 1960 floor:
      Industrial Dom. Cons. starts MY1961, Fresh Dom. Consumption and Cows In Milk MY1964, and Fresh
      Dom. Consumption's newest in-scope year is 2025.
      VINTAGES: release_date is the WASDE release the estimate was published at, derived from
      (market_year, wasde_release_month); month_code 0 marks the pre-WASDE-tracking mass (MY
      1960-2004, 389,283 rows) that carries one pass-through print per year. Re-printed vintages
      resolve LATEST-WINS on (release_date, bronze_ingest_date), so the table retains one row per
      vintage and as-of a date means the latest release on or before it.
      SCOPE: the metrics above are the DECLARED subset -- 20 of the 56 attributes the produced object
      holds. An undeclared attribute is not "missing data"; it is not advertised, and the honest
      answer is that this card does not serve it.

  silver_wasde:
    description: >
      USDA WASDE — monthly World Agricultural Supply and Demand Estimates. Tall/long format: one row per
      commodity x REGION x attribute x marketing_year per monthly release_date. Attributes are the
      balance-sheet line items; region is the geographic scope of the estimate (united_states, world,
      brazil, major_exporters, ...). As-of a date = the latest monthly release on or before it.
    grain: "one row per commodity x table_type x region x attribute x marketing_year x release_date"
    # COVERAGE (PA-1, hoisted from this card's own measured text): monthly release; no table-wide row/span
    # census is stated on this card
    cadence: monthly
    # FIXED 2026-07-05 (pg-parity gate catch): the grain also carries table_type + region — without them
    # in grain_cols the latest-vintage ROW_NUMBER collapsed ACROSS regions and kept one arbitrary region
    # row per (commodity, MY, attribute). Undetectable before because the Title-Case metrics bug made
    # every WASDE lookup return 0 rows anyway.
    grain_cols: [commodity, table_type, region, marketing_year, attribute]
    shape: tall
    commodity_col: commodity
    country_col: region                  # region IS the country axis here (see notes for the value format)
    period_col: marketing_year
    period_type: marketing_year
    period_sql_type: string              # marketing_year is a string like '2023/24'
    knowledge_date_col: release_date
    knowledge_semantics: vintage
    # Partition mode: REGISTERED (partition_mode registered / projection FORBIDDEN since BF-W2, ~461 real
    # monthly release_date partitions). Athena prunes the catalog with NO S3 enumeration, so an unbounded
    # probe is safe here -- the projected-grid / LIST-storm text that once lived on this table is DEAD
    # doctrine (PRICE_OBSERVABILITY W1.2 / S2.F11). The as-of guard is still emitted NATIVELY on release_date
    # (no CAST -- identity on a string col, and never poison a registered key) and the period-derived lower
    # bound is KEPT as free hygiene; real publication dates make those date bounds semantically valid here
    # (unlike ESR write-dates).
    vintage_partition_col: release_date
    vintage_partition_format: iso
    vintage_dates_real: true
    # FIXED 2026-07-16 (F2 pg-parity gate catch): the F2 WASDE rebuild put the F036 columns physically into
    # ALL silver_wasde partitions -- estimate_role {projection|estimate|actual}, projection_month,
    # source_table_id are natural-key columns. Early-era releases (1985-1999) legitimately carry MULTIPLE rows
    # per numbers grain (commodity, table_type, region, marketing_year, attribute) at ONE release_date,
    # differing only by estimate_role. The release_date-only latest-vintage ROW_NUMBER now TIES and pg vs
    # Athena break the tie by ENGINE ORDER -> Branch-A value flip-flops on the 1985/1986/1989 releases. This
    # deterministic role-priority tiebreak makes the MOST-SETTLED figure win at any as-of (actual < estimate <
    # projection).
    #
    # FIXED 2026-07-22 (WASDE-restoration W2, chronological projection_month): the modern US two-vintage shape
    # carries TWO projection rows per grain at ONE release -- a current-month projection column AND a
    # prior-month one (silver stores FULL month names in projection_month: 'January'..'December'). The value
    # that must win is the CURRENT one, which == the RELEASE month (probed carry-forward series: Nov'01->Nov,
    # Dec'01->Dec, Jan'02->Jan=1546 not the stale Dec=1574). The OLD `projection_month DESC NULLS LAST` ranked
    # month NAMES LEXICALLY -- it picks 'October' over 'November' (O>N) and 'December' over 'January' -- i.e.
    # the STALE prior-month value at ~half of all releases. A static winner-first month list can't fix it
    # either: the DEC/JAN WRAP is PRESENT (Athena probe 2026-07-22: 1549 grains, all January releases, carry
    # BOTH 'December' and 'January'); a static calendar order would wrongly pick December there. So the rank is
    # RELEASE-RELATIVE: `match_release_month: release_date` ranks the projection_month that equals the release
    # month FIRST (rank 0), default ASC, no `dir` -> the SQL CASE and the pure-Python oracle agree BY
    # CONSTRUCTION (avoids the ORACLE-DIR trap: a naive {..., dir: desc} emits correct SQL but the oracle's
    # role_order branch ignored dir -- now honored symmetrically on both branches). source_table_id ASC stays
    # the final total-order key. projection_month is silver `string` (full month names byte-for-byte) and
    # release_date is the ISO 'YYYY-MM-DD' partition -> substr(release_date,6,2) is engine-portable, no CAST,
    # no partition-pruning impact (it lives in the ROW_NUMBER ORDER BY, not the WHERE).
    vintage_tiebreak:
      - {col: estimate_role, role_order: [actual, estimate, projection]}   # role rank ASC: actual (rank 0) wins
      - {col: projection_month, match_release_month: release_date}          # current-month projection wins (release-relative)
      - {col: source_table_id, dir: asc}                                    # final deterministic total-order key
    # DP-2 (PRICE_OBSERVABILITY W1.2): surface estimate_role as `revision_stamp` on every row so an
    # avg_farm_price figure carries whether it is an actual / estimate / projection (R3 attribution: a
    # current/future-MY value is a USDA PROJECTION and must be attributed, not sold as our forecast).
    provenance_col: estimate_role
    metric_col: attribute                # the metric NAME lives here (e.g. 'Ending Stocks')
    value_col: estimate
    unit_col: unit
    metrics:
      # FIXED 2026-07-05: the silver data stores snake_case attributes (ending_stocks, production, ...).
      # The previous Title-Case names ('Ending Stocks', 'Total Use') matched ZERO rows — every WASDE lookup
      # silently compiled to an empty result and reported "not yet published". Caught by the pg-mirror
      # loader's 0-row load; values verified against SELECT DISTINCT attribute on release_date=2024-06-12.
      "ending_stocks":   {label: "ending stocks", desc: "carry-out stocks line"}
      "production":      {label: "production", desc: "production line"}
      "exports":         {label: "exports", desc: "exports line"}
      "imports":         {label: "imports", desc: "imports line"}
      "domestic_total":  {label: "total domestic use", desc: "total domestic use line (was mislabeled 'Total Use')"}
      "beginning_stocks": {label: "beginning stocks", desc: "carry-in stocks line"}
      # PRICE_OBSERVABILITY A3 RE-WHITELIST (2026-07-22): silver_wasde was rebuilt + promoted (canonical
      # CERTIFIED, 373 releases 1995+, pg parity PASS) and avg_farm_price is LIVE data again -- unwinding the
      # July W3.0 exclusion (label-dead then; the bronze alias was re-extended + re-parsed). Coverage + units
      # are probe-verified against the rebuilt canonical (2026-07-22), trusted over the retired exclusion note:
      #   corn/rice/sorghum/wheat  united_states  1995-01-12 -> 2026-07-10 (MY 1992/93 -> 2026/27)
      #   soybeans                 united_states  1996-06-12 ->            (MY .. -> 2026/27)
      #   cotton  REGION SPLIT: region 'u_s_cotton' 1995 -> 2011-08-11, THEN region 'united_states'
      #           2011-09-12 -> now (the split is REAL -- row_filters accepts BOTH so a pre-2011 ask and a
      #           modern ask both resolve; the two eras dedup by their own release vintage)
      #   soybean_oil + soybean_meal  united_states  2011-09-12 -> now (from the restored US oil-crops table --
      #           these are MARKET prices: Decatur oil c/lb, Decatur meal $/s.t., NOT farm-gate; desc says so)
      #   barley/oats  2015-07-10 -> now
      # unit_overrides is the GOVERNING display unit because the stored `unit` column is heterogeneous: modern
      # rows carry real units, legacy pre-2011 rows carry an EMPTY unit (values era-correct, e.g. corn med 2.38),
      # and cotton rows carry a WRONG bled label 'Million 480 Pound Bales' on c/lb-magnitude values (med 68.09).
      # Two attribution BLEEDS the row_filters fence out of serving (mechanism = Metric.row_filters, mirrored
      # in build_sql + apply_pit_filter):
      #   * soybeans: besides the clean '$/bu' series (689 rows, med 10.55) silver carries '$/s.t.' rows (149,
      #     med 392, meal-like), 'Domestic Measure' rows (691, med 5.86 hi 227.5, mixed junk) and 'c/lb' rows
      #     (8, oil-like) on the soybeans commodity -- restrict soybeans farm-price fetches to unit IN
      #     ('$/bu','') so only the true bean price (modern + legacy-blank) can reach serving.
      #   * cotton: exclude nothing (the label is wrong but the rows are right; unit_overrides displays c/lb) --
      #     the row_filter on the region column just widens the country match to region IN
      #     ('u_s_cotton','united_states') across the 2011 split.
      # Current- and future-MY values are USDA PROJECTIONS -- attributed by revision_stamp (provenance_col=
      # estimate_role) and the A1 release-relative projection_month tiebreak picks the CURRENT-month value.
      # R1 (config_check) binds unit_overrides keys to _FARM_PRICE_COMMODITIES; R3 binds the estimate_role-first
      # vintage_tiebreak + provenance_col above (both already present).
      "avg_farm_price":
        label: "average farm price"
        desc: >
          US season-average price by commodity (USDA survey-based; NOT a futures settle). corn, wheat, sorghum,
          oats and barley are $/bu; rice $/cwt; cotton c/lb; soybeans $/bu. soybean_oil (c/lb) and soybean_meal
          ($/s.t.) are US MARKET prices at Decatur, NOT farm-gate -- attribute them as such. Current- and
          future-MY values are USDA PROJECTIONS (revision_stamp carries actual/estimate/projection), never sold
          as our own forecast. Legacy pre-2011 rows carry an empty source unit; the values are era-correct.
        unit_overrides:
          corn:         "$/bu"
          wheat:        "$/bu"
          sorghum:      "$/bu"
          oats:         "$/bu"
          barley:       "$/bu"
          rice:         "$/cwt"
          cotton:       "c/lb"
          soybeans:     "$/bu"
          soybean_oil:  "c/lb"
          soybean_meal: "$/s.t."
        row_filters:
          # soybeans attribution bleed -> only the true bean price ($/bu, plus legacy-blank) reaches serving.
          soybeans:
            unit: ["$/bu", ""]
          # cotton region split -> the US cotton farm price lives under BOTH region codes across the 2011 break.
          cotton:
            region: ["u_s_cotton", "united_states"]
    notes: >
      attribute values are snake_case in silver (ending_stocks, ...). period = marketing_year string e.g.
      '2023/24'. country filters the REGION column and its values are snake_case scopes: 'united_states',
      'world', 'brazil', 'argentina', 'china', 'european_union', 'major_exporters', 'total_foreign', ...
      — pass country='united_states' for the US balance sheet (NOT 'United States'). Without a country the
      result spans ALL regions (each row carries its region in the country field).

  silver_production:
    description: >
      FAOSTAT annual CROP production statistics by country and commodity -- production, harvested
      area and yield, 1961-2024, for 43 commodity slugs including the World row and the continental
      aggregates (FAO-3's ladder). Tall format: metric names live in `metric`, values in `value`.
      Observational/annual — stamped with an ingest_date (no revision vintage), so as-of = rows
      ingested on or before the date.
    grain: "one row per commodity x country x year x metric"
    # COVERAGE (PA-1, FAO-5: MEASURED on the LIVE object AFTER the 2026-08-26 Lane-4 rewrite --
    # the full-table repair that landed the F022 canonical writer's first output, fixed is_official
    # on every row (595,898 official under the release's own legend, was 9.31% under the inverted
    # pre-2022 scheme), and admitted the twelve FAO-1 commodities): 862,153 rows / 43 slugs /
    # 1961-2024 / 3 metrics (production_quantity 333,585, area_harvested 271,889, yield 256,679).
    # last_obs moves at each annual QCL release WITH the projection year.range -- the annual-release
    # runbook owns both; a range or last_obs that lags the data silently truncates the newest year.
    row_count: 862153
    first_obs: "1961"
    last_obs: "2024"
    cadence: annual
    shape: tall
    commodity_col: commodity
    # FAO-5: GENERATED from configs/sources/faostat_item_map.yaml's CROP half (the map minus the
    # four livestock slugs, which belong to the fenced silver_production_livestock card below) --
    # exactly the live projection enum, pinned both directions by test. Without this fence a
    # `sorghum` ask pre-FAO-1 compiled SQL and returned a silent 0-row.
    commodity_values: [cocoa, corn_cbot, campinas_corn_reference_bmf, french_wheat_matif,
                       french_maize_matif, hard_red_winter_wheat_kcbt, hard_red_spring_wheat_mgex,
                       soft_red_winter_wheat_cbot, rough_rice_cbot, south_african_white_maize_jse,
                       south_african_yellow_maize_jse, soybeans_cbot, soybean_meal_cbot,
                       soybean_oil_cbot, soybeans_no_1_dce, soybeans_no_2_dce, soybean_meal_dce,
                       soybean_oil_dce, french_rapeseed_matif, canola_ice, rapeseed_oil_zce,
                       rapeseed_meal_zce, malaysian_crude_palm_oil_cme, palm_olein_dce,
                       brazilian_arabica_coffee, arabica_coffee, robusta_coffee, cotton, raw_sugar,
                       white_sugar, frozen_orange_juice, sorghum, peanut, barley, millet, oats,
                       sunflower, rye, cottonseed_oil, cottonseed, sunflower_oil, palm_kernel_oil,
                       palm_kernel]
    country_col: country                      # FAO-3: holds FAOSTAT's RAW M49 DISPLAY STRING ('United States of
    #                                           America', 'Viet Nam', "Côte d'Ivoire", 'China, mainland'), so a
    #                                           country='United States' ask emitted a plain equality that matched
    #                                           ZERO rows, silently -- name<->area is a query-time translation
    #                                           (faostat_areas.yaml), no silver column and no pg reload
    country_name_ref: numbers/faostat_areas.yaml   # FAO-3 numbers-owned static area reference, 244 areas incl.
    #                                                the aggregate ladder (World / 5 continents + sub-regions /
    #                                                European Union (27) / LDC+LLDC+SIDS+LIFDC+NFIDC) and the bare
    #                                                'China' row, a mainland+HK+Macao+Taiwan roll-up
    country_axis_is_destination: false        # FREE geography axis: these are REPORTING countries of a world crop
    #                                           surface, so the row's country IS the fact's geography and the
    #                                           citation label fallback stands (silver_esr is the other reading)
    period_col: year
    period_type: year
    period_sql_type: int
    knowledge_date_col: ingest_date
    knowledge_semantics: ingest
    metric_col: metric
    value_col: value
    unit_col: unit
    metrics:
      # physical vocabulary is production_quantity/area_harvested/yield (footer-probed 2026-07-15);
      # the old declared name 'production' was a zero-row phantom -- the pg loader's isin filter
      # never even mirrored those rows (C002-caught at the first live Branch-A gate fire).
      # FAO-5 per-metric units, measured (the whole file prints exactly t / ha / kg/ha for the crop
      # elements). yield is kg/ha where silver_psd's yield_mt_ha is MT/ha -- a 1000x collision on
      # the exact question that touches both cards; the unit fields are what let a seat choose
      # with its eyes open.
      production_quantity: {label: "production", unit: "t", desc: "production quantity, metric tonnes"}
      area_harvested:      {label: "area harvested", unit: "ha", desc: "harvested area, hectares"}
      yield:               {label: "yield", unit: "kg/ha", desc: "yield in KILOGRAMS per hectare -- silver_psd's yield_mt_ha is TONNES per hectare, a 1000x difference; never compare the two without converting"}
    notes: >
      metric strings match the dataset's metric labels. period = year integer.
      THE FAN-OUT (FAO-5): 43 slugs map onto 25 distinct FAOSTAT items -- Maize serves five slugs,
      Soya beans five, Wheat four, Coffee green three, Rape or colza seed three, and the sugar/oil
      pairs two each -- so one item's number is IDENTICAL under every slug it serves, and summing
      across slugs double-counts. THE WORLD ROW IS REAL AND SO IS THE AGGREGATE LADDER: 'World',
      the continents and their sub-regions, 'European Union (27)' and the five country groups sit
      in the SAME country column as their members (FAO-3's faostat_areas.yaml declares them) --
      never sum an aggregate with the countries inside it. is_official tracks the release's OWN
      flag legend since the 2026-08-26 rewrite (A=official; E estimated, I imputed, X
      international-org, M cannot-exist with a NULL value). Coverage is not uniform across slugs:
      the processed items (the oil/meal legs) carry Production ONLY and stop at 2023, while the
      seven primary crop items carry all three metrics to 2024.

  # ── FAO-2 (PROJECTION WAVE Lane 5): THE SECOND CARD ON THE SAME PHYSICAL TABLE ──────────────────
  # `athena_table: silver_production` -- one Glue object, two cards, the silver_esr ->
  # silver_esr_compact redirect used for a purpose it had not served before. It is a SECOND CARD and
  # not a widening of the card above because `commodity_values` and per-metric `unit` are per-CARD
  # CLOSED SETS: merged, a `cattle_beef` + `area_harvested` ask would compile SQL and return a silent
  # 0 rows (the exact defect FAO-5's commodity fence exists to close), and `yield [kg/ha]` would sit
  # on the same card as `yield_per_animal [kg/An]`.
  #
  # WHITELIST-ABSENT ON ARRIVAL (registry.WHITELIST_ABSENT_DEFAULT, the Lane-3 arm-vs-flip doctrine).
  # The item map is widened and the transforms map the five livestock elements, but THE LIVESTOCK
  # ROWS DO NOT EXIST YET -- silver_production's live objects hold only the crop metrics -- and a
  # served card would answer every herd question with 0 rows, which reads as "no cattle" rather than
  # "not published". The PA-1 coverage fields are therefore ABSENT, not estimated: `_table_card`
  # renders no coverage line at all when none is set, and an absent census is SILENCE. Measure
  # row_count / first_obs on the produced objects in the flip change.
  silver_production_livestock:
    athena_table: silver_production            # ONE physical table, TWO cards (see the block above)
    description: >
      FAOSTAT annual LIVESTOCK statistics by country — herd and flock SIZE, the milking herd, and
      output per animal. This is the estate's ONLY source of herd dynamics: silver_psd carries
      cattle_beef / hogs / broilers_poultry as balance sheets in metric TONNES and publishes no
      animal count at all (it refuses the two USDA animal-numbers codes by name, for want of a
      head-count home). Tall format on the silver_production physical table: metric names live in
      `metric`, values in `value`, and THE ROW'S OWN `unit` COLUMN IS AUTHORITATIVE — this card
      carries head counts, tonnes and per-animal rates side by side on purpose.
      Observational/annual — stamped with an ingest_date (no revision vintage), so as-of = rows
      ingested on or before the date.
    grain: "one row per commodity x country x year x metric"
    # COVERAGE (PA-1, MEASURED 2026-08-26 on the PRODUCED objects, the flip change's own read --
    # never the source ZIP: the 2026-08-26 backfill ran cattle_beef as a one-slug canary then the
    # three-slug fan-out, and every figure landed EXACTLY on the banked livestock census
    # (data/dec_p0/faostat_livestock_census.md): 80,654 rows / 4 slugs / 1961-2024 / 4 metrics
    # (live_animals 40,587 = cattle 13,831 An + hogs 12,824 An + broilers 13,932 "1000 An";
    # milk_animals 13,360; production_quantity 13,359; yield_per_animal 13,348). last_obs moves at
    # each annual QCL release with the crop card's -- the annual-release runbook owns both.
    row_count: 80654
    first_obs: "1961"
    last_obs: "2024"
    cadence: annual
    shape: tall
    commodity_col: commodity
    country_col: country                      # FAO-3: FAOSTAT's RAW M49 DISPLAY STRINGS, resolved
    country_name_ref: numbers/faostat_areas.yaml   #      through the shared area reference
    country_axis_is_destination: false        # FREE geography axis: the reporting country IS the fact
    period_col: year
    period_type: year
    period_sql_type: int
    knowledge_date_col: ingest_date
    knowledge_semantics: ingest
    metric_col: metric
    value_col: value
    unit_col: unit
    # The LIVESTOCK half of configs/sources/faostat_item_map.yaml, disjoint from the crop card's set
    # and together with it exactly the map (pinned both directions).
    commodity_values: [cattle_beef, hogs, broilers_poultry, milk_fluid]
    metrics:
      live_animals:
        label: "live animals"
        desc: "head of live animals held, at the reference date — HERD/FLOCK SIZE, never a tonnage.
          NO CARD-LEVEL UNIT ON PURPOSE: it is `An` (head) for cattle_beef and hogs and `1000 An`
          (thousand head) for broilers_poultry, so a unit here would render verbatim onto every
          citation and be wrong for one of the three. Read the row's `unit`."
      milk_animals:
        unit: "An"
        label: "milk animals"
        desc: "head of animals milked — the MILKING HERD, the denominator of yield_per_animal"
      production_quantity:
        unit: "t"
        label: "production"
        desc: "raw milk produced, metric tonnes. The one tonnage on this card"
      yield_per_animal:
        unit: "kg/An"
        label: "yield per animal"
        desc: "kilogrammes of milk per milk animal per year — a RATE, never a tonnage"
    notes: >
      THE ROW'S `unit` COLUMN IS AUTHORITATIVE AND THIS CARD CANNOT BE READ WITHOUT IT. Head counts,
      tonnes and per-animal rates share one physical table here. A HEAD COUNT MUST NEVER BE SUMMED
      WITH A TONNAGE, and yield_per_animal is kg of milk per animal — never narrate it as a tonnage
      or a national total.
      THE 1000x TRAP, MEASURED AND THE FIRST THING TO CHECK ON ANY CROSS-SLUG READ. live_animals is
      `An` (head) for cattle_beef and hogs but `1000 An` (thousand head) for broilers_poultry. The
      raw numbers are three orders of magnitude apart for that reason alone: comparing, ranking or
      summing them without reading each row's unit is wrong by exactly 1000x. Always pass a
      commodity with live_animals, and state the unit in the answer.
      cattle_beef / hogs / broilers_poultry HERE ARE ANIMALS, NOT MEAT. silver_psd serves the beef,
      pork and poultry BALANCE SHEETS on those same three slugs in metric tonnes. The two surfaces
      are complementary and must never be mixed in one figure: this card answers "how many animals",
      silver_psd answers "how much meat". milk_fluid is FAOSTAT's `Raw milk of cattle`, farm-gate
      fluid milk — the PSD 223000 product grain, NOT the `dairy` family gloss, which also covers
      butter, cheese and two milk powders.
      TWO ELEMENTS THE TRANSFORM MAPS AND THIS CARD DOES NOT SERVE, and neither is a gap in the data.
      `animals_producing_or_slaughtered` (313,081 source rows across THIRTY-NINE items — every
      species' meat, offal, hides and fat items, of which the three flagship meat items carry 13%)
      and `laying_birds` (30,823, the egg items) are carried only by items the map parks in
      writing — the meat/offal/hides axis for want of slugs (one item per slug, and the
      live-animal items hold the three that could carry them), the egg item because its
      Production element prints two units on one key. Declaring them here would
      be a metric that returns zero rows and reads as "not published". The slaughter axis is
      unserved; say so rather than answering it from the herd.
      GEOGRAPHY: the `country` axis is FAOSTAT's raw M49 display strings resolved through
      numbers/faostat_areas.yaml, and the aggregate ladder (World, the continents, European Union
      (27), the LDC/LLDC/SIDS/LIFDC/NFIDC groups) sits in the same column as its members — never sum
      an aggregate with the countries inside it.

  # SILVER-F047 QUARANTINE (corrected 2026-07-21 -- the earlier claim of a BF-W1 "numbers dispatch
  # quarantine guard" described code that never existed; pydantic silently dropped this key until the
  # registry went extra="forbid"). The projected silver_nasa_power is the LIST-storm class (~222k tiny
  # files, month-grain projection). What F047 actually retired: ENGINE legs -- the cascade weather leg
  # reads the NON-projected gold_weather_z since Phase D-W4 and must never come back here (INV-3).
  # What legitimately REMAINS: the numbers agent's DIRECT raw-observation lookups (daily precip/temp by
  # station-region) -- gold_weather_z serves standardized ANOMALIES (z), not raw values, and cannot
  # replace them. Live protections: declared year/month cols make build_sql emit sargable bounds +
  # static partition equalities (LIST-storm lint); INV-3 excludes it from DISTINCT vocab probes
  # (contract_check.NUMBERS_PROJECTION_TABLES); the pg mirror EXCLUDES it (size); and quarantined: true
  # is ENFORCED by config_check.check_quarantine -- any cascade_map/complex_map ref at this table fails
  # the build. Spec RETAINED so the reconcile NUMBERS_TABLES hard-list + numbers_ref back-pointer stay green.
  silver_nasa_power:
    quarantined: true    # SILVER-F047: no engine map may reference this table (check_quarantine, build-failing);
    #                      direct agent raw-weather lookups remain allowed with sargable predicates
    description: >
      NASA POWER daily weather by commodity growing region (country/region). Wide format: one column per
      variable. Observational, non-revising — as-of = observation dates on or before the cutoff. Typically
      queried as a windowed aggregate (sum precip / mean temp over a period_start..period_end).
      SILVER-F047: QUARANTINED from serving -- weather is served from gold_weather_z.
    grain: "one row per commodity x country x region x date (daily)"
    # COVERAGE (PA-1, hoisted from this card's own measured text): quarantined -- never rendered; declared
    # for parity
    cadence: daily
    shape: wide
    partition_cols: [commodity, country, region]   # PHYSICAL TRUTH post BF-W1 compaction (synced 2026-07-21):
    #                  Glue partitions are [commodity, year] REGISTERED; country/region/month are IN-FILE
    #                  columns (the compaction folded them into the parquet; the rebuilt catalog forgot to
    #                  declare them -- every weather lookup died COLUMN_NOT_FOUND until the Glue declaration
    #                  was restored). This list stays as-is FUNCTIONALLY: build_sql keeps emitting the same
    #                  equality predicates (country snake_case, region defaulting to the commodity's primary
    #                  growing region) -- they are ordinary column predicates now, equally valid SQL. The
    #                  LIST-storm risk this card's old comments guarded is RETIRED (registered partitions,
    #                  catalog-side pruning; ~1.4K partitions vs the old ~222K projected grid).
    commodity_col: commodity
    country_col: country
    period_type: date
    date_col: date
    year_col: year                       # year = the REGISTERED partition key (sargable bounds prune the
    month_col: month                     # catalog); month = an in-file column since the compaction
    knowledge_semantics: data_date
    metrics:
      temperature_2m_mean_c:    {label: "daily mean temperature", unit: "degC", desc: "daily mean 2m temperature"}
      temperature_2m_max_c:     {label: "daily max temperature", unit: "degC", desc: "daily max 2m temperature"}
      temperature_2m_min_c:     {label: "daily min temperature", unit: "degC", desc: "daily min 2m temperature"}
      precipitation_mm:         {label: "daily precipitation", unit: "mm", desc: "daily precipitation"}
      relative_humidity_2m_pct: {label: "relative humidity", unit: "pct", desc: "daily mean relative humidity"}
      wind_speed_2m_m_s:        {label: "wind speed", unit: "m/s", desc: "daily mean 2m wind speed"}
    notes: >
      Use period_start/period_end for the window and agg=sum (precip) or agg=mean (temp). region partition
      exists but is not yet a query filter (v1 aggregates across regions of a commodity+country).

  silver_esr:
    description: >
      USDA FAS Export Sales Reporting — WEEKLY US export sales and shipments by commodity and destination.
      commodity_name is the canonical contract slug. PERIOD = THE MARKETING-YEAR **START** YEAR, AS AN
      INTEGER: MY 2025/26 is period=2025, MY 2023/24 is period=2023. Never the end year, and never the
      calendar year of the as-of. A date belongs to the marketing year that STARTED on or before it — US
      corn and soybeans start Sep 1, so any date from 2025-09-01 through 2026-08-31 is period=2025; US
      wheat starts Jun 1, so 2025-06-01 through 2026-05-31 is period=2025. It follows that AT AN AS-OF IN
      THE FIRST HALF OF A CALENDAR YEAR THE CURRENT MARKETING YEAR IS THE PREVIOUS ONE — at an as-of in
      mid-2026 the current corn/soybean MY is 2025 (2025/26); period=2026 is a crop year that has not
      opened and returns NO ROWS, which is a query error and not an absence of data. Omit period entirely
      to read whatever weeks the window covers rather than guessing a year.
      (Implementation note, not a caller rule: the PHYSICAL column uses the FAS END-year label — soybeans
      MY 2023/24 is stored market_year 2024, confirmed 2026-07-03 from week windows 2023-09..2024-09 — and
      period_offset +1 translates the start-year convention above at compile time. Callers pass the START
      year on this card exactly as they do on silver_psd.)
      Each weekly report carries an as_of_date (the report cutoff); as-of a date = the latest report
      published on or before it (grain = the WEEK). Destinations ARE supported: pass country=<name> (e.g.
      country='China') for a buyer-scoped export-sales read; OMIT country for the national total across all
      destinations. Names resolve to raw FAS codes via numbers/esr_destinations.yaml; an unrecognised name
      returns NO rows (never a silent national total). Bloc/region aggregate codes (e.g. the EU) are a bloc
      aggregate, and pseudo codes (Unknown) are never a single-country name target.
    grain: "one row per commodity x destination x week_ending_date, per weekly as_of_date report"
    # COVERAGE (PA-1, W0-5 projection wave 2026-08-25): MEASURED on the LATEST VINTAGE per slug (the
    # as-of collapse serving actually reads): 1,472,434 rows across 31 slugs, weeks 1989-06-01 through
    # 2026-08-13. The physical table holds more (every retained weekly vintage); the latest-vintage cut
    # is the honest serving denominator. NO last_obs -- weekly reports keep landing.
    row_count: 1472434
    first_obs: "1989-06-01"
    cadence: weekly
    shape: wide
    commodity_col: commodity_name            # already our slugs: corn_cbot, soybeans_cbot, hard_red_winter_wheat_kcbt, ...
    # W0-3 (projection wave, 2026-08-25): the fence this card NEVER had. The 2026-08-20 widening coined
    # 21 new slugs and the card named none of them, so every off-card ESR ask compiled SQL and returned
    # a SILENT 0-row (sorghum's export_pace leg sat dark on slug identity for five days with rows LIVE
    # in silver). The set mirrors transforms/bronze_to_silver/usda_esr.py `_COMMODITY_CODE_TO_NAME`
    # exactly -- generated, never hand-listed; a test asserts equality BOTH directions (the PSD pin's
    # shape), so producer and fence are ONE universe or the build fails. `sorghum` asks ride the
    # cascade row's commodity_aliases (sorghum -> grain_sorghum); the FENCE lists table codes only.
    commodity_values: [all_rice, all_wheat, barley, cattle_beef, corn_cbot, cottonseed, cottonseed_meal,
                       cottonseed_oil, durum_wheat, flaxseed, grain_sorghum, hard_red_spring_wheat_mgex,
                       hard_red_winter_wheat_kcbt, hogs, linseed_oil, long_grain_brown_rice,
                       long_grain_milled_rice, medium_short_brown_rice, medium_short_milled_rice,
                       medium_short_rough_rice, mixed_wheat, oats, rough_rice_cbot, rye,
                       soft_red_winter_wheat_cbot, soybean_meal_cbot, soybean_oil_cbot, soybeans_cbot,
                       sunflower_oil, wheat_products, white_wheat]
    country_col: country_code                 # ESR_DESTINATION_PLAN W1: raw int FAS destination code (in-file on
    #                                           silver_esr_compact, NOT a projected partition) -> name<->code is a
    #                                           query-time translation (esr_destinations.yaml), no silver col / pg reload
    country_name_ref: numbers/esr_destinations.yaml   # W0 numbers-owned static FAS code<->name reference
    country_axis_is_destination: true         # the country axis enumerates BUYERS of one national flow, so a row's
    #                                           country is NOT the fact's geography and no label may borrow it
    #                                           (fix-cycle-2). Stated rather than inferred from country_name_ref:
    #                                           FAO-3 gave that key a second, FREE-axis user (silver_production)
    period_col: market_year
    period_type: marketing_year
    period_sql_type: int
    period_offset: 1
    date_col: week_ending_date
    knowledge_date_col: as_of_date
    # BF-W2 SEMANTIC FLIP (SILVER-F031 option-b): silver_esr_compact retains ONE object per
    # (slug, as_of_date) weekly vintage, so as-of truth = the LATEST vintage published on/before
    # asof -- the same ROW_NUMBER collapse as PSD/WASDE, keyed on the WEEK grain below. Backward
    # compatible with the pre-migration single-vintage layout (ROW_NUMBER=1 trivially).
    knowledge_semantics: vintage
    # R2 lexical-format trap: as_of_date values are YYYYMMDD ('20260712') but asof is ISO -- a naive
    # vintage guard compiles as_of_date <= '2026-07-14', lexically FALSE against every vintage (zero
    # rows). vintage_partition_col+format make the guard compare natively in YYYYMMDD (sargable once
    # as_of_date becomes a REGISTERED partition key at the BF-W2 scheme migration). vintage_dates_real
    # stays false (default): the backfill vintage's as_of is a WRITE date covering all MYs, so
    # period-derived date bounds on the vintage axis remain canary-banned (2026-07-04).
    vintage_partition_col: as_of_date
    vintage_partition_format: yyyyMMdd
    # R4: under vintage semantics the as_of stamp IS the publication event (the fetch date), so the
    # +7d data_date-era guard (D-W0.3) would DOUBLE-withhold the freshest published week. 0 at the
    # flip, never before it.
    publication_lag_days: 0
    # R3: every weekly vintage carries the same week under BOTH the current and the next MY --
    # without market_year in the grain the latest-vintage ROW_NUMBER collapse merges the two MYs.
    grain_cols: [commodity_name, market_year, country_code, week_ending_date]
    # S3 LIST-STORM FIX (Jul-2026, $134 in 2 days): the ORIGINAL silver_esr table uses partition
    # PROJECTION (as_of_date 1990->NOW x market_year x commodity_code ~ 6.1M candidate prefixes) — every
    # numbers query made Athena LIST ~130-600K S3 prefixes (26-31s planning time, measured). The agent
    # serves from silver_esr_compact instead: the b2s task's layout at silver/esr/, REGISTERED Glue
    # partitions, never projection. Pre-BF-W2-migration: one file per commodity (10 partitions, as_of_date
    # as a data column); post-migration: one file per (commodity, as_of_date) weekly vintage. The
    # commodity partition equality prunes every query to that slug's files either way (~10MB/vintage).
    athena_table: silver_esr_compact
    partition_cols: [commodity]
    metrics:
      weekly_exports_1000mt:    {label: "weekly exports", unit: "1000 MT", desc: "actual shipments in the week"}
      outstanding_sales_1000mt: {label: "outstanding sales", unit: "1000 MT", desc: "unshipped sales on the books"}
      gross_new_sales_1000mt:   {label: "gross new sales", unit: "1000 MT", desc: "new sales booked in the week"}
      changes_1000mt:           {label: "weekly net changes", unit: "1000 MT", desc: "net change in outstanding sales"}
    notes: >
      Units are 1000 MT (the transform divides raw MT by 1000). commodity = contract slug. Pass country=<name>
      for a per-destination (buyer) read, or OMIT country for the national total (agg=sum for a marketing-year
      total, agg=series over a week window with period_start/end). Destination names resolve to FAS codes via
      esr_destinations.yaml; an unrecognised name returns no rows (never a silent national total). The US is the
      REPORTER, never a destination. period = the marketing-year START year as an integer (MY 2025/26 -> 2025),
      the same convention silver_psd uses; the current MY at a mid-2026 as-of is 2025, and period=2026 returns
      no rows because that marketing year has not opened. When unsure, omit period and window with
      period_start/period_end instead — a wrong year reads as "no data" and is indistinguishable from one.

