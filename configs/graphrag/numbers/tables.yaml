      Daily FX rates for the commodity-relevant currencies vs the US dollar — 14 crosses: Brazilian real,
      Argentine peso, Chinese yuan, Indonesian rupiah, Indian rupee, Malaysian ringgit, Thai baht, Turkish
      lira, Australian and Canadian dollars, South African rand, Mexican peso, euro and British pound —
      each with its 90-day percent change beside it. Macro table (no commodity), known same-day
      (data_date). Source is the ECB reference rate via Frankfurter ("fred" in the id is a documented
      legacy misnomer, ADR-003).
    grain: "one row per date"
    # COVERAGE (PA-1, W0-5 projection wave 2026-08-25): registry.py's own rule stated verbatim, finally
    # declared here. NO last_obs -- the table is alive (fx_macro_daily); a widening lane (FX-1..FX-3)
    # re-measures row_count when the currency roster moves.
    row_count: 5538
    first_obs: "2004-12-31"
    cadence: daily
    shape: wide
    period_type: date
    date_col: date
    knowledge_semantics: data_date
    metrics:
      brl_usd: {label: "BRL/USD exchange rate", unit: "BRL per USD (FRED)", desc: "Brazilian real per US dollar; higher = weaker real"}
      ars_usd: {label: "ARS/USD exchange rate", unit: "ARS per USD (FRED)", desc: "Argentine peso per US dollar; higher = weaker peso"}
      cny_usd: {label: "CNY/USD exchange rate", unit: "CNY per USD (FRED)", desc: "Chinese yuan per US dollar; higher = weaker yuan"}
      brl_usd_pct_change_90d: {label: "BRL/USD 90-day % change", unit: "pct", desc: "BRL/USD 90-day percent change"}
      ars_usd_pct_change_90d: {label: "ARS/USD 90-day % change", unit: "pct", desc: "ARS/USD 90-day percent change"}
      cny_usd_pct_change_90d: {label: "CNY/USD 90-day % change", unit: "pct", desc: "CNY/USD 90-day percent change"}
      # FX-1/FX-3 (projection wave, 2026-08-25): the currency widening -- eleven new crosses, each the
      # quantified leg beside cascade prose that already shipped (19 declining region legs + D-3's
      # cocoa GBP cross). Same convention as the incumbents: local units per USD, higher = weaker.
      idr_usd: {label: "IDR/USD exchange rate", unit: "IDR per USD (ECB via Frankfurter)", desc: "Indonesian rupiah per US dollar; higher = weaker rupiah"}
      inr_usd: {label: "INR/USD exchange rate", unit: "INR per USD (ECB via Frankfurter)", desc: "Indian rupee per US dollar; higher = weaker rupee"}
      myr_usd: {label: "MYR/USD exchange rate", unit: "MYR per USD (ECB via Frankfurter)", desc: "Malaysian ringgit per US dollar; higher = weaker ringgit"}
      thb_usd: {label: "THB/USD exchange rate", unit: "THB per USD (ECB via Frankfurter)", desc: "Thai baht per US dollar; higher = weaker baht"}
      try_usd: {label: "TRY/USD exchange rate", unit: "TRY per USD (ECB via Frankfurter)", desc: "Turkish lira per US dollar; higher = weaker lira"}
      aud_usd: {label: "AUD/USD exchange rate", unit: "AUD per USD (ECB via Frankfurter)", desc: "Australian dollars per US dollar; higher = weaker Aussie"}
      cad_usd: {label: "CAD/USD exchange rate", unit: "CAD per USD (ECB via Frankfurter)", desc: "Canadian dollars per US dollar; higher = weaker loonie"}
      zar_usd: {label: "ZAR/USD exchange rate", unit: "ZAR per USD (ECB via Frankfurter)", desc: "South African rand per US dollar; higher = weaker rand"}
      mxn_usd: {label: "MXN/USD exchange rate", unit: "MXN per USD (ECB via Frankfurter)", desc: "Mexican pesos per US dollar; higher = weaker peso"}
      eur_usd: {label: "EUR/USD exchange rate", unit: "EUR per USD (ECB via Frankfurter)", desc: "Euros per US dollar; higher = weaker euro"}
      gbp_usd: {label: "GBP/USD exchange rate", unit: "GBP per USD (ECB via Frankfurter)", desc: "British pounds per US dollar; higher = weaker pound"}
      idr_usd_pct_change_90d: {label: "IDR/USD 90-day % change", unit: "pct", desc: "IDR/USD 90-day percent change"}
      inr_usd_pct_change_90d: {label: "INR/USD 90-day % change", unit: "pct", desc: "INR/USD 90-day percent change"}
      myr_usd_pct_change_90d: {label: "MYR/USD 90-day % change", unit: "pct", desc: "MYR/USD 90-day percent change"}
      thb_usd_pct_change_90d: {label: "THB/USD 90-day % change", unit: "pct", desc: "THB/USD 90-day percent change"}
      try_usd_pct_change_90d: {label: "TRY/USD 90-day % change", unit: "pct", desc: "TRY/USD 90-day percent change"}
      aud_usd_pct_change_90d: {label: "AUD/USD 90-day % change", unit: "pct", desc: "AUD/USD 90-day percent change"}
      cad_usd_pct_change_90d: {label: "CAD/USD 90-day % change", unit: "pct", desc: "CAD/USD 90-day percent change"}
      zar_usd_pct_change_90d: {label: "ZAR/USD 90-day % change", unit: "pct", desc: "ZAR/USD 90-day percent change"}
      mxn_usd_pct_change_90d: {label: "MXN/USD 90-day % change", unit: "pct", desc: "MXN/USD 90-day percent change"}
