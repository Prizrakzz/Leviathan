#     precipitation_mm is a raw daily mm LEVEL on the PROJECTED table the D-W4 gold decoupling
#     deliberately moved the weather legs OFF. Un-skip gate: a real precip-z family in gold_weather_z
#     (registered in tables.yaml), then one row here, stage-windowing left to the gold transform.
#
#   crush_margin_z (28 instances, 12 ids, 13 contracts) -- NO CRUSH SERIES IN THE NUMBERS REGISTRY.
#     No loaded table carries a crush margin, a board crush, or an oil share (checked across all 19
#     registered cards). A crush margin is DERIVED arithmetic over three separate futures legs
#     (meal + oil - beans, with per-contract unit conversions), and this map binds ONE (table, metric)
#     pair per ref with no arithmetic anywhere -- so there is no shape of row that could express it, even
#     if a source existed. Un-skip gate: a produced crush-margin series (its own ingest + silver/gold
