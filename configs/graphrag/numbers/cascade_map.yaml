  # -- C1 (2026-08-01) -- THE R9 CONTEXT LANE, ratified under D1 -------------------------------------
  # R9 used to ban this row outright. D1 (ratified 2026-08-01) split the rule: positioning may enter the
  # cascade map ONLY as a fetched PAST-TENSE CONTEXT leg -- never a fork ref, never a regime-MARKER ref,
  # never a chain/complex/transmission hop. config_check._check_positioning_lane is build-failing on any
  # other shape, reading cascade.positioning_context_violations -- the SAME predicate quantify()'s runtime
  # gate reads, so the lint and the engine can never disagree about what "context" means. Every field
  # below is load-bearing to that predicate:
  #   leg_mode: current  -> _node_specs skips era legs, so era_deltas is empty and _divergence can never
  #                         return True: the cross-era FORK path is structurally closed, not merely unused.
  #   period_type: date  -> a dated weekly observation, never a marketing-year fork window.
  #   metric mm_net      -> outside _TRADE_METRICS, so it can never seed an RF-3 reroute PAIR.
  #   narrate_unit       -> not 'flag', so it is an observed LEVEL and not a regime marker.
  #   PACE_TABLES        -> silver_cot carries a 'week' grain, without which the leg is structurally dead.
  #
  # TWO PRECONDITIONS, both named because a silent one is how this ships as decoration:
  #   (1) GRAPHRAG_CASCADE_PACE_LEG must be ON in the measured lane. cascade.py's selection gate drops an
  #       era-less `leg_mode: current` node unless `pace` is True, and the era-less case IS the live
  #       positioning shape. Verify it in the eval jobdef env before crediting any C1 result.
  #   (2) FENCED turns only. quantify() refuses this table on an OUTLOOK turn (D1's carve-out) because
  #       register.py releases the flow fence there by design.
  cot_mm_positioning:
    table: silver_cot
    metric: mm_net                 # managed-money NET position (mm_long - mm_short). mm_net_z_3yr is the
    #                                sibling standardization and is DELIBERATELY not mapped: one ref binds
    #                                ONE (table, metric) pair, and the LEVEL is the observation -- a z is a
    #                                derived comparison against a 3-yr window that reads as a verdict
    #                                ("stretched") the moment it is narrated. The level plus its own dated
    #                                history is the context lane; the z is not needed to state it.
    agg: latest                    # the single FRESHEST report on/before the asof (the esr_exports idiom;
    #                                a `series` leg over a trailing window is ORDER BY ASC and rows[0] is
    #                                the OLDEST print -- the A2b defect this wave measured)
    period_type: date              # weekly report_date; period_start/period_end bind it
    leg_mode: current              # CURRENT rhyme leg ONLY -- never an era leg (closes the fork path)
    country_rule: none             # no country column; commodity_col is leviathan_slug (CONTRACT slugs)
    keying: "commodity=CONTRACT slug (corn_cbot, ...); a bare base name matches ZERO rows (tables.yaml:699)"
    native_unit: contracts
    narrate_unit: contracts        # a signed position COUNT; scale 1, no ratio trap
    scale: 1
    coverage_start: 2006           # 12 slugs live 2006+; the wheat series start ~2014 (W4b legacy-name gap)
    status: mapped_supporting
    notes: >
      31 driver instances, the highest-instance FENCED dark ref and the one finding 2.4(a) is about: the
      agent reached silver_cot on the two execution-BAIT rows and on ZERO of the three purely-positioning
      rows, so discretion here is ANTI-CORRELATED with the ask and only determinism closes the class.
      HISTORICAL CONTEXT ONLY. Narrate the level in the PAST TENSE, dated by its own report date, and
      state nothing about what positioning will do next -- cascade.POSITIONING_CONTEXT_ADDENDUM rides the
      block whenever this leg renders, and tests/unit/test_register_corpus.py pins that string flow-clean.
      Positioning is UNREVISED, so latest-only is genuinely point-in-time-clean; publication_lag_days=6
      covers the Tuesday-data / Friday-release gap and the holiday slips. The table was ~6 weeks stale at
      the 2026-07-18 census, so an honest leg may serve a reading several weeks old WITH its date -- which
      is the correct behaviour, and the reason the report date belongs in the narration.

