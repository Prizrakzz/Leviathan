# the skip IS the deliverable for these, and re-deriving the same dead end later is the waste this block
# prevents. None of them is a lint waiver: an unmapped ref simply stays qualitative (see the file header).
#
#   stage_precip_z (38 instances, 3 ids, 24 contracts) -- NO PRECIP-Z METRIC EXISTS.
