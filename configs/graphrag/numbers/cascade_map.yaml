  resolve:
    US:                    {country: "United States"}
    USA:                   {country: "United States"}
    "US import":           {country: "United States"}
    Russia:                {country: "Russia"}
    Ukraine:               {country: "Ukraine"}
    China:                 {country: "China", currency: cny}
    "China (import side)": {country: "China", currency: cny}
    "China (FX)":          {country: "China", currency: cny}
    India:                 {country: "India"}
    "India (import side)": {country: "India"}
    Brazil:                {country: "Brazil", currency: brl}
