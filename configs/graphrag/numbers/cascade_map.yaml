    metric: oni_anom               # el_nino_flag | la_nina_flag carry the 0/1 regime marker
    agg: latest
    period_type: year_month        # windows via (year*100+month) bounds
    window_granularity: monthly
    keying: "NO commodity column (global ENSO state); asof compares (year*100+month) <= asof YM"
