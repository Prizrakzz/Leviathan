# Phase 9-B cascade map -- silver_ref (causal-DAG driver attribute) -> (silver table, metric, window rule).
# Only refs listed here are QUANTIFIED by the reasoning-branch cascade loop; an unmapped ref stays qualitative.
# native_unit/narrate_unit/scale drive the deterministic ratio pre-scale normalizer: injected [N] rows are
# emitted PRE-SCALED to narrate_unit so the mentor's narrated figure value-checks at scale 1.
# period_type drives fetch_window's window binding (marketing_year = period int, NEVER period_start/end;
# date/year_month = period_start/period_end bounds).
# TRACKED (D-B7, like its sibling tables.yaml): no secret/private IP beyond what tables.yaml already exposes,
# and tracking dodges the gitignored-config rollback trap.
# An UNCERTIFIED/empty table (silver_esr, silver_nasa_power at the 2026-06-24 certification) may appear ONLY
# with `deferred: true` (loaded-but-inert; the loader skips it, config_check errors on an ACTIVE row).
# Every table.metric below verified against the live registry (load_registry) on 2026-07-10.

refs:
  # ── PSD family (silver_psd, vintage, marketing-year) - the D3 core ─────────────────────────────────
  # ERA legs fan >=2 marketing years (a within-era delta must exist for the fork engine); the CURRENT
  # rhyme leg queries the CURRENT MY at the SESSION asof. PIT guard column = release_date (vintage).
  export:
    table: silver_psd
    metric: exports_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    country_rule: region           # RF-2: the DRIVER's region token via region_map; unresolved token -> the
    #                                node stays qualitative (never primary-fallback, never country=None)
    keying: "commodity=contract slug; country=driver region via region_map (Title-Case for PSD)"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001                # 2,462,000 MT -> 2.46 MMT
    coverage_start: 1960
    status: mapped
    notes: >
      Geography-GENERAL export home (73 driver instances, 26 ids): serves every export-policy driver id
      incl. non-US (Argentina/Brazil/Russia/India/Thailand/Vietnam/Canada/China) that ESR (US-only)
      cannot. US weekly export PACE is a DIFFERENT lookup -> see esr_exports (deferred).
  import:
    table: silver_psd
    metric: imports_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    country_rule: region           # RF-2: implements the row's keying intent (was unimplemented -> primary)
    keying: "commodity=contract slug; country=importing region via region_map (e.g. China)"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: >
      54 instances, 23 ids. The trade-war reroute fork (US exports DOWN vs China imports UP) is
      CROSS-NODE and Phase-C; this row supports same-node China-imports era contrasts today.
  consumption:
    table: silver_psd
    metric: consumption_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=consuming region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: "30 instances, 25 ids (China_food_demand, feed_demand, ethanol_demand, ...). Demand leg."
  production:
    table: silver_psd
    metric: production_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=producing region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: >
      13 instances, 10 ids. Also the PROXY for the deferred revision refs (conab_production_revision /
      wap_nonUS_revision / sagis_cec_revision): narrate the PSD production LEVEL for that country/MY.
  area:
    table: silver_psd
    metric: area_harvested_1000ha
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=producing region"
    native_unit: "1000 ha"
    narrate_unit: "M ha"
    scale: 0.001                   # 34,000 (1000 ha) -> 34.0 M ha
    coverage_start: 1960
    status: mapped
    notes: "20 instances, 8 ids (planted_area, acreage_competition, canola_area, ...). 2-4Q lag driver."
  stock:
    table: silver_psd
    metric: ending_stocks_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=holding region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: "15 instances, 8 ids (China_port_stocks, China_state_reserves, meal_inventory, ...)."
  beginning_stock:
    table: silver_psd
    metric: beginning_stocks_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=holding region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: >
      6 instances, 5 ids - state-reserve policy drivers (buffer_stock_release, state_reserve_buildup,
      state_reserve_release, China_state_reserves). Carry-in level is the reserve-policy proxy.
  psd_ending_stock_su_ratio:
    table: silver_psd
    metric: su_ratio
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=_primary_country(contract) Title-Case"
    native_unit: ratio
    narrate_unit: "%"
    scale: 100                     # 0.36 ratio -> 36.0 % -- THE ratio trap; pre-scale is MANDATORY
    coverage_start: 1960
    status: mapped
    notes: >
      Already served by silverleg._su_ratio for z-score firing; reused here for RAW-VALUE era contrast.
      29 instances, 4 ids. Never narrate a % against a stored 0.36 ratio -- emit value=36.0 unit='%'.

  # ── Supporting refs (macro/FX + climate; enable the FX leg + the ENSO analogue contrast) ──────────
  fred_fx_macro:
    table: silver_fred_fx
    metric: brl_usd                # DEFAULT only; country_rule=region swaps it to the region's <currency>_usd
    agg: latest
    period_type: date              # date-windowed: period_start/period_end bind here (unlike PSD)
    window_granularity: daily
    country_rule: region           # RF-2: region currency picks the metric (was hardcoded brl_usd -- the
    #                                ars_usd fold-forward); region w/o a currency column -> qualitative.
    #                                Table has no country column, so country stays null either way.
    keying: >
      NO commodity/country column. Currency metric from the driver's region via region_map: Brazil->brl_usd,
      Argentina->ars_usd, China->cny_usd. 90d change columns (*_pct_change_90d) are ALREADY percent.
    native_unit: "local currency per USD"
    narrate_unit: "local currency per USD"
    scale: 1
    coverage_start: 2004           # HARD floor: FX silver starts 2004-12-31; earlier episodes are FX-dark
    status: mapped_supporting
    notes: >
      124 instances. Direction is FRED 'local per USD' (higher = weaker local). 1999 BRL float /
      2002 ARS collapse are silver-dark; narrate those qualitatively.
  oni_climate:
    table: silver_noaa_oni
    metric: oni_anom               # el_nino_flag | la_nina_flag carry the 0/1 regime marker
    agg: latest
    period_type: year_month        # windows via (year*100+month) bounds
    window_granularity: monthly
    keying: "NO commodity column (global ENSO state); asof compares (year*100+month) <= asof YM"
    native_unit: degC
    narrate_unit: degC
    scale: 1
    coverage_start: 1950           # deepest silver history
    status: mapped_supporting
    notes: >
      118 instances. Quantifies ENSO analogues to 1950 (1997/98 vs 2015/16 El Nino contrast). Corpus is
      structurally thin pre-2000 for ENSO evidence -- silver is deep but the anchor may be absent;
      degrade to qualitative.

  # ── DEFERRED (uncertified/empty at the 2026-06-24 certification; un-defer gate = a live W0 probe) ──
  esr_exports:
    table: silver_esr
    metric: weekly_exports_1000mt      # FIX (D-W3.1): was weekly_exports_mt -- NOT a real registry column
    #                                    (ESR metrics are *_1000mt). Un-deferring as-written ERRORed
    #                                    check_cascade_map (metric-not-in-registry, fail-closed).
    # UN-DEFERRED (D-W5 ESR flip, 2026-07-12, user-ratified): cert reconcile GREEN on silver_esr_compact
    # (753,062 rows, all 8 checks pass), b2s freshness top-up from bronze as_of=20260528 SUCCEEDED, pg
    # mirror reloaded. Lands together with silver_esr's removal from UNCERTIFIED_TABLES (cascade_census.py)
    # or check_cascade_map fails closed. Gate: candidate census FIRES + --diff vs cascade_census_20260711b.
    # Rollback: re-add `deferred: true` here + re-add silver_esr to UNCERTIFIED_TABLES.
    agg: latest                        # v1 (C2): the single FRESHEST week on/before asof. was `sum` -- DEAD
    #                                    CONFIG (cascade.py hardcoded agg="series" on the date branch;
    #                                    row.get("agg") was only read on the marketing_year branch). D-W3.2
    #                                    now threads row.get("agg") into the date-branch CURRENT leg so this
    #                                    is honored. `latest` also fixes the stale-week defect: a `series` leg
    #                                    over [asof-365,asof] is ORDER BY ASC, so rows[0] was the ~1-year-OLD
    #                                    week mislabeled "current".
    period_type: date                  # weekly pace: period_start/period_end bind week_ending_date
    leg_mode: current                  # NEW FLAG (D-W3.2): the current rhyme leg ONLY -- never an era leg
    country_rule: none                 # US-only source; no country column, v1 sums destinations
    native_unit: "1000 MT"
    narrate_unit: "1000 MT"            # kt/week flow -- NOT MMT, NOT a level; scale 1 (no ratio trap)
    scale: 1
    coverage_start: 1990
    status: mapped
    notes: >
      US weekly export PACE (fresh rhyme leg): the single freshest week's shipments on/before the session
      as-of, narrated as "week ending <week_ending_date>". Complements -- never replaces -- the PSD export
      LEVEL backbone (see the `export` row). Flow in 1000 MT/week; NEVER deltaed against a PSD MMT level.
  # ── D-W5 WEATHER FLIP (2026-07-12, corrected shape) ──────────────────────────────────────────────────
  # The map row ID is the JOIN KEY to the drivers' silver_ref -- a single `weather_z` row joined to
  # NOTHING (zero drivers carry silver_ref: weather_z; the first candidate census was a vacuous 0-delta).
  # The real refs the DAGs bind are drought_z(64), heat_stress_z(53), frost_event_flag(22), gdd_z(2),
  # stage_tmax_anomaly(1) -- one row each below, all serving from the NON-projected gold_weather_z
  # (D-W4: tall, monthly, PIT-safe same-month z, PSD Title-Case countries). stage_precip_z (38 drivers)
  # has NO gold metric yet -- stays unmapped/qualitative pending a precip-z gold family.
  # Rollback: re-add `deferred: true` per row. Gate: candidate census diff + config_check green.
  drought_z: &gold_weather_row
    table: gold_weather_z
    metric: drought_z
    period_type: year_month            # reuses the ONI (year*100+month) windowing + as-of guard wholesale
    country_rule: region               # the driver's own region token -> region_map -> Title-Case country
    native_unit: z
    narrate_unit: z                    # a standardized anomaly, dimensionless; scale 1 (no ratio trap)
    scale: 1
    coverage_start: 1981
    status: mapped
    notes: >
      Monthly drought z (CHIRPS dry-run length vs prior-year same-month baseline, two PIT layers,
      z-scored across years within the calendar month). Narrate as "z = <v> vs the same-month norm";
      NEVER a level, NEVER deltaed against any MT/MMT row.
  heat_stress_z:
    <<: *gold_weather_row
    metric: heat_stress_z
    notes: >
      Monthly count of days over the heat threshold, z-scored vs the same-month prior-year baseline.
      Narrate as heat-stress anomaly; never a level.
  frost_event_flag:
    <<: *gold_weather_row
    metric: frost_event_flag
    native_unit: flag
    narrate_unit: flag
    notes: >
      Monthly frost flag: 1.0 if the monthly-min temperature dropped below freezing, else 0.0 (a real
      observation, kept). Narrate as presence/absence of a frost month; never averaged or z-labeled.
  gdd_z:
    <<: *gold_weather_row
    metric: gdd_z
    notes: >
      Monthly growing-degree-day sum, z-scored vs the same-month prior-year baseline.
  stage_tmax_anomaly:
    <<: *gold_weather_row
    metric: tmax_anomaly               # driver ref keeps its historical name; the gold column is tmax_anomaly
    notes: >
      Monthly mean-tmax anomaly z vs the same-month prior-year baseline.

# ── region_map (RF-2) -- driver region token -> table scope, for country_rule=region refs ──────────────
# TOP-LEVEL sibling of refs (load_map returns refs only; cascade.load_region_map reads this block).
# resolve: EXACT region tokens (as written in configs/graphrag/causal/*.yaml) that name ONE country.
#   country = the silver_psd surface form (Title-Case, W0/RF-0 convention: 'United States', 'South Africa').
#   currency = silver_fred_fx column prefix (<currency>_usd must be a REAL column -- lint-enforced). Only
#   brl/ars/cny exist in silver_fred_fx; EU maps to no currency because there is NO eur_usd column, so EU
#   fx legs stay qualitative rather than narrate the wrong pair.
# unresolved: compound/prose/vague tokens that CANNOT honestly resolve to one country -- the node skips to
#   qualitative (rrv1 2c: primary-fallback stamps the wrong country's numbers; country=null on a PSD trade
#   ref mixes ~150 countries). Splitting compounds (China/US) by metric axis is RF-3 pairing work, not this
#   map. config_check errors on any region token on a region-ruled driver that appears in NEITHER list.
