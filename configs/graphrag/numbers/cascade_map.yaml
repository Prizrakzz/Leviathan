  # -- THE PRICE-CONTEXT AMENDMENT (owner adjudication 2026-08-26) -- R4's first cascade_map row -------
  fishmeal_price_z:
    table: silver_pink_sheet
    metric: fish_meal_usd_t_zscore_5yr   # the STANDARDIZED 5-yr anomaly, not the dollar level (see notes)
    agg: latest
    period_type: date                    # the card HAS date_col: date (timestamp) -- see the notes on
    #                                      _order_col; `latest` genuinely orders here
    leg_mode: current                    # THE C-2 ANSWER BY SHAPE: latest-only source, no as-of replay
    country_rule: none                   # the card is wide and flat (no commodity_col, no country_col)
    keying: "no keying at all -- the metric IS the series (no commodity axis, no country axis)"
    native_unit: z
    narrate_unit: z                      # a standardized anomaly, dimensionless; scale 1 (no ratio trap)
    scale: 1
    coverage_start: 1981                 # the LEVEL's first month is 1979-01 (_ZSCORE_VALID_FROM in
    #                                      transforms/bronze_to_silver/pink_sheet.py:200) and the z needs
    #                                      _ZSCORE_MIN_PERIODS=36 months, so the first non-null z is
    #                                      1981-12 -- never 1960, which is the CARD's floor, not this
    #                                      series'
    status: mapped
    notes: >
      THE FISHMEAL PRICE ANOMALY, the substitution half of the mechanism whose supply half is
      `fishmeal_supply` above. Three carrier drivers (fishmeal_substitution on soybean_meal_cbot /
      soybean_meal_dce / rapeseed_meal_zce), all parented on peru_fishmeal_supply: dear or scarce
      fishmeal pushes the marginal protein ton into soybean/rapeseed meal.
      WHY THE Z AND NOT THE LEVEL. The archaeology's C-1 objection to the original Option C was that
      lifting the fence could only ever produce "a bare level narrated inside a cascade block" -- this
      map binds ONE (table, metric) pair per ref with no arithmetic, so a level is all it could say. A
      STANDARDIZED ANOMALY is a driver-shaped number instead: how stretched fishmeal is versus its own
      five-year history, which is what a substitution driver actually turns on, and it reads in the same
      units as the estate's dominant quantified pattern (the weather-z family, 148 live legs -- a `_z`
      ref reading a z series is this file's house form, and the drought_z row is the shape copied here).
      The analyst-facing dollar LEVEL is its twin, `fish_meal_usd_t` (570 non-null monthly prints
      1979-01..2026-06, measured tonight): it is reachable through the numbers AGENT card, where a reader
      asks for a price and gets a price, and it must NEVER be reached through this leg. The card's own
      doctrine says the same thing ("HOW STRETCHED A SERIES IS, IS A SECOND METRIC HERE, NOT A
      CALCULATION" -- prefer the stored z, PIT-clean by construction, over one computed off a windowed
      history read).
      PRICE-CONTEXT DISCIPLINE, the shape R4's amendment admits and the ONLY shape it admits -- and
      C-2 is closed on BOTH its vectors, not argued around. VECTOR ONE (era legs) BY SHAPE: this leg
      is CURRENT-ONLY (`leg_mode: current`): the cascade is a replay surface -- analogue eras,
      historical as-ofs -- and this table is LATEST-ONLY with retroactive World Bank revisions and no
      true as-of replay (tables.yaml:2078-2081), so an era leg would restate a series that cannot be
      restated; the lint refuses any other leg_mode rather than trusting an author to remember.
      VECTOR TWO (a historical-asof turn re-running the CURRENT leg) BY THE PER-TURN BELT: no row
      shape can express "this turn is a replay", so quantify()'s `price_replay` kwarg -- resolved at
      the answer seam as "this turn's asof is historical" -- keeps every price-context node
      qualitative on replay turns (evals, backtests, PIT repros), where the leg would otherwise
      serve today's revision as if known then. The shape rule itself is ONE function for lint and
      runtime (cascade.price_context_violations, the R9 arrangement), so a hand-edited map cannot
      pass the container what the build never saw. Narrate PAST TENSE, as an observed anomaly. The
      ref is banned BY NAME from chain_map, complex_map and transmission_map
      (config_check._check_price_context_lane, reading the RAW map so a deferred row cannot ship
      pre-loaded) -- a price is never a chain hop, never a relative-value side, never a transmission
      step. Never a fork, never a regime marker (a `narrate_unit: flag` row on this card is a build
      failure).
      THE REGISTER, and what it does NOT open. config_check.PRICE_CONTEXT_METRICS admits 20 of the
      card's 76 metrics: 9 input-cost levels + fish_meal_usd_t + their 10 z twins. The 16 estate-target
      benchmarks (+16 twins) stay fenced PERMANENTLY on self-reference -- each is the world cash price of
      a commodity the estate quotes a board for, so an engine leg on one would answer a price question
      about the very contract the cascade is explaining. beef_usd_t and chicken_usd_t are the card's own
      DEMAND-SIDE OUTPUT prices, which is the opposite of an input cost; their membership sitting was
      HELD on 2026-08-27 and adjudicated OUT ON THE NO-CARRIER GROUND: no DAG node names a livestock
      output-price claim (the livestock-demand nodes want on-feed counts and crush margins -- the
      owner-deferred data wall), so admission would mint dead config, the psd_ty_export precedent.
      Same ground, same day, for orange_usd_t (the card argues it is an FCOJ input cost, but no FCOJ
      node names a fruit-price claim). Both REOPEN automatically the day a DAG sitting names such a
      claim -- the z twins exist and are value-proved (763 prints each). copper_usd_mt is OUT
      PERMANENTLY (the card itself forbids it as an agricultural price signal). rubber_rss3 was the
      one neither-class member WITH a carrier and was still refused -- on sign-identity, not on
      class: see the 2026-08-27 family header below.
      GEOGRAPHY AND KEYING: NEITHER APPLIES. `country_rule: none` short-circuits _scope_ex before every
      token-reading branch, so the three drivers' region tokens (`Global` on soybean_meal_cbot, `China`
      on the other two) are INERT here -- they claim nothing, resolve nothing, and need no region_map
      entry; both build-time region lints go quiet on a `none` row for the same reason. The commodity
      half is inert too: the card declares commodity_col null, so query.py drops the returned contract
      slug before SQL. This is the row that needed no keying knob at all.
      WHAT `agg: latest` READS, AND WHY THE HERD ROW'S HEADLINE HAZARD IS ABSENT HERE. The
      herd_size_cattle row above records a live-row precondition: its card has no date_col and no
      year_col, so query._order_col is None, the leg returns an UNORDERED multi-row series, and which row
      gets narrated depends on the GRAPHRAG_CASCADE_HEADLINE flag. THAT HAZARD DOES NOT REACH THIS ROW.
      silver_pink_sheet declares `date_col: date` (timestamp, DP-5 normalized), so _order_col resolves,
      `agg: latest` genuinely orders by month and returns the freshest knowable month on/before the
      session as-of -- with the card's 40-day publication lag withholding the newest month until it is
      safely published. One row per month by grain, so no pace collapse is needed either (the F-E lint's
      sum/mean ban on price tables is untouched: this row declares no collapse kind).
      SUPERSEDED NAMING. The keying-knob sitting (2026-08-26, earlier the same day) recorded the intended
      row as `fishmeal_price` on `fish_meal_usd_t`. Both halves are superseded here and neither was a
      free choice: the ref KEEPS ITS DECLARED NAME `fishmeal_price_z` because that is what all three DAG
      nodes already carry, so binding it is ZERO re-keys (the alternative would have re-keyed three
      configs to match a map, which is the wrong direction -- the DAG names the claim, the map answers
      it); and the metric is the z because of the C-1 argument above. The name and the metric now agree:
      a `_z` ref reading a z series.

