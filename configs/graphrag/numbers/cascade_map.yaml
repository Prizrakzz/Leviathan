# Phase 9-B cascade map -- silver_ref (causal-DAG driver attribute) -> (silver table, metric, window rule).
# Only refs listed here are QUANTIFIED by the reasoning-branch cascade loop; an unmapped ref stays qualitative.
# native_unit/narrate_unit/scale drive the deterministic ratio pre-scale normalizer: injected [N] rows are
# emitted PRE-SCALED to narrate_unit so the mentor's narrated figure value-checks at scale 1.
# period_type drives fetch_window's window binding (marketing_year = period int, NEVER period_start/end;
# date/year_month = period_start/period_end bounds).
# TRACKED (D-B7, like its sibling tables.yaml): no secret/private IP beyond what tables.yaml already exposes,
# and tracking dodges the gitignored-config rollback trap.
# An UNCERTIFIED/empty table (silver_esr, silver_nasa_power at the 2026-06-24 certification) may appear ONLY
# with `deferred: true` (loaded-but-inert; the loader skips it, config_check errors on an ACTIVE row).
# Every table.metric below verified against the live registry (load_registry) on 2026-07-10.
# C3 (2026-08-01): every row added by the C3 wave is verified the SAME way PLUS a live read of the served
# metric on the source of truth (Athena) -- a row whose value/unit/scale could not be PROVEN against real
# data was SKIPPED, never bound to a plausible neighbour (D4: a silent wrong-metric binding is worse than
# an honestly dark ref). The skipped refs and their evidence are recorded at the bottom of this block.

refs:
  # ── PSD family (silver_psd, vintage, marketing-year) - the D3 core ─────────────────────────────────
  # ERA legs fan >=2 marketing years (a within-era delta must exist for the fork engine); the CURRENT
  # rhyme leg queries the CURRENT MY at the SESSION asof. PIT guard column = release_date (vintage).
  export:
    table: silver_psd
    metric: exports_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    country_rule: region           # RF-2: the DRIVER's region token via region_map; unresolved token -> the
    #                                node stays qualitative (never primary-fallback, never country=None)
    keying: "commodity=contract slug; country=driver region via region_map (Title-Case for PSD)"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001                # 2,462,000 MT -> 2.46 MMT
    coverage_start: 1960
    status: mapped
    notes: >
      Geography-GENERAL export home (73 driver instances, 26 ids): serves every export-policy driver id
      incl. non-US (Argentina/Brazil/Russia/India/Thailand/Vietnam/Canada/China) that ESR (US-only)
      cannot. US weekly export PACE is a DIFFERENT lookup -> see esr_exports (deferred).
  import:
    table: silver_psd
    metric: imports_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    country_rule: region           # RF-2: implements the row's keying intent (was unimplemented -> primary)
    keying: "commodity=contract slug; country=importing region via region_map (e.g. China)"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: >
      54 instances, 23 ids. The trade-war reroute fork (US exports DOWN vs China imports UP) is
      CROSS-NODE and Phase-C; this row supports same-node China-imports era contrasts today.
  consumption:
    table: silver_psd
    metric: consumption_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    # W0-7 (D-9, 2026-08-25): a Global/global driver token on this primary-ruled row silently cited the
    # contract's primary country (cotton's global_textile_demand answered with China). Fenced: such a
    # token now SKIP_NODEs (honest decline). Re-key the token to a nation in the DAG if the driver is
    # genuinely national (the FX-5 shape) -- never widen region_map with a Global entry (D-7).
    global_token: skip
    keying: "commodity=contract slug; country=consuming region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: "30 instances, 25 ids (China_food_demand, feed_demand, ethanol_demand, ...). Demand leg."
  production:
    table: silver_psd
    metric: production_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=producing region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: >
      13 instances, 10 ids. Also the PROXY for the deferred revision refs (conab_production_revision /
      wap_nonUS_revision / sagis_cec_revision): narrate the PSD production LEVEL for that country/MY.
  # ── WIRING WAVE-1 (Card B) TODO -- conab_production_revision repoint (NOT landed this wave) ──────────────
  # silver_conab_coffee is now a live numbers card (survey_release_date vintage), so the deferred
  # conab_production_revision leg CAN be repointed off the silver_psd PROXY above to the REAL CONAB survey.
  # It is NOT landed here because the plan (WIRING_WAVE1 §7 / SKEPTIC-3) gates the repoint on a PRODUCER
  # region='brazil' filter that this wave does not ship: CONAB's `region` column carries 12 values (brazil +
  # 11 states), and the cascade has NO honest in-map region pin (country_rule=none -> NO geo filter ->
  # _scope returns (commodity, None), and `keying` is descriptive text the cascade never parses), so a
  # repoint today would narrate 12 region rows, not the national headline. When the producer region filter
  # lands, add the ref below AND drop conab_production_revision from the proxy note above; gate on
  # config_check.check_cascade_map + a cascade_census --diff (only this ref moves):
  # ── GN-1 RECON WARNING (2026-08-22): pasting this row TODAY is a trap that passes every lint. The
  # blocker the comment above names (region filter) is only ONE of four measured grounds -- the row as
  # sketched reads 12 region rows not the national headline, the card fences the REVISION columns by
  # name (tables.yaml, the sagis D4 exclusion mirror), and the LEVEL metric it uses would return
  # zero-delta windows on survey cadence. Re-run the GN-1 recon's measurements before landing anything.
  #   conab_production_revision:
  #     table: silver_conab_coffee
  #     metric: production_thousand_bags
  #     agg: latest
  #     period_type: marketing_year
  #     country_rule: none            # requires the producer region='brazil' filter to be meaningful
  #     native_unit: "1000 60-kg bags"
  #     narrate_unit: "M 60-kg bags"
  #     scale: 0.001
  #     coverage_start: 2023
  #     status: mapped
  area:
    table: silver_psd
    metric: area_harvested_1000ha
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=producing region"
    native_unit: "1000 ha"
    narrate_unit: "M ha"
    scale: 0.001                   # 34,000 (1000 ha) -> 34.0 M ha
    coverage_start: 1960
    status: mapped
    notes: "20 instances, 8 ids (planted_area, acreage_competition, canola_area, ...). 2-4Q lag driver."
  stock:
    table: silver_psd
    metric: ending_stocks_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=holding region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: "15 instances, 8 ids (China_port_stocks, China_state_reserves, meal_inventory, ...)."
  beginning_stock:
    table: silver_psd
    metric: beginning_stocks_mt
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    keying: "commodity=contract slug; country=holding region"
    native_unit: MT
    narrate_unit: MMT
    scale: 0.000001
    coverage_start: 1960
    status: mapped
    notes: >
      6 instances, 5 ids - state-reserve policy drivers (buffer_stock_release, state_reserve_buildup,
      state_reserve_release, China_state_reserves). Carry-in level is the reserve-policy proxy.
  psd_ending_stock_su_ratio:
    table: silver_psd
    metric: su_ratio
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    # W0-7 (D-9, 2026-08-25): 11 census legs tokened Global/global rode this primary-ruled row and
    # FIRED with the contract primary's national su_ratio (french_wheat_matif -> European Union, the
    # three US wheats -> United States, raw_sugar -> Brazil, robusta -> Vietnam; barley + sunflower_oil
    # have NO geography primary and ran country-UNFILTERED). Fenced: Global-class tokens SKIP_NODE.
    # The honest world surface is silver_production's World row, gated on FAO-3 (C-3) -- never this row.
    global_token: skip
    keying: "commodity=contract slug; country=_primary_country(contract) Title-Case"
    native_unit: ratio
    narrate_unit: "%"
    scale: 100                     # 0.36 ratio -> 36.0 % -- THE ratio trap; pre-scale is MANDATORY
    coverage_start: 1960
    status: mapped
    notes: >
      Already served by silverleg._su_ratio for z-score firing; reused here for RAW-VALUE era contrast.
      29 instances, 4 ids. Never narrate a % against a stored 0.36 ratio -- emit value=36.0 unit='%'.

  # ── Supporting refs (macro/FX + climate; enable the FX leg + the ENSO analogue contrast) ──────────
  fred_fx_macro:
    table: silver_fred_fx
    metric: brl_usd                # DEFAULT only; country_rule=region swaps it to the region's <currency>_usd
    agg: latest
    period_type: date              # date-windowed: period_start/period_end bind here (unlike PSD)
    window_granularity: daily
    country_rule: region           # RF-2: region currency picks the metric (was hardcoded brl_usd -- the
    #                                ars_usd fold-forward); region w/o a currency column -> qualitative.
    #                                Table has no country column, so country stays null either way.
    keying: >
      NO commodity/country column. Currency metric from the driver's region via region_map: Brazil->brl_usd,
      Argentina->ars_usd, China->cny_usd. 90d change columns (*_pct_change_90d) are ALREADY percent.
    native_unit: "local currency per USD"
    narrate_unit: "local currency per USD"
    scale: 1
    coverage_start: 2004           # HARD floor: FX silver starts 2004-12-31; earlier episodes are FX-dark
    status: mapped_supporting
    notes: >
      124 instances. Direction is FRED 'local per USD' (higher = weaker local). 1999 BRL float /
      2002 ARS collapse are silver-dark; narrate those qualitatively.
  oni_climate:
    table: silver_noaa_oni
    metric: oni_anom               # el_nino_flag | la_nina_flag carry the 0/1 regime marker
    agg: latest
    period_type: year_month        # windows via (year*100+month) bounds
    window_granularity: monthly
    keying: "NO commodity column (global ENSO state); asof compares (year*100+month) <= asof YM"
    native_unit: degC
    narrate_unit: degC
    scale: 1
    coverage_start: 1950           # deepest silver history
    status: mapped_supporting
    notes: >
      118 instances. Quantifies ENSO analogues to 1950 (1997/98 vs 2015/16 El Nino contrast). Corpus is
      structurally thin pre-2000 for ENSO evidence -- silver is deep but the anchor may be absent;
      degrade to qualitative.
  # -- C3 (2026-08-01) -- the ONI sibling, same shape, same windowing ---------------------------------
  # SUPERSEDES the wiring-wave-1 card comment on silver_noaa_iod (tables.yaml: "enters NO cascade_map"),
  # which recorded that wave's SCOPE, not a doctrine: the table is the exact structural twin of
  # silver_noaa_oni (global, monthly, year+month keyed, no commodity/country column), and oni_climate has
  # been a mapped_supporting row since P9-B. That comment is now stale and lives in a file this wave does
  # not own -- flagged for the tables.yaml owner, not edited here.
  iod_climate:
    table: silver_noaa_iod
    metric: dmi_value              # the OBSERVED monthly index; iod_dmi_3month_avg is its smoothed sibling
    #                                (the oni_anom-not-oni_lag3 precedent: map the observation, not a filter)
    agg: latest
    period_type: year_month        # windows via (year*100+month) bounds -- the ONI machinery wholesale
    window_granularity: monthly
    country_rule: none             # global IOD state; the table has NO commodity/country column. NOT
    #                                `region`: every IOD driver's region token names the TELECONNECTION
    #                                TARGET ('Indian Ocean/Australia', 'India / East Africa'), never a
    #                                country slice of the index -- there is only ONE DMI series to serve,
    #                                so a region rule could only ever mislabel it.
    keying: "NO commodity/country column (global IOD state); asof compares (year*100+month) <= asof YM"
    native_unit: degC
    narrate_unit: degC
    scale: 1                       # an SST-anomaly gradient in degC; no ratio trap, no pre-scale
    coverage_start: 1950
    status: mapped_supporting
    notes: >
      21 instances, 2 ids (IOD_positive / IOD_negative), 15 contracts -- the highest-instance UNFENCED
      dark ref that a registered metric can honestly serve. Positive DMI = warm west (India/East Africa) /
      cool east (Indonesia-Australia); negative reverses it. PROBE (Athena, 2026-08-01): 918 rows spanning
      1950-01..2026-06, dmi_value non-null on all 918, range -1.19..+1.78 degC, and 1997-11 = 1.55 --
      the exact figure the registry card cites for the ERSSTv5 basis, so the served basis is confirmed
      live, not assumed. BASIS TRAP: magnitudes are ERSSTv5 vs the FIXED 1991-2020 climatology and are
      NOT comparable with pre-2026 HadISST-basis figures quoted elsewhere (1997 reads 1.55 here, 1.28 on
      the retired basis) -- never contrast a served value against a remembered one. The source publishes a
      completed month ~30-45d after month end, so the freshest reading normally trails today by about a
      month: cite the reading's OWN month, never call it current. NO pace leg: silver_noaa_iod is absent
      from cascade.PACE_TABLES (its ONI sibling is present), so this ref serves era + current rhyme legs
      only. That is a code file this wave does not own -- adding it there is a separate, deliberate change.

  # ── PSD ATTRIBUTE AXIS (silver_psd_attributes, vintage, marketing-year) — Lane 3 L2-5, flipped
  # 2026-08-26 with the whitelist. THE LONG COMPANION, not a second silver_psd. Values are in USDA's
  # NATIVE unit and are NOT converted: every row below is published in (1000 MT), so scale is 0.001
  # to narrate MMT — the wide PSD rows' 0.000001 is for RAW MT and the two must never be copied
  # across. Metric = the attribute label USDA itself prints, byte-exact from
  # data/dec_p0/psd_attribute_census.json (release_date=2026-08-13); the card declares these same
  # strings and tests/unit/test_psd_attribute_axis.py pins both rosters. EACH ROW IS INERT UNTIL A
  # DAG NODE CARRIES ITS REF — the re-keys are named in every `notes` block and live in
  # configs/graphrag/causal/*.yaml.
  psd_crush:
    table: silver_psd_attributes
    metric: Crush
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    global_token: skip             # country_rule absent -> primary; the crush drivers carry no region token
    keying: "commodity=contract slug; country=contract primary"
    native_unit: "1000 MT"
    narrate_unit: MMT
    scale: 0.001
    coverage_start: 1960
    status: mapped
    notes: >
      The crush VOLUME — tonnage actually processed — on the oilseed/meal/oil sheets only (21 mapped
      commodity codes, 159 countries, MY1960-2026). NEVER a margin: gold_board_crush is the soy margin in
      $/bu and crush_margin_z stays DARK by design (C19). There is no cane crush and no corn grind on this
      line. DAG RE-KEY THAT LIGHTS IT: domestic_crush_demand (canola_ice), eu_crush_demand
      (french_rapeseed_matif), rapeseed_crush_demand (rapeseed_meal_zce) move off crush_margin_z;
      Argentina_crush_capacity (soybean_meal_cbot) moves off `export`, which answers a CAPACITY driver
      with an export tonnage today. D-10 RECORD (flip census 2026-08-26): that leg FIRES with the
      contract PRIMARY's (US) crush while its subject is Argentina — the primary-ruled mis-scope
      class, a CONTINUATION (it was primary-scoped on `export` too; the metric improved, the scoping
      did not). It joins the D-10 register rather than a rushed re-fence: country_rule: region here
      would break the sibling crush legs ('China (Guangxi/coastal)' resolves nowhere), so the remedy
      is D-10's own per-leg scope mechanism, at that sitting. The margin-named ids and oil_share STAY
      on crush_margin_z and stay dark. USDA prints the crush line on a complex's oilseed AND meal AND
      oil sheets: never sum a complex's slugs. Whether the three carry identical values is UNMEASURED
      — probe before any leg reads two of them.
  psd_feed_use:
    table: silver_psd_attributes
    metric: Feed Dom. Consumption
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    global_token: skip
    keying: "commodity=contract slug; country=contract primary (mirrors the `consumption` row it sharpens)"
    native_unit: "1000 MT"
    narrate_unit: MMT
    scale: 0.001
    coverage_start: 1960
    status: mapped
    notes: >
      GRAIN SHEETS ONLY — barley, corn, millet, mixed grain, oats, rye, sorghum, wheat (8 codes, 158
      countries). The feed half of the grain demand split, replacing an undifferentiated consumption_mt
      for the drivers that actually mean feed. DAG RE-KEY: feed_demand (barley, corn, corn_cbot,
      french_maize_matif, sorghum, south_african_yellow_maize_jse), domestic_feed_demand and
      feed_demand_china (campinas_corn_reference_bmf) move off `consumption`. A MEAL-sheet feed driver
      must NOT ride this row — the meal sheets carry no Feed Dom. Consumption at all; they take
      psd_meal_feed_waste_use below. That split is USDA's, not ours.
  psd_fsi_use:
    table: silver_psd_attributes
    metric: FSI Consumption
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    global_token: skip
    keying: "commodity=contract slug; country=contract primary"
    native_unit: "1000 MT"
    narrate_unit: MMT
    scale: 0.001
    coverage_start: 1960
    status: mapped
    notes: >
      GRAIN SHEETS ONLY (the same 8 codes as psd_feed_use). Food, seed and industrial use as ONE combined
      figure — corn-for-ethanol is INSIDE it and is NOT separable, so this line is never narrated as the
      ethanol grind. Feed and FSI partition grain domestic use between them and must never be added to
      the oilseed sheets' three-way split. DAG RE-KEY: ethanol_demand (corn, corn_cbot) and
      ethanol_demand_BR (campinas_corn_reference_bmf) move off `consumption` — a strictly closer read than
      total domestic consumption, and honest only while the card's metric LABEL says "food, seed and
      industrial use". RFS/rfs_flag STAYS DARK: a policy mandate is not a use line.
  psd_meal_feed_waste_use:
    table: silver_psd_attributes
    metric: Feed Waste Dom. Cons.
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    global_token: skip
    keying: "commodity=contract slug; country=contract primary"
    native_unit: "1000 MT"
    narrate_unit: MMT
    scale: 0.001
    coverage_start: 1960
    status: mapped
    notes: >
      OILSEED / MEAL / OIL SHEETS ONLY (24 codes, 168 countries). Feed and waste as one line — the meal
      sheets' feed read, and the reason a single "feed" ref cannot serve both sheet families. DAG RE-KEY:
      soybean_meal_feed_demand (soybean_meal_cbot), hog_herd_demand (rapeseed_meal_zce) and
      china_feed_protein_destocking (rapeseed_meal_zce) move off `consumption`. rapemeal_feed_demand_z and
      rapemeal_demand_z STAY DARK: their contracts are the OILSEED and OIL slugs, not the meal, and
      commodity_aliases must not be used to manufacture a cross-product read.
  psd_food_use:
    table: silver_psd_attributes
    metric: Food Use Dom. Cons.
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    global_token: skip
    keying: "commodity=contract slug; country=contract primary"
    native_unit: "1000 MT"
    narrate_unit: MMT
    scale: 0.001
    coverage_start: 1960
    status: mapped
    notes: >
      OILSEED / MEAL / OIL SHEETS ONLY (24 codes, 168 countries). The FOOD half of vegetable-oil demand,
      separable at last from the INDUSTRIAL half (psd_industrial_use) that biodiesel policy moves. DAG
      RE-KEY: china_oil_demand (rapeseed_oil_zce), China_food_demand (palm_olein_dce),
      China_food_use_demand (soybeans_no_1_dce) move off `consumption`. Never added to
      psd_meal_feed_waste_use or psd_industrial_use — the three are USDA's own partition of the same
      domestic-use total, so summing them re-derives a number the sheet already prints.
  psd_industrial_use:
    table: silver_psd_attributes
    metric: Industrial Dom. Cons.
    agg: latest
    period_type: marketing_year
    window_granularity: marketing-year
    global_token: skip
    keying: "commodity=contract slug; country=contract primary"
    native_unit: "1000 MT"
    narrate_unit: MMT
    scale: 0.001
    coverage_start: 1961
    status: mapped
    notes: >
      OIL AND MEAL SHEETS ONLY (17 codes, 164 countries, MY1961-2026 — one year SHORTER than its
      siblings). The industrial/oleochemical/biodiesel-feedstock half of vegetable-oil demand. This is
      the closest observed line to a biodiesel-mandate effect, and it is a USE tonnage, not a mandate:
      biodiesel_mandate_flag (14 instances) stays a qualitative flag and is NOT re-keyed here.

  # ── THE KEYING KNOB (2026-08-26): the first two rows that read a NON-CONTRACT commodity ────────────
  # Both rows carry `commodity: <slug>`, the FIXED per-row override that landed in cascade._scope_ex
  # in this same sitting. It is NOT commodity_aliases: aliases RENAME a contract slug per contract and
  # fall back to the slug when a contract is absent (right for sagis crop codes, wrong here -- there is
  # no contract named cattle_beef to rename, so a rename row would key `corn_cbot` and read zero rows
  # forever). The override is lint-fenced fail-closed in config_check.check_cascade_map on four terms:
  # non-empty str; mutually exclusive with commodity_aliases; country_rule declared EXPLICITLY region
  # or none (never primary/absent -- the override slug has NO configs/geographies file, so a primary
  # row would resolve None and false-decline `no-geography-primary` on every leg, MEASURED); and
  # membership in the table card's `commodity_values` (a slug outside the enum returns a silent zero).
  # THE DOCTRINE FENCE IS UNTOUCHED AND STILL BINDS (psd_meal_feed_waste_use's note): a knob that CAN
  # key a cross-product read is not permission to manufacture one. What licenses these two rows is that
  # the DAG driver ALREADY names the other commodity as the mechanism -- a herd of cattle, a tonne of
  # fishmeal -- and the leg narrates that commodity's own series under its own unit, never the
  # contract's number wearing another commodity's label.
  herd_size_cattle:
    table: silver_production_livestock
    metric: live_animals
    commodity: cattle_beef         # THE OVERRIDE. The card's commodity_values are the four livestock
    #                                slugs (cattle_beef, hogs, broilers_poultry, milk_fluid); no
    #                                contract is named for any of them, which is the whole point.
    agg: latest                    # the freshest published YEAR on/before the asof
    period_type: date              # SEE THE WINDOW PARAGRAPH IN notes -- `date` is the honest choice
    #                                here and `marketing_year` is a measured wrong-year read
    leg_mode: current              # CURRENT rhyme leg ONLY: an era window cannot scope on this card
    #                                (no date_col, no year_col), so an era leg would read 1961-2024
    #                                whole and delta its ends. Lift only if the card gains a year axis.
    country_rule: region           # the DRIVER's own token (US on all three carriers) via region_map;
    #                                required-explicit by the override lint, and `region` rather than
    #                                `none` because the card HAS a country axis (FAOSTAT reporting
    #                                countries) and an unscoped read mixes ~200 of them
    keying: "commodity = FIXED cattle_beef (the override knob); country = driver region via region_map"
    native_unit: An                # FAOSTAT's own unit code for HEAD
    narrate_unit: "million head"
    scale: 0.000001                # 86,700,000 An -> 86.7 million head
    coverage_start: 1961
    status: mapped
    notes: >
      THE US CATTLE HERD, IN HEAD (FAOSTAT live_animals on the livestock card). CATTLE ONLY, and the
      unit is `An` (head) for this slug: the 1000x trap on this metric is the SIBLING slug --
      broilers_poultry stores `1000 An` -- and it cannot reach this row, because the commodity is
      FIXED to cattle_beef and the lint pins it inside the card's four-value enum. Never sum or rank
      this figure against a poultry count, and never against silver_psd's cattle_beef BALANCE SHEET:
      that card answers how much BEEF in tonnes, this one answers how many ANIMALS.
      GEOGRAPHY: the three carrier drivers (corn / corn_cbot / soybean_meal_cbot cattle_cycle_herd_size)
      token `US`, which region_map resolves to "United States"; the card's country column holds
      FAOSTAT's raw M49 display strings, so the title is translated to 'United States of America' at
      SQL time by the card's country_name_ref (numbers/faostat_areas.yaml) -- never by this map.
      WHAT A WINDOW MEANS HERE, and why period_type is `date` on an ANNUAL table. The card declares
      period_col `year` (int), NO date_col and NO year_col, so a date-typed leg's period_start/period_end
      bind NOTHING in build_sql: the only live guards are commodity/country/metric plus the PIT guard
      ingest_date <= asof (knowledge_semantics: ingest). The leg is therefore "the freshest annual
      observation the ingest knew about at the as-of", and that is exactly what `agg: latest` +
      `leg_mode: current` ask for. `marketing_year` was REFUSED on measurement, not taste: the engine
      derives the covering MY from _covering_my, whose default start month is September, so a
      calendar-year annual series would be read as year-1 for any event date in Jan-Aug (a March-2012
      drought would query the 2011 herd), and the CURRENT leg at a 2026 as-of would ask for MY2026
      against a series whose last observation is 2024 -- permanently silent. `year_month` claims a
      monthly grain this card does not have. Cite the ROW's own year, never the leg's trailing window
      label (the citation still STAMPS the leg's asof-365..asof label -- a cosmetic mismatch beside
      a 2024 observation, recorded here rather than papered over: build_sql binds no period on this
      card, so the label describes the ask, not the read).
      MEASURED CONSEQUENCE of an inert window, AND THE FLAG THAT GOVERNS IT (review find,
      2026-08-26): the compiled leg returns the WHOLE 1961-2024 series (64 rows, well inside the
      5,000 cap), UNORDERED -- the card has no date_col/year_col, so query._order_col is None and
      agg=latest falls through to the series arm. Which row gets narrated is then decided by
      _headline_row: with GRAPHRAG_CASCADE_HEADLINE=on (PRODUCTION, serving rev 115+) it is
      max(citations._row_order_key) = the last published year, correct; with the flag OFF (the A2b
      byte-identical revert state) _headline_row returns rows[0], and on this leg rows[0] is the
      1961 herd -- a 63-year-stale figure narrated as current. THE FLAG IS THEREFORE A LIVE-ROW
      PRECONDITION: this row is the estate's first order-less multi-row leg, and the A2b revert may
      not be exercised while it is live without also deferring this row (or giving the card a year
      axis, which un-inerts the window and retires this whole paragraph).
