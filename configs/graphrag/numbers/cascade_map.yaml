      NO commodity/country column. Currency metric from the driver's region via region_map: Brazil->brl_usd,
      Argentina->ars_usd, China->cny_usd. 90d change columns (*_pct_change_90d) are ALREADY percent.
    native_unit: "local currency per USD"
    narrate_unit: "local currency per USD"
    scale: 1
    coverage_start: 2004           # HARD floor: FX silver starts 2004-12-31; earlier episodes are FX-dark
    status: mapped_supporting
    notes: >
      124 instances. Direction is FRED 'local per USD' (higher = weaker local). 1999 BRL float /
      2002 ARS collapse are silver-dark; narrate those qualitatively.
  oni_climate:
