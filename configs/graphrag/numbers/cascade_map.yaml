  # -- C3 (2026-08-01) -- the ONI sibling, same shape, same windowing ---------------------------------
  # SUPERSEDES the wiring-wave-1 card comment on silver_noaa_iod (tables.yaml: "enters NO cascade_map"),
  # which recorded that wave's SCOPE, not a doctrine: the table is the exact structural twin of
  # silver_noaa_oni (global, monthly, year+month keyed, no commodity/country column), and oni_climate has
  # been a mapped_supporting row since P9-B. That comment is now stale and lives in a file this wave does
  # not own -- flagged for the tables.yaml owner, not edited here.
  iod_climate:
    table: silver_noaa_iod
    metric: dmi_value              # the OBSERVED monthly index; iod_dmi_3month_avg is its smoothed sibling
    #                                (the oni_anom-not-oni_lag3 precedent: map the observation, not a filter)
    agg: latest
    period_type: year_month        # windows via (year*100+month) bounds -- the ONI machinery wholesale
    window_granularity: monthly
    country_rule: none             # global IOD state; the table has NO commodity/country column. NOT
    #                                `region`: every IOD driver's region token names the TELECONNECTION
    #                                TARGET ('Indian Ocean/Australia', 'India / East Africa'), never a
    #                                country slice of the index -- there is only ONE DMI series to serve,
    #                                so a region rule could only ever mislabel it.
    keying: "NO commodity/country column (global IOD state); asof compares (year*100+month) <= asof YM"
    native_unit: degC
    narrate_unit: degC
    scale: 1                       # an SST-anomaly gradient in degC; no ratio trap, no pre-scale
    coverage_start: 1950
    status: mapped_supporting
    notes: >
      21 instances, 2 ids (IOD_positive / IOD_negative), 15 contracts -- the highest-instance UNFENCED
      dark ref that a registered metric can honestly serve. Positive DMI = warm west (India/East Africa) /
      cool east (Indonesia-Australia); negative reverses it. PROBE (Athena, 2026-08-01): 918 rows spanning
      1950-01..2026-06, dmi_value non-null on all 918, range -1.19..+1.78 degC, and 1997-11 = 1.55 --
      the exact figure the registry card cites for the ERSSTv5 basis, so the served basis is confirmed
      live, not assumed. BASIS TRAP: magnitudes are ERSSTv5 vs the FIXED 1991-2020 climatology and are
      NOT comparable with pre-2026 HadISST-basis figures quoted elsewhere (1997 reads 1.55 here, 1.28 on
      the retired basis) -- never contrast a served value against a remembered one. The source publishes a
      completed month ~30-45d after month end, so the freshest reading normally trails today by about a
      month: cite the reading's OWN month, never call it current. NO pace leg: silver_noaa_iod is absent
      from cascade.PACE_TABLES (its ONI sibling is present), so this ref serves era + current rhyme legs
      only. That is a code file this wave does not own -- adding it there is a separate, deliberate change.

  # ── DEFERRED (uncertified/empty at the 2026-06-24 certification; un-defer gate = a live W0 probe) ──
  esr_exports:
    table: silver_esr
    metric: weekly_exports_1000mt      # FIX (D-W3.1): was weekly_exports_mt -- NOT a real registry column
    #                                    (ESR metrics are *_1000mt). Un-deferring as-written ERRORed
    #                                    check_cascade_map (metric-not-in-registry, fail-closed).
    # UN-DEFERRED (D-W5 ESR flip, 2026-07-12, user-ratified): cert reconcile GREEN on silver_esr_compact
    # (753,062 rows, all 8 checks pass), b2s freshness top-up from bronze as_of=20260528 SUCCEEDED, pg
    # mirror reloaded. Lands together with silver_esr's removal from UNCERTIFIED_TABLES (cascade_census.py)
    # or check_cascade_map fails closed. Gate: candidate census FIRES + --diff vs cascade_census_20260711b.
    # Rollback: re-add `deferred: true` here + re-add silver_esr to UNCERTIFIED_TABLES.
    agg: latest                        # v1 (C2): the single FRESHEST week on/before asof. was `sum` -- DEAD
    #                                    CONFIG (cascade.py hardcoded agg="series" on the date branch;
    #                                    row.get("agg") was only read on the marketing_year branch). D-W3.2
    #                                    now threads row.get("agg") into the date-branch CURRENT leg so this
    #                                    is honored. `latest` also fixes the stale-week defect: a `series` leg
    #                                    over [asof-365,asof] is ORDER BY ASC, so rows[0] was the ~1-year-OLD
    #                                    week mislabeled "current".
    period_type: date                  # weekly pace: period_start/period_end bind week_ending_date
    leg_mode: current                  # NEW FLAG (D-W3.2): the current rhyme leg ONLY -- never an era leg
    country_rule: none                 # US-only source; no country column, v1 sums destinations
    native_unit: "1000 MT"
    narrate_unit: "1000 MT"            # kt/week flow -- NOT MMT, NOT a level; scale 1 (no ratio trap)
    scale: 1
    coverage_start: 1990
    status: mapped
    notes: >
      US weekly export PACE (fresh rhyme leg): the single freshest week's shipments on/before the session
      as-of, narrated as "week ending <week_ending_date>". Complements -- never replaces -- the PSD export
      LEVEL backbone (see the `export` row). Flow in 1000 MT/week; NEVER deltaed against a PSD MMT level.
  # ── D-W5 WEATHER FLIP (2026-07-12, corrected shape) ──────────────────────────────────────────────────
  # The map row ID is the JOIN KEY to the drivers' silver_ref -- a single `weather_z` row joined to
  # NOTHING (zero drivers carry silver_ref: weather_z; the first candidate census was a vacuous 0-delta).
  # The real refs the DAGs bind are drought_z(64), heat_stress_z(53), frost_event_flag(22), gdd_z(2),
  # stage_tmax_anomaly(1) -- one row each below, all serving from the NON-projected gold_weather_z
  # (D-W4: tall, monthly, PIT-safe same-month z, PSD Title-Case countries). stage_precip_z (38 drivers)
  # has NO gold metric yet -- stays unmapped/qualitative pending a precip-z gold family.
  # Rollback: re-add `deferred: true` per row. Gate: candidate census diff + config_check green.
  #
  # DROUGHT_Z UN-DEFERRED (BF-W1, 2026-07-14): the CHIRPS silver value rebuild landed real precip for
  # all 31 commodities (post-rebuild census: zero all-NaN month objects; 17,642 fabricated partitions
  # retired to silver_old/), and the dry-day threshold now floors at 1mm (dry_day_threshold, commit
  # dc5b2367) so the pct-20 definition no longer degenerates in zero-inflated climates -- the gold
  # rebuild emits drought_z for 31/31 commodities (774,876 gold rows, embedder image 15422de3).
  drought_z:
    table: gold_weather_z
    metric: drought_z
    period_type: year_month
    country_rule: region
    native_unit: z
    narrate_unit: z
    scale: 1
    coverage_start: 1981
    status: mapped
    notes: >
      Monthly longest consecutive dry-day run (CHIRPS precip; dry = below max(pct-20 of the trailing
      same-month baseline, 1mm/day)), z-scored vs the same-month prior-year baseline. Un-deferred in
      BF-W1 after the CHIRPS value rebuild + the dry-day floor fix.
  heat_stress_z: &gold_weather_row
    table: gold_weather_z
    metric: heat_stress_z
    period_type: year_month            # reuses the ONI (year*100+month) windowing + as-of guard wholesale
    country_rule: region               # the driver's own region token -> region_map -> Title-Case country
    native_unit: z
    narrate_unit: z                    # a standardized anomaly, dimensionless; scale 1 (no ratio trap)
    scale: 1
    coverage_start: 1981
    status: mapped
    notes: >
      Monthly count of days over the heat threshold, z-scored vs the same-month prior-year baseline.
      Narrate as heat-stress anomaly; never a level.
  frost_event_flag:
    <<: *gold_weather_row
    metric: frost_event_flag
    native_unit: flag
    narrate_unit: flag
    notes: >
      Monthly frost flag: 1.0 if the monthly-min temperature dropped below freezing, else 0.0 (a real
      observation, kept). Narrate as presence/absence of a frost month; never averaged or z-labeled.
  gdd_z:
    <<: *gold_weather_row
    metric: gdd_z
    notes: >
      Monthly growing-degree-day sum, z-scored vs the same-month prior-year baseline.
  stage_tmax_anomaly:
    <<: *gold_weather_row
    metric: tmax_anomaly               # driver ref keeps its historical name; the gold column is tmax_anomaly
    notes: >
      Monthly mean-tmax anomaly z vs the same-month prior-year baseline.

  # -- C1 (2026-08-01) -- THE R9 CONTEXT LANE, ratified under D1 -------------------------------------
  # R9 used to ban this row outright. D1 (ratified 2026-08-01) split the rule: positioning may enter the
  # cascade map ONLY as a fetched PAST-TENSE CONTEXT leg -- never a fork ref, never a regime-MARKER ref,
  # never a chain/complex/transmission hop. config_check._check_positioning_lane is build-failing on any
  # other shape, reading cascade.positioning_context_violations -- the SAME predicate quantify()'s runtime
  # gate reads, so the lint and the engine can never disagree about what "context" means. Every field
  # below is load-bearing to that predicate:
  #   leg_mode: current  -> _node_specs skips era legs, so era_deltas is empty and _divergence can never
  #                         return True: the cross-era FORK path is structurally closed, not merely unused.
  #   period_type: date  -> a dated weekly observation, never a marketing-year fork window.
  #   metric mm_net      -> outside _TRADE_METRICS, so it can never seed an RF-3 reroute PAIR.
  #   narrate_unit       -> not 'flag', so it is an observed LEVEL and not a regime marker.
  #   PACE_TABLES        -> silver_cot carries a 'week' grain, without which the leg is structurally dead.
  #
  # TWO PRECONDITIONS, both named because a silent one is how this ships as decoration:
  #   (1) GRAPHRAG_CASCADE_PACE_LEG must be ON in the measured lane. cascade.py's selection gate drops an
  #       era-less `leg_mode: current` node unless `pace` is True, and the era-less case IS the live
  #       positioning shape. Verify it in the eval jobdef env before crediting any C1 result.
  #   (2) FENCED turns only. quantify() refuses this table on an OUTLOOK turn (D1's carve-out) because
  #       register.py releases the flow fence there by design.
  cot_mm_positioning:
    table: silver_cot
    metric: mm_net                 # managed-money NET position (mm_long - mm_short). mm_net_z_3yr is the
    #                                sibling standardization and is DELIBERATELY not mapped: one ref binds
    #                                ONE (table, metric) pair, and the LEVEL is the observation -- a z is a
    #                                derived comparison against a 3-yr window that reads as a verdict
    #                                ("stretched") the moment it is narrated. The level plus its own dated
    #                                history is the context lane; the z is not needed to state it.
    agg: latest                    # the single FRESHEST report on/before the asof (the esr_exports idiom;
    #                                a `series` leg over a trailing window is ORDER BY ASC and rows[0] is
    #                                the OLDEST print -- the A2b defect this wave measured)
    period_type: date              # weekly report_date; period_start/period_end bind it
    leg_mode: current              # CURRENT rhyme leg ONLY -- never an era leg (closes the fork path)
    country_rule: none             # no country column; commodity_col is leviathan_slug (CONTRACT slugs)
    keying: "commodity=CONTRACT slug (corn_cbot, ...); a bare base name matches ZERO rows (tables.yaml:699)"
    native_unit: contracts
    narrate_unit: contracts        # a signed position COUNT; scale 1, no ratio trap
    scale: 1
    coverage_start: 2006           # 12 slugs live 2006+; the wheat series start ~2014 (W4b legacy-name gap)
    status: mapped_supporting
    notes: >
      31 driver instances, the highest-instance FENCED dark ref and the one finding 2.4(a) is about: the
      agent reached silver_cot on the two execution-BAIT rows and on ZERO of the three purely-positioning
      rows, so discretion here is ANTI-CORRELATED with the ask and only determinism closes the class.
      HISTORICAL CONTEXT ONLY. Narrate the level in the PAST TENSE, dated by its own report date, and
      state nothing about what positioning will do next -- cascade.POSITIONING_CONTEXT_ADDENDUM rides the
      block whenever this leg renders, and tests/unit/test_register_corpus.py pins that string flow-clean.
      Positioning is UNREVISED, so latest-only is genuinely point-in-time-clean; publication_lag_days=6
      covers the Tuesday-data / Friday-release gap and the holiday slips. The table was ~6 weeks stale at
      the 2026-07-18 census, so an honest leg may serve a reading several weeks old WITH its date -- which
      is the correct behaviour, and the reason the report date belongs in the narration.

