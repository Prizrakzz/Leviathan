# =====================================================================================================
# PHASE PAIRS -- WHICH PHASE OF A SIGNED CLIMATE SERIES IS IN FORCE (lane D, the same smoke)
# =====================================================================================================
# THE DEFECT. The shipped graph puts `El_Nino` and `La_Nina` on ONE ONI ref with OPPOSITE declared signs
# and loudness ranks the UNSIGNED reading, so BOTH members land loud on the SAME number and the block
# prints two contradictory edges off one figure. `render.sb_phase_pair` already says they are one series
# -- it does NOT say which of the two phases the reading actually IS. Measured cost on the served
# answers: the palm turn built a supply-squeeze story on "-0.39 degC", a COOL-phase reading, and the
# corn page wrote "opposite signs on each board by phase" with no ENSO driver admitted at all.
#
# WHAT THIS DECLARES, AND IT IS A FACT ABOUT THE INDEX, NOT A BAND. A positive ONI anomaly IS El Nino
# and a negative one IS La Nina; a positive dipole-mode index IS the positive IOD phase. The THRESHOLD
# is NOT declared here -- it is read from the `conventions:` entry named by `convention:`, whose first
# `abs_bands` band is already the publisher's own phase cut (ONI 0.5 degC = silverleg's own
# `_ONI_INTENSITY_BANDS[0]`, lint-pinned; IOD 0.4 degC = the BoM/JMA event convention). One number, one
# owner: a phase line can never disagree with the label word on the row above it.
#
# ITS OWN TOP-LEVEL KEY, for the `watch_overlay` reason: `render.phase_in_force()` is the ONE reader and
# nothing on the rank, the loud cut or the convention label can move because of an entry here. When a
# ref has no entry the join line renders exactly as it does at HEAD -- fail-closed, never a guess about
# which way an unfamiliar index signs.
phase_pairs:
  silver_noaa_oni.oni_anom:
    convention: oni_climate
    positive: {driver: El_Nino,      words: "the warm phase"}
    negative: {driver: La_Nina,      words: "the cool phase"}
  silver_noaa_oni.oni_lag6:
    convention: oni_climate
    positive: {driver: El_Nino,      words: "the warm phase"}
    negative: {driver: La_Nina,      words: "the cool phase"}
  silver_noaa_iod.dmi_value:
    convention: iod_climate
    positive: {driver: IOD_positive, words: "the positive phase"}
    negative: {driver: IOD_negative, words: "the negative phase"}
