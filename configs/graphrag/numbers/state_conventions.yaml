# THE DESK-CONVENTION REGISTRY -- STATE ENGINE DESIGN sec 2.4 (ruling 1; D14), landed at sitting S0.
#
# WHAT A CONVENTION MAY DO: attach a LABEL WORD to a state row, enter the loudness rank as a TIE-BREAK
# behind the three computed measures (sec 3.2), and feed a WATCH proximity row (sec 5.1 kind 2).
# WHAT IT MAY NOT DO: exclude a row, gate a traversal, veto a driver, fire a regime, or LEAD the order.
# Ordering only, never exclusion -- the owner's ruling 1. Loudness is COMPUTED (|z|, percentile
# extremity, run length against the driver's OWN series); a convention only breaks a tie.
#
# WHY HERE AND NOT IN params.yaml. `serving.silver.thresholds` (params.yaml:151-156) is silverleg's
# FIRING contract -- `_thr` reads it and `_verdict_z` turns it into observed / inconclusive / normal,
# which `planner.ground` and `firing.fire_contract` consume. An ORDERING LABEL is a different kind of
# thing from a firing threshold, so params.yaml stays byte-identical and this file is new. The board
# row is NEVER vetoed: a `normal` reading is a row that says so.
#
# REGISTER SAFETY IS A LINT CLAUSE, NOT A HABIT. Every label below and every template literal returns
# ZERO from register.count_flow_words, register.count_valuation_words, register.register_leaks and
# register._LANE_B_ADJ -- pinned by state/lint.py and by tests/unit/test_state_lint.py. Revision 1 of
# the design proposed "crowded short" / "crowded long" / "stretched"; those are the flow register's own
# MUST-FLAG words (register.py:684 `_LANE_B_FLOW_RX`, pinned MUST_FLAG at
# tests/unit/test_register_corpus.py:347-352) and they failed this file's own lint. The vocabulary here
# is the walk's own `_z_word` register ("near normal" / "notably above normal", cascade.py:950).
#
# EVERY VALUE IS AN OWNER-CURATED DESK CONVENTION, and each row says whether it is VERIFIED against
# something in the estate or DECLARED and awaiting the owner's word (`verified: null`).

version: 1

# -- per-cadence z / percentile windows (sec 2.1) -----------------------------------------------------
# The window a state is measured over, in the cadence's OWN unit, so a rendered figure can name its
# window in that unit and its n (the futures_z precedent, params.yaml:157-178). `daily: 250` is the
# SAME number params.yaml `serving.silver.stats.futures_z.window_sessions` carries, and for the same
# measured reason: 250 sessions is one trading year, and a calendar-day window over a per-session table
# varies silently with holidays and venue closures.
windows:
  daily:    250     # sessions (one trading year)
  weekly:   156     # weeks (three years) -- the COT / ESR / FGIS grain
  biweekly: 78      # fortnights (three years) -- the UNICA grain
  monthly:  120     # months (ten years) -- ONI / IOD / MPOB / pink sheet / weather z
  annual:   10      # marketing years -- silverleg's own PSD `window_years: 10` (params.yaml:151)

# -- how a value becomes a label, PER KIND (declared, never inferred by a consumer) -------------------
band_semantics:
  abs_bands:          "the RAW value's magnitude vs absolute bands in the series' own unit; |v| >= bands[i] takes labels[i] and the HIGHEST matching band wins; below bands[0] there is NO label and the row says so"
  z_bands:            "the same rule on the row's z instead of its raw value; |z| >= bands[i] takes labels[i], highest match wins, below bands[0] no label"
  percentile_bands:   "TAIL CUTS on the row's own history: a band under 50 labels from BELOW (pct <= band -> that label), a band over 50 labels from ABOVE (pct >= band -> that label), the most extreme match wins, and between the innermost cuts there is NO label"
  pace_vs_prior_year: "a signed PERCENT change against the same point of the prior year; v <= bands[0] takes labels[0], v >= bands[-1] takes labels[-1], between them no label"

conventions:

  # -- climate ---------------------------------------------------------------------------------------
  # ONE VOCABULARY, PINNED. These four bands and their four words ARE silverleg._ONI_INTENSITY_BANDS
  # (silverleg.py:57), read here ascending where silverleg stores them descending. state/lint.py fails
  # closed if the two ever drift: the board and the firing leg must never say "strong" at two different
  # anomalies. ONI's `z` is the RAW anomaly in degC, never a sigma -- so this row is abs_bands.
  oni_climate:
    kind: abs_bands
    bands:  [0.5, 1.0, 1.5, 2.0]
    labels: [elevated, moderate, strong, extreme]
    unit: degC
    history_window_key: monthly
    verified: "identical to silverleg._ONI_INTENSITY_BANDS (lint-pinned); NOAA's 'weak' renders as 'elevated' and 'very strong' as 'extreme' -- an observed driver is never 'weak'"

  # The BoM +/-0.4 degC positive/negative IOD event convention. OWNER-APPROVED (sec 16 decision 5) and
  # UNVERIFIED against the publisher: the card's own served basis is ERSSTv5 vs the FIXED 1991-2020
  # climatology, and magnitudes on that basis are NOT comparable with pre-2026 HadISST figures.
  # ONE ESTATE CORROBORATION, FOUND AT THE S0 REVIEW AND NOT PROMOTED TO A VERIFICATION: the DMI
  # bronze transform's own header states the same number from a different authority --
  # raw_to_bronze/noaa_iod.py, "Phase thresholds follow JMA convention (+/-0.4 C)". That is a second
  # SECONDARY source, not the publisher: BoM returned HTTP 403 on every path and both host forms in
  # the design's delta pass (item B4.2) and is renaming the product, so `verified` stays null until a
  # browser read. Recorded here so the next sitting does not mistake the silence for an absence of
  # evidence.
  iod_climate:
    kind: abs_bands
    bands:  [0.4]
    labels: [event]
    unit: degC
    history_window_key: monthly
    verified: null     # UNVERIFIED -- owner-declared 0.4 degC; not read off the publisher

  # silverleg's own FX z threshold (params.yaml:153, `z: 1.5`) and its t / 2t / 3t intensity ladder
  # (silverleg._intensity): the same ladder, said once, as ordering words.
  # THE WINDOW IS THE ONE THING THAT DOES **NOT** MATCH, and it is a finding rather than a slip. The
  # SAME params.yaml line carries `window_days: 504` for this ref's FIRING contract, while the board's
  # `history_window_key: daily` resolves to `windows.daily: 250` (sec 2.1, and the number silverleg's
  # OWN sibling block fixes for futures_z, params.yaml:178). So the estate now holds TWO windows for
  # one ref: 504 for whether the leg FIRES, 250 for where the board RANKS it. The design fixes
  # windows.daily at 250 and this file is compliant with it; the divergence belongs to the D5 census
  # finding that already tracks silverleg-vs-board window drift, and is written down here rather than
  # left silent so the census counts it instead of re-discovering it.
  fred_fx_macro:
    kind: z_bands
    bands:  [1.5, 3.0, 4.5]
    labels: [moderate, strong, extreme]
    history_window_key: daily
    verified: "params.yaml serving.silver.thresholds.fred_fx_macro z=1.5 and silverleg._intensity's t/2t/3t ladder"

  # -- balance sheet ---------------------------------------------------------------------------------
  # OWN-HISTORY PERCENTILES ONLY. Owner decision 5: NO absolute stocks-to-use desk bands in V1 -- a
  # per-slug-family absolute band is real desk knowledge nobody in this estate has measured, and an
  # invented one would rank 63 commodities against a number curated for one of them. The tails of a
  # slug's own ten marketing years are COMPUTED, not curated.
  psd_ending_stock_su_ratio:
    kind: percentile_bands
    bands:  [10, 25, 75, 90]
    labels: [very tight, tight, ample, very ample]
    history_window_key: annual
    history_window: 10        # marketing years -- silverleg's own window_years
    verified: "own-history percentiles; the window equals silverleg's params.yaml window_years: 10"

  # -- positioning -- READ, LABELLED, AND FENCED (sec 2.4, D18) ---------------------------------------
  # `context_only: true` is the whole rule: the row renders as level + percentile + report date in the
  # PAST TENSE with cascade.POSITIONING_CONTEXT_ADDENDUM riding the block, and it is NEVER a fan-out
  # source, NEVER a convergence member, NEVER an analog dimension, NEVER a projection or watch anchor.
  # ONE EXCEPTION, owner amendment sec 16: when the QUERY NAMES POSITIONING the row may rank the anchor
  # set and serve as the analog dimension -- positioning explained is not positioning narrated as a
  # cause. On an OUTLOOK turn the series half declines `outlook_lane` (R9's shipped drop, untouched).
  cot_mm_positioning:
    kind: percentile_bands
    bands:  [10, 90]
    labels: [bottom decile, top decile]
    history_window_key: weekly
    history_window: 156       # weeks
    context_only: true
    verified: "own-history percentiles over 156 weeks; the report is unrevised, so latest-only is PIT-clean"

  # -- weather z (gold_weather_z serves these AS standardized anomalies) ------------------------------
  # The basin-tail row's +2 sigma is the `severe` cut. The map ref is `stage_tmax_anomaly`
  # (cascade_map.yaml:1237), never a bare `tmax_anomaly` -- the driver ref keeps its historical name
  # while the gold column is `tmax_anomaly`.
  drought_z:            {kind: z_bands, bands: [1.0, 2.0], labels: [notable, severe], history_window_key: monthly, verified: "gold_weather_z serves a z; the +2 sigma severe cut is the basin-tail convention"}
  heat_stress_z:        {kind: z_bands, bands: [1.0, 2.0], labels: [notable, severe], history_window_key: monthly, verified: "gold_weather_z serves a z; the +2 sigma severe cut is the basin-tail convention"}
  gdd_z:                {kind: z_bands, bands: [1.0, 2.0], labels: [notable, severe], history_window_key: monthly, verified: "gold_weather_z serves a z; the +2 sigma severe cut is the basin-tail convention"}
  stage_tmax_anomaly:   {kind: z_bands, bands: [1.0, 2.0], labels: [notable, severe], history_window_key: monthly, verified: "gold_weather_z serves a z; the +2 sigma severe cut is the basin-tail convention"}

  # -- the pink sheet's input-cost family: the SOURCE serves these as 5-year z columns ----------------
  # ONE cut, one word. The 1.5 is silverleg's own z threshold for the retired `pink_sheet_input_costs`
  # entry (params.yaml:155, `{kind: z, window_years: 5, z: 1.5}`), carried here as an ORDERING label
  # rather than a firing threshold -- see `retired_from_params` at the foot of this file.
  brent_crude_z:        {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}
  urea_z:               {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}
  natural_gas_us_z:     {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}
  natural_gas_eu_z:     {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}
  npk_fertilizer_z:     {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}
  dap_z:                {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}
  potash_z:             {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}
  fishmeal_price_z:     {kind: z_bands, bands: [1.5], labels: [elevated], history_window_key: monthly, verified: "params.yaml pink_sheet_input_costs z=1.5 (window_years 5), carried as an ordering label"}

  # -- export / inspection PACE: a signed percent against the prior year, +/-10 pct -------------------
  # `pace_vs_prior_year` is stats.yoy_delta over the SHIPPED weekly collapse (cascade._PACE_COLLAPSE),
  # never a third pace producer beside `_pace_legs` and `_pace_series`. The +/-10 pct cut is DECLARED,
  # not measured -- the S4 census prints the distribution and the owner narrows it.
  esr_exports:           {kind: pace_vs_prior_year, bands: [-10, 10], labels: [behind, ahead], history_window_key: weekly, verified: null}
  fgis_inspections_pace: {kind: pace_vs_prior_year, bands: [-10, 10], labels: [behind, ahead], history_window_key: weekly, verified: null}

  # -- levels and spreads with no desk band: their OWN history's deciles -----------------------------
  # `low` / `high` and nothing stronger: these four have no published convention, so the words say only
  # where the reading sits in its own record. A zero-crossing spread is never labelled by percent.
  mpob_ending_stocks:      {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: monthly, verified: null}
  cbot_board_crush_margin: {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: daily,   verified: null}
  kc_chi_spread:           {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: daily,   verified: null}
  white_yellow_spread:     {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: daily,   verified: null}

# -- the two DEAD params.yaml entries, copied here with their note (sec 2.4) --------------------------
# MEASURED: neither is a cascade_map ref and neither has a silverleg handler (`_HANDLERS` carries three:
# psd_ending_stock_su_ratio, fred_fx_macro, oni_climate), so both are dead config in params.yaml today.
# They are RECORDED here so the numbers survive the retirement; params.yaml stays byte-identical at S0
# and the two entries are removed in their own later commit, never as a side effect of this file.
retired_from_params:
  pink_sheet_input_costs: {kind: z, window_years: 5,  z: 1.5, note: "no silverleg handler, no cascade_map ref; its 1.5 lives on above as the pink-sheet family's ordering cut"}
  psd_sd_level:           {kind: z, window_years: 10, z: 1.0, note: "no silverleg handler, no cascade_map ref; the export/import/consumption/stock vintage levels are read by the board as their own percentile rows"}

# ═════════════════════════════════════════════════════════════════════════════════════════════════════
# THE WATCH-ONLY OVERLAY (S7b, the owner's 2026-09-11 non-obvious watch ruling)
# ═════════════════════════════════════════════════════════════════════════════════════════════════════
# WHY IT IS A SEPARATE TOP-LEVEL KEY AND NOT FIFTEEN MORE ROWS UNDER `conventions:`.
# `conventions:` is read by feeders._convention_label -> StateRow.convention -> walk._convention_hit,
# and `_convention_hit` is a TERM OF walk.rank_key. A ref curated into that block therefore changes
# bd.order, and through it every rendered line of every board-on turn, WITH EVERY FLAG OFF. A config
# curation is the one change in this sitting that cannot be dark behind a code flag, so these entries
# live under their own key: `lint.load_conventions()`'s consumers read `conventions` and never this,
# and watch.watch_overlay() is the ONE reader. SB-1's "past the line the desk convention calls X"
# clause, the loud cut, the rank tuple and analogs.crossings are all untouched by construction.
#
# A LIVE CURATION IS A SEPARATE, DECLARED, NON-BYTE-IDENTICAL CHANGE with its own 144-turn census. If
# the owner wants these on the rank, that is the change to make -- not this one.
#
# "OVERLAY" IS ABOUT THE KEY, NOT ABOUT THE FILE (review round 2, minor g). This file is TRACKED and
# committed by path -- it is not a gitignored private config and it is not a local-only sidecar, and
# these fifteen entries ship in the same commit as the producer that reads them. What "overlay" names
# is the SEPARATE TOP-LEVEL KEY: an additive second book that `watch.nonobvious_candidates` merges
# UNDER the base (`merged.setdefault`, so a `conventions:` entry always wins), reached by
# `watch.watch_overlay()` alone.
#
# WHAT THEY ARE FOR. MEASURED over scratchpad/board_census_run5's 144 board x mode traces: fifteen
# distinct silver_refs carry 463 of the banked d2 order rows and have NO entry in `conventions:` at
# all, so every band-keyed watch term is structurally blind to the balance sheet, the trade flows and
# the cattle herd. (The brief's "sixteen refs / 491 rows" counts a sixteenth "ref" that is the EMPTY
# series key -- 68 rows with no series at all, which can never take a convention. Fifteen is the
# curatable number and 463 is its row count; both are re-measurable from the traces.)
#
# EVERY ENTRY IS THE SAME SHAPE AND THE SAME BASIS: own-history deciles, `low` / `high` and nothing
# stronger -- the file's own "levels and spreads with no desk band" family (mpob_ending_stocks,
# cbot_board_crush_margin, kc_chi_spread, white_yellow_spread) extended to the refs the census says are
# uncovered. Owner decision 5 REFUSES invented absolute bands and this curation invents none: a decile
# says only where a reading sits in its own record, which is a computed fact, not desk knowledge nobody
# in this estate has measured. `verified: null` on all fifteen -- they are DECLARED, and each names
# below the count that earned it a place.
#
# THE WINDOW IS THE CADENCE'S OWN. Fourteen of the fifteen are PSD / PSD-attribute / livestock cards on
# the ANNUAL marketing-year grain (silverleg's own window_years: 10, `windows.annual`), which is what
# `retired_from_params.psd_sd_level`'s own note already says these refs are read as: "the
# export/import/consumption/stock vintage levels are read by the board as their own percentile rows".
# This block is that sentence, made machine-readable.
watch_overlay:

  # -- PSD trade and supply/demand levels (silver_psd, annual marketing years) ------------------------
  export:                  {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 107 banked order rows, 75 of 144 seats
  import:                  {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 62 rows, 55 seats
  area:                    {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 51 rows, 48 seats -- planted / harvested area
  consumption:             {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 44 rows, 40 seats
  production:              {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 35 rows, 23 seats
  beginning_stock_region:  {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 28 rows, 28 seats
  stock:                   {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 24 rows, 24 seats
  sunflower_oil_supply:    {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 20 rows, 16 seats
  production_region:       {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 12 rows, 4 seats

  # -- PSD ATTRIBUTE use columns (silver_psd_attributes, annual marketing years) ----------------------
  psd_feed_use:            {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 24 rows, 20 seats
  psd_fsi_use:             {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 12 rows, 12 seats
  psd_food_use:            {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 12 rows, 12 seats
  psd_meal_feed_waste_use: {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 12 rows, 8 seats
  psd_crush:               {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 8 rows, 8 seats

  # -- livestock (silver_production_livestock, annual) ------------------------------------------------
  # THE ONE FAMILY NO OTHER TERM CAN SEE. The herd is a stock with a multi-year turnover: a reading in
  # its own record's tail is the whole fact about it, and there is no published desk band to borrow.
  # HALF THE FAMILY IS UNCOVERED, DELIBERATELY AND MEASURABLY (coherence audit 2026-09-16, NC-A9).
  # `herd_size_hogs` is a live cascade_map ref (cascade_map.yaml:617) on the SAME card, the same annual
  # grain and the same scale/narrate_unit as `herd_size_cattle`, and it is in NEITHER this block NOR the
  # watch_overlay. The reason is the curation method and not carelessness: this overlay was cut by
  # BANKED ROW COUNT from the 144-trace run5 census (every entry carries its count) and hogs scored ZERO
  # banked rows, so there was nothing to size a band against. The sentence above is about the FAMILY, so
  # say it plainly: a Chinese-hog-herd row renders today with no band word beside a US-cattle row that
  # has one. ADDING THE ENTRY IS A LIVE CURATION -- this file's own header says such a change is
  # "SEPARATE, DECLARED, NON-BYTE-IDENTICAL, with its own 144-turn census", because the terms here feed
  # `watch.nonobvious_candidates` -- so it is DOCKETED for the next census, never slipped in beside a
  # comment fix.
  herd_size_cattle:        {kind: percentile_bands, bands: [10, 90], labels: [low, high], history_window_key: annual, history_window: 10, verified: null}   # 12 rows, 12 seats

# =====================================================================================================
# READING WORDS -- WHAT THE NUMBER ON A STATE LINE ACTUALLY IS (lane D, the 2026-09-16 pre-arm smoke)
# =====================================================================================================
# THE DEFECT, VERBATIM FROM THE SERVED ANSWERS. The block names a row by its DRIVER ID and its SOURCE
# CARD and never by the QUANTITY it read, so a policy node sitting on a volume column reaches the writer
# as a policy figure:
#
#   block   "- [N13] Argentina export tax on CBOT soybeans, USDA PSD for 2025-12-31: 27.45 MMT"
#   served  "Argentine export tax sits at 6.65 MMT"           (a TAX RATE, in a TONNAGE unit)
#   served  "Brazilian supply 118 MMT [N32]"                  (N32 is USDA PSD EXPORTS, Brazil)
#   served  "Flash-drought reading 0.6 z [N44]"               (gold_weather_z.drought_z)
#
# WHY IT IS A DECLARED TABLE AND NOT A DERIVATION. The S8 docket in `render.py` (above `pattern_label`)
# records the S7 attempt and the measurement that reverted it: folding `display.metric_label` into the
# SB-1 head never fired on the two POLICY rows it was written for and made 28 of 43 real rows WORSE by
# appending a storage-column word ("exports mt", "su ratio", "brent crude usd bbl zscore 5yr") to a line
# that already read correctly. Its own conclusion is that the mechanism that works is "reader words
# DECLARED beside the ref, not derived from a column name". `cascade_map.yaml` is GITIGNORED and
# generator-owned, so the declaration lives here, in the board's own tracked vocabulary file, under its
# own top-level key -- the `watch_overlay` precedent exactly: `lint.load_conventions()`'s consumers read
# `conventions:` and never this, `render.reading_words()` is the ONE reader, and NOTHING about the rank,
# the loud cut, the convention label or `analogs.crossings` can move because of an entry here.
#
# THE TABLE IS COMPLETE AND THE LINT SAYS SO. There are exactly 39 distinct (table, metric) pairs across
# the whole 47-ref board map; `lint._check_reading_words` fails closed when any one of them has no entry,
# when an entry is not register-clean on all four detectors, and when an entry carries a digit or an
# underscore (a storage token wearing reader spacing is the very defect this table replaces). A metric
# with no entry renders NO clause at all -- never a slug, never a guess.
#
# `<table>.*` IS A CARD-WIDE DEFAULT and exists for ONE measured case: `silver_fred_fx` declares
# `brl_usd` on the map and `cascade._region_row` swaps in the resolved region's currency, so the metric
# a board actually reads is `cny_usd`, `myr_usd`, `idr_usd` or `inr_usd` -- names no static table can
# enumerate. An exact key always wins over the wildcard.
# THE 09-23 FIX ROUND (lane T, CONTRACT C1/C10): these words are now the served row's NAME -- the board
# names a row by its SERIES, never by the driver routed to it -- so the entries were re-read against
# their own cards and corrected where the old words named something the series is not:
#   gold_weather_z.drought_z        the card's own desc: "longest consecutive dry-day run in the month, z vs
#                                   prior-year same months" (the page printed it as "flash drought")
#   silver_esr.weekly_exports_1000mt the card's own desc: "actual shipments in the week" -- "export sales"
#                                   was false, and the served rewrite had to correct it on the page
#   silver_psd.beginning_stocks_mt  total carry-in, every holder (the page printed it as "reserve stocks")
# silver_psd.su_ratio KEEPS its name here: OWNER DECISION 4's basis rides the CARD (tables.yaml
# `basis_words` + `display_scale`/`display_unit`, CONTRACT C10), which the row identity prints beside
# the name -- so a writer's "stocks-to-use" still joins the row it names.
# Each is register-clean on the four detectors and carries no digit or underscore (clause 13).
reading_words:
  gold_board_crush.crush_margin_usd_bu:                  "the board crush margin"
  gold_futures_spreads.spread_value:                     "the spread between two delivery months"
  gold_weather_z.drought_z:                              "the longest dry-day run in the month, as a z-score"
  gold_weather_z.frost_event_flag:                       "frost events"
  gold_weather_z.gdd_z:                                  "the growing-degree-day anomaly"
  gold_weather_z.heat_stress_z:                          "the heat-stress anomaly"
