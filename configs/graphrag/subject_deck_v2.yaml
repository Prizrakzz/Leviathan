# THE SUBJECT RESOLVER CALIBRATION DECK, v2 -- v1 VERBATIM PLUS THE DECOY SUB-CLASS THE BLOCK'S
# FATAL BAR NAMED
#
# Design: docs/private/SUBJECT_RESOLVER_SITTING_2026-09-09.md D9. v1: configs/graphrag/subject_deck_v1.yaml.
#
# WHY THERE IS A v2 AT ALL, AND WHY IT IS NOT AN EDIT. D9's rule for a frozen instrument is that it is
# never edited: a deck whose rows move between two runs cannot compare them. So v1's one hundred and
# four rows are carried here BYTE FOR BYTE -- same ids, same classes, same phrases, same expected ids,
# same order -- and this file adds a new DECOY SUB-CLASS after them and changes nothing else. Every
# figure v1 measured is therefore still measurable on this deck, row for row, beside the new rows.
#
# WHAT THE NEW ROWS ARE FOR. Phase B's billed layer 2 STOPPED on the FATAL decoy bar and named the
# mechanism exactly: the planner picked `calendar_spread` on a MARKET-STRUCTURE ask (3 of 3 draws) and
# `ending_stocks_su_ratio` on a HOW-TO-READ ask (2 of 3). The frozen block said a market, a commodity
# and a table are never subjects; what it had not closed is that the 405-id enum CARRIES ids spelled
# like the market structure and like the table, so "names no cause at all" was satisfiable by the id.
# The block's v2 closes both in its own register. TWO ROWS ARE NOT A MEASUREMENT OF A CLOSURE, so this
# deck adds FOURTEEN more of exactly those two shapes -- eight asks about how a market's own price,
# spread, curve, basis, roll or front month BEHAVES, and six about how to READ or COMPUTE a table, a
# ratio or a figure, or about the tool itself. They are written in a desk analyst's words, several of
# them name a concept the enum carries an id for (basis, crush margin, calendar spread, a stocks-to-use
# ratio), and every one of them expects the EMPTY ARRAY. That is the point: a decoy that no id shadows
# tests nothing.
#
# NO HELD-OUT PHRASE IS IN THIS FILE. The held-out deck lives outside the repo, was authored blind to
# both versions of the block, and its layer 2 has never been run -- it is the one-shot that grades the
# v2 block. The author of these fourteen rows has not read it.
#
# freeze:
#   date: 2026-09-10
#   wave: STATE ENGINE -- SUBJECT RESOLVER, phase B follow-up (the block's v2)
#   supersedes: subject_deck_v1.yaml -- rows 1-104 are that file's rows verbatim
#   added: dc15-dc28, one new decoy sub-class (market structure; how-to / methodology / the tool)
#   scored_by: |
#     LAYER 1 -- state.subject.resolve(phrase, graph=CausalGraph.load()) -> SubjectHints, unchanged
#     from v1: a row passes when any expected id, OR any member of that id's subject GROUP
#     (state.subject.groups), appears in the union of hints.exact + hints.alias + the top-5
#     hints.candidates. LAYER 2 -- dispatch.plan_turn at the seat below, 3 draws, a row passes at
#     >= 2 of 3, scored by scripts/graphrag/subject_deck_run.py:score_layer2 under the ALTERNATIVES
#     reading: a row's expect list names, for each cause the ask carries, the ids that would each be a
#     right answer for it, and the picks must reach EXACTLY the row's concept count among the expected
#     groups (near_duplicate 1, multi 2). v1's runs were scored under the CONJUNCTION reading, which
#     asked one pick to carry two group keys at once; both columns are printed on every run.
#   seat: claude-sonnet-4-6, temperature 0, max_contracts 2 (layer 2). Layer 1 has NO sampling seat --
#     bge-m3 at fixed weights is deterministic, so one draw per row is the whole run.
#   vocabulary_hash: 99dc11409fe9
#   artifact: configs/graphrag/subject_vocab.npz -- 4,000 rows x 1,024, bge-m3, built 2026-09-09 in
#     1,814 s by scripts/graphrag/build_subject_vocab.py
#   planner_block_sha256: 37900160d21a25445322b01b1420641f9e40398ce3fe6872e66fc522228843bb
#     dispatch._subject_block, the v2 text, pinned at state.subject.SUBJECT_BLOCK_SHA256 and graded by
#     config_check.check_subject_resolver. v1 of that block was
#     39188d42d075f73db9c76a29bed95a53e8dc2442b06bd26e61f5d261a66a2489 and it is the text the banked
#     v1 layer-2 figures were measured against. A deck run whose block sha is not the line above is
#     measuring a different prompt and its decoy figures do not carry across.
#   bars:
#     exact: 100% in hints.exact
#     alias: 100% in hints.exact + hints.alias
#     synonym: >= 90% of rows carry an expected id or its group in the top-5 (layer 1); >= 90% of
#       rows passed at >= 2 of 3 draws (layer 2)
#     misspelling: >= 85% on both layers
#     description: >= 75% (layer 1), >= 70% (layer 2)
#     acronym: 100% (these ids are reachable ONLY through their prose)
#     near_duplicate: layer 1 -- the expected GROUP appears in the top-5. Layer 2 -- 100%: the pick's
#       group equals ANY expected id's group, and exactly one of them. The expect list is a list of
#       ALTERNATIVES for ONE cause, so a pick cannot be asked to carry two of its group keys at once.
#     multi: layer 1 -- the groups present in the hints. Layer 2 -- 100%: every expected CONCEPT
#       covered by some pick, a concept being the set of alternative ids the row lists for that cause.
#     decoy: layer 1 -- ZERO candidates at or above AMBIG_FLOOR. Layer 2 -- ZERO picks on ANY draw
#       across ALL TWENTY-EIGHT decoy rows. Both are FATAL and neither is a rate: the estate's cost of
#       a false subject is a board anchored on a question that named no driver.
#   calibration:
#     CAND_FLOOR: 0.52
#     AMBIG_FLOOR: 0.78
#     TOP_K: 5
#     UNMOVED FROM v1, AND THE HINT FLOOR WAS CONSIDERED AND REFUSED. Both v1 decoy picks came from
#     candidates scoring 0.55-0.56, so a HINT_FLOOR between CAND_FLOOR and AMBIG_FLOOR would have
#     removed dc08's candidate -- and recomputing the banked per-row scores of BOTH decks at 0.58 /
#     0.60 / 0.62 costs 2 / 5 / 9 true calibration rows and 14 / 20 / 25 true held-out rows. The rule
#     was "take it only if it costs zero true rows", so it is NOT taken; and it would not have reached
#     dc09 at all, whose five candidate ids came from the ALIAS tier, which no candidate floor fences.
#     The full table is banked on state.subject.CALIBRATION_NOTE.
#
# ---------------------------------------------------------------------------------------------------
# THE NEW SUB-CLASS, MEASURED AT LAYER 1 BEFORE ANYTHING WAS BILLED (2026-09-10, free, artifact ok,
# instrument LIVE on 118 of 118 rows)
# ---------------------------------------------------------------------------------------------------
#   The 104 carried rows reproduce v1 to the row on every class (exact 10/10, alias 10/10, synonym
#   10/14, misspelling 13/14, description 14/14, acronym 10/10), which is what carrying them verbatim
#   is for. Over all TWENTY-EIGHT decoys: 17 put a candidate above CAND_FLOOR in front of the planner
#   (7 of those are v1's), and ONE carries at AMBIG_FLOOR -- so this deck's L1 DECOY CARRY bar STOPS.
#   IT IS A FINDING AND IT IS NOT TUNED AWAY. The row is dc23, a methodology ask that names a tracked
#   quantity by its own reader form: T0 EXACT-matches `crush_margin` and the family ranks 0.7962 /
#   0.7803 / 0.7567 / 0.7352 / 0.7107, two of them above AMBIG_FLOOR 0.78. v1's decoy class was "asks
#   that name NO driver" and 0.78 was calibrated on exactly that population; this row names one out
#   loud and asks how it is COMPUTED, which is the sub-class's whole point at layer 2. What it exposes
#   is a seam-level disagreement, docketed on state.subject.CALIBRATION_NOTE and fixed nowhere here:
#     a. the v2 block tells the planner to name NO subject on a how-to-compute ask, and
#        seam._write_subject's carry fires on `amb and not picked` -- so a planner that OBEYS is
#        followed by a row asking the reader which driver they meant, and on an anchorless board by a
#        `subject_ambiguous` decline. The closure made at the pick is undone one layer down.
#     b. the two ids that row would name are ONE driver: `crush_margin` and `crush_margin_expansion`
#        are both `ref:crush_margin_z`. `ambiguous()` is not group-deduped, so the render's sentence
#        ("either of two drivers this estate tracks") is untrue here and the decline gate
#        `len(amb) >= 2` counts SPELLINGS rather than drivers.
#   THE BAR THE BLOCK'S v2 IS GRADED ON IS THE LAYER-2 ONE -- zero picks on any draw across all 28
#   decoy rows -- and it is independent of this carry. dc23 is kept because a decoy no id shadows
#   tests nothing, and because deleting a row that fails is how an instrument stops measuring.
#
# ---------------------------------------------------------------------------------------------------
# THE ROWS BELOW, THROUGH dc14, ARE subject_deck_v1.yaml's ONE HUNDRED AND FOUR ROWS VERBATIM.
# v1's own header -- the layer-1 result table, the held-out layer-1 table, the like-for-like baseline
# and the curation docket -- is not repeated here; it is in that file and it still stands.
# ---------------------------------------------------------------------------------------------------
version: 2
deterministic: true
rows:

