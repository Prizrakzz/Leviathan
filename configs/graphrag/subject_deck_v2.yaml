# ---------------------------------------------------------------------------------------------------
# DECOY, THE v2 SUB-CLASS -- MARKET STRUCTURE. How a market's OWN price behaves: the spread, the curve,
# the basis, the roll, the front month, open interest, implied vol, the cash-versus-board relationship.
# These are the asks the enum SHADOWS: it carries basis, calendar_spread, wheat_corn_spread,
# soybean_crush_margin and a dozen more ids spelled like the structure itself. The correct answer is
# the EMPTY ARRAY on every one, and the block's v2 says so in its own register.
