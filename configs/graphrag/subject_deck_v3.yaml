# WHY THERE IS A v3 AT ALL, AND WHY IT IS NOT AN EDIT. D9's rule for a frozen instrument is that it is
# never edited: a deck whose rows move between two runs cannot compare them. v2 therefore stays exactly
# as it is -- it is the instrument phase D was measured on, and every phase-D figure is still readable
# against it row for row. This file carries v2's one hundred and eighteen rows in v2's own order, and
# ONE of them says something different: dc18.
#
# WHAT THE OWNER RULED (2026-09-11). Phase D's billed layer 2 left two decoy rows firing out of
# twenty-eight, and they were two different kinds of thing:
#   dc18 -- 'open interest ...' -> cot_positioning + managed_money_positioning on 3 of 3 draws. NOT a
#     defect. Positioning is a subject when a desk asks about it (D18, and the owner's own scenario);
#     the estate's own curation says so out loud -- `open interest` is a term of the `cftc_positioning`
#     slice in configs/graphrag/driver_slices.yaml, which is exactly why the free ALIAS tier fires on
#     this phrase. The row was mis-classed as a decoy. It is re-labelled here as what it always was: an
#     ALIAS row, whose expected ids are the positioning group.
#   dc22 -- 'a spread ... ' -> wheat_corn_spread on 2 of 3 draws. A real defect, and one an enum fence
#     cannot reach: the fenced id (`calendar_spread`) was replaced by an UNFENCED and entirely
#     legitimate cross-market instrument. An enum fence removes an ID, not an ASK. The closure is
#     therefore made at the ask, in the frozen block's v3 (one bullet: a spread, a curve or a basis
#     named without both of its markets names no subject). dc22 STAYS A DECOY and it is the row that
#     grades that bullet.
#
# SO THE DECOY CLASS IS TWENTY-SEVEN ROWS ON THIS DECK, NOT TWENTY-EIGHT, and the non-decoy population
# is ninety-one. Both counts are stated here because the FATAL bar is a count and not a rate.
#
# NO HELD-OUT PHRASE IS IN THIS FILE. The held-out deck lives outside the repo, was authored blind to
# all three versions of the block, and its layer 2 has still never been run -- it is the one-shot that
# grades the v3 block, and the pre-registered gate for spending it is a CLEAN layer-2 decoy bar on this
# deck. The author of this file has not read it.
#
# WHAT IS DURABLE WHERE -- THREE HOMES, AND THEY DO NOT OVERLAP (ruled 2026-09-11, and it is the
# closure of the one open question the phrase-free fence left). (1) THE TRACKED BANK,
# `data/subject_resolver/<date>/`: the immutable per-run record and its dated summary index, PHRASE-
# FREE AND ID-FREE by law -- class counts, digests and verdicts, with every `*_ids` list, `unscored`
# and `group_detail` dropped and the counts kept (`unscored_n`). It is the certificate, it is what
# gets committed, and it is all that gets committed. (2) THE SCRATCHPAD, session-temp: the full
# artifact, every draw and every per-row pick, keyed by ROW ID -- which is why it is not in the tree
# and why it does not survive the session. (3) THE DURABLE UNTRACKED HOME,
# `docs/private/subject_heldout/` (gitignored): the runner's `--full-artifact-dir` copies that same
# full artifact there, and the HELD-OUT DECK ITSELF lives there. So the one-shot's per-row detail
# outlives the session and no held-out row id ever enters the repository. The runner REFUSES a
# `--full-artifact-dir` inside this repo that `git check-ignore` does not report as ignored, before it
# reads a deck or spends a cent.
#   AND THE ARTIFACT CARRIES NO ASK -- measured, and worth saying because "the full artifact" does not
#   sound like it: `layer1_rows` and `layer2_rows` carry `id`, `klass`, `expect`, the hint counts and
#   every draw's picks, and neither carries `phrase`. The ROW ID is therefore what the tracked bank
#   drops and what the untracked home keeps, and a durable copy is complete only BESIDE THE DECK that
#   keys it. That is the reason the deck and the copies share one directory rather than two.
#
