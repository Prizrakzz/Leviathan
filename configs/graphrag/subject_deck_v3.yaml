#
#   THE PROVENANCE INPUTS ARE INDEPENDENT and none stands in for another. The pinned block is
#   SUBSTITUTION-FREE -- MEASURED: it renders identically for a one-id vocabulary and for the whole
#   enum -- so its sha names WHICH PROMPT and carries nothing about what may be PICKED. What may be
#   picked is `live_ids` of the graph, which is `all_ids` of the GRAPH MINUS the own-structure fence
#   (`state.subject.OWN_STRUCTURE_IDS`): the graph hash names the first half and the fence is RECORDED
#   on every run as `own_structure_fence` beside `live_ids_count`, so a curation change (both counts
#   move) and a fence change (only the enum does) are told apart off the bank. And the asks are the
#   DECK's.
#
#   WHAT CHECKS (10)-(12) ACTUALLY BITE ON, said plainly because it reads like a tautology and is not:
#   on the run that writes the record they are SELF-COMPARISONS -- the block sha and the graph hash are
#   read from the same process a moment before the comparison -- and they exist for
#   every LATER reading of that record: a bank re-graded tomorrow, a `--rescore`, or a document
#   produced by something other than this runner, which is the population whoever spends the one-shot
#   actually reads from. THE LIVE RUN'S OWN GUARANTEE ON (10) IS MADE BY A REFUSAL AND NOT BY THE
#   CHECK: the run renders the block, hashes it, and STOPS with exit 2 -- nothing billed, nothing
#   banked -- when the digest is not the pin, so the field the check later reads is a measurement that
#   was already fenced. Check (2) is the same idea one level out: the runner can only write a record
#   whose name is its stamp, so the check is there for the copy somebody makes afterwards.
#
#   AND THE NAMED PATH IS THE PER-RUN RECORD. Nothing counted CALIBRATION ATTEMPTS until 2026-09-11:
#   the dated `<deck>_summary.json` was a FIXED path that MERGED, so a second calibration replaced the
#   first outright and one free `--layer 1` re-run left an earlier layer 2 and an earlier OPEN gate
#   sitting under a fresh block sha and a fresh graph hash (MEASURED on a doctored bank, free --
#   round-3 adversarial verification). THAT FINDING IS CLOSED, and this is the shape that closed it:
#   every layer-2 run writes ONE immutable record at the path named in check (1), carrying provenance
#   WITH the measurement and the gate computed over that same document; the summary keeps only an
#   append-only POINTER list `layer2_runs` plus the latest verdict copied for a reader, so THE ATTEMPT
#   COUNT IS THE LENGTH OF THAT LIST; and a record path that already exists is REFUSED rather than
#   overwritten. Whoever spends the one-shot reads the gate off THE RECORD'S PATH, by name -- never
#   off the summary (the gate refuses it) and never off "a run that opened".
#
# ---------------------------------------------------------------------------------------------------
# WHAT TO READ FIRST WHEN LAYER 2 IS BILLED -- THE NEW BULLET'S BLAST RADIUS, CENSUSED NOT GUESSED
# ---------------------------------------------------------------------------------------------------
# THE CENSUS BELOW IS THE PRE-REGISTRATION, LEFT EXACTLY AS IT WAS WRITTEN BEFORE THE SPEND. IT HAS
# SINCE BEEN MEASURED, AND THE RESULT IS EMPTY: all SIX non-decoy rows named here PASSED on all three
# draws -- ex06, al05, ac01, mu04, de12 and al08 -- and the five OTHER spread-word decoys (dc08, dc15,
# dc16, dc17, dc23) read "-" on every draw. NOTHING WAS SUPPRESSED, so the bullet has no price to
# weigh; it also did not move dc22, which is the finding in the layer-2 block above. A reader who
# wants the outcome should read this census for WHAT WAS ASKED OF THE RUN and that block for WHAT THE
# RUN ANSWERED. The text from here down is unamended.
#
# The v3 bullet (a spread, a curve or a basis named without both of its markets names no subject) was
# written for dc22 and it is graded on dc22. But a sentence added to a prompt is read on EVERY row,
# and LAYER 1 NEVER SEES THE BLOCK AT ALL -- so the free run banked above cannot measure this in
# either direction, for good or for harm. The billed layer 2 is its only measurement.
#
# THE CENSUS. Eleven of this deck's 118 ASKS name one of `spread | basis | curve | crush | calendar |
# contango | backwardation | arb | premium | discount | differential`. SIX ARE DECOYS (dc08, dc15,
# dc16, dc17, dc22, dc23) and FIVE ARE NOT: ex06, al05, al08, ac01, mu04. A sixth non-decoy row, de12,
# names none of those words and is the structure in PROSE. All six non-decoy rows are counted in the
# gate's ninety-one, so a suppression of any one of them fails the gate and correctly withholds the
# one-shot -- but these are the rows to read first, in this order, and a MISS on one of them is the
# bullet's price to be weighed against dc22 and not a defect of the deck:
#
#   ex06  exact        'freight rates and the soybean basis'
#         READ THIS ONE FIRST. It names a BASIS with one market -- the bullet's own shape -- while its
#         subject, `freight_rates`, is named outright beside it. The bullet has to suppress the BASIS
#         as a subject without taking the turn with it. Its class bar is 100% and phase D's block-v2
#         run passed the exact class 10 of 10.
#   al05  alias        'how much does ocean freight matter for the soybean basis'
#         The same shape one tier down, and the same 100% class bar (phase D: alias 10 of 10).
#   ac01  acronym      'the bacterial disease insects spread through Florida citrus groves'
#         `spread` AS A VERB. This is the false positive a KEYWORD fence would have made, and it is
#         the row that proves the closure was made in prose at the ask rather than on a word. The
#         acronym class is reachable ONLY through its prose and its bar is 100% (phase D: 10 of 10).
#   mu04  multi        'freight and crude both moving against the vegoil arb'
#         Two concepts, both named outright; the structure is context and not subject (phase D: the
#         multi class 8 of 8).
#   de12  description  'what a processor earns turning beans into oil and meal'
#         Names no spread word at all and IS the crush in prose -- the nearest SEMANTIC neighbour
#         where the four above are the nearest lexical ones (phase D: description 14 of 14).
#
#   al08  alias        'the EU deforestation regulation and the cocoa differential'
#         A word the bullet does not name, on a row whose subject is a regulation; listed so the
#         census is whole rather than convenient.
#
# ---------------------------------------------------------------------------------------------------
# THE ROWS BELOW, THROUGH dc14, ARE subject_deck_v1.yaml's ONE HUNDRED AND FOUR ROWS VERBATIM, AND THE
# ROWS AFTER THEM ARE subject_deck_v2.yaml's FOURTEEN VERBATIM EXCEPT dc18. Neither predecessor's own
# header -- v1's layer-1 result table, the held-out layer-1 table, the like-for-like baseline and the
# curation docket; v2's new-sub-class layer-1 measurement -- is repeated here; both still stand.
# ---------------------------------------------------------------------------------------------------
