# ---------------------------------------------------------------------------------------------------
# DECOY, THE v2 SUB-CLASS -- MARKET STRUCTURE. How a market's OWN price behaves: the spread, the curve,
# the basis, the roll, the front month, implied vol, the cash-versus-board relationship. These are the
# asks the enum SHADOWS: it carries basis, calendar_spread, wheat_corn_spread, soybean_crush_margin and
# a dozen more ids spelled like the structure itself. The correct answer is the EMPTY ARRAY on every
# one of the SEVEN that remain, and the block says so in its own register.
#
# dc18 SITS IN THIS BLOCK AND IS NO LONGER ONE OF THEM. It is kept in position -- a frozen instrument
# does not reorder its rows -- but its class is `alias` and its expected ids are the positioning group.
# OPEN INTEREST IS NOT MARKET STRUCTURE IN THIS ESTATE'S OWN CURATION: it is a term of the
# `cftc_positioning` slice, positioning is subject-eligible by D18 and by the owner's ruling of
# 2026-09-11, and the free ALIAS tier fires on the phrase for exactly that reason. The sentence above
# is true of the other seven rows of this sub-class and it is NOT true of dc18, which is why it is
# said here rather than left to a reader to notice.
# ---------------------------------------------------------------------------------------------------
