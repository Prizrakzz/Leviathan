  # ---------------------------------------------------------------------------------------------
  # (e) DISPERSION / FUNDAMENTAL RELATIVE VALUE across FOUR related contracts -- and the deck's richest
  # declared-darkness surface.
  #
  # DOCTRINE FENCE (reroute v2, REROUTE_V2_RV_PLAN.md:1-14). This is fundamental relative value, NOT a
  # trading system: no long/short, no hedge ratio, no recommended spread, no basis, no cross-commodity
  # tonnage delta. Price DIRECTION narration is allowed; a price NUMBER may appear only as a verbatim
