  # WHY A DOSSIER AND NOT A TURN. T1: corn, srw_wheat, soybeans and cotton are four distinct evidence
  # nodes against a 3-seed ceiling. T3: the deliverable is whether the four analog picks AGREE -- a
  # comparison that cannot be formed until each commodity's analog set is separately established, and
  # the reason a single wide turn cannot serve it even if it retrieves all four populations. T2: each
  # commodity's "does the current setup match" leg needs its own balance-sheet read plus the regime
  # series, past four before the third commodity.
  #
  # NEIGHBOURS (disclosed): dv_episode_lanina_arg (width deck) is ONE commodity, ONE regime, ONE
  # country; positioning_corn_analogue compares today's COT with a NAMED year; enso_1997_analog is a
