  # ---------------------------------------------------------------------------------------------
  # (c) CROSS-ORIGIN POLICY INTERFERENCE -- the Russia-tax lesson generalised across commodities.
  #
  # THE LESSON THIS ROW CARRIES FORWARD. The width deck proved that russia_export_tax_quota (363 props)
  # is routed by exactly ONE dag id, `Russia_export_tax`, which exists in exactly ONE contract,
  # french_wheat_matif -- structurally unreachable while only one evidence node is seeded. This row is
  # the same trap FOUR TIMES OVER, and that is the whole design: argentina_export_policy (580 props) is
  # routed only by Argentina_export_registration / Argentina_export_tax / soy_dollar, which live only
  # in the soy contracts; indonesia_b40_palm (86 props) is routed only by DMO, which lives only in
  # malaysian_crude_palm_oil_cme and palm_olein_dce; msp (1220 props) rides India_MSP (cotton) and MSP
  # (rice); Russia's population needs the french_wheat seed. Answering the question the desk actually
  # asked therefore requires FIVE distinct evidence nodes (rice, palm_oil, soybeans, french_wheat,
  # cotton) against a 3-seed ceiling -- and a dossier gets one seed per sub-query for free.
  #
  # WHY A DOSSIER AND NOT A TURN. T1 as above. T3: the deliverable is which interventions FEED EACH
  # OTHER and in what SEQUENCE -- a cross-leg reconciliation that does not exist until each origin's
  # dated instruments are separately in hand. T4: global_rice_export_policy (292 props) is an ORPHAN
  # slice with no dag id, so India's rice-specific policy population is not DAG-routable and must come
  # through the export_ban aliases (India_export_ban, minimum_export_price, export_tax) and the rice
  # node; Vietnam_export_tax_policy and buffer_stock_release are unbacked.
  #
  # LOCAL MIRROR EVIDENCE (rice.jsonl, 216 rows): "India implemented an export ban of non-basmati rice
  # in 2023" [2023-01-01]; "India imposed minimum export price restrictions on basmati rice as of
  # August 25, 2023" [2023-11-08]; "India imposed a 20 percent export duty on parboiled non-basmati
  # rice (HS 1006.30.10) on August 25, 2023" [2023-11-08]; six MSP procurement rows. The dated
  # instruments this row asks for demonstrably exist for at least the India leg.
  #
  # NEIGHBOURS (disclosed): dv_xorigin_wheat_policy (width deck) ranks WHEAT exporters by interference
  # odds -- one commodity, no interaction leg; ab_cf_india_rice is a single counterfactual;
  # j30_multi_rice_india is India's rice stance alone; sy_enum_11 / sy_ver_09 are Indian sugar policy;
  # sy_cmp_09 contrasts two governments on ONE commodity. No row asks which simultaneous interventions
  # across DIFFERENT crops feed each other.
  - id: dr_policy_interference_multiorigin
    contract: rough_rice_cbot
    category: dr_policy_interference
    asof: '2026-08-07'
    turn_class: T1_seeds + T3_reconcile + T4_dark
    turn_floor: ">=5 distinct evidence nodes, one per origin population, against a 3-seed ceiling"
    angles_expected:
      - the Indian leg on rice (ban, minimum export price, export duty, procurement and support price)
      - the Indonesian leg on palm (domestic obligation, levy, export restriction)
      - the Argentine leg on the soy complex (export tax, export registration)
      - the Russian leg on wheat (export tax, quota)
      - the interaction mechanism -- which of these instruments has historically triggered or amplified another
      - the dated sequence in which past clusters of interventions actually landed
      - which origin's hand has mattered most for rice specifically, and on what evidence
      - which origins' interference the record cannot date
    sources:
      - driver_slice:export_ban                  # 1272 props, 6 dag ids incl. India_export_ban / minimum_export_price / export_tax
      - driver_slice:russia_export_tax_quota     # 363 props; ONE dag id, french_wheat_matif only
      - driver_slice:argentina_export_policy     # 580 props; soy contracts only (soy_dollar rides here)
      - driver_slice:indonesia_b40_palm          # 86 props; DMO only, palm contracts only
      - driver_slice:msp                         # 1220 props; India_MSP (cotton) + MSP (rice) + China_min_purchase_price
      - driver_slice:tariff                      # 4000 props, 10 dag ids -- the importer-side response
      - driver_slice:china_reserve_auctions       # 188 props; the state-reserve lever
      - driver_slice:sanctions_payment_rails     # 217 props; the settlement leg on the Russian side
      - node:rice                                # 14606 props / 572 docs / 16 sources
      - node:palm_oil                            # 4219 props / 236 docs / 14 sources
      - node:soybeans                            # 23440 props / 704 docs / 19 sources
      - node:french_wheat                        # the second wheat seed the Russian population hangs off
      - node:cotton                              # 9366 props / 541 docs / 17 sources -- the MSP leg
    prereg: >-
      A dossier-shaped answer gives each origin its own section with DATED instruments carrying their
      own handles, then reconciles them: which instrument has historically followed which, and what
      that sequence did to rice. It names the origins whose interference it cannot date rather than
      dropping them, and it does not carry an export-registration or domestic-obligation claim from
      prior knowledge with no dated row behind it. A single turn, holding one evidence node, is
      expected to serve the India leg well, gesture at one other origin, and carry the Russian and
      Argentine legs from generic prose -- the structurally predicted failure.
    expect:
      needs_evidence: true
      drivers: [India, Indonesia, Argentina, Russia]
    question: "Half the governments in the trade seem to be leaning on their own exports at once right now -- Delhi on rice, Jakarta on palm, Buenos Aires on the soy complex, Moscow on wheat. I trade rice but I get carried by all of it. Which of these interventions actually feed each other, in what sequence has that happened before, and whose hand is the one that has historically mattered most for what rice does?"

