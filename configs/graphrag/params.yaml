# GraphRAG tunable params — PRIVATE IP (git-ignored). Phase 1 W4 seed.
# The §9.1 experiment surface: every knob is read from here, never hardcoded. Tuned via Langfuse
# experiments against the §9 gold sets; the winner is promoted. Each entry notes its watched metric.

version: "0.1.0-seed"

traversal:
  traversal_mode: both          # templated | exploratory | both (tenet 8)   [novel-path recall vs latency]
  on_template_boost: 1.10       # ranking boost for on-template paths (boost, never penalty)
  surprise_threshold: 0.55      # evidence bar an off-template chain clears to be surfaced
  cascade_max_depth: 5
  cascade_branch: 3
  cascade_beam: 12
  min_support_count: 2          # min distinct (canonical) events for a confirmed cascade hop

retrieval:
  rerank_top_k: 20
  rrf_k: 60                     # Reciprocal Rank Fusion constant
  candidate_pool: 200          # chunks fused before rerank
  stratified_quota: {shock: 2, sd_balance: 2, trade_flow: 2, substitute: 2, price_policy: 1}

confidence:
  evidence_class_weight: {fact: 1.0, reported_claim: 0.6, model_inference: 0.0}  # 0 = walled out
  grounding_threshold: 0.80

abstain_if:
  min_retrieval_conf: 0.35
  min_grounding: 0.80

entity_linking:
  candidate_k: 8               # candidate node IDs returned to the planner
  min_link_score: 0.60        # below → ask/abstain, never silently retrieve on a wrong entity

# Concept expansion: how a resolved concept (commodity_hierarchy.yaml) becomes the cascade member set.
# A complex/group ("all wheat", "the oilseed complex") MUST run a cascade per member and surface where
# members diverge — averaging the HRW-vs-SRW spread away is the failure this prevents.
concept_expansion:
  default: enumerate_divergent  # multi-node concept → per-member cascade, divergences surfaced
  single_node: benchmark        # one causal node (incl. a held contract) → one cascade
  max_members: 8                # above this → ask the user to narrow or name a benchmark (latency guard)
  policies:
    enumerate_divergent: "cascade per member node; consolidate by reporting agreement vs sign/magnitude
                          divergence across members; NEVER average members into one number"
    benchmark: "one cascade on the resolved node; list its mapped contracts as the tradeable instruments"
    aggregate: "explicit basket/complex-level roll-up — only when the user asks for the portfolio view"
    abstain: "unknown concept → abstain; never guess a node"

# SERVING knobs — the values the LIVE code actually reads (graphrag/params.py get()). These mirror the
# code defaults exactly at introduction (no behavior change); every future tune happens HERE, in review,
# never as a code constant (the RERANK_POOL lesson: a quality knob shipped as a constant on an assertion).
serving:
  # Provider routing (providers.py): SERVING inference only (Sonnet reasoner/planner, Haiku numbers/
  # summary); offline Opus/Batch paths are hardwired to the Anthropic API and ignore this.
  # ANTHROPIC as of the 2026-07-25 latency RCA (F8a) — this line now MATCHES reality instead of
  # contradicting it. Serving taskdef :64 sets GRAPHRAG_PROVIDER=anthropic and env beats params, so that
  # ONE env var was the only thing standing between the fleet and cross-region routing; deleting it armed
  # THREE regressions at once, none of them observable:
  #   1. `bedrock_models` below maps to `global.` inference profiles, which carry a region-LESS model ARN
  #      and may serve from ANY enabled commercial region (measured: api.anthropic.com is 2 ms from the
  #      task, ap-south-1 Mumbai 190 ms) — and Bedrock model-invocation logging is DISABLED, so there
  #      would be no post-hoc evidence of which region answered;
  #   2. the SSE slab regression — extract.py defaults the fine-grained-tool-streaming beta ON for
  #      Anthropic and OFF for Bedrock; measured with it off: a few chars, 31.4 s of silence, then all
  #      1,013 deltas back-to-back;
  #   3. no `us.`-scoped profile is provisioned (returns AccessDeniedException) and the IAM policy
  #      wildcards `arn:aws:bedrock:*::foundation-model/anthropic.claude-*`, so there is no
  #      geography-bounded rollback target to fall back to.
  # The 2026-07-04 Bedrock parity gate still stands (strips 43 vs the 60-strip Anthropic timeline-off
  # baseline — fewer = cleaner, hallucinations 40/40, 25/25 judged, zero fallback/floor events), and the
  # model MAP below is deliberately KEPT: GRAPHRAG_PROVIDER=bedrock remains the instant per-run switch in
  # either direction. This pin changes the DEFAULT only — env still wins, both ways.
  provider: anthropic
  bedrock_models:               # serving alias -> cross-region inference profile (Phase 0 probe, 2026-07-04)
    claude-sonnet-4-6: global.anthropic.claude-sonnet-4-6
    claude-haiku-4-5: global.anthropic.claude-haiku-4-5-20251001-v1:0
  walk:                         # planner.grounded_subgraph
    tau: 0.35                   # mechanism-relevance floor (seeds exempt)
    node_budget: 10
    depth: 2
    max_seeds: 2
    # D-GD-1 (2026-08-08) cascade-closure reservation SIZE -- the number of the walk's EXISTING slots
    # held for the backed ancestors of the top-ranked admitted drivers. This is the magnitude only;
    # the gate is GRAPHRAG_CLOSURE_RESERVE and it DEFAULTS OFF, so this value is inert until the
    # D-GD-3 A/B flips it (`=on` reads this number, an integer overrides it outright).
    # 3 because ancestor closure is median 2 / mean 3.58 for the 573 of 1,112 drivers that have one --
    # 3 covers the median chain whole; 26-ancestor monsters are clipped by N, not by luck.
    closure_reserve: 3
  ground:                       # planner.ground
    recency_days: 548           # probe evidence must be dated within this window before asof to fire
    probe_cap: 24
    evidence_cap: 24
    k_by_depth: [5, 3, 2]
  retrieval:                    # evidence.retrieve / pgstore.pg_retrieve / rankers
    fetch_k: 60
    rerank_pool: 60             # CE pool; 24 was tried + REVERTED (41.7% deep-rescue rate, 2026-07-03 ablation)
    k: 5
    mmr: 0.5
    fairness: 0.30
    # ── managed-rerank coalescer (rankers._RerankCoalescer) ────────────────────────────────────────────
    # Resolution order is ENV > params > code default for all three (rankers._coalesce_window /
    # _coalesce_quiescence / _rerank_max_attempts), so the ECS taskdef still wins. These are the values the
    # Phase-2 latency RCA measured to 1.00 Bedrock rerank calls/turn in-VPC; the serving taskdef env MUST be
    # set to match (it carries the pre-RCA 1.5 / 0.3) or these params are inert on serving.
    coalesce_window: 4.0        # s — leader's hard cap waiting for the hinted batch
    coalesce_quiescence: 2.5    # s — safety net for an UNMEETABLE hint, not the normal closer. 0.3 (serving)
                                # and 0.8 (old code default) both fired as the PRIMARY closer: real walk
                                # inter-arrival gaps are p50 0.142 s but p90 0.760 s, 27.8% > 0.30 s (n=212).
    rerank_max_attempts: 2      # F1b: botocore TOTAL attempts. The 3-req/min Cohere Rerank quota is
                                # NON-adjustable and user-confirmed permanent, so a throttle is steady state;
                                # an 8-attempt adaptive ladder burned tens of seconds HOLDING the quota
                                # before the bge fallback was even reached. Fail fast — affordable now that
                                # serving is 4 vCPU (bge was measured at 10.3 s/60-doc pool on 1 vCPU).
  timeline:                     # event timeline (layer 2): prop-store episodes per slice
    # DEFAULT OFF (GRAPHRAG_TIMELINE=on to enable): measured net-negative as first built (counts w/o
    # receipts invited confabulation); the receipted+evidence-gated path is what =on now exercises.
    gap_days: 90                # consecutive props further apart than this start a new episode
    max_per_node: 4             # episodes shown per grounded node (biggest first)
    min_props: 2                # R3 / D-EI-8 CORROBORATION FLOOR: minimum DISTINCT PROP DATES (= distinct
                                # dated documents, not props) an episode needs to be RENDERED. Applied at
                                # READ time in timeline.episodes_for, after the PIT recount and before
                                # max_per_node, so the artifact stays complete and this can move without a
                                # rebuild. Measured on the live artifact: 2,070 of 3,735 episodes are
                                # single-date; N>=2 costs 71 of 484 rendered lines (-14.7%), darkens 8 of
                                # 125 slices, and is as-of invariant across all three deck cohorts. N>=3
                                # was REJECTED on a collision (it darkens coffee_rust_crop, cancelling the
                                # R1 rust repair); N>=5 takes 37.8% of rendered lines. 0 or 1 = disabled.
                                # SUPPRESSION IS NEVER SILENT: a floored node still emits a stated line
                                # (answer._l2_blocks + timeline.floored_line/floor_suffix) -- without that
                                # emitter the floor is absence HIDDEN and re-opens incident I-2.
                                # Stamped into the artifact (timeline.build_stamp) and asserted by
                                # check_artifact, so editing this without a rebuild goes RED rather than
                                # silently re-cutting what the reader sees.
  scaffold:                     # D-RC-11 noise caps on the synthesized '## Episodes' section. ACTIVE
    # ONLY when GRAPHRAG_EPISODE_RELEVANCE is on (flag off -> caps never run, byte-identical turn).
    # Basis: the 2026-08-05 desk probe -- synthesized sections ran 23-35 bullets, ~68% verbatim CASE-1
    # absence lines. Receipted rows are kept FIRST (reader value), absence rows fill to their own cap,
    # final order stays chronological; every dropped row is stamped (episodes_scaffolded.n_capped),
    # never silent -- the same bounded-enumeration class as timeline.max_per_node above.
    max_bullets: 12             # total bullets in a synthesized section
    max_absence: 6              # of which CASE-1 'no citable item' absence lines
  cascade:                      # P9-B quantified-cascade loop (GRAPHRAG_CASCADE_QUANT)
    cap: 12                     # max windowed lookups per answer (own budget, separate from silver.cap)
  silver:                       # silverleg (WS-4) — the observed-value leg
    cap: 8                      # max silver lookups per answer
    thresholds:                 # per-ref anomaly rule: z = |z-score| floor; abs = absolute band
      psd_ending_stock_su_ratio: {kind: z, window_years: 10, z: 1.0}
      fred_fx_macro: {kind: z, window_days: 504, z: 1.5}
      oni_climate: {kind: abs, band: 0.5}
      pink_sheet_input_costs: {kind: z, window_years: 5, z: 1.5}
      psd_sd_level: {kind: z, window_years: 10, z: 1.0}   # export/import/consumption/stock vintage levels
  stats:                        # G4c(i): the numbers-agent compute_stat belt (NOT silverleg's driver
    # verdicts above -- silverleg never reads this key, and `_thr` never reaches it). It lives here, one
    # block down from silverleg's PSD window_years=10 and FX window_days=504, because "how long a window
    # is a z-score taken over" is one question with one home, and a futures z whose window was whatever
    # the model happened to type is the exact auditability gap section 1d names.
    futures_z:
      # 250 SESSIONS, and the unit is SESSIONS because silver_futures_eod is a per-session, per-delivery-
      # month table -- a calendar-day window over it would silently vary with holidays and venue closures.
      # ~250 is one trading year (252 CME sessions less a US holiday or two), and one trading year is the
      # honest ceiling for a SINGLE delivery month: a corn Dec contract lists 2-3 years out but only
      # trades liquidly in its final ~12 months, so 504 (the FX number) would reach back into the
      # illiquid listing tail and z a liquid print against an illiquid regime -- two populations, one
      # sigma, a wrong number that looks right.
      # CEILING AND DEFAULT, NOT A REWRITE -- AND NEVER A NEW FLOOR (review FATAL, wf_6906ea5b): a
      # caller that named a SHORTER window keeps it; a caller that asked for more is narrowed TO this;
      # a caller that named NONE gets min(this, len(series)) -- because stats.zscore treats a non-None
      # window as a REQUIRED depth (it declines when history < window), so a bare 250 default would
      # have turned every shorter-than-250 handle (model-emitted limit, period-scoped ask, thin month)
      # from a computed z into a decline. The only genuine floor stays stats.MIN_ZSCORE_N (8). Never
      # silent either way: the effective window is stamped on the injected [N] row and rendered on
      # the citation.
      window_sessions: 250

gates:                          # §9 targets (measured, not assumed)
  extraction_relation_f1: 0.80
  entity_linking_acc: 0.90
  novel_path_recall: 0.70
  citation_faithfulness: 1.00
  grounding: 0.80
  abstention_correctness: 0.95

# Stage D — corpus prioritization (size the Sonnet extraction slice to budget). Read-only analysis,
# no LLM spend. priority = density × liquidity × recency; est_cost = est_props × usd_per_prop.
prioritize:
  # Exp-1 (billed): warm sync+cache = $0.0079/call (prefix 4,187 tok read 0.1x; output ~379 tok = 72%).
  # Caching beats Batch x1.2 but output is the floor (uncached). WS-B may lower this if a compact schema holds recall.
  usd_per_prop: 0.0079          # Sonnet 4.6, sync + 5-min prompt-cache, warm (Exp-1); was 0.0075 est.
  chars_per_prop: 121           # calibrated: robust 25-doc/25-source weighted alpha/props=121.5 (median 124.5, range 59-390); was 130 (~7% high). 6-doc gave 99 but was WASDE-skewed (tabular, low cpp)
  gate_keep_rate: 0.60          # relevance gate skips ~40% boilerplate/table chunks before any LLM call
  default_budget: 1500
  density_weights: {alpha: 0.4, sentence: 0.2, marker: 0.3, digit: 0.1}
  recency:                      # [min_year, weight]; first match scanning down — recent worth more
    - [2015, 1.0]
    - [2010, 0.8]
    - [2000, 0.5]
    - [0, 0.25]
  liquidity:                    # per batch_extract._commodity_of label; futures-liquidity tiers (editable)
    soybeans: 1.0
    corn_grains: 1.0
    wheat: 1.0
    soybean_oil: 1.0
    soybean_meal: 1.0
    sugar: 1.0
    coffee: 1.0
    cotton: 1.0
    palm_oil: 0.7
    cocoa: 0.7
    rice: 0.7
    rapeseed: 0.7
    orange_juice: 0.4
    multi_sd: 0.6               # WASDE/WAP — cover many liquid commodities
    macro: 0.5                  # WB CMO — cross-commodity price context
    _default: 0.5
