  # =============================================================================================
  # (11) THE OLDEST-5000 CLASS -- census (e).5, the one dark item with MEASURED harm. The tool schema
  # hides NumberQuery.limit, so the agent has no lever to window a long series deliberately.
  - id: dcw_full_record_range
    contract: corn_cbot
    category: dcw_full_history_series
    asof: '2026-08-07'
    unlock: "NumberQuery.limit into the tool schema with a newest-first note (D-CW-1c)"
    census_ref: "census tool-schema row 'limit (measured harm: oldest-5000)'; (e).5"
    sources:
      - silver:silver_futures_eod         # settle per delivery month; corn_cbot ~49,255 rows (agent.py:2417)
      - code:numbers/query.py:43          # limit: int = 5000, absent from the tool schema
      - code:numbers/agent.py:1383-1423   # the NumberQuery tool input schema (11 of 12 fields)
      - code:numbers/agent.py:2413-2443   # series_truncated -- the stamp that names this defect
    today: >-
      An unwindowed agg='series' read compiles ORDER BY <total order> LIMIT 5000 ASCENDING, with no
      DESC, so the OLDEST 5,000 rows survive and roughly 44,000 newer ones are silently dropped --
      corn's served "record" stops around 2011-2012. The truncation is stamped, but the agent has no
      remedy available to it because `limit` is not in the tool's input schema. A renderer that then
      headlines the extremes of that window is honest-looking and wrong.
    wired: >-
      D-CW-1c exposes limit in the tool schema with an explicit newest-first note, so the agent can
      WINDOW deliberately. The answer must either window the read (period_start/period_end -- the
      standing remedy, never raising the cap, which would re-open the scan surface the S3 LIST-storm
      work closed) or state the span it actually covered; and every extreme it quotes must carry its
      trade_date, its contract_month and its settle_kind (corn_cbot is GLBX, so a true exchange
      settlement, in US cents/bushel), with the 2010-06 history floor acknowledged rather than implied
      away.
    fail: >-
      A "full record" range whose extremes all sit in 2010-2012 while being presented as the whole
      history; any range or extreme quoted with no date span stated; a bare level with no
      contract_month (every row of a multi-expiry read carries the same slug and the same date, so a
      level without its expiry is unattributable); or a raised cap in place of a window.
    question: "How wide has corn's trading range been over the full history, and when did it print the extremes?"

