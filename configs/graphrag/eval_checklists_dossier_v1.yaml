      - key: node:hrs_wheat
        width_basis: T1_seeds
        why: the spring-wheat venue's own population; the anchor seed's siblings crowd it out otherwise
        markers: [spring wheat, minneapolis, mgex, prime hard, durum]
      - key: driver_slice:russia_export_tax_quota
        width_basis: T1_seeds
        why: reachable only via the french_wheat seed -- the same structural trap the width deck proved
        markers: [export tax, export duty, floating tax, export quota, indicative price]
        context_markers: [russia, russian]
      - key: driver_slice:black_sea_corridor
        width_basis: T1_seeds
        why: the export-competition leg that separates the EU and US venues; 57 props, thin by record
        markers: [black sea, grain corridor, grain initiative, export competition]
      - key: driver_slice:polar_vortex_winterkill
        width_basis: T2_silver
        why: polar_vortex / protective_snow_cover -- present on the WINTER classes only, a real separator
        markers: [polar vortex, winterkill, snow cover, protective snow]
      - key: driver_slice:cereal_rust_complex
        width_basis: T2_silver
        why: stem_rust / stripe_rust -- the disease leg that differentiates the classes
        markers: [stem rust, stripe rust, leaf rust]
      - key: silver:silver_futures_eod
        width_basis: T2_silver
        why: >-
          per-contract board levels by delivery month, one read per venue -- four of the reads the
          attribution step needs before any balance-sheet series
        markers: [delivery month, settlement price, front month, nearby futures, board price]
      - key: silver:silver_cot
        width_basis: T2_silver
        why: >-
          per-slug positioning, one read per venue; the narrative positioning layer is one prop
          estate-wide, so this series or an honest refusal are the only two truthful options
        markers: [managed money, commitments of traders, net long, net short, open interest]
