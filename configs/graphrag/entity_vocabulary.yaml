# GraphRAG entity vocabulary — PRIVATE IP (git-ignored).
# Phase 1 W3 SEED, grounded in the W1 corpus profile (real surface forms) + the 31-commodity
# universe (leviathan.common.constants.ALL_COMMODITIES). This is a starting point for DOMAIN
# REVIEW (Phase 1 exit gate), not a finished taxonomy. Every term should occur in the corpus
# (the vocab linter checks this) and every surface form maps to exactly one (role, canonical).
#
# Structure mirrors GRAPHRAG_PLAN.md §3.2: nodes (things) | edges (typed relations) | arbitration
# | aliases (EN/PT/ES) | verb_normalization.
#
# NODE-MODEL RULE (pinned): a node is a COMMODITY (or other entity below). A metric (production,
# yield, export, price, …) + its direction (↑/↓) + as-of-date ride on the QuantitativeClaim /
# Relationship — NEVER baked into a node id. There is NO `arabica_production` node; it is the
# `arabica_coffee` node + a `production` metric on a claim/edge. Labelers & extraction must follow
# this (the gold linter enforces it: a closed-type entity id must be a canonical node here).

version: "0.4.0-seed"   # 0.4: grounded-truth harvest from the 3-doc run — geographies regions
                        # (regions.yaml), producer countries, context (non-tradeable) commodities,
                        # `produces` edge + `beneficial_weather` nodes. See GRAPHRAG_PLAN.md v0.4.

nodes:
  # underlying commodities (the 31 contracts collapse to these; contracts are aliases/instruments).
  # Includes the crush/refine products + biofuel demand sinks (ethanol/biodiesel) so the demand-side
  # cascade has real endpoints.
  commodity:
    # Wheat splits into CLASS nodes (distinct protein/spec/market, not just origin): hard red winter,
    # hard red spring, soft red winter (US) + french_wheat (EU milling). `wheat` is the parent concept
    # (expanded to its classes by commodity_hierarchy.yaml). Corn stays ONE node — its CBOT/BMF/MATIF
    # variants are pure origin, carried by country_origin + the hierarchy contract→origin map.
    [corn, wheat, hrw_wheat, hrs_wheat, srw_wheat, french_wheat, rice, white_maize, yellow_maize,
     soybeans, soybean_meal, soybean_oil, rapeseed, canola, rapeseed_oil, rapeseed_meal,
     palm_oil, palm_olein, arabica_coffee, robusta_coffee, cocoa, raw_sugar, white_sugar,
     cotton, orange_juice, ethanol, biodiesel,
     # CONTEXT commodities (tradeable:false — no contract/silver, never a cascade root, but real edge
     # endpoints: sunflower_oil substitutes_for palm_oil; barley competes_with corn in feed). They
     # have NO entry in commodity_hierarchy.contracts → flagged non-tradeable by construction.
     sunflower, sunflower_oil, barley, sorghum, fish_meal,
     # D-EC D15 Wave 1c (2026-08-19) — the thirteen MEASURED-dark context commodities. Same class as the
     # five above (no contract, no silver, never a cascade root); the roster, the tiering and the
     # per-node dark-prop counts live on commodity_hierarchy.yaml:context_commodities, which is the
     # authority. They are node ids HERE because a canonical must be a defined node before it can carry
     # aliases (config_check.lint_vocab) and because commodity_hierarchy.coverage_check resolves group
     # and complex members against this list. NODE-MODEL RULE still applies: 'cottonseed meal
     # production' is the `cottonseed` node + a production metric on a claim, never a node id.
     cottonseed, coconut, palm_kernel, peanut, ddgs, used_cooking_oil, tallow, hfcs,
     olive_oil, pulses, fresh_citrus, minor_oilseeds, minor_cereals,
     # D-EC POST-X2 GRAPH-COMPLETION WAVE (2026-08-21) -- F-A item A, THE LIVESTOCK DEMAND LAYER. Same
     # context class as the D15 thirteen (no `contracts:` entry, non-tradeable by construction, never a
     # cascade root) and declared here for the same reason: a canonical must be a defined node before it
     # can carry aliases (config_check.lint_vocab), and commodity_hierarchy.coverage_check resolves the
     # new `feed_demand_complex` members against this list. The founding measurement is the plan's own:
     # the pilot measured 50% of WASDE propositions routing to NOTHING because no cattle / poultry / hog
     # node exists anywhere in the graph. Every alias below is MEASURED on the 345,870-prop pre-X2 chunk
     # cache with the production matcher pair (ex._normalize -> harvest.build_matcher); see the alias
     # block for the counts and for the four refusals the measurement forced.
     # NODE-MODEL RULE still applies: 'cattle on feed' is the `cattle_beef` node + an inventory metric on
     # a claim, never a node id -- the herd-cycle MECHANISM stays in the driver lane
     # (`cattle_cycle_herd_size`, `cattle_on_feed`, `broiler_economics`, `hog_margins_crush`).
     # ESR CODE CORRECTION BANKED HERE so nobody re-derives it: beef is code 1701; 1702 is hogs.
     broilers_poultry, cattle_beef, hogs, dairy,
     # F-A item M, the ONE aggregate that is a PRODUCT rather than a set of our nodes: `compound_feed` is
     # manufactured mixed feed, so it is a context COMMODITY and not a `commodity_group` (a group with no
     # member set expands to nothing -- the exact `food_grains` defect D8 fixed). Measured 508 props
     # ('compound feed') + 26 ('compound feeds') + 21 ('mixed feed').
     compound_feed]
  # NOTE: canola (ICE, Canada) and rapeseed (MATIF, Europe) are the same oilseed agronomically but
  # DISTINCT contracts (`canola_ice` vs `french_rapeseed_matif` in the universe) → distinct nodes,
  # linked at extraction via substitutes_for/correlates_with, NOT collapsed by alias.
  commodity_group:
    # D-EC POST-X2 GRAPH-COMPLETION WAVE (2026-08-21) -- F-A item M, THE AGGREGATE / GROUP NODE CLASS.
    # A1's defect, verbatim: "commodity_hierarchy declares grains/oilseeds/oilseed_meals/vegetable_oils/
    # food_grains/soft_commodities/tropicals + complexes, but ev.all_nodes() returns ONLY the 24 contract
    # nodes -- no group has match_forms or a slice", so 9,599 aggregate-worded props matched no member
    # matcher. The ratified design decision (plan L430-434) is GROUP-LEVEL SLICES, not fan-out to members.
    # THE ROUTING HALF OF THAT DECISION IS commodity_hierarchy.yaml:context_commodities, not this list --
    # evidence.all_nodes() reads `contracts:` + `context_commodities:`, so a group node named only here
    # still has no slice. Five aggregates carry MEASURED mass and are routed there; the rest stay
    # EXPANSION-ONLY and the reason is written at their site in commodity_hierarchy.yaml.
    # + `coarse_grains` (measured 1,017 'coarse grain' / 1,162 'coarse grains') -- the USDA/FAO feed-cereal
    #   class noun. It is DISTINCT from the `feed_grains` COMPLEX (a ration-substitute set, expansion
    #   precedence complex > group) and from `grains` (which includes the food cereals).
    # `protein_meal` is DELIBERATELY NOT a sixth node here: F-A M names it as "oilseed_meals/protein_meal",
    # i.e. two candidate names for ONE concept, and minting both would re-create the XC-2/XC-5 spelling-split
    # class on a node this wave is trying to consolidate. It lands as a SURFACE FORM of `oilseed_meals`
    # (measured: 'protein meal' 462, 'protein meals' 94).
    [grains, food_grains, feed_grains, oilseeds, vegetable_oils, oilseed_meals,
     soft_commodities, tropicals, coarse_grains]
  country_origin:    # producers (W1 surface forms) + the structural IMPORTERS that absorb displaced
                     # supply (needed for the trade_flow + substitute stages of a cascade)
    [Brazil, Argentina, United_States, China, Colombia, Vietnam, India, Australia,
     Malaysia, Indonesia, Ukraine, Russia, Cote_dIvoire, Ghana, Thailand, Canada, EU,
     South_Africa, Mexico,
     Egypt, Turkey, Bangladesh, Pakistan, Nigeria, Philippines, Japan, South_Korea,
     Algeria, Saudi_Arabia,
     # producer countries harvested from configs/geographies/ + corpus-frequent origins
     France, Germany, Italy, Poland, Romania, Hungary, Serbia, Peru, Paraguay, Ecuador,
     Honduras, Uganda, Ethiopia, Cameroon,
     # -- B1 THE DESTINATION/IMPORTER LAYER, routing half (2026-08-21). recon item R3 -----------------
     # ELEVEN destinations that carry >= 0.5% of measured US export tonnage and were absent from this
     # list. Measured (b1_esr_rank / laneb_dest_split over silver/esr, 5 commodities, MY>=2020,
     # as_of=20260820, grand total 990,222 kt): Taiwan 2.64%, Spain 1.82%, Guatemala 1.51%,
     # Netherlands 1.03%, Dominican Republic 1.03%, Venezuela 0.92%, Costa Rica 0.85%, Panama 0.68%,
     # El Salvador 0.64%, Morocco 0.62%, Nicaragua 0.47%. Adding them takes country_origin's tonnage
     # anchor from 84.2% to ~96%. The header above already says this list carries "the structural
     # IMPORTERS that absorb displaced supply" -- these eleven are that class and were simply missing.
     # Corpus attestation, pre-X2 cache (production matcher pair): Netherlands 950, Guatemala 901,
     # Spain 897, Peru 687(already a node), Ecuador 594(already), Italy 493(already), Taiwan 430,
     # Venezuela 254, Honduras 235(already), Morocco 179, Costa Rica 62, Nicaragua 62, Panama 35,
     # El Salvador 21, Dominican Republic 3. THE DOMINICAN REPUBLIC NUMBER IS STATED, NOT HIDDEN: 3
     # props of corpus attestation against 1.03% of measured tonnage -- it is declared for the TONNAGE
     # axis (extraction typing + the destination router), not for corpus mass, and that is the whole
     # point of B1's honest framing ("destination-keyed addressing, never prop rescue").
     # CONFIG-ONLY: nothing re-chunks here; extraction types them from the next run on (D-CW-1e).
     Taiwan, Spain, Guatemala, Netherlands, Dominican_Republic, Venezuela, Costa_Rica, Panama,
     El_Salvador, Morocco, Nicaragua]
  region:            # distinct growing regions (sub-regions are their OWN nodes, not parent aliases;
                     # containment is a belongs_to_group edge, never an alias)
    [Minas_Gerais, Sul_de_Minas, Cerrado_Mineiro, Espirito_Santo, Parana, Mato_Grosso,
     Pampas, Tay_Nguyen, Central_Highlands, Free_State, Sabah, Sarawak, Sumatra, Kalimantan]
  organization:      # source bodies for attribution/reliability (harvested from legacy configs/sources)
    [USDA, USDA_FAS, USDA_NASS, USDA_ERS, USDA_WAOB, CONAB, ICO, ICCO, MPOB, MPOC, FNC, Fedecafe,
     Cecafe, ABIC, Cocobod, SAGIS, SAAFF, UNICA, CNA, ANEC, ABIOVE, World_Bank, FAO, IMF,
     ISO_Sugar, LMC_International]
  climate_driver:    # macro teleconnection drivers — the UPSTREAM cause of the proximate hazards.
                     # A quant reasons "La Niña year → Brazil drought risk"; hazards are downstream.
    # D-EC XC-2 (2026-08-20): the two ENSO values were ACCENTED here while 17 of the 33 DAGs spelled the
    # same node ASCII, so those 17 had no vocabulary entry at all and the extractor could not mint the
    # entity their DAGs depend on. Canonical is now the ASCII majority spelling; the accented forms moved
    # DOWN into `aliases:` below, where a surface form belongs.
    # RE-MEASURED 2026-08-21 for the completion wave's C-8 hygiene row, and the row CLOSES AS A NO-OP on
    # this file: the counts the ledger carries (El_Nino 2 / El_Nino-accented 3, La_Nina 2 / La_Nina-accented 2)
    # reproduce EXACTLY, but they are not a split -- ZERO accented spellings survive as a KEY or an id. The
    # two ASCII hits are the node list here and the `aliases:` key below; all seven accented hits are prose
    # in three comment lines plus the deliberate surface forms in the two alias lists. No merge is owed
    # here. The residue the C-8 row was really pointing at lives on OTHER surfaces and is NOT this lane's:
    # configs/graphrag/numbers/chain_map.yaml (1 accented La_Nina) and configs/graphrag/gold/
    # entity_linking.jsonl (1). Handed to the integrator rather than reached across a lane boundary.
    [El_Nino, La_Nina, IOD_positive, IOD_negative, ENSO_neutral]
  hazard:            # NEGATIVE weather/disease shocks (sign carried on the edge)
    [drought, frost, flood, heat_stress, excess_rain, leaf_rust, HLB, black_pod, CBD,
     witches_broom, harmattan]
  beneficial_weather:  # POSITIVE conditions (grounded-truth gap: "snow cover protected crops")
    [favorable_rainfall, adequate_moisture, protective_snow_cover, timely_rains, ideal_conditions]
  # -- COST STACK + MACRO CONTEXT (D-CW-1e, 2026-08-07 -- the DARK CAPABILITY CENSUS, item 10) ------
  # The vocab typed ethanol/biodiesel (the demand-side sinks) but had NO node for a single INPUT to
  # growing a crop, so every fertilizer / energy / freight / metals mention in the corpus extracted as
  # an unmapped entity -- while silver_pink_sheet serves 32 metrics across exactly these series and the
  # driver_slices carry 863 props of urea/DAP/potash/diesel text. These are CONTEXT entities, not
  # tradeable contracts: they have no entry in commodity_hierarchy.contracts, so they are non-tradeable
  # by construction (the sunflower_oil/barley precedent) and can never be a cascade root. The surface
  # forms below are the ones the corpus actually uses -- taken verbatim from the matching driver_slices
  # term lists (fertilizer / energy / freight_rates / logistics_chokepoint / macro_context categories),
  # never invented. CONFIG-ONLY: nothing re-chunks here; extraction types them from the next run on.
  # NODE-MODEL RULE still applies -- the PRICE of urea is a metric on a claim, never a node id.
  fertilizer:
    [urea, DAP, potash, phosphate_rock, NPK_blend]
  energy:            # the fuel/energy inputs (crude, gas, diesel) -- biofuel SINKS stay under commodity
    # D-EC POST-X2 GRAPH-COMPLETION WAVE (2026-08-21) -- gap-register row E1, "THE ENERGY FUTURES LEGS"
    # (owner catch 2026-08-20). The plan assigns the CONTEXT-NODE half to this wave ("Energy CONTEXT NODES
    # (`heating_oil`, `gasoline`) follow the D15 pattern in the completion wave") and the databento HO/RB/CL
    # symbol widening to the numbers wave. Both candidates were MEASURED on the 345,870-prop pre-X2 cache
    # with the production matcher pair, and the measurement SPLITS them:
    #   gasoline   388 props  (+ 'petrol' 43, the Commonwealth/GAIN register)   -> AUTHORED
    #   heating oil  3 props  ('rbob' 0, 'ulsd' 0, 'distillate' 3)              -> REFUSED ON MEASUREMENT
    # THE heating_oil REFUSAL, written so it is reversible rather than re-derived: three propositions in
    # 345,870 is the e1_census dead class, and the two instrument names a heating-oil node would exist to
    # catch ('RBOB', 'ULSD') fire ZERO times each -- this corpus is 28 agricultural text sources and it does
    # not carry a distillate desk. That is a CORPUS-ACQUISITION finding, not a curation one, and it does not
    # block the numbers half: a databento HO/RB param widening needs a registry card, never a text node.
    # UN-REFUSE GATE: 'heating oil' or 'ulsd' above zero on the post-X2 cache, or an energy text source.
    # `gasoline` unblocks F-A item G's `ethanol <-> RBOB/gasoline` blend-economics edge, whose stated
    # precondition was exactly "needs E1's energy nodes" (plan precondition P12). The EDGE is the DAG lane's.
    [crude_oil, natural_gas, diesel, gasoline]
  freight:           # ocean freight COST (the rate itself); the routes are chokepoints below
    [baltic_dry_index, panamax_freight]
  logistics_chokepoint:   # physical route constraints that price freight and delay flows
    [panama_canal, suez_canal]
  metal:             # macro-barometer / input metals -- NEVER a tradeable contract here (no silver, no
                     # cascade root); they exist so a macro-context mention types instead of dropping
    [copper, aluminium, iron_ore, zinc, nickel, steel]
  state_marker:      # market-signal nodes (NOT metrics; metrics live in silver/quantitative_claims)
    [flowering_stress, biennial_off_year, biennial_on_year, withheld_supply,
     crush_margin_expansion, tenderable_collapse, replanting_cycle, export_pace_lag, safrinha]
  policy_event:
    # D-EC POST-X2 GRAPH-COMPLETION WAVE (2026-08-21) -- XC-4's THIRD EUDR BREAK, the one F-A item N does
    # not cover. XC-4 records the node as "broken THREE ways (3 id spellings, none in entity_vocabulary --
    # the extractor cannot mint the entity 11 DAG instances depend on)"; F-A N covers the mis-filed slice
    # terms and the id merge, and the vocabulary row was assigned to nobody. VERIFIED before this edit:
    # `grep -ci eudr entity_vocabulary.yaml` returned 0 while eleven DAG driver instances across eight
    # boards name the entity. This row closes that break. EUDR binds 2026-12-30 (web-verified, post-delays).
    # The three DAG spellings (EUDR x8, EU_EUDR x2, eudr_deforestation x1) merge to `EUDR` in the causal
    # lane; both retired spellings are kept BELOW as surface forms on the El_Nino accented-form precedent,
    # so nothing that ever wrote them goes unrouted.
    [export_ban, export_tax, import_tariff, biodiesel_mandate, DMO, FUNCAFE, soy_dollar,
     quota, levy, port_closure, sanctions, MSP, EUDR]
  instrument:
    [arabica_robusta_spread, white_raw_premium, soyoil_palm_premium, wheat_corn_spread,
     soybean_crush_margin, board_crush, sugar_ethanol_parity]
  event: []          # OPEN set — minted at extraction, canonicalized in Phase 4 (Fix 6)

edges:               # typed/signed/dated relations — NEVER stored as nodes
  causes:            {directed: true,  sign: pm,  lag: months}
  affects_yield_of:  {directed: true,  sign: pm,  lag: months}
  produces:          {directed: true,  sign: pos}                # country_origin → commodity (origin anchor)
  teleconnects_to:   {directed: true,  sign: pm,  lag: months}   # climate_driver → hazard (ENSO/IOD)
  amplifies:         {directed: true,  sign: pos}
  dampens:           {directed: true,  sign: neg}
  substitutes_for:   {directed: true,  sign: pos, lag: months}
  competes_with:     {directed: false}
  depends_on:        {directed: true}
  crushed_into:      {directed: true}                            # oilseed → meal + oil (the crush)
  refined_into:      {directed: true}                            # CPO → palm_olein, raw → white sugar
  co_product_of:     {directed: false, sign: pos}                # one process yields both (kernel~CPO, lint~cottonseed) — F-A item B; registry row owed by lane C's handoff D
  feedstock_for:     {directed: true,  sign: pm,  lag: months}   # veg-oil/cane/corn → biofuel demand
  diverted_to:       {directed: true,  sign: pm,  lag: months}   # supply rerouted to fuel/domestic use
  redirects_to:      {directed: true,  lag: months}
  restricts:         {directed: true,  sign: neg, lag: months}
  subsidizes:        {directed: true,  sign: pos}
  delays:            {directed: true,  sign: neg, lag: months}
  disrupts:          {directed: true,  sign: neg}
  belongs_to_group:  {directed: true}
  leads_lags:        {directed: true,  sign: pm,  lag: months}
  correlates_with:   {directed: false}
  precedes:          {directed: true}
  confirms:          {directed: false}
  contradicts:       {directed: false}
  cited_by:          {directed: true}

# Deterministic role resolution: each surface form → exactly one (role, canonical). A term that
# could be both node and edge is an extraction error → vocab-curation queue (never double-counted).
arbitration:
  stress:        {role: node, canonical: flowering_stress}   # the causal link is a separate `causes` edge
  substitution:  {role: edge, canonical: substitutes_for}
  frost:         {role: node, canonical: frost}
  ban:           {role: node, canonical: export_ban}

aliases:             # EN/PT/ES + abbreviations + contract names → canonical node (free-text linking).
                     # Contract slugs also appear here so a position name links; the authoritative
                     # contract→node map for expansion lives in commodity_hierarchy.yaml.
  arabica_coffee:    [arabica, "café arábica", "café arabica", "green coffee", "mild arabica",
                      "Colombian mild", "Brazilian naturals", brazilian_arabica_coffee, BMF_arabica]
  robusta_coffee:    [robusta, conilon, conillon, "Vietnamese robusta", "café robusta"]
  corn:              [maize, "maíz", milho, "yellow corn", "U.S. corn", "EU maize", "maïs",
                      corn_cbot, campinas_corn_reference_bmf, french_maize_matif]
  wheat:             ["all wheat", "winter wheat", winter_wheat, "spring wheat (generic)", trigo, blé]
  hrw_wheat:         ["HRW wheat", "hard red winter", "hard winter wheat", hard_red_winter_wheat_kcbt]
  hrs_wheat:         ["HRS wheat", "hard red spring", "spring wheat", hard_red_spring_wheat_mgex]
  srw_wheat:         ["SRW wheat", "soft red winter", "soft wheat", soft_red_winter_wheat_cbot]
  french_wheat:      ["milling wheat", "French wheat", "EU wheat", "European wheat", "blé tendre",
                      french_wheat_matif]
  rice:              ["rough rice", "paddy rice", "milled rice", "long grain rice", rough_rice_cbot]
  white_maize:       ["white maize", "SA white maize", south_african_white_maize_jse]
  yellow_maize:      ["yellow maize", "SA yellow maize", south_african_yellow_maize_jse]
  soybeans:          [soybean, soya, soja, soybeans_cbot, soybeans_no_1_dce, soybeans_no_2_dce]
  soybean_meal:      [soymeal, "farelo de soja", soybean_meal_cbot, soybean_meal_dce]
  soybean_oil:       [soyoil, "óleo de soja", soybean_oil_cbot, soybean_oil_dce]
  palm_oil:          [CPO, crude_palm_oil, malaysian_crude_palm_oil_cme]
  palm_olein:        [olein, palm_olein_dce]
  rapeseed:          [colza, french_rapeseed_matif]
  canola:            [canola_ice]
  rapeseed_oil:      [rapeseed_oil_zce]
  rapeseed_meal:     [rapeseed_meal_zce]
  raw_sugar:         ["açúcar bruto", "azúcar crudo", sugar_no_11]
  # `refined sugars` added 2026-08-20 (the Wave 1c rider, rated and taken): the matcher does no stemming and
  # `refined_sugar` normalizes to the SINGULAR "refined sugar", so the plural was a separate string missing
  # 28 props / 12 net-new dark (Wave 1c's measurement over the full chunk cache). It belongs HERE and not in
  # evidence_windows extra_terms, by that file's own test: refined sugar IS the white contract -- an IDENTITY
  # claim extraction may act on -- rather than a related-stage word. Homed beside its singular, nowhere else.
  white_sugar:       [refined_sugar, "refined sugars", sugar_no_5]
  cotton:            ["algodón", "algodão"]
  # D-EC D8 (2026-08-19) ETHANOL MATCH FORMS. `ethanol` was already a commodity node with four aliases, but
  # the four were SLUGS: match_forms(ethanol) covered 'ethanol' / 'hydrous ethanol' / 'anhydrous ethanol' /
  # 'etanol' / 'bioethanol' and missed the forms the corpus actually writes. Every addition below is a
  # MEASURED count over the full 345,870-prop chunk cache: corn ethanol 86, bio ethanol 60 (the OPEN
  # compound -- ex._normalize collapses whitespace between tokens, never inside them, so it is a different
  # string from 'bioethanol'), molasses-based ethanol 49, sugarcane-based ethanol 48, hydrated ethanol 45
  # (the USDA/Brazil register for what the slug calls hydrous -- 4 props say 'hydrous ethanol', 45 say
  # 'hydrated'), corn-based ethanol 27, fuel ethanol 25, grain-based ethanol 14, sugarcane ethanol 6.
  # DISJOINT FROM THE NUMBERS LANE BY CONSTRUCTION: not one form here is a METRIC phrase. 'ethanol
  # production', 'ethanol sales', 'ethanol margin' and the rest belong to silver_unica / the numbers
  # registry and to the `ethanol_margins` driver slice; the NODE-MODEL RULE at the top of this file bars a
  # metric from riding a node id, and re-declaring those phrases here would poach both.
  ethanol:           [hydrous_ethanol, anhydrous_ethanol, etanol, bioethanol, "bio ethanol",
                      "hydrated ethanol", "corn ethanol", "corn-based ethanol", "sugarcane ethanol",
                      "sugarcane-based ethanol", "molasses-based ethanol", "grain-based ethanol",
                      "fuel ethanol"]
  biodiesel:         [B40, B35, B30, B50, FAME, palm_biodiesel, biodiesel_mandate_blend]
  Minas_Gerais:      [MG, Minas]                              # sub-regions are their OWN region nodes
  Sul_de_Minas:      ["Sul de Minas", "South of Minas"]
  Cote_dIvoire:      ["Côte d'Ivoire", Ivory_Coast]
  United_States:     [US, USA, U.S.]
  CONAB:             ["Companhia Nacional de Abastecimento"]
  leaf_rust:         [hemileia_vastatrix, ferrugem, roya, coffee_rust, "coffee leaf rust", CLR]
  # hazard surface forms harvested from legacy stress_types (free-text → canonical hazard node)
  drought:           [dry, dryness, "moisture deficit", "below-normal rainfall", "dry spell",
                      "low soil moisture", "water stress", "dry conditions", seca]
  frost:             [freeze, freezing, "cold snap", "cold damage", geada, "black frost", "sub-zero"]
  flood:             [flooding, waterlogging, inundation, "excess rain", "excessive moisture"]
  heat_stress:       ["heat wave", "high temperature", "excessive heat", "extreme heat", "hot dry"]
  black_pod:         [phytophthora, "black pod disease"]
  witches_broom:     ["witches' broom", "witch's broom", crinipellis]
  CBD:               ["coffee berry disease", colletotrichum]
  harmattan:         ["harmattan winds", "dry harmattan"]
  # D-EC XC-2 (2026-08-20): keys FLIPPED to the ASCII canonical (was `El_Niño`/`La_Niña`). The accented
  # DAG-id spelling is kept as a surface form so nothing that ever wrote it goes unrouted. The list is
  # deliberately redundant under ex._normalize (which de-accents and collapses `_` to a space, so all three
  # of "El Niño"/"El Nino"/"El_Niño" fold to one string) -- it is an IDENTITY register a reader consults by
  # eye, and the accented form earned its line by being the id 15 shipped DAGs actually used.
