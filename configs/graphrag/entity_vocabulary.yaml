# Many surface verbs → one canonical edge+sign; the original verb stays in the edge's verbatim span.
verb_normalization:
  "reduces|lowers|cuts|pressures|hurts|weighs on|drags": {edge: causes, sign: neg}
  "boosts|lifts|supports|raises|drives up": {edge: causes, sign: pos}
  "replaces|switches to|substitutes": {edge: substitutes_for, sign: pos}
  "bans|halts|restricts|curbs|limits": {edge: restricts, sign: neg}
  "delays|slows|holds up": {edge: delays, sign: neg}
  "disrupts|blocks|closes": {edge: disrupts, sign: neg}
  "crushed into|crushes into|processed into|yields meal and oil": {edge: crushed_into}
  "refined into|refines into": {edge: refined_into}
  "blended into|feedstock for|used for biodiesel|used for ethanol|mandated into fuel": {edge: feedstock_for, sign: pos}
  "diverted to|channeled to|redirected to fuel|absorbed by mandate": {edge: diverted_to, sign: pm}
  "produces|grows|cultivates|output of|harvest in|production located in": {edge: produces, sign: pos}

# Causal linguistic anchors (harvested from legacy configs/sources). Extraction only mints a causal
# edge when the sentence is anchored by one of these — cuts false-positive correlational edges.
causal_markers:
  - "as a result of"
  - "due to"
  - "because of"
  - "in response to"
  - "following"
  - "consequently"
  - "triggered by"
  - "led to"
  - "resulted in"
  - "driven by"
  - "attributed to"
  - "stemming from"
  - "owing to"
  - "in the wake of"
  - "prompted by"
  - "caused by"
  - "as a consequence of"
  - "which led to"
  - "which resulted in"
  - "expected to lead to"
  - "likely to result in"
