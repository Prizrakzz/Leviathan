  #
  # D-CW-3a -- FERTILIZER/ENERGY ORPHANS. Of the four orphans the wave names (urea 165, dap 88, potash 113,
  # diesel 497 props) only DIESEL has a landing site. MEASURED over all 33 causal YAMLs: the estate holds NO
  # nutrient-specific driver id at all -- the whole fertilizer concept is carried by five generic ids
  # (fertilizer_cost / fertilizer_costs / fertilizer_input_cost / fertilizer_input_costs /
