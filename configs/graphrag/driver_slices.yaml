# ── slice -> DAG driver-id alias map (GraphRAG v2 L2 regime-firing fix, 2026-07-03) ──────────────────────────
# Slice NAMES (keys under `drivers:` above) were curated independently of the causal-DAG driver ids, so of 353
# distinct DAG driver ids only 13 matched a slice name exactly (4%). ground() read evidence at
# drivers/<dag_id>, which only ever resolved for those 13 — so convergence regimes fired 0.0 and leg-grounding
# stuck at 0.2 (the L2 A/B blocker). This block maps each slice to the DAG driver id(s) whose dated text
# evidence it legitimately carries; the resolver in evidence.py inverts it (dag_id -> slice) so a driver leg
# reads drivers/<slice_name>.jsonl.  HAND-CURATED from a substring+fuzzy candidate pass — topical matches only
# (rejected difflib noise like urea->area, cocoa_grindings->RIN, ethanol_margins->hog_margin).  Each dag id is
# owned by exactly ONE slice.  Genuinely-dark blockers with no topical slice (conab_production_revision,
# favorable_rainfall, export_pace_lag) are intentionally absent — they need the silver leg (F4) or a new slice.
# Additive: the 13 exact-name matches keep resolving by identity even if omitted here.
dag_alias:
  # D-EC XC-2 (2026-08-20). These two rows used to reach HALF the ENSO layer and the file could not say so:
  # the DAGs carried ENSO under two ids differing by DIACRITIC alone -- ASCII `El_Nino` on 17 contracts,
  # accented `El_Niño` on 15 (`La_Nina` 17 / `La_Niña` 14), with ZERO DAGs carrying both, so the split
  # partitioned grains+oilseeds from softs+coffee+canola and no id-keyed traversal could walk a corn ENSO
  # episode to a coffee one. MEASURED before the merge: 48.6% of El_Nino contract PAIRS were id-walkable
  # (241 of 496), 48.8% for La_Nina -- the "silent 50% cut to the highest-degree hub" of the desk-ontology
  # diff, arithmetically. The 33 DAGs are now normalized to the ASCII MAJORITY spelling (the rename moved
  # 110 id-reference lines across 18 files; driver ids 374 -> 371, driver INSTANCES unchanged at 1,152), so
  # these rows now reach 32 and 31 contracts respectively -- the union of both former partitions.
  # NOT the reason the rows kept resolving before: evidence.driver_alias()'s accent-fold pass already routed
  # the accented ids to these ASCII slice names, so SLICE resolution was never the casualty. What was cut is
  # every reader keyed on the id STRING (graph joins, convergence membership, episode identity). The fold
  # pass stays -- it is now a no-op for ENSO and remains the defense for the next accented id.
  el_nino: [El_Nino]
  la_nina: [La_Nina]
