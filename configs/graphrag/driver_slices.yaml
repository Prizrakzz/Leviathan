  # MACRO DE-CHOKE (no alias edit -- `macro: [macro_demand]` above already existed; the CHOKE was that
  # `macro_demand` was a node on exactly ONE DAG, cocoa). The same wave curated a macro_demand node onto
  # 23 more grain/oilseed/softs DAGs, mirroring cocoa.yaml's shape field-for-field, so the slice's 2,121
  # props stop being cocoa-only: MEASURED reach 1 -> 24 contracts. Where the DAG already carried an
  # unambiguous income-elastic consumption node, that node now names macro_demand as a PARENT (cocoa's
  # exact shape, macro_demand -> grind_demand); where it did not, macro_demand is a root driver.
  # Two honesty fences applied to the curation, both worth stating because they are why the number is
  # 24 and not 33:
  #   (i) DECLINED where end demand is income-INELASTIC or the sign would be ambiguous -- the four wheat
  #       boards (milling wheat is the textbook staple; its macro channel is import FINANCING, already
  #       carried by EUR_USD / USD_index), rough_rice_cbot (rice consumption FALLS with income across
  #       Asia, so a '+' sign would be wrong), south_african_white_maize_jse (the southern-African food
  #       staple -- note its YELLOW twin DOES get the node, because yellow maize is feed), raw_sugar +
  #       white_sugar (calorie demand is inelastic; sugar's real macro channel is crude/ethanol parity,
  #       already modelled by sugar_ethanol_parity), frozen_orange_juice (secular decline dominates the
  #       cycle). Recorded, not smuggled.
  #  (ii) region is `Global` on EVERY macro_demand node, including the China- and EU-specific ones, and
  #       that is deliberate: fred_fx_macro IS a cascade-mapped ref, and cascade_map's region_map RESOLVES
  #       'China' (-> China, cny) and 'EU'. A China-regioned node would therefore have quietly armed a
  #       QUANTIFIED cny fx leg on eight DAGs -- turning a narrative de-choke into new engine
  #       quantification, which this wave does not do. 'Global' lands in region_map.unresolved, so the
  #       node stays qualitative exactly as cocoa's always has. The geography lives in the mechanism /
  #       blurb / evidence_query text, where narrative belongs. (config_check's cascade_map region census
  #       caught the one compound token, 'Brazil;Global', before it shipped.)

  # ===== D-GD guided-depth wave, TRANCHE 2 (2026-08-08) -- eleven orphan slices acquire a REAL node =====
  # Same Pareto rule D-PQ used and for the same reason: every id below is a BRAND-NEW driver node curated
  # onto the boards where its economics bind, so no slice loses a prop and no id changes owner (the
  # duplicate-ownership leg of evidence.check_driver_slices hard-errors on a second owner). Contrast the
  # ONE alias-only entry, `myr_fx`, which takes an id that was WAIVED silver_only and gives it the text
  # slice it has always been -- its waiver row is deleted below in the same edit, because a waiver asserts
  # "grounded by the observed silver leg, never text" and that stops being true the moment a text slice
  # owns it (the D-CW-3a precedent, verbatim).
  #
  # WHY NOW, and why with edges rather than nodes alone: the D-GD recon proved the walk FLATTENS the
  # curated hierarchy (a driver's parents are already wave-1 siblings, so 0 of 33 DAGs yield a new depth-2
  # key at ANY budget). Reach is therefore necessary but NOT sufficient -- the D-PQ macro de-choke took
  # `macro` from 1 to 24 contracts and the wired-v2 read still showed it dark, because reachable is not
  # ADMITTED. These nodes ship BEFORE the D-GD-1 cascade-closure reservation and BEFORE the D-GD-3 A/B so
  # the graph is CONSTANT across both arms; conversion is then measured with the admission help the
  # closure mechanism provides, not without it.
  subsidy: [producer_subsidy]
    # 3,038 props, the estate's largest orphan. FOUR boards, each a named programme a desk actually trades,
    # never a generic "governments support farmers" node: raw_sugar + white_sugar (India's FRP cane price
    # and the WTO-litigated export subsidy), soybeans_no_1_dce (China's per-mu direct payment, the 2016
    # replacement for the stockpiling regime, on the DOMESTIC non-GMO board where it binds -- not on the
    # no.2 imported-bean board), cotton (the Xinjiang target-price subsidy). On every one the node is a
    # PARENT of that board's own acreage or balance node, so the graph reads subsidy -> acreage/carryout
    # -> price rather than leaving a free-floating policy marker. Reach 0 -> 4.
    # DECLINED and recorded, not smuggled: the US boards (us_farm_program already carries that concept and
    # owns its own slice), rough_rice_cbot (its MSP node IS the Indian procurement instrument -- a second
    # node would double-count one policy), campinas_corn_reference_bmf (Plano Safra is subsidised CREDIT, a
    # financing-cost channel with no acreage node on that DAG to parent), and the MATIF boards (CAP direct
    # payments have been DECOUPLED since 2003, so the acreage claim would be wrong for the modern era).
  sunflower_oil_balance: [sunflower_oil_supply]
    # 1,133 props. Sunoil is the marginal substitute in the vegoil stack, so the node lands on the five
    # boards that price against it: french_rapeseed_matif (EU bottling), rapeseed_oil_zce + soybean_oil_dce
    # + palm_olein_dce (the Chinese switch), malaysian_crude_palm_oil_cme (the Indian switch). Reach 0 -> 5.
    # DECLINED: soybean_oil_cbot -- US soyoil's marginal demand is RFS/renewable-diesel, not Black Sea
    # sunoil -- and canola_ice, where the substitution runs through the EU/China boards already listed.
  egypt_gasc_tenders: [Egypt_GASC_tender]
    # 447 props. GASC is the single largest milling-wheat buyer; the node is a parent of each board's
    # export_pace_lag, mirroring french_wheat's existing Algeria_tender_specs shape. Reach 0 -> 2.
    # DECLINED: hard_red_spring_wheat_mgex (high-protein spring wheat is not GASC's grade) and
    # soft_red_winter_wheat_cbot (soft low-protein wheat rarely wins a GASC bread-programme tender). The
    # slice's own `[moves:]` annotation lists srw_wheat; this refuses that annotation on the physics.
  idr_fx: [IDR_USD]
    # 274 props. The palm SELLER's currency: Indonesia is ~58% of world output and the DAGs carried MYR and
    # CNY but never IDR. malaysian_crude_palm_oil_cme + palm_olein_dce. Reach 0 -> 2.
  inr_fx: [INR_USD]
    # 402 props. The palm BUYER's currency (India is the largest single importer) and the sugar EXPORTER's
    # parity currency (India is the swing raw exporter). malaysian_crude_palm_oil_cme + raw_sugar.
    # Reach 0 -> 2. DECLINED: rough_rice_cbot, whose INR_THB_VND_weakness basket already carries the rupee
    # leg -- a second node there would double-own one FX channel.
    # BOTH FX nodes carry region tokens (`Indonesia`, `India`) that RESOLVE in cascade_map.region_map but
    # carry NO currency column, so fred_fx_macro degrades to qualitative exactly as the D-PQ macro_demand
    # fence intended. Only brl/ars/cny exist in silver_fred_fx; nothing new is quantified by this wave.
  myr_fx: [MYR_USD]
    # 14 props, and the ONE alias-only entry in the tranche -- MYR_USD already exists as a node on
    # malaysian_crude_palm_oil_cme and palm_olein_dce, so this is wiring, not curation. Reach 0 -> 2.
    # Its `waivers:` row is deleted below in the same edit (the D-CW-3a precedent).
  global_rice_export_policy: [vietnam_thailand_export_policy]
    # 292 props. rough_rice_cbot's whole export-policy stack is India-centric and owned by `export_ban`;
    # this is the non-India half (Vietnam suspensions, Thai price floors) that buyers turn to when India
    # restricts. Parent of buyer_tender_demand. Reach 0 -> 1 -- the ceiling, since rice has one board.
  west_africa_weather: [west_africa_rainfall]
    # 154 props. cocoa's weather is densely curated but ENTIRELY through generic shared slices (drought,
    # flood, heat, harmattan); the one thing it has no node for is the belt's RAINFALL TIMING, which is
    # what sets main- and mid-crop size. Parent of export_pace_lag (arrivals). Reach 0 -> 1.
    # DECLINED: cotton and robusta_coffee -- West African cotton is ~5% of world exports and robusta is a
    # Vietnam/Brazil crop; the slice's own terms are Ivory-Coast/Ghana cocoa-belt terms.
  mississippi_river_levels: [Mississippi_low_water]
    # 20 props, and the cleanest structural precedent in the estate: it is the US twin of the already
    # curated `Parana_low_water` -> parana_river_levels node on soybean_meal_cbot. Curated with
    # parents: [drought] on all three boards, so the chain reads drought -> low water -> barge freight ->
    # basis, a four-link all-backed chain that existed nowhere in the estate before this wave.
    # corn_cbot + soybeans_cbot + soft_red_winter_wheat_cbot. Reach 0 -> 3.
  panama_canal_constraints: [Panama_Canal_constraint]
    # 8 props -- the thinnest slice this wave adopts, and it is adopted for STRUCTURE, not volume: a
    # chokepoint node gives the freight leg a cause, which is what the closure reservation walks.
    # corn_cbot + soybeans_cbot + soybean_meal_cbot. Reach 0 -> 3.
  suez_redsea_disruption: [Suez_Red_Sea_disruption]
    # 44 props. soft_red_winter_wheat_cbot + raw_sugar + white_sugar -- the three boards that BOTH carry a
    # freight_rates node to parent AND appear in the slice's own `[moves:]` list. Reach 0 -> 3.
    # DECLINED: malaysian_crude_palm_oil_cme. Palm's Red Sea exposure is real, but that DAG carries no
    # freight node at all, and inventing a freight stack for one chokepoint is a bigger curation act than
    # this wave should make in passing.
