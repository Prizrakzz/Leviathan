  # ========== B1 DESTINATION/IMPORTER LAYER -- ROUTING HALF (ratified 2026-08-21) ========================
  # The measured framing, and it is written here so B1 is never re-litigated on the original overstatement:
  # the buyer side does NOT "not exist". It exists in the NUMBERS lane (numbers/agent.py's shipped
  # 38-destination detector anchors 93.5% of measured US export tonnage) and in the VOCABULARY (43
  # country_origin nodes anchor 84.2%); what is absent is EVIDENCE ADDRESSING. 79-96% of the props below
  # already land in a COMMODITY slice, so this layer buys DESTINATION-KEYED ADDRESSING and never prop rescue:
  # today a "what is the Philippines doing in meal?" question must find 102 props inside a soybean_meal slice
  # holding thousands.
  # THE SURFACE-FORM LAW THAT DECIDED EVERY TERM LIST, measured: a destination's corpus mass lives in
  # `<demonym|country> + <commodity>` bigrams, named institutions and demand-channel nouns -- and NEVER in
  # `<country> + import/tender` compounds, every one of which scored ZERO ("mexico corn import", "eu wheat
  # import", "algeria wheat tender", "japan corn import" ...). An agent handed the ordinary "keep terms
  # SPECIFIC" rule would have produced a zero-hit slice.
  # ORIGIN/DESTINATION AMBIGUITY, declared rather than claimed away: `<demonym> <commodity>` is ambiguous by
  # construction ("colombian sugar" is Colombia-as-PRODUCER). Every list below is restricted to commodities
  # the destination BUYS, but that is a curation judgement and not something the matcher can enforce -- the
  # `export_levy_duty` HONEST SCOPE convention, applied.
  # FOUR OF THE FIVE BELOW ARE READ-DARK BY CONSTRUCTION and need evidence.READ_DARK_SLICES_PIN entries;
  # that pin edit is the ratified home for them ("the wave gate's 'written down as edge-reachable-only' in
  # its enforceable form"), and the next wave's edge half retires the pins.
  # FIVE CANDIDATES WERE REFUSED ON MEASUREMENT and are recorded so they are not re-proposed:
  # import_parity_landed_cost 95 props, importer_tender_mechanism 92, latam_import_demand 85,
  # eu_import_demand 28, north_africa_wheat_tenders 26 -- all under the 100-prop authoring gate. The last is
  # a CORPUS-ACQUISITION finding and not a curation one: `oaic`, `onicl`, `algeria wheat tender` and
  # `north africa wheat import` are ZERO props, so the Maghreb tender desk is in none of the 28 text sources.
  # `sea_import_demand` is the one that resolves a DAG id: it claims `buyer_tender_demand` (rough_rice_cbot,
  # region 'Indonesia/Philippines' -- an exact topical fit), waived and unowned, and that waiver row is
  # deleted in the same edit.
  # `bulog` LANDS HERE, not on `producer_support_intl`: B1's ratified one-owner rule sends tmo/gasc/bulog to
  # the destination/tender slices because the dominant corpus sense is import tenders (measured: bulog 139
  # props / 136 net-new dark, 110 of them usda_gain_rice -- Indonesia's food agency buying rice).
  sea_import_demand: {category: demand_center, terms: [indonesian soybean, vietnam soybean, indonesia soybean,
    thai soybean, philippine soybean, thailand soybean, philippine corn, philippines wheat,
    philippines soybean meal, malaysia soybean, thai feed, philippines corn, philippines soybean,
    philippine soybean meal, indonesian flour, nfa rice, indonesia feed, vietnam feed demand,
    philippine mills, bogasari, bulog]}
    # SE Asia is the fastest-growing feed and food buyer of US and South American grain and meal; its purchase tempo is a demand signal no commodity slice can address by destination.  [moves: soybean_meal, soybeans, corn, srw_wheat, soybean_oil, rice]
  # 1,295 props / 1,215 unclaimed by any of the 126 production slices. `tmo` alone is 760 props / 715 net-new
  # dark and was sampled clean ("The Turkish Grain Board (TMO) imported about 1.3 million metric tons of wheat
  # duty free..."). No DAG id exists for a Turkish import agency, so this slice is READ-DARK by construction.
  turkey_tmo_imports: {category: demand_center, terms: [tmo, turkey corn, turkish wheat, turkish flour,
    turkish grain board, turkey wheat, turkey rice, turkey barley, inward processing regime, turkish corn,
    turkish barley, toprak mahsulleri]}
    # TMO's tenders and Turkey's inward-processing regime make it the swing milling-wheat and corn buyer on the Black Sea's doorstep.  [moves: hrw_wheat, srw_wheat, french_wheat, corn]
  # 845 props / 666 unclaimed. THE FLOW RELATION ITSELF -- "exports to China", "shipped to China" -- which is
  # how the corpus names a destination without naming a commodity compound.
  # MEASURED CORRECTION TO B1's OWN RECOMMENDATION, recorded and NOT acted on: B1 declined to claim the DAG
  # id `us_export_pace` on the ground that it is "LIVE (5 DAGs) but owned; claiming it MOVES reach". It is
  # live on 5 DAGs, but it is NOT owned -- it is a `waivers:` row (:1060) and appears on no dag_alias RHS, so
  # claiming it would be the favorable_rainfall / MYR_USD pure-addition shape and would CREATE reach on five
  # boards while retiring a pin entry and a waiver. The dec_p1 fillability census independently rates
  # `us_export_pace` FILLABLE-BY-TERM (389 anchored props). The ratified recommendation is followed as
  # ratified -- READ_DARK pin, no claim -- and the correction is handed to the wave rather than acted on
  # unilaterally, because the recommendation carries owner word and the correction does not.
  us_export_flow_relation: {category: demand_center, terms: [exports to china, exports to japan,
    exports to mexico, exported to china, shipped to china, shipments to china, sales to china,
    export commitments, us origin, american origin, us exports to, purchases from the united states,
    sales to japan, sales to mexico]}
