  # with the slice name, so it adds ONE driver_slice_alias_warnings() advisory -- accepted, and it is the
  # exact class the heuristic's docstring calls a legitimate concept alias.
  natural_gas: [refinery_energy_costs]

  # ===== D-PQ DAG-curation wave (2026-08-07) -- the CURATION D-CW-3a said it could not do by wiring =====
  # D-CW-3a MEASURED that no nutrient-specific driver id existed anywhere in the 33 causal YAMLs and
  # correctly REFUSED to steal one of the five generic fertilizer ids from the `fertilizer` slice (a
  # zero-sum re-own that un-strands nothing). This wave supplies the missing NODES instead, so both
  # entries below are pure additions on brand-new ids: no slice loses a single prop, and the
  # `fertilizer` slice keeps all five of its ids on all 15 contracts.
  #
  # urea_cost: a nitrogen input-cost node CURATED onto the 12 DAGs where nitrogen economics actually
  # bind -- corn family (corn, corn_cbot, campinas_corn_reference_bmf, french_maize_matif, both JSE
  # maize boards), wheat family (french_wheat_matif, MGEX, KCBT, CBOT SRW) and canola/rapeseed
  # (canola_ice, french_rapeseed_matif). On every one it is inserted beside the DAG's existing generic
  # fertilizer node AND made that node's parent, so the graph reads energy -> urea -> fertilizer cost
  # -> price (a chain, never two parallel additive cost drivers double-counting one cost push).
  # Reach 0 -> 12: `urea` LEAVES the read-dark census (evidence.READ_DARK_SLICES_PIN 28 -> 26 with
  # potash). `urea` is a literal token of the id, so this adds no driver_slice_alias_warnings entry.
  urea: [urea_cost]
  # potash_cost: the ONE defensible nutrient-specific node outside nitrogen. Oil palm removes more
  # potassium than any other nutrient and muriate of potash is the single largest line in a Malaysian /
  # Indonesian estate fertiliser budget, with the 12-24 month FFB yield response the DAG's own
  # fertilizer_cost node already encodes (lag 2-6 quarters, edge_type affects_yield_of) -- so the node
  # is a refinement of an existing mechanism, not a new claim. Added to malaysian_crude_palm_oil_cme
  # ONLY: palm_olein_dce is the refined downstream product and correctly carries no plantation cost
  # stack at all. Reach 0 -> 1; shares the `potash` token, so no new advisory.
  # DECLINED, and recorded rather than forced: **dap**. Phosphate is a build-up/maintenance nutrient
  # with multi-year soil residual -- on none of the 33 boards is DAP the marginal input cost inside the
  # 1-4 quarter lag horizon these DAGs model, and on the crops where it matters at all it moves with the
  # nitrogen story a `urea_cost` node already carries. `dap` therefore STAYS in READ_DARK_SLICES_PIN;
  # its 88 props wait for a real phosphate mechanism, not a node invented to retire a census line.
  potash: [potash_cost]
