# Driver-keyed evidence slices (GraphRAG v2 WS-MS6). PRIVATE IP (gitignored).
# The commodity-keyed sampler drops props that describe a DRIVER without naming one of our 24 commodities
# ("Indonesia raised the blend to B40", "Pacific freight doubled", "La Nina intensified"). Those are exactly
# the cascade/convergence TRIGGERS this project exists to ground. This map routes such props — captured FREE
# from the same Haiku chunking pass — into driver slices evidence/drivers/<driver>.jsonl, retrieved when a
# query's subgraph touches that driver. The driver NODES already exist in the causal DAGs (each driver's
# silver_ref ties the text trigger to its silver number); this gives them their dated text evidence.
#
# `terms` feed harvest.build_matcher (word-boundary, case-insensitive). Kept SPECIFIC to avoid over-firing
# (e.g. "brazilian real"/"brl" not bare "real"; "natural gas" not "gas"; "heat wave" not "heat").
# category groups slices; priority: context marks the low-value macro_context tail (metals/macro) we capture
# anyway — the barley/sunflower precedent (cascade endpoints worth seeing, not first-class drivers).
#
# `max_props` (OPTIONAL, G5c / D-EI-3) — the per-slice prop cap. Absent means "inherit the pass default"
# (write_driver_slices' max_per=4000); `null` means UNCAPPED. It is declared explicitly on exactly the four
# slices that are actually AT the cap, because an undeclared cap is how 5,809 of the 16,000 rows in those
# four slices (36%) were swapped for a different 5,809 at the 2026-07-20 promote with all four counts frozen
# at exactly 4000 and nothing printed. Raising the cap was priced and rejected: at 20,000 those four go to
# ~465 MB each and roughly double the 1.361 GB driver layer. Keep 4,000; the truncation is now recorded in
# the run manifest, and the survivors are chosen deterministically (evidence._truncation_order: most recent
# by date, ties by source_key/id) instead of by a PYTHONHASHSEED-randomized set iteration.
#
# EVERY EDIT TO THIS FILE MUST BE MIRRORED: `python -m leviathan.graphrag.driver_slices_manifest --write`,
# then `git add -f configs/graphrag/driver_slices_manifest.yaml`. This file is gitignored whole-directory
# (.gitignore:49) and has an EMPTY git log, so the tracked manifest is the ONLY reviewable record that a term
# set changed. config_check and every maintenance Batch job fail on drift.
drivers:
  # --- climate (the weather triggers; tie to ONI / soil-moisture / heat silver) ---
  el_nino:       {category: climate, terms: ["el nino", "el niño", "enso warm phase"]}
  la_nina:       {category: climate, terms: ["la nina", "la niña", "enso cool phase"]}
  drought:       {category: climate, terms: ["drought", "dryness", "dry weather", "rainfall deficit", "water stress", "below-normal rainfall"]}
  frost:         {category: climate, terms: ["frost", "frosts", "freeze", "cold snap", "black frost", "frio"]}
  flood:         {category: climate, terms: ["flood", "flooding", "excess rain", "waterlogging", "torrential rain"]}
  heat:          {category: climate, terms: ["heat wave", "heatwave", "heat stress", "excessive heat", "record temperatures"]}
  monsoon:       {category: climate, terms: ["monsoon"]}
  harmattan:     {category: climate, terms: ["harmattan"]}

  # --- policy (the announcement triggers; tie to tariff / export-restriction silver) ---
  export_ban:        {category: policy, terms: ["export ban", "export restriction", "export tax", "export duty", "export quota", "export licen", "embargo"]}
  biodiesel_mandate: {category: policy, terms: ["biodiesel", "renewable diesel", "blending mandate", "blend mandate", "b20", "b30", "b35", "b40", "rfs", "rin "]}
  tariff:            {category: policy, max_props: 4000, terms: ["tariff", "import duty", "import tax", "antidumping", "anti-dumping", "wto", "world trade organization", "uruguay round", "tariff-rate quota", "trq", "nafta", "usmca", "mercosur", "eu-mercosur", "canola dispute", "export licence", "export license"]}   # G5c: AT the cap (4,000 props / ~93 MB). Declared, not inherited -- see the max_props note above.
  msp:               {category: policy, terms: ["minimum support price", "msp"]}
  subsidy:           {category: policy, terms: ["subsidy", "subsidies", "subsidized"]}

  # --- macro: FX + freight (the cost-of-trade triggers; tie to FRED FX / freight silver) ---
  brl_fx:        {category: macro, terms: ["brazilian real", "brl", "real depreciat", "real weaken", "real strengthen"]}
  idr_fx:        {category: macro, terms: ["rupiah", "idr"]}
  inr_fx:        {category: macro, terms: ["indian rupee", "rupee", "inr"]}
  myr_fx:        {category: macro, terms: ["ringgit", "myr"]}
  freight:       {category: macro, terms: ["freight", "ocean freight", "shipping cost", "baltic dry", "vessel availab", "logistics cost", "container rate", "panama canal", "suez"]}

  # --- energy (often the START of a cascade: crude -> biodiesel economics / fertilizer / freight) ---
  crude:         {category: energy, terms: ["crude oil", "brent", "wti", "petroleum", "oil prices"]}
  diesel:        {category: energy, terms: ["diesel", "gasoil"]}
  natural_gas:   {category: energy, terms: ["natural gas", "gas prices"]}

  # --- fertilizer (cost-push; already quantified in your Pink Sheet silver) ---
  urea:          {category: fertilizer, terms: ["urea"]}
  dap:           {category: fertilizer, terms: ["dap", "diammonium phosphate"]}
  potash:        {category: fertilizer, terms: ["potash", "potassium chloride", "muriate of potash"]}
  fertilizer:    {category: fertilizer, terms: ["fertilizer", "fertiliser", "nutrient cost", "input cost"]}

  # --- macro_context (low-priority cascade endpoints; the barley/sunflower precedent) ---
  metals:        {category: macro_context, priority: context, terms: ["copper", "aluminium", "aluminum", "iron ore", "steel prices", "zinc", "nickel"]}
  macro:         {category: macro_context, priority: context, terms: ["interest rate", "inflation", "recession", "gdp growth", "dollar index", "global demand", "covid", "covid-19", "coronavirus", "pandemic", "super cycle", "commodity boom", "financial crisis", "deleveraging"]}

