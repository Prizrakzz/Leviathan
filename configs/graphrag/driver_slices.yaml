# Driver-keyed evidence slices (GraphRAG v2 WS-MS6). PRIVATE IP (gitignored).
# The commodity-keyed sampler drops props that describe a DRIVER without naming one of our 24 commodities
# ("Indonesia raised the blend to B40", "Pacific freight doubled", "La Nina intensified"). Those are exactly
# the cascade/convergence TRIGGERS this project exists to ground. This map routes such props — captured FREE
# from the same Haiku chunking pass — into driver slices evidence/drivers/<driver>.jsonl, retrieved when a
# query's subgraph touches that driver. The driver NODES already exist in the causal DAGs (each driver's
# silver_ref ties the text trigger to its silver number); this gives them their dated text evidence.
#
# `terms` feed harvest.build_matcher (word-boundary, case-insensitive). Kept SPECIFIC to avoid over-firing
# (e.g. "brazilian real"/"brl" not bare "real"; "natural gas" not "gas"; "heat wave" not "heat").
# category groups slices; priority: context marks the low-value macro_context tail (metals/macro) we capture
# anyway — the barley/sunflower precedent (cascade endpoints worth seeing, not first-class drivers).
#
# `max_props` (OPTIONAL, G5c / D-EI-3) — the per-slice prop cap. Absent means "inherit the pass default"
# (write_driver_slices' max_per); `null` means UNCAPPED. It is declared explicitly on the slices that are
# actually AT or PAST the cap, because an undeclared cap is how 5,809 of the 16,000 rows in the original four
# capped slices (36%) were swapped for a different 5,809 at the 2026-07-20 promote with all four counts frozen
# at exactly 4000 and nothing printed. The truncation is recorded in the run manifest, and the survivors are
# chosen deterministically (evidence._truncation_order: most recent by date, ties by source_key/id) instead of
# by a PYTHONHASHSEED-randomized set iteration.
#
# D6 AMENDED — 4,000 -> 25,000 (owner word 2026-08-19, D-EC decision D6 as ratified). D-EI-3's "keep 4,000"
# rested on a 20,000 price quoted at ~465 MB per capped slice, i.e. on the EMBEDDED row size. The measured
# demand is what overturned it: data/dec_p0/thin_slice_fill.md prices the post-X2 worst case at 15,445 props
# (`wasde_stocks_to_use`, 3.86x its cap, ~11,400 props discarded), and a re-measurement of the FULL 345,870-prop
# chunk cache with the production matchers (this batch, 2026-08-19) prices the cap's cost TODAY, before X2
# adds anything: the 113 slices demand 77,742 rows and the store holds 58,597, and on the pre-batch config the
# four declared slices alone demanded 22,800 rows against 16,000 stored -- 6,800 ALREADY-HARVESTED props
# discarded on every pass, purely to the cap. 25,000 clears the 15.4k worst case with headroom and is the
# number D6 names. Two further slices were measured INSIDE the 80% band and are declared here before they
# truncate rather than after: livestock_feed_demand 3,751 (94%) and protein_meal_substitution 3,280 (82%).
#
# WHERE THE DEFAULT LIVES, AND WHY IT IS STILL 4,000 IN CODE: the pass default is the `max_per: int = 4000`
# keyword on evidence.plan_driver_slices / evidence.write_driver_slices; no caller (build_evidence_task,
# evidence_batch's two plan sites) passes it, so the signature default IS the policy. This batch does NOT own
# evidence.py (a sibling agent holds it), so the raise is landed HERE, per slice, on every slice whose measured
# demand exceeds 4,000 -- an explicit 25,000 outranks the inherited default in evidence.slice_cap(). When the
# signature default moves to 25,000 these declarations become redundant and the ones that carry no OTHER reason
# to be declared can be deleted in the same change.
#
# EVERY EDIT TO THIS FILE MUST BE MIRRORED: `python -m leviathan.graphrag.driver_slices_manifest --write`,
# then `git add -f configs/graphrag/driver_slices_manifest.yaml`. config_check and every maintenance Batch
# job fail on drift, and the mirror is the only guard that fires BEFORE compute is spent.
# RE-CUT 2026-08-21 (D-EC graph-completion wave, lane A): the sentence this note used to carry -- "this file
# is gitignored whole-directory (.gitignore:49) and has an EMPTY git log, so the tracked manifest is the ONLY
# reviewable record that a term set changed" -- IS FALSE and was repeated by seven of seven recon lanes. The
# DIRECTORY is gitignored, but THIS FILE IS FORCE-ADDED AND TRACKED (`git ls-files` returns it; history
# 1f1173e7, db18565c, f33d6ee5, 2f2b0620, 93fa5023), exactly like driver_slices_manifest.yaml, params.yaml
# and the four numbers/*.yaml maps. Two consequences the false sentence was hiding: (1) a term edit DOES
# leave a reviewable diff, so `git add -f configs/graphrag/driver_slices.yaml` must land in the SAME commit
# as the mirror or the mirror moves while the source does not -- the precise drift the mirror law exists to
# prevent; (2) the genuinely unreviewable half is configs/graphrag/causal/ -- 33 .yaml on disk, ZERO tracked,
# no manifest module -- which is where every DAG driver id this wave mints lands.
drivers:
  # --- climate (the weather triggers; tie to ONI / soil-moisture / heat silver) ---
  # D-EC completion wave 2026-08-21 (lane A) ENSO DIACRITIC HYGIENE, the driver_slices half of XC-2. Ledger
  # correction C-8 re-measured the plan's premise and it does NOT reproduce as a DAG split: the 33 causal
  # YAMLs are already uniform ASCII (`El_Nino` on 32, zero accented ids). The real residue is HERE, and it is
  # a DEAD-TERM residue, not a routing split: harvest._Matcher runs BOTH the declared forms and the scanned
  # text through ex._normalize (NFKD -> ASCII), so "el niño" normalizes to "el nino" and its key is dropped by
  # the matcher's own `setdefault` -- it could never claim a single prop the ASCII form did not already claim.
  # MEASURED on the full 345,870-prop chunk cache: the accented forms are exact post-normalization duplicates
  # (0 net-new props by construction), i.e. the e1_census dead-term class, and they are deleted here. ROUTING
  # IS UNCHANGED BY THIS EDIT -- zero props move. The accented spellings survive deliberately in the dag_alias
  # XC-2 note below, where they are HISTORY being narrated, not config being matched.
  el_nino:       {category: climate, terms: ["el nino", "enso warm phase"]}
  la_nina:       {category: climate, terms: ["la nina", "enso cool phase"]}
  # VOCAB SWEEP item 6 (2026-08-21): the pure D1 "gas-hub" class -- entity_vocabulary ALREADY lists "dry
  # conditions", "dry spell" and "seca" as drought ALIASES (extraction lane) and the ROUTING lane had none of
  # them. Measured on the 345,870-prop cache (props / net-new driver-dark): dry conditions 301/210, dry spell
  # 68/46, dry spells 33/23, drier than normal 37/26, seca 2/2, secas 1/1 = +308 net-new dark. The sweep's own
  # full-text-layer number is 1,168 dark WINDOWS; the gap is the 60.2% of documents not yet chunked, so the
  # prop count rises with X2. 'dry spell' and 'dry spells' are BOTH declared: the matcher is word-boundary, so
  # the singular can never fire inside the plural. INTENDED MULTI-LABEL, declared not discovered: bare
  # 'dry spell' also fires inside `west_africa_weather`'s "west africa dry spell" -- the same concept on two
  # slices, which is what multi-label routing is for.
  drought:       {category: climate, max_props: 25000, terms: ["drought", "dryness", "dry weather", "rainfall deficit", "water stress", "below-normal rainfall",
    "dry conditions", "dry spell", "dry spells", "drier than normal", "seca", "secas"]}   # D6: 2,370 measured today, ~6,028 after X2 -- crosses 4,000 for the first time.
  # VOCAB SWEEP item 13: entity_vocabulary already lists "geada" as a frost alias; the routing lane had
  # neither form. AND THE PLURAL IS THE MASS -- geada 58 windows, geadas 495 (8.5x), the exact 'ruble'/'rubles'
  # finding the A24 FX roster recorded. HONEST INSTRUMENT NOTE: both forms measure ZERO on the 345,870-prop
  # CHUNK cache and 544 on the full TEXT LAYER, 544/544 from CONAB -- i.e. Brazilian frost prose lives almost
  # entirely in the 60.2% of documents X2 chunked and this cache does not hold. They are declared on the
  # text-layer measurement, and they are the term to re-count first at the post-rebuild re-measure.
  frost:         {category: climate, terms: ["frost", "frosts", "freeze", "cold snap", "black frost", "frio", "geada", "geadas"]}
  flood:         {category: climate, terms: ["flood", "flooding", "excess rain", "waterlogging", "torrential rain"]}
  heat:          {category: climate, terms: ["heat wave", "heatwave", "heat stress", "excessive heat", "record temperatures"]}
  # VOCAB SWEEP item 5 proposed `monsoon += kharif, rabi` and named itself "the HIGHEST-risk item in this
  # list", offering the alternative in the same breath: "a new `india_crop_season` slice with the same two
  # terms". THE ALTERNATIVE IS TAKEN, and the ground is this file's own doctrine. kharif/rabi are SEASON
  # labels attached to balance-sheet prose ("the last Rabi crop... bumper for oilseeds"), so the add would
  # have moved ~1,600 windows of acreage/production text onto a CLIMATE slice whose two DAG ids
  # (monsoon_active / monsoon_weak) mean monsoon RAINFALL on live rice/cotton boards. That is the 'cerrado'
  # and 'leaf rust' class -- a term whose mass is a different concept from the slice's id -- and this file
  # deleted both rather than declare them. `monsoon` therefore keeps its single term and its honest scope.
  monsoon:       {category: climate, terms: ["monsoon"]}
  # NEW SLICE (vocab sweep item 5, authored as its stated alternative). MEASURED on the 345,870-prop cache:
  # kharif 332 props / 253 net-new dark, rabi 311 / 240 = +493 net-new; full-text-layer 1,639 dark windows.
  # The Indian corpus does not write "monsoon" when it means the monsoon crop -- it writes kharif
  # (monsoon-sown) and rabi (post-monsoon residual-moisture), and that season axis is the single densest
  # unrouted vocabulary in the India GAIN series. REFUSED on measurement: bare `imd` (7 props / 1 net-new
  # dark) -- a three-letter token under word-boundary matching for one net-new prop is the `MoT` defect
  # re-created, and the India Meteorological Department is named in full where it matters.
  # READ-DARK BY CONSTRUCTION: no DAG driver id names an Indian crop season, so this slice needs an
  # evidence.READ_DARK_SLICES_PIN entry (the wave gate's "written down as edge-reachable-only").
  india_crop_season: {category: climate, terms: [kharif, rabi]}
    # India's two crop seasons are the acreage/production axis every India GAIN report is organized around; the monsoon slice models the RAIN, this models the SEASON.  [moves: rice, corn, cotton, soybeans, srw_wheat]
  harmattan:     {category: climate, terms: ["harmattan"]}
  # D-EC D8 (2026-08-19) THE BENIGN ARM. The store had FOUR adverse weather slices (drought 2,370, flood 344,
  # frost 459, heat 89) and no counterfactual: 'ideal conditions' / 'favorable weather' / 'good growing
  # conditions' were terms of NO slice, so an analogue question about a GOOD weather year had nothing to
  # retrieve and every crop DAG's weather node could only be grounded in the direction of damage. Gate: 945
  # props of measured backing (data/dec_p0/thin_slice_fill.md M6); DRY-RUN on the full 345,870-prop chunk
  # cache with the production matchers = 879 props already in the chunked half alone (851 of them claimed by
  # none of the five incumbent weather slices), ~2x that after X2.
  # TERMS ARE MEASURED, not imagined -- every form below occurs in the corpus (top: 'favorable weather' 440,
  # 'good weather' 108, 'favorable conditions' 65). Two forms the D8 text named are DELIBERATELY ABSENT:
  # 'benign weather' and 'favourable conditions' score ZERO occurrences in 345,870 props, and a dead term is
  # the e1_census 310-of-638 class. So does 'excellent rain' (the corpus only ever writes the plural, and
  # the matcher is word-boundary, so the singular would have been a fifth dead term). DISJOINT BY
  # CONSTRUCTION from `us_drought_monitor`, which owns the RATING vocabulary ('crop conditions',
  # 'good-to-excellent', 'soil moisture'): no form here contains any of them.
  # KNOWN IMPRECISION, declared rather than discovered: 'good condition' (44 props) is the one term whose
  # sample is not purely agronomic -- 3 of 4 sampled props are crop condition, the fourth is "the Indian
  # textile sector remains in relatively good condition". Kept because crop-condition prose is the core of
  # the benign arm and the misfiling is bounded (~12 props) and auditable by slice_audit.py, which exists
  # for exactly this class.
  benign_growing_conditions: {category: climate, terms: ["favorable weather", "favourable weather",
    "favorable conditions", "favorable growing conditions", "favorable rains", "favorable rain",
    "favorable moisture", "ideal conditions", "ideal weather", "ideal growing conditions",
    "good growing conditions", "good weather", "good rains", "good rain", "good condition",
    "good conditions", "excellent weather", "excellent conditions", "excellent growing conditions",
    "optimal conditions", "optimal weather", "conducive weather", "beneficial rains", "beneficial rain",
    "timely rains"]}
    # The counterfactual arm of the four adverse weather slices; grounds "what does a good year look like".  [moves: corn, soybeans, srw_wheat, hrw_wheat, hrs_wheat, french_wheat, cotton, rice]

  # ===== D-EC graph-completion wave 2026-08-21 (F-A item N) -- THE NEUTRAL-VALENCE WEATHER ARM =============
  # A12 (1,435 props): every weather slice in this file is VALENCED -- drought/flood/frost/heat carry damage,
  # benign_growing_conditions carries its counterfactual -- so the QUANTITATIVE anomaly register ("110 percent
  # of normal", "cumulative precipitation to date") had no home and the graph could only read weather once it
  # had already become a named hazard. That is the LATENESS bias F-A item N names.
  # TERMS ARE THE MEASURED SUBSET OF THE SPEC'S LIST, and the four the spec named that are NOT here are the
  # review (all measured on the full 345,870-prop cache with the production matchers):
  #   * `soil moisture` 437 props / **0 net-new dark** -- 100% already claimed by `us_drought_monitor`, which
  #     owns the whole RATING vocabulary ("crop conditions", "good-to-excellent", "topsoil moisture").
  #     Re-declaring it buys double-routing, never coverage (the D8 doctrine, verbatim).
  #   * `rainfall deficit` 7 / 0 and `below normal rainfall` 21 / 0 -- both are EXACT post-normalization
  #     duplicates of incumbent `drought` terms ("rainfall deficit", "below-normal rainfall"; _normalize
  #     collapses the hyphen). Declaring them would be a literal re-declaration.
  #   * `growing degree days` 2 / 2 and `rainfall surplus` 0 / 0 -- PARKED per harvest.py's two-level prune
  #     (the concept already has a hitting form) and DEAD respectively.
  #   * `NDVI` / `vegetation index` are NOT taken here: vocab-sweep item 15 assigns them to
  #     `us_drought_monitor` to close the `ndvi_vegetation_health` D3 gap on six contracts, and an id gets
  #     ONE owner. They are added there instead, in this same edit.
  # ALSO REFUSED, with the sweep's own numbers, so nobody re-proposes them: bare `rainfall` (8,616 windows /
  # 5,730 driver-dark), `precipitation` (1,976/1,370), `temperatures` (2,443/1,508), `weather conditions`
  # (5,856/2,931). The sweep names this slice as their natural home AND classes them "WOULD SWAMP THE SLICE";
  # unsampled, they would turn a quantitative-anomaly slice into "all weather prose", which is the exact
  # trade the `sugarcane`/`cane` refusal already made. They are the wave's first post-rebuild sampling job.
  # READ-DARK BY CONSTRUCTION -- needs an evidence.READ_DARK_SLICES_PIN entry.
  quantitative_weather_anomaly: {category: weather_regime, terms: ["above normal precipitation",
    "below normal precipitation", "above normal rainfall", "percent of normal", "cumulative precipitation"]}
    # The neutral-valence anomaly register: how far from normal, stated as a number, BEFORE it becomes a named hazard.  [moves: corn, soybeans, srw_wheat, hrw_wheat, french_wheat, rice, cotton, palm_oil]
  # F-A item N + vocab sweep item 9. A15 (557 props): water AVAILABILITY is the leading indicator the graph
  # only ever reads after it has become "drought" ("Out of 123 reservoirs, 114 reported more than 80 percent
  # of normal storage"). Measured on the full cache: irrigation 879/531 dark, reservoirs 79/64, reservoir
  # 47/35, dam 115/101, aquifer 9/9 = +740 net-new dark.
  # *** THE GATE THIS SLICE SHIPPED ON, ADJUDICATED IN THIS SAME EDIT (vocab-sweep hygiene H1) ***
  # `vietnam_robusta_weather`'s term "irrigation water" was a LIVE OVER-FIRE: 215 props on this cache and
  # 944 windows corpus-wide, the large majority Indian and Chinese irrigation prose with no Vietnam and no
  # robusta content, absorbed by a Vietnam-specific slice on every board it reaches. Its net-new dark is
  # ZERO -- every one of its props is already claimed by another slice -- so it buys that slice no coverage
  # at all, only mis-filing. It is DELETED at its own site below in this edit, which is what lets bare
  # `irrigation` be declared here without the two slices fighting over the same mass.
  # REFUSED on measurement: `canal water allocation` (0 props) and `reservoir level` (redundant -- it contains
  # the declared bare `reservoir`, and under longest-first word-boundary matching a longer form containing a
  # declared shorter one can claim nothing extra).
  # READ-DARK BY CONSTRUCTION -- needs an evidence.READ_DARK_SLICES_PIN entry.
  irrigation_infrastructure: {category: weather_regime, terms: [irrigation, reservoir, reservoirs, aquifer, dam]}
    # Reservoir storage, canal allocation and groundwater set the water a crop will actually get, one to two seasons before "drought" is written.  [moves: rice, cotton, srw_wheat, hrw_wheat, corn, raw_sugar]

  # --- policy (the announcement triggers; tie to tariff / export-restriction silver) ---
  export_ban:        {category: policy, terms: ["export ban", "export restriction", "export tax", "export duty", "export quota", "export licen", "embargo"]}
  # VOCAB SWEEP item 27: modest mass, but it closes THREE D3 gaps at once -- `RenovaBio`, `red_iii_mandate`
  # and `eu_renewable_biofuel` are DAG ids this slice already OWNS with no term that could fire on them, so
  # those boards reached an empty text leg. It also declared b20/b30/b35/b40 and skipped b7/b10, the EU and
  # Malaysian levels. Measured: b7 85 props / 8 net-new dark, b10 43/6, red ii 5/1, renovabio 1/1,
  # renewable energy directive 4/0, red iii 0/0 (17 dark windows on the full text layer -- mpoc carries the
  # EU policy story and 60% of the estate's documents are not in this cache). REFUSED, measured at ZERO:
  # b100, co-processing, cbio, small refinery exemption.
  biodiesel_mandate: {category: policy, terms: ["biodiesel", "renewable diesel", "blending mandate", "blend mandate", "b20", "b30", "b35", "b40", "rfs", "rin ",
    "b7", "b10", "red ii", "red iii", "renewable energy directive", "renovabio"]}
  # VOCAB SWEEP item 3, THE DUTY HALF ONLY -- and the split is load-bearing, not stylistic. This file's own
  # `export_levy_duty` note RECORDED that "customs duty / countervailing duty ... belong to `tariff`", and
  # `tariff` then declared neither, so that recorded refusal left the props homeless for a year. Measured on
  # the 345,870-prop cache (props / net-new driver-dark): customs duty 86/70, countervailing duty 47/14,
  # safeguard duty 21/19, section 301 33/5, section 232 8/0, phase one 10/7 = +115 net-new. `section 301`
  # also closes a D3 gap: `US_section301_tariffs` is a tariff-OWNED DAG id on 14 DAGs whose slice carried no
  # term that could fire on it. THE AGREEMENT HALF IS DELIBERATELY NOT HERE -- see `trade_agreement_access`
  # below; ASEAN is a region word as often as a policy word and `tariff` is the estate's second-most
  # cap-pressured slice, so a 2,000-window infusion of schedule prose would change what all 28 of its
  # contracts read.
  tariff:            {category: policy, max_props: 25000, terms: ["tariff", "import duty", "import tax", "antidumping", "anti-dumping", "wto", "world trade organization", "uruguay round", "tariff-rate quota", "trq", "nafta", "usmca", "mercosur", "eu-mercosur", "canola dispute", "export licence", "export license",
    "customs duty", "countervailing duty", "safeguard duty", "section 301", "section 232", "phase one"]}   # G5c: WAS at the cap (4,000 props / ~93 MB). Declared, not inherited -- see the max_props note above. D6 2026-08-19: 4,000 -> 25,000; measured demand on the full chunk cache is 6,867 TODAY, so 2,867 harvested props are being discarded on every pass before X2 adds a thing.
  # VOCAB SWEEP item 22, the D1 gas-hub class again: entity_vocabulary ALREADY maps FRP and SAP as `msp`
  # aliases (extraction lane) and the routing lane had neither. FRP/SAP are the Indian CANE prices -- the cost
  # floor under the world's swing sugar exporter. Measured: frp 30 props/11 dark (30/30 usda_gain_sugar),
  # state advised price 69/57, fair and remunerative price 8/5. REFUSED, explicitly: bare `sap` -- it collides
  # with tree sap and the software vendor, and the acronym is spelled out instead.
  msp:               {category: policy, terms: ["minimum support price", "msp", "frp", "state advised price", "fair and remunerative price"]}
  # VOCAB SWEEP item 21, the pure INFLECTION class the A24 roster's variant sweep was built to catch: the
  # matcher does no stemming, so the VERB forms are separate strings. Measured: subsidize 108/65 dark,
  # subsidizing 44/35, subsidised 1/1 (British, declared anyway -- it costs nothing and mpoc spells British
  # throughout). Zero new concept, zero judgement, +101 net-new props.
  subsidy:           {category: policy, max_props: 25000, terms: ["subsidy", "subsidies", "subsidized", "subsidize", "subsidizing", "subsidised"]}   # D6: measured 3,038 today, crosses 4,000 for the FIRST time at X2 (~5,218 projected) -- declared BEFORE it silently truncates, not after.
  # D-EC D8 (2026-08-19) THE TRQ MECHANISM. `quota` fires 2,158 times in the corpus and bare 'quota' /
  # 'import quota' were an exact term of NO slice -- the only coverage was inside the compounds
  # 'tariff-rate quota' (tariff), 'export quota' (export_ban, russia_export_tax_quota) and
  # 'india sugar export quota' (india_import_duty). TERMS ARE DISJOINT BY MEASUREMENT: this slice does NOT
  # re-declare 'tariff-rate quota' or 'trq'. Measured on the full 345,870-prop cache: adding those two moves
  # the slice 1,201 -> 2,620 props and moves its NET-NEW (props no policy slice already claims) by EXACTLY
  # ZERO -- every prop they would add is already inside `tariff`. What this slice actually buys is the 450
  # props that carry the in-quota/out-of-quota/allocation vocabulary and NO tariff word at all.
  # THE CAP-RELIEF GROUND IN THE D8 TEXT IS FALSE AND IS RECORDED HERE AS FALSE: `driver_slices_for` is
  # MULTI-LABEL (a prop joins every slice whose terms it mentions), so routing quota props to a second slice
  # cannot remove them from `tariff` and cannot relieve one byte of tariff's cap pressure. The cap answer is
  # D6 (4,000 -> 25,000), which is applied above. The ground that survives is COVERAGE of the 450.
  # READ-DARK AND WAIVED, deliberately: the one topical DAG id (`China_import_quota_VAT`) is owned by
  # `tariff`, and taking it would MOVE reach rather than create it -- see the refusal recorded on tariff's
  # dag_alias entry. The slice holds real props and waits for a DAG driver id of its own.
  # D-EC completion wave 2026-08-21 (orphan register, policy family). EIGHT TERM ADDS, verbatim from the spec,
  # measured here on the full 345,870-prop cache (props / net-new driver-dark): minimum access volume 38/5,
  # mav 45/13, out-quota 19/2, unlimited quota 6/2, autonomous quota 12/1, quantitative restrictions 51/35,
  # quantitative restriction 11/7, tariffication 35/28 = +93 net-new. `out-quota` is NOT redundant with the
  # incumbent `out-of-quota`: _normalize collapses hyphens to spaces, so "out quota" != "out of quota".
  # *** THE IMPORT-LICENSING RIDER: SETTLED AS DARK, WITH THE WRITTEN NOTE THE RATIFICATION REQUIRES ***
  # The disease lane handed this slice a rider ('import approval', 'import approvals', 'import permit',
  # 'import permits') off the 21 Indonesian import-licensing props that only surfaced because a wheat-disease
  # matcher was catching them; the policy lane, measuring independently, REFUSED `import permit` as the
  # LICENSING class. The plan ratified a mechanical settlement 2026-08-20: "settled by the FULL-CACHE DRY-RUN
  # with production matchers during the completion wave's vocab pass -- ship iff contamination low, else dark
  # with a written note (the surcharge-audit instrument, applied)". THE DRY-RUN RAN (2026-08-21, production
  # matchers, all 345,870 props): import permit 71 props / 36 net-new dark, import permits 62/56, import
  # approval 13/8, import approvals 4/4 = 133 props / 104 net-new. CONTAMINATION IS NOT THE TAIL, IT IS THE
  # CLASS -- the sampled props are authorization instruments, not quota administration: "China's biotech
  # regulations require that each shipment have an import permit"; "traders can apply for an interim import
  # permit"; "importers must apply for an import permit issued by SE to import HFCS into Mexico"; "The Thai
  # Government issues import permits and soybean importers are required to purchase domestic soybeans at
  # government determined prices". This slice's honest scope is in/out-of-quota RATES, ALLOCATIONS and FILL.
  # So the four terms are REFUSED HERE and the rider ships DARK, per the settlement's own else-branch. Two
  # notes so the mass is not lost: the China biotech permits already route to the new `biotech_market_access`
  # slice through its bare `biotech` term (verified on the samples, which all contain the word), and the
  # Indonesian sugar-permit cluster is a domestic import-administration instrument whose candidate home is
  # `producer_support_intl` -- recorded there, not shipped, because it is unsampled for over-fire.
  # ALSO REFUSED from the same rider, measured: `spi` 3 props / 0 net-new (a three-letter token = the `MoT`
  # defect re-created, and it is dead besides); `reference price` 211/155 but 123 of 211 are usda_gain_sugar
  # domestic PRICE CONTROL, not quota, so it fails the same class test; `maximum retail price` 26/13 and
  # `ceiling price` 34/15, same class; `bulog` 139/136 is an IMPORT AGENCY and B1's ratified one-owner rule
  # sends it to the destination/tender slices -- it is declared on `sea_import_demand` below.
