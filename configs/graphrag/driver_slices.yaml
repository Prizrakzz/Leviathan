  # backed_dag_ids() resolves it by identity (the same reason el_nino/frost/export_ban never needed one).
  # Adopted on corn + corn_cbot + soybean_meal_cbot as a PARENT of each board's aggregate feed-demand node,
  # exactly the shape ASF_hog_herd and poultry_expansion already have on soybean_meal_cbot. Reach 0 -> 3.
