  # (fertilizer / fertiliser / nutrient cost / input cost) are DISJOINT from urea's, dap's and potash's. So
  # urea/dap/potash are SKIPPED here and reported, not smuggled: routing one of those five to `urea` would
  # not un-strand anything, it would simply take the richer fertilizer narrative away from whichever board
  # (rough rice, cocoa, canola...) the id lives on. Un-stranding them is a CURATION act (a nutrient-specific
  # node, or a fertilizer-slice term widening plus a slice rebuild), not a wiring one.
