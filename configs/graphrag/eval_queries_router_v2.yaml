# ROUTER MEASUREMENT DECK v2 (D-AM-20) -- the tier-1 response-contract selector, measured.
#
# ##########################################################################################################
# ##  THIS IS A MEASUREMENT DECK, NOT A TUNING DECK.                                                      ##
# ##########################################################################################################
# The whole point of these rows is to tell the truth about where intent.select_response_contract MISSES.
# Do NOT widen _RC_PATTERNS row-by-row until this deck reads 100% -- that is exactly the failure the
# held-out-probe lesson names: a cue list fitted to its own scoreboard measures the fitting, not the
# router. The legitimate uses of a miss here are (a) evidence in a decision to change a cue DELIBERATELY,
# with the change justified on the SHAPE of the ask rather than on this row, and (b) a re-measure after
# such a change. If a cue is widened, expect the accuracy number to move by less than the miss count --
# and if it moves by exactly the miss count, suspect fitting.
#
# The 13-probe calibration rows already pinned in tests/unit/test_response_contracts.py are the TUNED
# corpus. These rows are deliberately NOT those rows. Overlap is zero by construction.
#
# ── WHAT THE SELECTOR IS ─────────────────────────────────────────────────────────────────────────────────
# intent._RC_PATTERNS is a PRIORITY-ORDERED tuple of narrow regexes, first match wins:
#     verification -> counterfactual -> horizon -> enumeration -> ranking -> compare -> recency -> context_node
# `select_response_contract` returns the winner (None = no match = the `default` contract shape, which is
# today's answer -- a miss is FAIL-OPEN and costs nothing but the shaping). `select_response_contract_all`
# (D-AM-20) returns the FULL ordered match set; the orchestrator stamps the non-winners as
# `also_matched` inside the `response_contract` decision dict so contested turns are visible in eval
# artifacts. A row with a non-empty also_matched is a row where a priority re-order would change the
# answer's shape -- watch those, they are where drift lands first.
#
# ── ROW FIELDS ───────────────────────────────────────────────────────────────────────────────────────────
#   id               unique, stable. `st_*` = store row, `sy_*` = synthetic row.
#   question         the query text, VERBATIM for store rows (typos and all -- a typo is a real router input).
#   source           store    -> a REAL user question, scanned read-only from the durable DynamoDB stores
#                               (leviathan-dev-terminal-store turn items + leviathan-dev-graphrag-sessions
#                               turn items, us-east-1) on 2026-08-06. NEVER invented.
#                    synthetic -> authored to cover under-represented intents. Clearly marked, never counted
#                               as evidence about what users actually ask.
#   expected_intent  numbers_only | reasoning | hybrid | live -- the LANE the turn belongs in.
#                      numbers_only = only an observed figure/level, no causal reasoning asked.
#                      reasoning    = why/how/what-if about drivers, cascades, exposure, direction.
#                      hybrid       = needs a specific number AND the reasoning around it.
#                      live         = asks for breaking news / what just happened (the live lane).
#   rc_expected      the contract the selector SHOULD pick, or null when the DEFAULT shape is correct.
#                    Every non-null value must be a member of response_contracts.valid_names().
#   ambiguous        true where reasonable readers disagree about rc_expected. FLAGGED, never guessed
#                    silently. An ambiguous row still carries a label -- the flag says "do not treat this
#                    miss as a defect without re-reading the question".
#   note             optional, free text; why a label is what it is.
#
# ── LABELLING RULES (applied uniformly; read these before disputing a label) ──────────────────────────────
# 1. rc_expected describes the SHAPE THE ANSWER SHOULD TAKE, decided from the question alone. It is NOT
#    "what the regex does". Labelling from the regex would make the deck a tautology.
# 2. TIER-0 EXEMPT LANES carry rc_expected: null BY RULE, not by judgement:
#      * numbers_only and live turns -- orchestrator.py runs the selector only for kind in
#        (reasoning, hybrid), so on those lanes the selector never runs in serving at all;
#      * outlook asks -- the register-affecting outlook gate (tier 0) preempts, and `outlook` is never a
#        tier-1 return value.
#    The audit therefore reports TWO accuracies: over ALL rows, and over ELIGIBLE rows
#    (expected_intent in {reasoning, hybrid}) -- the second is the serving-relevant number, and a
#    shadow false-positive on an exempt row is informational only.
# 3. A conditional MECHANISM ask ("how does the ban affect palm") is NOT counterfactual. A hypothetical
#    the record may not carry ("what if the ban happened") is.
# 4. "versus normal / average / seasonal / history" is a BASELINE comparison, not a two-market compare;
#    those rows are rc_expected: null by design and the compare regex declines them deliberately.
# 5. Non-English rows are rc_expected: null -- the cue list is English and the caller fails OPEN. That is
#    a stated contract, not a miss.
#
# ── PROVENANCE OF THE STORE ROWS (the true count, stated plainly) ─────────────────────────────────────────
# A full read-only scan of BOTH durable tables on 2026-08-06 returned 22 items in the terminal store and
# 2 in the sessions table. Of those, 5 terminal turn items and 1 session turn item carry a user question:
# SIX raw question records, which dedupe (exact, then casefold+punctuation-normalised) to FIVE distinct
# real questions -- the sugar crush-pace ask is stored in BOTH tables and is counted once.
#
# FIVE IS THE TRUE COUNT. There is no larger pool of real queries in this estate. The deck is topped up to
# 150 with SYNTHETIC rows so the selector can be measured per-stratum at a usable sample size, and every
# one of those rows says `source: synthetic`. No invented row is ever labelled `store`. Any future claim
# about "what users ask" may cite the five store rows and nothing else.
#
# Two of the five store rows (st_sugar_crush_pace_a / _b) are a 0.70-similarity NEAR-DUPE pair: the same
# research question re-asked with different wording three weeks apart. They are KEPT as two rows because
# they are two distinct real turns with two distinct selector inputs; near-dupe collapsing is applied at
# exact/casefold level only. Both are noted below so nobody double-counts them as independent evidence.
#
# ── SCORER ───────────────────────────────────────────────────────────────────────────────────────────────
#   python scripts/router_deck_audit.py
# Offline, deterministic, zero spend: pure-regex selector + the classify-free lexical intent heuristic.
# No LLM, no Athena, no evidence store.
version: 2
deck: router_v2
authored: '2026-08-06'
scanned_stores_on: '2026-08-06'
store_rows_true_count: 5
rows:

