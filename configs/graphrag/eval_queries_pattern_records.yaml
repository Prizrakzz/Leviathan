  # ===================== (6) REGRESSION RIDERS -- the engines compose =====================
  # Both rows are lifted VERBATIM (question + asof + pins) from the mini-decks whose asofs were probe-
  # calibrated for the chain and transmission flips, so a red here is unambiguously pattern-flag interference
  # and not a fresh calibration miss. They are HYBRID turns by design.
  # WHY NO pattern_* PIN ON THESE TWO: trace.pattern_records is written only by run_numbers_only; the hybrid
  # lane never copies it (orchestrator.py:155-225). `pattern_cited: false` here would pass VACUOUSLY on every
  # run, including one where the card had gone haywire -- a pin that cannot fail is worse than no pin, so it
  # is omitted on purpose. `pattern_register_clean` is likewise omitted: on a full cascade walk the banned set
  # (trend/regime/confirms) is legitimately reachable in non-pattern prose, so pinning it would score the
  # cascade voice, not the pattern fence.

  - id: pr_rider_chain_fired
    contract: corn_cbot
    category: pattern_regression_rider_chain
    expected_intent: hybrid
    asof: '2026-02-15'
    # VERBATIM from eval_queries_chain_on.yaml :: chain_corn_safrinha_pos (the flagship that gates the chain
    # flip). Under GRAPHRAG_PATTERN_RECORDS=on the chain engine must still fire and still cite >=3 distinct
    # quantified hops. The pattern card touches neither cascade.py nor the chain composer -- it is a read-side
    # numbers-lane card -- so this row is the assertion that "no new engine surfaces" (non-goal 9) held.
    cascade_drivers:
      - La_Nina
      - safrinha
      - ending_stocks_su_ratio
    question: A La Nina set in over Brazil's center-west -- trace how it hit the safrinha corn crop and fed through to the US corn stocks-to-use balance sheet, on the record.
    expect:
      chain_fired: true
      min_chain_hops_cited: 3
      pit_clean: true
      banned_valuation: 0
      banned_flow: 0

  - id: pr_rider_transmission_fired
    contract: soybean_oil_cbot
    category: pattern_regression_rider_transmission
    expected_intent: hybrid
    asof: '2026-02-15'
    # VERBATIM from eval_queries_transmission_on.yaml :: xmit_vegoil_triangle_pos -- deliberately the CONTROL
    # row, not the flagship: both its links are substitution links, so it is robust to window choice and pins
    # the composer CORE (a chain fired, >=1 link rendered AND cited) without asserting a per-link nature. That
    # robustness is exactly what a regression rider needs -- a red here means interference, never calibration.
    # `link_comove` stays an ACCEPTED decline (the reached-not-yet payoff, transmission plan D4), never a
    # failure.
    question: >-
      Read the edible-oil complex across for me: soyoil against palm, and palm against rapeseed oil. Whose
      World stocks-to-use tightened relative to whose over the same window, and how far does that read carry
      along the substitution chain?
    expect:
