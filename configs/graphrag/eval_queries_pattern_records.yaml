    #     of "daily sweeps". No assert key reads the rendered provenance wording. The engine helps as far as it
    #     can -- the deterministic preface already prints "weekly replay asofs" and the injected leg carries
    #     pattern_provenance='backfill_grid' -- so a violation requires the model to CONTRADICT its own
    #     preface, which is visible in the judge transcript but scores no deterministic tooth.
    #   NOT AVAILABLE AT ALL: there is no provenance-mixing pin, because with zero daily_sweep rows there is no
    #     second class to blend. A genuine mixing test becomes realizable only after the daily sweep has run
    #     (see the report) -- it is deferred, not silently dropped.
    question: As of 25 July 2026, how often has the corn export sales pace leg been recorded firing -- and are those recent daily readings, or something else?
    expect:
      needs_evidence: false
      pattern_cited: true
      pattern_register_clean: true
      pit_clean: true
      banned_valuation: 0
      banned_flow: 0

  # ===================== (5) NEGATIVES -- no volunteer injection (one-env-per-run) =====================
  # There is NO flag-off row in this deck (a deck runs under ONE process env; a flag-off pin in a flag-on run
  # is the mixed-flag error). The negative teeth are instead: a question on a contract whose ledger slice is
  # REAL and non-empty, phrased with no persistence intent, must inject NOTHING.
  # PROBE (both rows): pattern_records_scope(question) -> None, so pattern_records_legs is never called,
  # trace.pattern_records is absent, pattern_injected=0, and BOTH pattern pins evaluate false. The slice these
  # rows decline to touch is live: corn_cbot x export_pace x backfill_grid = 156 swept rows, 9 fired.
  # VACUITY CAVEAT: like every pattern pin, these are non-vacuous only if the turn routes numbers_only -- read
  # intent_ok before crediting a green.

  - id: pr_no_volunteer_pace_neg
    contract: corn_cbot
    category: pattern_negative_no_volunteer
    expected_intent: numbers_only
    asof: '2026-07-25'
    # The sharpest negative available: it names the pace surface AND the contract whose ledger slice is the
    # deck's only positive, but asks a LEVEL question (where does the pace stand vs the prior MY) with no
    # persistence intent. If the card volunteers a base rate here, the detector is over-firing and the flag is
    # not safe to flip. Verified against _PERSIST_INTENT: none of its branches match (no how many/how long/
    # how often, no first..Nth, no fired+history, no "on record"/"base rate"/"track record"/"recorded firing").
    question: As of 25 July 2026, where do US corn export sales commitments stand against the same week of the prior marketing year?
    expect:
